 lưu ý nào đối với tài nguyên rừng?","o":["Dân số tăng lên bao nhiêu lần thì diện tích rừng giảm đi bấy nhiêu lần.","Diện tích rừng tăng tỷ lệ thuận với quy mô phát triển kinh tế.","Diện tích rừng bình quân đầu người được giữ vững ở mức 0,64 ha/người.","Diện tích rừng tăng nhẹ nhờ luồng di cư từ miền núi về đồng bằng."],"w":"Nhận định biến đổi theo cùng số lần cần số liệu gốc cho cả dân số và diện tích rừng 1943–1980. File không kèm bảng kiểm chứng; giữ nguyên khóa."},{"q":"Hiện tượng \"ùn tắc lao động\" ở nông thôn đồng bằng nước ta đã dẫn đến hệ quả di dân nào được đề cập trong tài liệu?","o":["Dòng di cư từ đồng bằng lên miền núi.","Dòng di cư từ thành thị quay trở lại nông thôn.","Dòng di cư ra nước ngoài để tìm kiếm việc làm giản đơn.","Luồng di chuyển dân cư giữa các huyện nghèo ở vùng sâu vùng xa."]},{"q":"Theo định nghĩa trong tài liệu, dự báo dân số ngắn hạn được thực hiện cho giai đoạn nào?","o":["Dưới 5 năm","Từ 5 đến 10 năm","Dưới 30 năm","Từ 30 năm trở lên"],"w":"Các khoảng thời gian ở lựa chọn không loại trừ nhau: dưới 5 năm cũng thuộc dưới 30 năm. Theo yêu cầu vẫn chỉ chấm khóa A của nguồn."},{"q":"Hàm số nào sau đây biểu thị quy mô dân số hàng năm tăng hoặc giảm với một lượng không đổi?","o":["Hàm cấp số cộng","Hàm cấp số nhân","Hàm số mũ","Hàm logistics"]},{"q":"Trong các phương pháp dự báo dân số, phương pháp nào biểu diễn quá trình tăng dân số từ giới hạn dưới đến giới hạn trên?","o":["Hàm logistics","Phương pháp thành phần","Hàm cấp số nhân","Phương pháp ngoại suy tỷ lệ"]},{"q":"Quyết định nào của Hội đồng Chính phủ vào ngày 26/12/1961 đã mở đầu cho việc quản lý nhà nước đối với phát triển dân số ở Việt Nam?","o":["Quyết định 216-CP","Quyết định 34-CP","Quyết định 162-HĐBT","Quyết định 58-HĐBT"]},{"q":"Ủy ban quốc gia dân số và kế hoạch hóa gia đình (UBQGDS-KHHGĐ) được thành lập vào năm nào?","o":["1984","1961","1993","2005"]},{"q":"Chiến lược Dân số - Kế hoạch hóa gia đình (DS-KHHGĐ) đến năm 2000 của Việt Nam xác định địa bàn trọng điểm là khu vực nào?","o":["Vùng nông thôn","Vùng thành thị và các khu công nghiệp","Vùng biên giới và hải đảo","Toàn bộ các thành phố lớn trên cả nước"]},{"q":"Nghị quyết số 21-NQ/TW về công tác dân số trong tình hình mới do Ban Chấp hành Trung ương Đảng khóa XII ban hành vào ngày tháng năm nào?","o":["25/10/2017","26/12/1961","14/01/1993","22/11/2019"]},{"q":"Quyết định phê duyệt \"Chiến lược Dân số Việt Nam đến năm 2030\" có số hiệu là gì?","o":["Quyết định số 1679/QĐ-TTg","Quyết định số 216-CP","Quyết định số 162-HĐBT","Quyết định số 270-TTg"]},{"q":"Mục tiêu tổng quát của Chiến lược Dân số Việt Nam đến năm 2030 bao gồm nội dung nào sau đây?","o":["Duy trì vững chắc mức sinh thay thế; đưa tỷ số giới tính khi sinh về mức cân bằng tự nhiên","Giảm nhanh tỷ lệ sinh con thứ 3 trở lên để quy mô dân số dưới mức 82 triệu","Mỗi gia đình chỉ có một con để nhanh chóng ổn định quy mô dân số","Tập trung toàn diện vào việc áp dụng các biện pháp đình sản vĩnh viễn"]},{"q":"Theo Chiến lược Dân số Việt Nam đến năm 2030, mục tiêu cần đạt của tuổi thọ trung bình vào năm 2030 là bao nhiêu tuổi?","o":["75 tuổi","73,4 tuổi","74,5 tuổi","78 tuổi"]},{"q":"Điểm khác biệt căn bản trong việc dự báo dân số toàn quốc so với dự báo dân số cho từng vùng lãnh thổ, đơn vị hành chính nhỏ hơn trong nhiều trường hợp là gì?","o":["Yếu tố di dân (xuất cư, nhập cư)","Xu hướng biến động của tỷ suất sinh thô","Xu hướng biến động của tỷ suất tử vong thô","Việc lựa chọn các mốc thời gian để tính toán"]},{"q":"Nhược điểm lớn nhất của phương pháp dự báo dân số theo hàm số toán học là gì?","o":["Chỉ đưa ra kết quả tổng dân số và mức độ chính xác không cao nếu thời gian dự báo dài","Quá trình tính toán vô cùng phức tạp và bắt buộc phải dùng máy tính","Yêu cầu nguồn số liệu gốc cực kỳ chi tiết về cơ cấu tuổi và giới tính","Không thể áp dụng khi dân số có tốc độ tăng trưởng ổn định"]},{"q":"Định nghĩa về chính sách dân số của một quốc gia nhấn mạnh hệ thống đồng bộ các mục tiêu và giải pháp do chính phủ đề ra nhằm tác động đến các yếu tố nào của dân số?","o":["Quy mô, cơ cấu, phân bổ và tốc độ tăng trưởng dân số","Chỉ tác động duy nhất vào mức sinh và các biện pháp kế hoạch hóa gia đình","Trình độ học vấn và thu nhập bình quân đầu người của lao động nông thôn","Tuổi thọ trung bình và tỷ lệ mắc các bệnh bẩm sinh của trẻ em"]},{"q":"Ví dụ nào sau đây thể hiện một \"Chính sách dân số trực tiếp\"?","o":["Chính sách sinh một con ở Trung Quốc hoặc khuyến khích nhập cư ở một nước phát triển","Nâng cao trình độ văn hóa giáo dục cho phụ nữ vùng sâu vùng xa","Phát triển hệ thống bảo hiểm y tế toàn dân cho người cao tuổi","Đầu tư xây dựng cơ sở hạ tầng giao thông ở nông thôn để giãn dân đô thị"],"w":"Ví dụ chính sách một con là ví dụ lịch sử; câu đang hỏi loại chính sách, không khẳng định đó là chính sách Trung Quốc hiện hành."},{"q":"Chính sách dân số \"ngầm định\" (hoặc không công khai) được hiểu là trường hợp nào?","o":["Chính phủ không công bố chính thức chính sách nhưng vẫn tiến hành các biện pháp cần thiết để tác động đến biến dân số","Chính phủ không nhận thức được việc tăng dân số đang hạn chế sự phát triển","Chính sách chỉ áp dụng cho các vùng dân tộc thiểu số rất ít người","Chính sách do các tổ chức quốc tế tự ý triển khai không thông qua chính phủ"]},{"q":"Theo quan điểm cũ (Nghị quyết 04-NQTW năm 1993), giải pháp cơ bản mang tính động lực thúc đẩy phong trào quần chúng thực hiện KHHGĐ là gì?","o":["Vận động tuyên truyền và giáo dục gắn liền với các dịch vụ tiếp cho người chấp nhận gia đình ít con","Thực thi nghiêm kỷ cương pháp luật và áp dụng các hình phạt hành chính nặng","Tập trung mở rộng các kỹ thuật mới trong y học hiện đại","Đẩy mạnh xã hội hóa và chỉ dựa vào nguồn viện trợ của các tổ chức quốc tế"],"w":"Đáp án có cụm “các dịch vụ tiếp cho người chấp nhận” có dấu hiệu thiếu từ. Giữ nguyên thay vì tự đoán chữ bị thiếu."},{"q":"Điểm mới cốt lõi trong Quan điểm 2 của Nghị quyết số 21-NQ/TW (năm 2017) về trọng tâm của chính sách dân số hiện nay là gì?","o":["Chuyển trọng tâm chín các lựa chọn có thể chồng lấn; giữ khóa A."},{"q":"Tuyến đầu tiếp xúc dân:","o":["Trạm y tế xã","Bộ Y tế","BV TW","Sở Y tế"]},{"q":"Tổ chức Y tế Thế giới (WHO) ước tính hàng năm có khoảng bao nhiêu ca tử vong có liên quan đến nghề nghiệp?","o":["2 triệu ca","1 triệu ca","3 triệu ca","4 triệu ca"],"w":"Ước tính tử vong nghề nghiệp cần năm và phạm vi. WHO/ILO công bố khoảng 1,9 triệu cho năm 2016; số làm tròn 2 triệu trong file không được xem là con số cập nhật cho mọi năm."},{"q":"Theo Tổ chức Y tế Thế giới, có bao nhiêu phần trăm chứng đau thắt lưng là do nghề nghiệp?","o":["37%","27%","47%","57%"],"w":"Con số 37% không có năm hoặc báo cáo WHO kèm theo; giữ đúng số liệu của file, không xác nhận đó là ước tính hiện tại."},{"q":"Theo Luật lao động năm 2012, người lao động là người từ đủ bao nhiêu tuổi trở lên?","o":["15 tuổi","14 tuổi","16 tuổi","18 tuổi"],"w":"Câu đã giới hạn Bộ luật Lao động năm 2012: giữ nguyên bối cảnh lịch sử, không coi đây là tóm tắt toàn bộ quy định hiện hành hoặc các ngoại lệ về lao động chưa thành niên."},{"q":"Năm 1948, Tổ chức Y tế Thế giới (WHO) định nghĩa sức khỏe là trạng thái thoải mái hoàn toàn về thể chất, tâm thần và yếu tố nào dưới đây?","o":["Xã hội","Kinh tế","Môi trường","Tâm linh"]},{"q":"Độ tuổi lao động ở Việt Nam hiện nay đối với nam giới là bao nhiêu?","o":["18 - 60 tuổi","18 - 55 tuổi","15 - 60 tuổi","18 - 65 tuổi"],"w":"“Hiện nay” chưa có ngày tham chiếu, và tuổi lao động không nên đồng nhất với tuổi nghỉ hưu. Nguồn đánh dấu 18–60; giữ khóa, không dùng câu này làm hướng dẫn pháp luật hiện hành."},{"q":"Mối quan hệ giữa lao động và sức khoẻ được biểu diễn là mối quan hệ như thế nào?","o":["Hai chiều","Một chiều","Đồng biến","Nghịch biến"]},{"q":"Tính đến ngày 31/12/2016, Việt Nam đã ban hành danh mục bao nhiêu bệnh nghề nghiệp được bảo hiểm?","o":["34 bệnh","28 bệnh","30 bệnh","35 bệnh"],"w":"Câu đã giới hạn ngày 31/12/2016. Giữ số 34 bệnh theo khóa nguồn; không dùng để mô tả danh mục hiện hành."},{"q":"Theo tài liệu, hiện nay ở Việt Nam có bao nhiêu Trung tâm Y tế quận/huyện tham gia vào mạng lưới chăm sóc sức khỏe người lao động?","o":["713","650","700","750"],"w":"Nguồn dùng “hiện nay” với con số 713 nhưng không nêu năm thống kê. Số lượng và tổ chức mạng lưới có thể thay đổi; không tự cập nhật dữ liệu."},{"q":"Không gian của khu vực lao động trong đó người lao động làm việc cùng với phương tiện phục vụ lao động được gọi là gì?","o":["Môi trường lao động","Điều kiện lao động","Vị trí lao động","Phân xưởng sản xuất"]},{"q":"Theo WHO và ILO (1950), việc tuyển chọn và đảm bảo cho người lao động được làm nghề thích hợp phải dựa trên tiêu chí nào?","o":["Khả năng tâm sinh lý của họ","Nhu cầu của doanh nghiệp","Bằng cấp học vấn","Mức lương thỏa thuận"]},{"q":"Tuyên ngôn Alma Ata (1987) khẳng định mạnh mẽ điều gì về sức khỏe?","o":["Sức khỏe là một quyền cơ bản của con người","Sức khỏe là không có bệnh tật","Sức khỏe là trách nhiệm riêng của ngành y tế","Sức khỏe hoàn toàn phụ thuộc vào kinh tế xã hội"],"w":"Phần hỏi ghi Alma Ata (1987), trong khi tuyên bố Alma-Ata được thông qua năm 1978 theo WHO. Giữ nguyên năm trong câu nguồn và khóa A; chỉ ghi chú chỗ cần kiểm tra."},{"q":"Theo định nghĩa của Tổ chức Y tế Thế giới, sức khỏe nghề nghiệp là trạng thái thoải mái toàn diện về thể chất, tâm thần và xã hội của người lao động trong điều kiện nào?","o":["Điều kiện lao động và quá trình làm việc","Môi trường sống và sinh hoạt","Môi trường tự nhiên và xã hội","Gia đình và cộng đồng"]},{"q":"Vệ sinh lao động là giải pháp phòng, chống tác động của yếu tố nào đối với con người trong quá trình lao động?","o":["Yếu tố có hại","Yếu tố nguy hiểm","Yếu tố rủi ro","Yếu tố môi trường"]},{"q":"Yếu tố gây mất an toàn, làm tổn thương hoặc tử vong cho con người trong quá trình lao động được gọi là gì?","o":["Yếu tố nguy hiểm","Yếu tố có hại","Yếu tố rủi ro","Yếu tố độc hại"]},{"q":"Độc chất nghề nghiệp chủ yếu tập trung xác định các chất độc trong môi trường nào?","o":["Môi trường không khí","Môi trường nước","Môi trường đất","Môi trường thực phẩm"],"w":"Độc chất nghề nghiệp không chỉ giới hạn một môi trường phơi nhiễm. Cụm “chủ yếu tập trung” cần bối cảnh giáo trình; giữ khóa không khí theo nguồn."},{"q":"Tâm lý lao động là môn khoa học nghiên cứu chủ yếu về vấn đề gì tại nơi làm việc?","o":["Hành vi con người","Năng suất lao động","Thu nhập của người lao động","Tình trạng máy móc"]},{"q":"Theo Viện An toàn Vệ sinh Lao động Mỹ (NIOSH), ergonomics là sự nghiên cứu để phù hợp công việc với đối tượng nào?","o":["Người lao động","Thiết bị máy móc","Người sử dụng lao động","Môi trường tự nhiên"]},{"q":"Bệnh nghề nghiệp là bệnh phát sinh do yếu tố nào tác động đối với người lao động?","o":["Điều kiện lao động có hại của nghề nghiệp","Điều kiện sinh hoạt kém","Yếu tố di truyền","Tai nạn giao thông trên đường đi làm"]},{"q":"Cơ quan nào là đầu mối tham mưu cho Bộ Y tế quản lý về sức khỏe nghề nghiệp ở tuyến trung ương?","o":["Cục Quản lý môi trường y tế","Viện Sức khoẻ nghề nghiệp và môi trường","Cục Y tế dự phòng","Viện Giám định Y khoa trung ương"],"w":"Tên và chức năng cơ quan phụ thuộc cơ cấu tổ chức, thời điểm và văn bản có hiệu lực. File không nêu năm; khóa được giữ nguyên, không xác nhận cơ quan hiện hành."},{"q":"Bộ Giáo dục và Đào tạo có trách nhiệm gì trong lĩnh vực an toàn vệ sinh lao động?","o":["Đưa nội dung an toàn, vệ sinh lao động vào chương trình giảng dạy","Tổ chức khám sức khỏe định kỳ cho sinh viên","Ban hành tiêu chuẩn vệ sinh lao động cấp quốc gia","Giao nhiệm vụ kiêm nhiệm cho bộ phận hành chính nhân sự"]}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const SUBJ=[
 {id:'tl',name:'Tâm lý – Đạo đức y học',desc:'Tâm lý học, y đức, giao tiếp với người bệnh',color:'#8a3a52'},
 {id:'sh',name:'Sinh học di truyền',desc:'Tế bào, ADN, quy luật di truyền, đột biến',color:'#2f6b4f'},
 {id:'hh',name:'Hóa đại cương',desc:'Cấu tạo nguyên tử, liên kết, dung dịch, hợp chất hữu cơ',color:'#27598a'},
 {id:'ds',name:'Dân số và Sức khỏe',desc:'Dân số học, truyền thông – giáo dục sức khỏe, sức khỏe nghề nghiệp',color:'#9a6212'}
];
const SM=Object.fromEntries(SUBJ.map(s=>[s.id,s]));
const MIX={id:'mix',name:'Trộn cả 4 môn',desc:'Câu hỏi lấy ngẫu nhiên từ tất cả các môn',color:'#444b57'};
const TOTAL=SUBJ.reduce((a,s)=>a+DATA[s.id].length,0);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>String(Math.round(x*100)/100).replace('.',',');
const L='ABCD';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function rnd(n){if(window.crypto&&crypto.getRandomValues){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const Q=k=>{const p=k.split(':');return DATA[p[0]][+p[1]]};
const validKey=k=>{const p=String(k).split(':');return DATA[p[0]]&&DATA[p[0]][+p[1]]!==undefined};

let prog=store.get('onthi.prog',{best:{},wrong:{}});
if(!prog.best)prog.best={};if(!prog.wrong)prog.wrong={};
for(const k of Object.keys(prog.wrong))if(!validKey(k))delete prog.wrong[k];
let sess=store.get('onthi.sess',null);
if(sess&&(!Array.isArray(sess.items)||!sess.items.length||!sess.items.every(it=>validKey(it.k)&&Array.isArray(it.order)&&it.order.length===4)))sess=null;
let fs=store.get('onthi.fs',2);
document.documentElement.setAttribute('data-fs',fs);
const ui={view:'home',subj:null,mode:'practice',limit:0,rf:'bad',panel:false,q:'',sf:'all',shown:30,modal:null};
let timerId=null;

function saveProg(){store.set('onthi.prog',prog)}
function saveSess(){store.set('onthi.sess',sess)}
function setsOf(id){const n=DATA[id].length,c=Math.ceil(n/50),size=Math.ceil(n/c),out=[];for(let k=0;k<c;k++){const a=k*size,b=Math.min(n,a+size);if(b>a)out.push({k,a,b})}return out}
function wrongKeys(subj){return Object.keys(prog.wrong).filter(k=>subj==='mix'||k.startsWith(subj+':'))}
const isRight=it=>it.ans!==null&&it.order[it.ans]===0;
function tally(){let c=0,w=0,b=0;sess.items.forEach(it=>{if(it.ans===null)b++;else if(isRight(it))c++;else w++});return{c,w,b,n:sess.items.length}}
const subjOf=id=>id==='mix'?MIX:SM[id];

function start(subj,kind,arg){
 let keys=[],title='';
 if(kind==='set'){const s=setsOf(subj)[arg];for(let i=s.a;i<s.b;i++)keys.push(subj+':'+i);title='Đề '+(arg+1)}
 else if(kind==='rand'){const ids=subj==='mix'?SUBJ.map(s=>s.id):[subj];let pool=[];ids.forEach(id=>DATA[id].forEach((_,i)=>pool.push(id+':'+i)));keys=shuffled(pool).slice(0,arg);title='Ngẫu nhiên '+keys.length+' câu'}
 else{keys=shuffled(wrongKeys(subj)).slice(0,50);title='Ôn lại câu đã sai'}
 if(!keys.length)return;
 const now=Date.now(),lim=ui.mode==='exam'?ui.limit*60:0;
 sess={subj,kind,arg,title,mode:ui.mode,limit:lim,started:now,endAt:lim?now+lim*1000:0,items:keys.map(k=>({k,order:shuffled([0,1,2,3]),ans:null,flag:false})),i:0,done:false};
 saveSess();ui.panel=false;go('quiz');
}
function go(v){ui.view=v;render();window.scrollTo(0,0)}
function pick(j){
 const it=sess.items[sess.i];
 if(sess.done)return;
 if(sess.mode==='practice'){
  if(it.ans!==null)return;
  it.ans=j;
  if(isRight(it))delete prog.wrong[it.k];else prog.wrong[it.k]=1;
  saveProg();saveSess();render();
  const fb=document.getElementById('fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
 }else{it.ans=j;saveSess();render()}
}
function jump(i){sess.i=Math.max(0,Math.min(sess.items.length-1,i));ui.panel=false;saveSess();render();window.scrollTo(0,0)}
function finish(){
 if(sess.done)return;
 sess.done=true;sess.finishedAt=Date.now();
 sess.items.forEach(it=>{if(it.ans===null)return;if(isRight(it))delete prog.wrong[it.k];else prog.wrong[it.k]=1});
 const r=tally();
 if(sess.kind==='set'){
  const key=sess.subj+':set'+sess.arg,sc=r.c/r.n*10,old=prog.best[key];
  if(!old||sc>old.score)prog.best[key]={score:sc,c:r.c,n:r.n,t:Date.now()};
 }
 saveProg();saveSess();
 ui.rf=(r.w+r.b)?'bad':'all';ui.panel=false;go('result');
}
function askSubmit(){
 const r=tally();
 ui.modal={title:'Nộp bài?',text:r.b?`Bạn còn ${r.b} câu chưa trả lời. Nộp bài bây giờ?`:'Bạn đã trả lời hết các câu. Nộp bài để xem điểm?',ok:'Nộp bài',cancel:'Làm tiếp',fn:finish};render();
}
function askExit(){
 ui.modal={title:'Thoát ra ngoài?',text:'Bài làm được lưu lại. Lần sau bạn có thể bấm “Làm tiếp” ở trang đầu.',ok:'Thoát',cancel:'Ở lại',fn:()=>go('home')};render();
}

/* ---------- views ---------- */
function header(){
 return `<header class="top"><div class="wrap"><button class="brand" data-act="home">Ôn trắc nghiệm</button><div class="tools"><div class="fs" role="group" aria-label="Cỡ chữ"><span>Cỡ chữ</span>${[1,2,3].map(n=>`<button class="fsb" style="font-size:${[.85,1.1,1.4][n-1]}rem" aria-pressed="${fs===n}" aria-label="Cỡ chữ ${['vừa','lớn','rất lớn'][n-1]}" data-act="fs" data-n="${n}">A</button>`).join('')}</div><button class="btn sm" data-act="search">Tra cứu</button></div></div></header>`;
}
function vHome(){
 let resume='';
 if(sess&&!sess.done){
  const a=sess.items.filter(i=>i.ans!==null).length;
  resume=`<div class="notice"><strong>Bạn đang làm dở một bài</strong><br>${esc(subjOf(sess.subj).name)} · ${esc(sess.title)} · đã trả lời ${a}/${sess.items.length} câu<div class="acts"><button class="btn primary" data-act="resume">Làm tiếp</button><button class="btn" data-act="drop">Bỏ bài này</button></div></div>`;
 }
 const cards=SUBJ.map(s=>{
  const sets=setsOf(s.id).length,done=Object.keys(prog.best).filter(k=>k.startsWith(s.id+':set')).length,w=wrongKeys(s.id).length;
  return `<button class="row subj" style="--c:${s.color}" data-act="subj" data-id="${s.id}"><span><span class="rt">${esc(s.name)}</span><span class="rs">${DATA[s.id].length} câu · ${sets} đề · đã làm ${done}/${sets} đề${w?` · ${w} câu cần ôn lại`:''}</span></span><span class="go" aria-hidden="true">›</span></button>`}).join('');
 const mw=wrongKeys('mix').length;
 return `${header()}<main class="wrap"><h1>Chọn môn để ôn</h1><p class="lead">Bấm vào một môn, sau đó chọn đề muốn làm.</p>${resume}${cards}<button class="row subj" style="--c:${MIX.color}" data-act="subj" data-id="mix"><span><span class="rt">${MIX.name}</span><span class="rs">${TOTAL} câu · lấy ngẫu nhiên từ cả 4 môn${mw?` · ${mw} câu cần ôn lại`:''}</span></span><span class="go" aria-hidden="true">›</span></button>${foot()}</main>`;
}
function foot(){return `<div class="foot">Tổng hợp từ 4 file trắc nghiệm gốc, giữ nguyên câu hỏi và đáp án. Các file Tâm lý, Sinh học, Dân số ghi tác giả NGUYỄN GIA PHÚ - 526YCT02. Điểm và tiến độ lưu ngay trên trình duyệt này, không cần mạng.</div>`}
function vSubject(){
 const id=ui.subj,S=subjOf(id),isMix=id==='mix',n=isMix?TOTAL:DATA[id].length,w=wrongKeys(id).length;
 const modes=[['practice','Ôn luyện','Chọn xong biết đúng sai ngay, có giải thích.'],['exam','Thi thử','Làm hết rồi nộp bài mới biết điểm.']];
 const seg=modes.map(m=>`<button class="segb" role="radio" aria-checked="${ui.mode===m[0]}" data-act="mode" data-m="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('');
 const timer=ui.mode==='exam'?`<div class="chips" role="group" aria-label="Thời gian làm bài">${[[0,'Không giới hạn'],[45,'45 phút'],[60,'60 phút'],[90,'90 phút']].map(t=>`<button class="chip" aria-pressed="${ui.limit===t[0]}" data-act="limit" data-m="${t[0]}">${t[1]}</button>`).join('')}</div>`:'';
 let sets='';
 if(!isMix){
  sets=`<h2>2. Chọn đề</h2>`+setsOf(id).map(s=>{
   const b=prog.best[id+':set'+s.k];
   return `<button class="row" data-act="start" data-kind="set" data-arg="${s.k}"><span><span class="rt">Đề ${s.k+1}</span><span class="rs">Câu ${s.a+1}–${s.b} · ${s.b-s.a} câu</span></span><span class="best">${b?`Cao nhất<b>${fmt(b.score)}/10</b>`:'Chưa làm'}</span></button>`}).join('');
 }
 const rnd=`<h2>${isMix?'2':'3'}. Hoặc làm đề tự chọn</h2>
 <button class="row" data-act="start" data-kind="rand" data-arg="20"><span><span class="rt">Ngẫu nhiên 20 câu</span><span class="rs">Làm nhanh, khoảng 10–15 phút</span></span><span class="go" aria-hidden="true">›</span></button>
 <button class="row" data-act="start" data-kind="rand" data-arg="50"><span><span class="rt">Ngẫu nhiên 50 câu</span><span class="rs">Một đề đầy đủ, mỗi lần một đề khác</span></span><span class="go" aria-hidden="true">›</span></button>
 <button class="row" data-act="start" data-kind="wrong" ${w?'':'disabled'}><span><span class="rt">Ôn lại câu đã làm sai</span><span class="rs">${w?`${w} câu${w>50?' (mỗi lượt lấy 50 câu)':''}`:'Chưa có câu sai nào. Làm một đề trước nhé.'}</span></span><span class="go" aria-hidden="true">›</span></button>`;
 return `${header()}<main class="wrap"><button class="back" data-act="home">‹ Về danh sách môn</button><h1 style="border-left:12px solid ${S.color};padding-left:.7rem">${esc(S.name)}</h1><p class="lead">${esc(S.desc)} · ${n} câu</p><h2 style="margin-top:1.2rem">1. Chọn cách ôn</h2><div class="seg" role="radiogroup" aria-label="Cách ôn">${seg}</div>${timer}${sets}${rnd}${foot()}</main>`;
}
function vQuiz(){
 const it=sess.items[sess.i],q=Q(it.k),n=sess.items.length,practice=sess.mode==='practice',locked=practice&&it.ans!==null,subjId=it.k.split(':')[0],S=SM[subjId];
 const opts=it.order.map((oi,j)=>{
  let c='opt',tag='';
  if(locked){c+=' lock';if(oi===0){c+=' ok';tag='<span class="tag">✓ Đáp án đúng</span>'}else if(j===it.ans){c+=' no';tag='<span class="tag">✗ Bạn đã chọn câu này</span>'}}
  else if(j===it.ans)c+=' sel';
  return `<button class="${c}" data-act="pick" data-j="${j}" aria-pressed="${j===it.ans}"><span class="let">${L[j]}</span><span class="otx">${esc(q.o[oi])}${tag}</span></button>`}).join('');
 let fb='';
 if(locked){
  const r=isRight(it);
  fb=`<div id="fb" class="fb ${r?'good':'bad'}" role="status"><strong>${r?'✓ Đúng rồi!':'✗ Chưa đúng.'}</strong>${r?'':` Đáp án đúng là <b>${L[it.order.indexOf(0)]}</b>.`}${q.e?`<p>${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</div>`;
 }
 const flag=!practice?`<button class="flagbtn" data-act="flag">${it.flag?'★ Đã đánh dấu xem lại (bấm để bỏ)':'☆ Đánh dấu để xem lại sau'}</button>`:'';
 let panel='';
 if(ui.panel){
  panel=`<div class="panel"><strong>Danh sách câu</strong><div class="small">${practice?'Xanh: đúng · Đỏ: sai · Trắng: chưa làm':'Ô xanh đậm: đã trả lời · Dấu chấm than: đã đánh dấu'}</div><div class="grid">${sess.items.map((x,i)=>{
   let c='cell',mk=String(i+1);
   if(practice&&x.ans!==null){c+=isRight(x)?' ok':' no';mk+=isRight(x)?' ✓':' ✗'}
   else if(!practice&&x.ans!==null)c+=' done';
   if(x.flag)c+=' flag';if(i===sess.i)c+=' cur';
   return `<button class="${c}" data-act="jump" data-i="${i}" aria-label="Câu ${i+1}">${mk}</button>`}).join('')}</div>${practice?'':'<button class="btn primary" data-act="submit">Nộp bài</button>'}</div>`;
 }
 const last=sess.i===n-1;
 const next=last?(practice?`<button class="btn primary main" data-act="${practice?'finish':'submit'}">Xem kết quả</button>`:`<button class="btn primary main" data-act="submit">Nộp bài</button>`):`<button class="btn ${practice&&!locked?'':'primary'} main" data-act="next">Câu tiếp ›</button>`;
 return `<div class="qtop"><div class="wrap"><button class="btn sm" data-act="exit">‹ Thoát</button><div class="qcount">Câu ${sess.i+1} / ${n}</div><div id="timer" class="timer"></div></div></div><div class="bar" aria-hidden="true"><i style="width:${(sess.i+1)/n*100}%"></i></div>
 <main class="wrap" style="padding-top:0"><div class="qcard"><div class="qmeta"><span class="sbadge" style="--c:${S.color}">${esc(S.name)}</span><span>${esc(sess.title)} · ${practice?'Ôn luyện':'Thi thử'}</span></div><div class="qtext" tabindex="-1" id="qtext">${esc(q.q)}</div>${opts}</div>${fb}${flag}${panel}</main>
 <div class="nav"><div class="wrap"><button class="btn" data-act="prev" ${sess.i===0?'aria-disabled="true"':''}>‹ Trước</button><button class="btn" data-act="panel">${ui.panel?'Đóng danh sách':'Danh sách câu'}</button>${next}</div></div>`;
}
function reviewItem(it,idx){
 const q=Q(it.k),S=SM[it.k.split(':')[0]],st=it.ans===null?['bl','Chưa trả lời']:isRight(it)?['ok','✓ Đúng']:['no','✗ Sai'];
 const opts=it.order.map((oi,j)=>{
  let c='ro',m='';
  if(oi===0){c+=' ok';m='<b class="m">✓ Đáp án đúng</b>'}else if(j===it.ans){c+=' no';m='<b class="m">✗ Bạn đã chọn câu này</b>'}
  return `<div class="${c}"><span class="l">${L[j]}.</span><span>${esc(q.o[oi])}${m}</span></div>`}).join('');
 return `<article class="rv"><div class="rvh"><span class="num">Câu ${idx+1} <span class="sbadge" style="--c:${S.color};font-weight:400">${esc(S.name)}</span></span><span class="st ${st[0]}">${st[1]}</span></div><div class="rq">${esc(q.q)}</div>${opts}${q.e?`<p class="small" style="margin-top:.6rem">${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</article>`;
}
function vResult(){
 const r=tally(),sc=r.c/r.n*10,S=subjOf(sess.subj);
 const bad=r.w+r.b;
 const list=sess.items.map((it,i)=>[it,i]).filter(([it])=>ui.rf==='all'||it.ans===null||!isRight(it));
 return `${header()}<main class="wrap"><h1>Kết quả</h1><p class="lead">${esc(S.name)} · ${esc(sess.title)} · ${sess.mode==='practice'?'Ôn luyện':'Thi thử'}</p>
 <div class="score"><div class="big">${fmt(sc)}<small> / 10</small></div><div>Đúng ${r.c} trên ${r.n} câu</div></div>
 <div class="stats"><div class="stat g"><b>${r.c}</b>Đúng</div><div class="stat r"><b>${r.w}</b>Sai</div><div class="stat"><b>${r.b}</b>Chưa làm</div></div>
 <div class="acts"><button class="btn primary" data-act="again">Làm lại đề này</button><button class="btn" data-act="subj" data-id="${sess.subj}">Chọn đề khác</button><button class="btn" data-act="home">Về trang đầu</button></div>
 <h2>Xem lại bài làm</h2>
 <div class="chips" style="margin:0 0 1rem" role="group" aria-label="Lọc câu"><button class="chip" aria-pressed="${ui.rf==='bad'}" data-act="rf" data-m="bad">Câu sai và chưa làm (${bad})</button><button class="chip" aria-pressed="${ui.rf==='all'}" data-act="rf" data-m="all">Tất cả ${r.n} câu</button></div>
 ${list.length?list.map(([it,i])=>reviewItem(it,i)).join(''):'<p class="lead">Bạn làm đúng hết. Không có câu nào cần xem lại.</p>'}${foot()}</main>`;
}
function vSearch(){
 return `${header()}<main class="wrap"><button class="back" data-act="home">‹ Về trang đầu</button><h1>Tra cứu câu hỏi</h1><p class="lead">Gõ một vài từ để tìm câu hỏi và xem đáp án đúng. Gõ không dấu cũng được.</p>
 <label for="sq" class="small">Từ khóa</label><input id="sq" class="field" type="search" autocomplete="off" value="${esc(ui.q)}" placeholder="Ví dụ: ribosome, hô hấp, orbital...">
 <div class="chips" role="group" aria-label="Lọc theo môn"><button class="chip" aria-pressed="${ui.sf==='all'}" data-act="sf" data-m="all">Tất cả môn</button>${SUBJ.map(s=>`<button class="chip s" style="--c:${s.color}" aria-pressed="${ui.sf===s.id}" data-act="sf" data-m="${s.id}">${esc(s.name)}</button>`).join('')}</div>
 <div id="res" style="margin-top:1.2rem"></div></main>`;
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function fillSearch(){
 const box=document.getElementById('res');if(!box)return;
 const t=norm(ui.q.trim()).split(/\s+/).filter(Boolean);
 if(!t.length){box.innerHTML=`<p class="small">Nhập từ khóa để bắt đầu tìm.</p>`;return}
 const hits=[];
 for(const s of SUBJ){if(ui.sf!=='all'&&ui.sf!==s.id)continue;DATA[s.id].forEach((q,i)=>{if(q._n===undefined)q._n=norm(q.q+' '+q.o.join(' '));if(t.every(w=>q._n.includes(w)))hits.push([s,q,i])})}
 const part=hits.slice(0,ui.shown);
 box.innerHTML=`<p class="small">Tìm thấy ${hits.length} câu.</p>`+part.map(([s,q,i])=>`<article class="rv"><div class="rvh"><span class="sbadge" style="--c:${s.color}">${esc(s.name)}</span><span class="small">Câu ${i+1}</span></div><div class="rq">${esc(q.q)}</div>${q.o.map((o,j)=>`<div class="ro${j===0?' ok':''}"><span>${esc(o)}${j===0?'<b class="m">✓ Đáp án đúng</b>':''}</span></div>`).join('')}${q.e?`<p class="small" style="margin-top:.6rem">${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</article>`).join('')+(hits.length>part.length?`<button class="btn" data-act="more">Hiện thêm</button>`:'');
}
function modalHtml(){
 const m=ui.modal;if(!m)return '';
 return `<div class="mask" data-act="mclose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(m.title)}</h2><p>${esc(m.text)}</p><div class="acts"><button class="btn" data-act="mclose">${esc(m.cancel)}</button><button class="btn primary" id="mok" data-act="mok">${esc(m.ok)}</button></div></div></div>`;
}
function render(){
 const v=ui.view;
 if((v==='quiz'||v==='result')&&!sess)ui.view='home';
 const html=ui.view==='home'?vHome():ui.view==='subject'?vSubject():ui.view==='quiz'?vQuiz():ui.view==='result'?vResult():vSearch();
 app.innerHTML=html+modalHtml();
 if(ui.view==='search')fillSearch();
 if(ui.modal){const b=document.getElementById('mok');if(b)b.focus()}
 tick();
}
function tick(){
 if(ui.view!=='quiz'||!sess||sess.done||!sess.endAt)return;
 const left=Math.max(0,Math.ceil((sess.endAt-Date.now())/1000)),el=document.getElementById('timer');
 if(el){el.textContent='Còn '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.classList.toggle('low',left<300)}
 if(left<=0){ui.modal=null;finish()}
}
setInterval(tick,1000);

/* ---------- events ---------- */
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.classList.contains('mask')&&e.target!==t)return;
 const a=t.dataset.act;
 switch(a){
  case 'home':ui.modal=null;go('home');break;
  case 'fs':fs=+t.dataset.n;store.set('onthi.fs',fs);document.documentElement.setAttribute('data-fs',fs);render();break;
  case 'search':go('search');break;
  case 'subj':ui.subj=t.dataset.id;go('subject');break;
  case 'mode':ui.mode=t.dataset.m;render();break;
  case 'limit':ui.limit=+t.dataset.m;render();break;
  case 'start':start(ui.subj,t.dataset.kind,t.dataset.kind==='set'||t.dataset.kind==='rand'?+t.dataset.arg:0);break;
  case 'resume':ui.panel=false;go('quiz');break;
  case 'drop':ui.modal={title:'Bỏ bài đang làm?',text:'Các câu đã trả lời trong bài này sẽ không được tính điểm.',ok:'Bỏ bài',cancel:'Giữ lại',fn:()=>{sess=null;store.set('onthi.sess',null);render()}};render();break;
  case 'pick':pick(+t.dataset.j);break;
  case 'next':jump(sess.i+1);break;
  case 'prev':if(sess.i>0)jump(sess.i-1);break;
  case 'jump':jump(+t.dataset.i);break;
  case 'panel':ui.panel=!ui.panel;render();break;
  case 'flag':sess.items[sess.i].flag=!sess.items[sess.i].flag;saveSess();render();break;
  case 'submit':askSubmit();break;
  case 'finish':finish();break;
  case 'exit':askExit();break;
  case 'again':{ui.mode=sess.mode;ui.limit=sess.limit/60;ui.subj=sess.subj;start(sess.subj,sess.kind,sess.arg);break}
  case 'rf':ui.rf=t.dataset.m;render();break;
  case 'sf':ui.sf=t.dataset.m;ui.shown=30;render();break;
  case 'more':ui.shown+=30;fillSearch();break;
  case 'mclose':ui.modal=null;render();break;
  case 'mok':{const fn=ui.modal&&ui.modal.fn;ui.modal=null;render();if(fn)fn();break}
 }
});
app.addEventListener('input',e=>{if(e.target.id==='sq'){ui.q=e.target.value;ui.shown=30;fillSearch()}});
document.addEventListener('keydown',e=>{
 if(ui.modal){if(e.key==='Escape'){ui.modal=null;render()}return}
 if(ui.view!=='quiz'||!sess||sess.done)return;
 const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
 const k=e.key.toLowerCase();
 if('1234'.includes(k)&&k.length===1)pick(+k-1);
 else if('abcd'.includes(k)&&k.length===1)pick('abcd'.indexOf(k));
 else if(e.key==='ArrowRight'&&sess.i<sess.items.length-1)jump(sess.i+1);
 else if(e.key==='ArrowLeft'&&sess.i>0)jump(sess.i-1);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script>
</body>
</html>
