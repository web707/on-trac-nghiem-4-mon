ực XX, cái XY."]},{"q":"Mèo tam thể (có 3 màu lông đen, vàng, trắng) hầu như chỉ bắt gặp ở giới cái. Cơ sở tế bào học của hiện tượng này là do:","o":["Sự bất hoạt ngẫu nhiên của một trong hai nhiễm sắc thể X ở cá thể cái tạo thành thể khảm.","Hiện tượng đột biến gen trội trên nhiễm sắc thể thường chỉ biểu hiện ở giới cái.","Sự tương tác cộng gộp giữa các gen nằm trên các nhiễm sắc thể thường khác nhau.","Giới đực bị đột biến gây chết ở giai đoạn phôi thai nếu mang kiểu gen dị hợp."]},{"q":"Tật có túm lông ở vành tai ở người là do gen nằm trên đoạn không tương đồng của NST Y quy định. Nếu người bố mắc tật này, tỷ lệ con trai của ông ta mắc bệnh là bao nhiêu?","o":["100%.","50%.","25%.","0%."],"w":"Giữ đây là giả thiết mô hình của bài: tính trạng có túm lông tai là ví dụ di truyền Y truyền thống nhưng không nên suy rộng như kết luận đã xác nhận cho mọi trường hợp thực tế."},{"q":"Ở ruồi giấm, gen W quy định mắt đỏ, w quy định mắt trắng nằm trên X. Ruồi cái mắt trắng lai với ruồi đực mắt đỏ sinh ra đời con F1 có kiểu hình như thế nào?","o":["100% ruồi cái mắt đỏ, 100% ruồi đực mắt trắng.","100% ruồi cái mắt trắng, 100% ruồi đực mắt đỏ.","100% ruồi đều có mắt đỏ.","50% ruồi mắt đỏ, 50% ruồi mắt trắng ở cả hai giới."]},{"q":"Xét một gen có 2 alen A và a nằm trên vùng không tương đồng của NST X. Trong quần thể ruồi giấm, có tối đa bao nhiêu kiểu gen về gen này?","o":["5 kiểu gen (3 ở giới cái, 2 ở giới đực).","3 kiểu gen.","4 kiểu gen.","6 kiểu gen."]},{"q":"Vùng tương đồng (Pseudoautosomal region) trên nhiễm sắc thể giới tính X và Y có đặc điểm gì?","o":["Chứa các locus gen giống nhau, có khả năng tiếp hợp và trao đổi chéo trong giảm phân.","Chỉ chứa các gen quy định giới tính đự","Hoàn toàn không có gen nào nằm trên vùng này.","Chứa các gen lặn liên kết chặt chẽ và không bao giờ trao đổi chéo."]},{"q":"Người phụ nữ bình thường nhưng mang gen bệnh mù màu đỏ - lục (dị hợp tử) kết hôn với người đàn ông bình thường. Tỷ lệ sinh con trai của họ bị mắc bệnh mù màu là bao nhiêu?","o":["50%.","100%.","25%.","0%."],"w":"Cần phân biệt xác suất một con trai mắc bệnh (50% trong các con trai) với xác suất sinh một trẻ vừa là trai vừa mắc bệnh (25% tổng số trẻ). Câu nguồn và khóa 50% dễ bị hiểu khác nhau."},{"q":"Tính trạng di truyền liên kết với giới tính được hiểu là những tính trạng:","o":["Do các gen nằm trên nhiễm sắc thể giới tính quy định.","Chỉ xuất hiện ở một trong hai giới (ví dụ: tạo sữa ở bò cái).","Chịu ảnh hưởng bởi nồng độ hormone sinh dục của giới tính đó.","Do các gen nằm ở tế bào chất (ti thể, lục lạp) quy định."]},{"q":"Một người đàn ông bị bệnh máu khó đông (gen lặn trên X) lấy vợ hoàn toàn bình thường (không mang gen bệnh). Họ sinh ra những đứa con như thế nào?","o":["100% con gái bình thường mang gen bệnh (dị hợp), 100% con trai bình thường.","50% con gái bị bệnh, 50% con trai bị bệnh.","100% con gái bị bệnh, 100% con trai bình thường.","100% con cái sinh ra đều bị bệnh."]},{"q":"Hiện tượng di truyền liên kết với giới tính thường được ứng dụng trong thực tiễn chăn nuôi để làm gì?","o":["Phân biệt sớm giới tính của vật nuôi ngay từ giai đoạn mới nở dựa vào kiểu hình.","Tạo ra các giống vật nuôi mới có năng suất cao hơn.","Gây đột biến định hướng tạo ra các tính trạng mong muốn.","Ngăn chặn các bệnh truyền nhiễm lây lan trong đàn vật nuôi."]},{"q":"Ở ruồi giấm, alen A (thân xám) trội so với a (thân đen) trên NST thường; B (mắt đỏ) trội so với b (mắt trắng) trên NST X. Lai ruồi cái thân xám, mắt đỏ (dị hợp 2 cặp gen) với ruồi đực thân đen, mắt trắng. Tỷ lệ ruồi đực thân xám, mắt trắng ở F1 là:","o":["12,5% (1/8).","25% (1/4).","6,25% (1/16).","37,5% (3/8)."]},{"q":"Bệnh mù màu do alen lặn m nằm trên NST X. Một cặp vợ chồng mắt bình thường sinh được một con trai mắc hội chứng Klinefelter (XXY) và bị mù màu. Quá trình không phân ly NST đã xảy ra ở đâu?","o":["Ở người mẹ trong giảm phân II.","Ở người mẹ trong giảm phân I.","Ở người bố trong giảm phân I.","Ở người bố trong giảm phân II."],"w":"Kết luận mẹ giảm phân II theo mô hình không có hoán vị tại locus và không xét X-inactivation lệch; câu nguồn không nêu các giả thiết này."},{"q":"Ở gà, gen A quy định lông vằn, a quy định lông không vằn nằm trên NST Z (không có alen trên W). Lai gà trống lông vằn dị hợp tử với gà mái lông không vằn. Tỷ lệ kiểu hình ở đời con là:","o":["1 trống vằn : 1 trống không vằn : 1 mái vằn : 1 mái không vằn.","100% trống vằn : 100% mái không vằn.","100% trống không vằn : 100% mái vằn.","1 trống vằn : 2 trống không vằn : 1 mái vằn."]},{"q":"Bệnh hói đầu ở người do gen trội H nằm trên NST thường quy định ở nam, nhưng ở nữ kiểu gen HH mới gây hói, dị hợp Hh không hói. Đây là hiện tượng gì?","o":["Di truyền tính trạng chịu ảnh hưởng của giới tính.","Di truyền liên kết hoàn toàn với nhiễm sắc thể X.","Di truyền liên kết với nhiễm sắc thể Y.","Di truyền tính trạng bị hạn chế bởi giới tính."],"w":"Đây là mô hình một gen chịu ảnh hưởng giới tính trong bài tập, không phải mô tả đầy đủ cơ sở di truyền phức tạp của mọi trường hợp hói đầu ở người."},{"q":"Đặc điểm nào sau đây giúp phân biệt bệnh do gen lặn trên X (không có alen trên Y) với bệnh do gen lặn trên NST thường trong nghiên cứu phả hệ?","o":["Bệnh trên X có tỷ lệ nam mắc bệnh cao hơn nữ rõ rệt và không bao giờ truyền gen bệnh từ bố sang con trai.","Bệnh trên X có tỷ lệ mắc bệnh ở hai giới là tương đương nhau.","Bệnh trên X có hiện tượng di truyền thẳng từ mẹ sang tất cả các con gái.","Bệnh trên NST thường chỉ bắt gặp ở những gia đình có giao phối cận huyết."]},{"q":"Một quần thể người ở trạng thái cân bằng di truyền có tần số nam giới bị mù màu (do gen lặn trên X) là 10%. Tần số nữ giới bị mù màu trong quần thể này theo lý thuyết là bao nhiêu?","o":["1%.","10%.","5%.","18%."]},{"q":"Ở người, hệ nhóm máu ABO do gen trên NST thường quy định, bệnh máu khó đông do gen lặn h trên NST X. Mẹ nhóm máu A, bình thường; bố nhóm máu B, bình thường. Họ sinh con trai nhóm máu O, bị máu khó đông. Kiểu gen của bố mẹ là:","o":["IAIO XHXh x IBIO XHY.","IAIA XHXh x IBIB XHY.","IAIO XHXH x IBIO XhY.","IAIB XHXh x IOIO XHY."]},{"q":"Ở ruồi giấm, xét 2 gen lặn a và b nằm trên cùng một NST giới tính X cách nhau 20 cM. Ruồi cái dị hợp tử đều lai với ruồi đực mang kiểu hình lặn. Tỷ lệ ruồi đực mang kiểu hình tái tổ hợp tính trên tổng số cá thể của F1 là bao nhiêu?","o":["10%.","20%.","5%.","40%."]},{"q":"Một người phụ nữ có bố bị mù màu đỏ - lục, mẹ bình thường không mang gen bệnh. Cô kết hôn với người đàn ông mù màu. Xác suất họ sinh được con gái đầu lòng không bị mù màu là bao nhiêu?","o":["25% (1/4).","50% (1/2).","12,5% (1/8).","0%."]},{"q":"Cho phép lai P: X^A X^a (Mắt đỏ) x X^A Y (Mắt đỏ). Nếu xảy ra đột biến lệch bội ở cặp NST giới tính của cơ thể cái trong quá trình giảm phân I, loại giao tử mang NST giới tính đột biến nào được tạo ra?","o":["X^A X^a và O.","X^A X^A và O.","X^a X^a và O.","X^A Y và O."]},{"q":"Ở tằm, alen A quy định trứng màu sẫm trội hoàn toàn so với a quy định trứng màu sáng nằm trên NST Z. Lai tằm cái trứng sẫm với tằm đực trứng sáng. Phát biểu nào sau đây đúng về kết quả phép lai và ứng dụng của nó?","o":["F1 có tằm đực nở từ trứng sẫm, tằm cái nở từ trứng sáng; giúp phân biệt sớm giới tính tằm từ giai đoạn trứng để giữ lại tằm đực cho nhiều tơ.","F1 có 100% tằm cái nở từ trứng sẫm, 100% tằm đực nở từ trứng sáng; giúp giữ lại tằm cái đẻ trứng.","F1 có 100% trứng màu sẫm; tạo ưu thế lai cho đàn tằm ở thế hệ sau.","F1 có tằm đực nở từ trứng sáng, tằm cái nở từ trứng sẫm; giúp chọn lọc tằm cái có khả năng kháng bệnh tốt hơn."]},{"q":"Quần thể người đang ở trạng thái cân bằng di truyền, bệnh mù màu do alen lặn m nằm trên X gây r Biết tần số alen m = 0,2. Một cặp vợ chồng mắt bình thường trong quần thể này kết hôn. Xác suất sinh con đầu lòng là con trai bị mù màu là bao nhiêu?","o":["Khoảng 8,33% (tương đương 1/12).","2,5%.","12,5%.","4,16%."]},{"q":"Phả hệ mô tả hai bệnh: Bệnh P do gen trội trên NST thường; bệnh Q do gen lặn trên NST X. Một cặp vợ chồng: Chồng mắc bệnh P (nhưng bố chồng không mắc bệnh P) và không mắc bệnh Q. Vợ không mắc bệnh P, nhưng có bố mắc bệnh Q. Xác suất để cặp vợ chồng này sinh đứa con đầu lòng chỉ mắc bệnh P là:","o":["3/8.","1/4.","1/8.","3/16."],"w":"Chưa nói rõ người vợ có mắc bệnh Q hay không; có bố mắc Q chưa đủ kết luận vợ dị hợp. Khóa 3/8 cần giả thiết người vợ không mắc Q và mang alen bệnh."},{"q":"Ở ruồi giấm, alen A (mắt đỏ) trội so với a (mắt trắng), B (cánh dài) trội so với b (cánh ngắn) đều nằm trên vùng không tương đồng của NST X. Ruồi cái mắt đỏ, cánh dài dị hợp 2 cặp gen giao phối với ruồi đực mắt trắng, cánh ngắn. F1 xuất hiện 4% ruồi đực mắt đỏ, cánh ngắn. Tần số hoán vị gen ở ruồi cái là:","o":["16%.","8%.","4%.","32%."]},{"q":"Ở gà (2n=78, giới đực ZZ, giới cái ZW), một đột biến gen lặn (l) nằm trên NST Z gây chết phôi sớm. Lai gà trống dị hợp tử mang gen đột biến (ZLZl) với gà mái bình thường (ZLW). Tỷ lệ giới tính của số gà con sống sót nở ra sẽ là:","o":["2 gà trống : 1 gà mái.","1 gà trống : 1 gà mái.","1 gà trống : 2 gà mái.","3 gà trống: 1 gà mái."]}],"hh":[{"q":"Hạt nhân nguyên tử gồm những hạt nào?","o":["Proton và neutron","Proton và electron","Neutron và electron","Proton, neutron và electron"],"e":"Electron nằm ngoài hạt nhân; hạt nhân gồm proton và neutron (trừ đồng vị ¹H không có neutron)."},{"q":"Ngoại trừ He, trong các nguyên tố nhóm A (nhóm chính), cơ sở để xếp vào cùng một nhóm là gì?","o":["Có cùng số electron hóa trị ở lớp ngoài cùng","Có cùng số lớp electron","Có cùng số proton","Có cùng khối lượng nguyên tử"],"e":"Bổ sung phạm vi nhóm chính để tránh khái quát không đúng cho mọi nguyên tố chuyển tiếp."},{"q":"Trong mô hình orbital thường dùng ở mức nhập môn, bề mặt giới hạn đám mây electron thường bao vùng chứa khoảng bao nhiêu xác suất tìm thấy electron?","o":["90–95%","10–15%","40–45%","100% chính xác"],"e":"Bề mặt orbital là quy ước xác suất, không phải biên vật lý cố định; thường chọn khoảng 90–95%."},{"q":"Nguyên lý bất định Heisenberg nêu rằng không thể xác định đồng thời tùy ý chính xác hai đại lượng nào của một hạt?","o":["Vị trí và động lượng theo cùng một phương","Khối lượng và điện tích","Điện tích và số proton","Khối lượng nghỉ và số neutron"],"e":"Δx·Δpₓ ≥ ℏ/2. Đại lượng chính xác là động lượng; bản gốc ghi nhầm hạt vĩ mô."},{"q":"Độ âm điện đặc trưng cho khả năng nào của nguyên tử trong liên kết hóa học?","o":["Hút electron liên kết về phía mình","Đẩy mọi electron ra khỏi nguyên tử","Chỉ nhận neutron","Chỉ nhường proton"],"e":"Độ âm điện mô tả khả năng hút electron khi nguyên tử tham gia liên kết."},{"q":"Theo mô hình Lewis, liên kết cộng hóa trị hình thành chủ yếu bằng cách nào?","o":["Các nguyên tử dùng chung một hoặc nhiều cặp electron","Các ion trái dấu hút nhau sau khi chuyển electron hoàn toàn","Hai hạt nhân dùng chung neutron","Hai nguyên tử chỉ hút nhau bằng lực hấp dẫn"],"e":"Cặp electron dùng chung là đặc trưng của liên kết cộng hóa trị trong mô hình Lewis."},{"q":"Mô tả nào phù hợp với liên kết hydrogen điển hình giữa các phân tử?","o":["H đã liên kết với N, O hoặc F tương tác với cặp electron tự do trên nguyên tử âm điện của phân tử khác","Mọi liên kết có H đều là liên kết hydrogen","H chỉ tương tác với kim loại kiềm","Đó là liên kết giữa hai neutron"],"e":"Liên kết hydrogen điển hình có nhóm cho X–H và nguyên tử nhận có cặp electron tự do."},{"q":"Phát biểu nào SAI về cách sắp xếp bảng tuần hoàn hiện đại?","o":["Các nguyên tố được xếp theo chiều tăng dần khối lượng nguyên tử","Các nguyên tố được xếp theo chiều tăng số hiệu nguyên tử","Các nguyên tố cùng chu kỳ có cùng số lớp electron có electron ở trạng thái cơ bản","Các nguyên tố nhóm chính cùng nhóm thường có cùng số electron lớp ngoài cùng"],"e":"Bảng tuần hoàn hiện đại sắp theo điện tích hạt nhân, không theo khối lượng nguyên tử."},{"q":"Xu hướng chung từ trái sang phải trong một chu kỳ của các nguyên tố nhóm chính là gì?","o":["Bán kính nguyên tử giảm, độ âm điện thường tăng, tính kim loại giảm","Bán kính tăng và tính kim loại tăng","Độ âm điện luôn giảm","Số lớp electron tăng liên tục"],"e":"Đây là xu hướng chung; không áp dụng như quy luật tuyệt đối cho mọi đại lượng và mọi nguyên tố."},{"q":"Xu hướng chung từ trên xuống dưới trong một nhóm chính là gì?","o":["Bán kính nguyên tử tăng và tính kim loại tăng","Bán kính giảm và tính kim loại giảm","Số lớp electron giảm","Năng lượng ion hóa thứ nhất luôn tăng"],"e":"Khi xuống nhóm, có thêm lớp electron; năng lượng ion hóa thường giảm."},{"q":"Những kiểu xen phủ nào có thể tạo liên kết σ nếu orbital định hướng thích hợp?","o":["Xen phủ trục s–s, s–p và p–p","Chỉ s–s","Chỉ s–p","Chỉ xen phủ bên p–p"],"e":"Liên kết σ có mật độ electron dọc trục nối hai hạt nhân."},{"q":"Liên kết π thông thường giữa hai nguyên tử carbon hình thành do kiểu xen phủ nào?","o":["Xen phủ bên của hai orbital p song song","Xen phủ trục s–s","Xen phủ trục s–p","Xen phủ trục p–p"],"e":"Hai orbital p xen phủ bên tạo mật độ electron ở hai phía trục liên nhân."},{"q":"Trong mô hình VSEPR và lai hóa nhập môn, phân tử H₂O có đặc điểm nào?","o":["Dạng gấp khúc; O lai hóa sp³; góc H–O–H khoảng 104,5°","Dạng thẳng; O lai hóa sp; góc 180°","Dạng tam giác phẳng; góc 120°","Dạng tứ diện đều với góc H–O–H 109,5°"],"e":"O có hai cặp electron liên kết và hai cặp tự do; dạng phân tử là gấp khúc."},{"q":"Dãy nào chỉ gồm hydrocarbon có mọi nguyên tử carbon lai hóa sp³?","o":["CH₄, C₃H₈, C₄H₁₀, C₅H₁₂","CH₄, C₂H₂, C₃H₈, C₄H₁₀","C₂H₂, C₆H₆, CH₄, C₅H₁₂","C₂H₄, C₃H₈, C₄H₁₀, CH₄"],"e":"Các alkane chỉ có liên kết đơn nên carbon lai hóa sp³."},{"q":"Dung dịch là gì?","o":["Hỗn hợp đồng nhất của dung môi và chất tan","Hỗn hợp bất kỳ của hai chất rắn","Chỉ là hỗn hợp của nước và muối","Hệ luôn có hai pha phân biệt"],"e":"Dung môi không nhất thiết là nước."},{"q":"Giữ nguyên lượng chất tan, thêm dung môi tinh khiết vào dung dịch không xảy ra phản ứng. Nồng độ phần trăm khối lượng và nồng độ mol thay đổi thế nào?","o":["Cả hai đều giảm","Cả hai đều tăng","C% tăng, CM giảm","C% giảm, CM tăng"],"e":"Khối lượng và thể tích dung dịch tăng trong khi lượng chất tan giữ nguyên."},{"q":"Thẩm thấu qua màng chỉ cho dung môi đi qua là quá trình nào?","o":["Dung môi chuyển ròng từ phía dung dịch loãng sang phía đậm đặc hơn khi chưa có áp suất đối kháng đủ lớn","Chất tan luôn đi từ đậm đặc sang loãng qua màng","Electron chuyển qua màng","Dung môi chỉ chuyển từ đậm đặc sang loãng"],"e":"Đó là dòng chuyển ròng; phân tử dung môi vẫn chuyển động theo cả hai chiều."},{"q":"Phản ứng dùng trong chuẩn độ thể tích cần đáp ứng tập hợp yêu cầu nào?","o":["Nhanh, đủ hoàn toàn, có tỉ lượng xác định và xác định được điểm kết thúc phù hợp","Chỉ cần có màu","Chỉ cần sinh khí","Chỉ cần xảy ra chậm"],"e":"Cần phản ứng có cơ sở định lượng và cách nhận biết điểm kết thúc phù hợp."},{"q":"Xét về thẩm thấu, vì sao nước cất không phù hợp để truyền trực tiếp vào máu?","o":["Môi trường nhược trương làm nước đi vào hồng cầu, có thể gây tan máu","Nước cất luôn ưu trương hơn máu","Nước cất làm hồng cầu mất nước và co lại","Nước cất chứa quá nhiều NaCl"],"e":"So với dịch trong hồng cầu, nước cất là môi trường nhược trương."},{"q":"Các ion vô cơ trong cơ thể có thể tham gia những chức năng nào?","o":["Cân bằng điện giải, áp suất thẩm thấu, dẫn truyền thần kinh và hoạt động cơ","Chỉ cung cấp năng lượng trực tiếp như glucose","Chỉ tạo màu cho máu","Không tham gia hoạt động tế bào"],"e":"Các ion như Na⁺, K⁺, Ca²⁺ có những vai trò sinh lý khác nhau."},{"q":"Lấy khoảng 4,4–6,2 mmol/L làm mốc so sánh của bài tập. Với glucose M = 180 g/mol, nhận định nào đúng về giá trị 152 mg/dL?","o":["Tương đương khoảng 8,44 mmol/L và cao hơn mốc trên của bài","Tương đương 0,844 mmol/L, thấp hơn mốc dưới","Tương đương 5,00 mmol/L, nằm trong khoảng","Tương đương 15,2 mmol/L"],"e":"152 mg/dL = 1,52 g/L; 1,52/180 × 1000 = 8,44 mmol/L. Mốc được dùng cho bài tập, không phải kết luận chẩn đoán."},{"q":"Trong dược lý, mannitol truyền tĩnh mạch thuộc nhóm nào và có thể được dùng để làm gì theo chỉ định?","o":["Thuốc lợi tiểu thẩm thấu, giúp giảm áp lực nội sọ trong những tình huống được chỉ định","Thuốc chỉ cung cấp năng lượng","Chất chống đông máu trực tiếp","Dung dịch thay thế mọi chất điện giải"],"e":"Mannitol tạo tác dụng thẩm thấu; việc sử dụng phải theo chỉ định lâm sàng."},{"q":"Salbutamol có công thức thu gọn HO–C₆H₃(CH₂OH)–CH(OH)–CH₂–NH–C(CH₃)₃ (OH ở vị trí 1, CH₂OH ở 2, nhánh aminoalcohol ở 4). Xét: (1) CTPT C₁₃H₂₁NO₃; (2) có nhóm phenol; (3) có amin bậc I; (4) một mol phản ứng với ba mol NaOH trong nước. Các phát biểu SAI là?","o":["3 và 4","1 và 2","2 và 3","1 và 4"],"e":"N liên kết với hai nhóm carbon nên amin bậc II. Trong điều kiện nước thông thường chỉ OH phenol phản ứng định lượng với NaOH theo tỉ lệ 1:1."},{"q":"Ion kim loại nào là thành phần của hydroxyapatite trong xương?","o":["Ca²⁺","Ba²⁺","Na⁺","K⁺"],"e":"Hydroxyapatite có công thức thường viết Ca₁₀(PO₄)₆(OH)₂."},{"q":"Muối nào có thể trung hòa acid nhờ phản ứng HCO₃⁻ + H⁺ → CO₂ + H₂O và có trong một số chế phẩm kháng acid?","o":["NaHCO₃","NaCl","Na₂SO₄","KNO₃"],"e":"Bicarbonate phản ứng với acid; câu hỏi kiểm tra phản ứng hóa học."},{"q":"Chất nào được dùng làm vật liệu bó bột, sau khi trộn nước sẽ đông cứng thành gypsum?","o":["Thạch cao nung CaSO₄·½H₂O","Vôi sống CaO","Đá vôi CaCO₃","Na₂CO₃"],"e":"CaSO₄·½H₂O nhận nước tạo CaSO₄·2H₂O và đông cứng."},{"q":"Muối sulfate ít tan nào được dùng làm chất cản quang trong khảo sát đường tiêu hóa?","o":["BaSO₄","Na₂SO₄","MgSO₄","K₂SO₄"],"e":"BaSO₄ rất ít tan và hấp thụ tia X tốt; không thay bằng các muối bari tan."},{"q":"Cặp ion nào là các cation chủ yếu của dịch ngoại bào và nội bào, tương ứng?","o":["Na⁺ và K⁺","Ba²⁺ và Pb²⁺","Ag⁺ và Hg²⁺","Al³⁺ và Fe³⁺"],"e":"Na⁺ chủ yếu ở ngoại bào, K⁺ chủ yếu ở nội bào; chúng góp phần tạo áp suất thẩm thấu."},{"q":"Liên kết trong khung phân tử hợp chất hữu cơ chủ yếu là loại nào?","o":["Cộng hóa trị","Ion","Kim loại","Liên kết hydrogen thay cho mọi liên kết C–C"],"e":"Khung hữu cơ hình thành chủ yếu từ liên kết cộng hóa trị."},{"q":"Nhận xét nào phù hợp về nhiều phản ứng hữu cơ ở mức nhập môn?","o":["Có thể diễn ra chậm và theo nhiều hướng tạo hỗn hợp sản phẩm","Mọi phản ứng đều tức thời","Mọi phản ứng đều chỉ cho một sản phẩm","Mọi phản ứng đều hoàn toàn ở nhiệt độ phòng"],"e":"Không có một tốc độ hay hiệu suất chung cho mọi phản ứng hữu cơ."},{"q":"Trong nhiều phản ứng hữu cơ, đun nóng và dùng xúc tác có tác dụng chủ yếu nào?","o":["Tăng tốc độ phản ứng","Làm mọi phản ứng đạt hiệu suất 100%","Thay đổi định luật bảo toàn nguyên tố","Loại bỏ hoàn toàn mọi sản phẩm phụ"],"e":"Nhiệt độ và xúc tác ảnh hưởng tốc độ; xúc tác không thay đổi hằng số cân bằng."},{"q":"Amino acid thiết yếu đối với người là amino acid như thế nào?","o":["Cơ thể không tổng hợp đủ đáp ứng nhu cầu, cần được cung cấp từ khẩu phần","Cơ thể luôn tự tổng hợp đủ","Không tham gia cấu tạo protein","Chỉ tồn tại ở thực vật"],"e":"Khái niệm thiết yếu phụ thuộc khả năng đáp ứng nhu cầu của cơ thể."},{"q":"Các đơn vị tạo nên chuỗi polypeptide của protein là gì?","o":["Các gốc α-amino acid nối bằng liên kết peptide","Các gốc glucose nối bằng liên kết glycoside","Các gốc acid béo nối bằng liên kết ester","Các nguyên tử kim loại nối bằng liên kết kim loại"],"e":"Liên kết peptide hình thành giữa nhóm carboxyl và amino của các amino acid."},{"q":"Xét enzyme trong điều kiện hoạt động thích hợp: (1) làm giảm năng lượng hoạt hóa; (2) không bị tiêu hao theo tỉ lượng của phản ứng tổng thể; (3) có hiệu quả xúc tác ở lượng nhỏ; (4) thường có tính đặc hiệu cao. Có bao nhiêu phát biểu đúng?","o":["4","1","2","3"],"e":"Cả bốn mô tả đều đúng khi hiểu enzyme không bị tiêu hao theo phản ứng, không có nghĩa enzyme không bao giờ bị biến tính."},{"q":"Nguyên tố có cấu hình electron [Kr]4d¹⁰5s¹ nằm ở đâu trong bảng tuần hoàn?","o":["Khối d, chu kỳ 5, nhóm 11 (IB)","Khối s, chu kỳ 4, nhóm 1","Khối p, chu kỳ 5, nhóm 13","Khối d, chu kỳ 4, nhóm 11"],"e":"Đây là Ag, Z = 47; được xếp vào khối d."},{"q":"Nguyên tố có cấu hình electron [Ne]3s²3p¹ thuộc vị trí nào?","o":["Khối p, chu kỳ 3, nhóm 13 (IIIA)","Khối s, chu kỳ 3, nhóm 1","Khối p, chu kỳ 2, nhóm 13","Khối d, chu kỳ 3, nhóm 3"],"e":"Đây là Al, Z = 13."},{"q":"Với nguyên tử As có cấu hình [Ar]3d¹⁰4s²4p³, phát biểu nào SAI?","o":["As thuộc nhóm 13 (IIIA)","As có Z = 33","As ở chu kỳ 4","Ở trạng thái cơ bản, phân lớp 4p có ba electron độc thân"],"e":"4s²4p³ có 5 electron lớp ngoài cùng; As thuộc nhóm 15 (VA)."},{"q":"Trong CH₃–CH=CH–C≡CH, lai hóa carbon từ trái sang phải là gì?","o":["sp³, sp², sp², sp, sp","sp³, sp², sp, sp², sp","sp, sp², sp³, sp, sp²","sp², sp³, sp², sp², sp³"],"e":"Carbon ở liên kết đơn của CH₃ là sp³; C của C=C là sp²; C của C≡C là sp."},{"q":"Lai hóa của carbon trong C₂H₆, C₂H₄, C₂H₂, C₆H₆ và CCl₄ lần lượt là gì?","o":["sp³, sp², sp, sp², sp³","sp, sp², sp³, sp², sp³","sp³, sp², sp, sp, sp³","sp³, sp³, sp², sp², sp"],"e":"Trong mỗi phân tử nêu trên, các carbon có cùng kiểu lai hóa."},{"q":"Nguyên tử trung hòa có tổng số proton, neutron, electron là 36; số hạt mang điện gấp đôi số hạt không mang điện. Nguyên tố nào phù hợp?","o":["Mg, cấu hình [Ne]3s²","Na, cấu hình [Ne]3s¹","Al, cấu hình [Ne]3s²3p¹","S, cấu hình [Ne]3s²3p⁴"],"e":"2Z + N = 36 và 2Z = 2N nên Z = N = 12."},{"q":"X có lớp ngoài cùng 3s²3p¹, Y có lớp ngoài cùng 2s²2p⁴. Công thức oxide bền thông thường của X với Y là gì?","o":["X₂Y₃","X₃Y₂","XY₂","X₂Y"],"e":"X là Al (thường +3), Y là O (thường −2)."},{"q":"Số oxi hóa của K, Mn và O trong KMnO₄ lần lượt là gì?","o":["+1, +7, −2","+1, +6, −2","−1, +7, −2","+1, +7, +2"],"e":"1 + x + 4(−2) = 0 nên x = +7."},{"q":"Số oxi hóa của K, Cr và O trong K₂Cr₂O₇ lần lượt là gì?","o":["+1, +6, −2","+1, +7, −2","+2, +6, −2","+1, +3, −1"],"e":"2(+1) + 2x + 7(−2) = 0 nên x = +6."},{"q":"Cl có Z = 17. Quy ước điền orbital p theo mₗ = −1, 0, +1; điền spin +½ trước rồi ghép spin −½ cùng thứ tự. Bộ số lượng tử electron cuối là gì?","o":["n = 3; l = 1; mₗ = 0; mₛ = −½","n = 3; l = 2; mₗ = 0; mₛ = −½","n = 2; l = 1; mₗ = 0; mₛ = −½","n = 3; l = 1; mₗ = 2; mₛ = +½"],"e":"Cl có 3p⁵; electron thứ năm trong p ghép tại mₗ = 0 theo quy ước đã cho."},{"q":"Bộ số lượng tử (n, l, mₗ, mₛ) nào hợp lệ?","o":["2, 1, −1, +½","3, 0, 1, −½","1, 1, 0, +½","3, 1, 0, 1"],"e":"0 ≤ l ≤ n−1; −l ≤ mₗ ≤ l; mₛ = ±½."},{"q":"Dãy nào tăng dần nhiệt độ sôi ở áp suất 1 atm?","o":["CH₃OCH₃ < CH₃CH₂CH₂OH < CH₃COOH < C₆H₅OH","CH₃OCH₃ < C₆H₅OH < CH₃COOH < CH₃CH₂CH₂OH","C₆H₅OH < CH₃COOH < CH₃CH₂CH₂OH < CH₃OCH₃","CH₃COOH < CH₃OCH₃ < C₆H₅OH < CH₃CH₂CH₂OH"],"e":"Nhiệt độ sôi xấp xỉ lần lượt −25, 97, 118, 182 °C."},{"q":"Trong CH₃OH, C₂H₅OH, HOCH₂CH₂OH, HOCH₂CH₂CH₂OH và CH₃CH(OH)CH₂OH, có bao nhiêu chất hòa tan Cu(OH)₂ mới kết tủa tạo phức xanh lam ở nhiệt độ thường?","o":["2","1","3","4"],"e":"Ethylene glycol và propane-1,2-diol có các nhóm OH trên carbon kề nhau."},{"q":"Trong CO₂, H₂O, CH₃Cl, SO₂, SO₃ và CH₄, có bao nhiêu phân tử có moment lưỡng cực khác không?","o":["3","2","4","5"],"e":"H₂O, CH₃Cl và SO₂ phân cực; CO₂, SO₃, CH₄ có hình học đối xứng làm triệt tiêu moment."},{"q":"Trong HCl, H₂SO₄, C₆H₅OH, NaOH, BaCl₂, CH₃COOH và NH₃, có bao nhiêu chất được xếp vào chất điện li mạnh theo phân loại phổ thông?","o":["4","3","5","6"],"e":"HCl, H₂SO₄, NaOH và BaCl₂ được xếp là điện li mạnh; nấc phân li thứ hai của H₂SO₄ không hoàn toàn ở mọi nồng độ."},{"q":"Trong HCl, H₂SO₄, C₆H₅OH, NaOH, BaCl₂, CH₃COOH và NH₃, có bao nhiêu chất được xếp vào chất điện li mạnh theo phân loại phổ thông?","o":["4","6","5","3"],"e":"Bốn chất là HCl, H₂SO₄, NaOH và BaCl₂."},{"q":"Dãy nào chỉ gồm các phân tử phân cực?","o":["HCl, HCHO, CH₃CHO, C₂H₅Cl","HCl, HCHO, C₂H₄, C₂H₅Cl","CO₂, CH₃CHO, C₂H₆, HBr","CO₂, CH₃CHO, C₂H₄, C₂H₅Cl"],"e":"C₂H₄, C₂H₆ và CO₂ không phân cực."},{"q":"Phân tử mạch hở HOCH₂–(CHOH)₄–CHO có bao nhiêu nguyên tử carbon bất đối?","o":["4","3","5","6"],"e":"Bốn carbon CHOH đều gắn bốn nhóm khác nhau."},{"q":"Phân tử mạch hở HOCH₂–(CHOH)₃–CO–CH₂OH có bao nhiêu nguyên tử carbon bất đối?","o":["3","2","4","5"],"e":"Ba carbon CHOH là ba tâm bất đối."},{"q":"Trong C₆H₅OH, C₆H₅CH₂OH, HOC₆H₄CH₃, C₆H₁₃OH và C₁₀H₆(OH)₂ (hai OH gắn trực tiếp vòng naphthalene), có bao nhiêu chất thuộc loại phenol?","o":["3","1","2","4"],"e":"C₆H₅OH, cresol và naphthalenediol có OH gắn trực tiếp carbon thơm."},{"q":"Trong CH₄, NH₃, C₂H₂, CCl₄, CH₃COOH, C₂H₄, C₆H₁₂O₆ và C₆H₆, có bao nhiêu hydrocarbon?","o":["4","3","5","6"],"e":"Hydrocarbon chỉ chứa C và H: CH₄, C₂H₂, C₂H₄, C₆H₆."},{"q":"Trong CH₃CH₂CH₃, CH₃NH₂, CH₂=CHCOOH, CH₂=CH–CH=CH₂, CH₃OH, C₆H₅OH, HCHO, CH₃COONa và NH₃(aq), có bao nhiêu chất là dẫn xuất hydrocarbon theo phân loại phổ thông?","o":["6","4","5","7"],"e":"Sáu chất hữu cơ chứa nguyên tố ngoài C, H là amin, acid, methanol, phenol, formaldehyde và sodium acetate."},{"q":"Dữ liệu thay cho hình thiếu: CH₄; C₂H₄; C₂H₅OH; CH₃COOH; CH₃Cl; CH₃NH₂; HCHO. Có bao nhiêu chất là dẫn xuất hydrocarbon?","o":["5","3","4","6"],"e":"Năm chất chứa C cùng nguyên tố khác ngoài H; CH₄ và C₂H₄ là hydrocarbon."},{"q":"Trong ethanol, glycerol, ethylene glycol, dimethyl ether và propane-1,3-diol, có bao nhiêu chất hòa tan Cu(OH)₂ mới kết tủa tạo phức xanh lam ở nhiệt độ thường?","o":["2","1","3","4"],"e":"Glycerol và ethylene glycol có nhóm OH kề nhau."},{"q":"Có bao nhiêu đồng phân cấu tạo amin bậc I có công thức C₃H₉N?","o":["2","3","4","5"],"e":"Propan-1-amine và propan-2-amine."},{"q":"Trong các dung dịch CH₃NH₂, (CH₃)₂NH, (CH₃)₃N và C₆H₅NH₂ ở nồng độ thông thường, có bao nhiêu dung dịch làm quỳ tím hóa xanh rõ rệt?","o":["3","1","2","4"],"e":"Ba alkylamine có tính base đủ rõ; aniline là base rất yếu trong thử nghiệm quỳ thông thường."},{"q":"Thủy phân KHÔNG hoàn toàn Gly–Phe–Tyr–Gly–Lys–Gly–Phe–Tyr. Có thể thu tối đa bao nhiêu tripeptide khác nhau chứa ít nhất một gốc Gly?","o":["5","4","3","6"],"e":"Các đoạn khác nhau: Gly–Phe–Tyr; Phe–Tyr–Gly; Tyr–Gly–Lys; Gly–Lys–Gly; Lys–Gly–Phe."},{"q":"Thủy phân không hoàn toàn Phe–Tyr–Gly–Lys–Gly–Phe–Tyr. Có thể thu tối đa bao nhiêu dipeptide khác nhau chứa đúng một gốc Gly?","o":["4","1","3","5"],"e":"Tyr–Gly, Gly–Lys, Lys–Gly, Gly–Phe."},{"q":"Xét: (1) Mọi protein đều chứa hơn 50 loại α-amino acid khác nhau; (2) albumin và hemoglobin là protein hình cầu có thể tan trong nước; (3) tác nhân vật lý/hóa học thích hợp có thể gây biến tính protein; (4) mọi protein đều là enzyme. Có bao nhiêu phát biểu đúng?","o":["2","1","3","4"],"e":"Đúng là (2), (3). Không nhầm số gốc amino acid với số loại amino acid; không phải mọi protein đều là enzyme."},{"q":"Xét: (1) amino acid là hợp chất hữu cơ tạp chức; (2) ở pH 3, glycine có pI = 6 mang điện tích ròng âm; (3) mọi peptide kể cả dipeptide đều cho phản ứng biuret; (4) amino acid có tính lưỡng tính. Có bao nhiêu phát biểu đúng?","o":["2","1","3","4"],"e":"Đúng (1), (4). pH < pI nên glycine mang điện tích ròng dương; biuret cần ít nhất hai liên kết peptide."},{"q":"Với sucrose, maltose, lactose: (1) đều là disaccharide; (2) đều chuyển hóa qua dạng mạch hở trong nước; (3) đều chứa khoảng 42,1% C theo khối lượng (C=12, H=1, O=16); (4) dùng thuốc thử Tollens phân biệt riêng cả ba dung dịch. Có bao nhiêu phát biểu đúng?","o":["2","1","3","4"],"e":"Đúng (1), (3). CTPT chung C₁₂H₂₂O₁₁; sucrose không có đầu khử tự do; Tollens không phân biệt riêng maltose với lactose."},{"q":"Chất nào thường được xếp vào hợp chất vô cơ theo phân loại phổ thông?","o":["Ammonium cyanate NH₄OCN","Acetic acid CH₃COOH","Urea CO(NH₂)₂","Ethanol C₂H₅OH"],"e":"Muối cyanate được xếp vô cơ; urea là hợp chất hữu cơ."},{"q":"Trong (CH₃)₃C–COOH, H₂NCH₂CH₂COOH, HOOC–CH=CH–COOH và CH₃CH(NH₂)COOH, có bao nhiêu chất có đồng phân hình học quanh liên kết đôi C=C?","o":["1","2","3","4"],"e":"Chỉ but-2-enedioic acid có dạng cis/trans quanh C=C."},{"q":"Xét các mục: (1) acid tartaric HOOC–CH(OH)–CH(OH)–COOH; (2) alanine; (3) glycerol; (4) acid 2-aminopropanoic. Có bao nhiêu MỤC biểu diễn chất có thể có đồng phân đối quang? Đếm cả hai mục trùng tên.","o":["3","1","2","4"],"e":"Các mục (1), (2), (4) có thể có đồng phân đối quang; alanine và acid 2-aminopropanoic là cùng một chất. Tartaric acid còn có dạng meso."},{"q":"Xét các chất khác nhau: ethylene glycol, propane-1,3-diol, glycerol, ethanol, propane-1,2-diol, methyl acetate, formic acid, phenol và fructose. Có bao nhiêu chất hòa tan Cu(OH)₂ ở nhiệt độ thường, kể cả phản ứng acid–base?","o":["5","3","4","6"],"e":"Ethylene glycol, glycerol, propane-1,2-diol, fructose tạo phức; formic acid trung hòa Cu(OH)₂. Không đun nóng."},{"q":"Một aldohexose mạch hở có bốn tâm bất đối và không có dạng meso. Tổng số đồng phân cấu hình, kể cả dãy D và L, là bao nhiêu?","o":["16","8","32","64"],"e":"Số đồng phân là 2⁴ = 16."},{"q":"Một ketohexose mạch hở kiểu fructose có ba tâm bất đối và không có dạng meso. Tổng số đồng phân cấu hình, kể cả D và L, là bao nhiêu?","o":["8","4","16","32"],"e":"Số đồng phân là 2³ = 8."},{"q":"Xét chỉ thị acid–base: (1) dạng acid và base liên hợp thường có màu khác nhau; (2) khoảng chuyển màu thường xấp xỉ pKa ± 1; (3) không thể pha hỗn hợp nhiều chỉ thị. Những phát biểu đúng là?","o":["1 và 2","1 và 3","2 và 3","Cả 1, 2, 3"],"e":"Có thể dùng hỗn hợp chỉ thị, ví dụ chỉ thị vạn năng; khoảng chuyển màu là gần đúng."},{"q":"Ở 25 °C, so sánh các dung dịch base yếu đơn chức cùng nồng độ: (1) acid càng yếu thì pKa càng lớn; (2) base có pKb lớn hơn thường cho pH nhỏ hơn; (3) base càng mạnh thì pKb càng lớn; (4) pKa₂ của H₃PO₄ và pKb của H₂PO₄⁻ luôn có tổng 14. Chọn các phát biểu đúng.","o":["1 và 2","1 và 3","2 và 4","1, 2 và 4"],"e":"(4) ghép sai cặp: acid liên hợp của H₂PO₄⁻ là H₃PO₄ nên phải dùng pKa₁. (3) ngược chiều."},{"q":"Ở 25 °C, với các dung dịch base yếu cùng nồng độ: (1) acid yếu hơn có pKa lớn hơn; (2) base có pKb lớn hơn thường cho pH nhỏ hơn; (3) base mạnh hơn có pKb lớn hơn; (4) pKa của H₂PO₄⁻ → HPO₄²⁻ và pKb của chính H₂PO₄⁻ nhận proton có tổng 14. Chọn các phát biểu đúng.","o":["1 và 2","1, 2 và 3","2 và 3","1, 3 và 4"],"e":"(4) không ghép acid với base liên hợp tương ứng; HPO₄²⁻ mới là base liên hợp của H₂PO₄⁻ trong nấc acid đã nêu."},{"q":"Ở 25 °C: (1) acid càng mạnh thì base liên hợp càng yếu; (2) với cặp liên hợp HPO₄²⁻/PO₄³⁻, Ka·Kb = Kw; (3) Kb(NH₃)=1,8×10⁻⁵ thì Ka(NH₄⁺)≈5,56×10⁻¹⁰. Những phát biểu nào đúng?","o":["Cả 1, 2 và 3","Chỉ 1","Chỉ 2","Chỉ 3"],"e":"Kw = 10⁻¹⁴; Ka = Kw/Kb."},{"q":"Thứ tự tăng dần tính acid trong nước của CH₃COOH, C₆H₅CH₂COOH, BrCH₂COOH, ClCH₂COOH, FCH₂COOH là gì?","o":["CH₃COOH < C₆H₅CH₂COOH < BrCH₂COOH < ClCH₂COOH < FCH₂COOH","FCH₂COOH < ClCH₂COOH < BrCH₂COOH < CH₃COOH < C₆H₅CH₂COOH","CH₃COOH < FCH₂COOH < ClCH₂COOH < BrCH₂COOH < C₆H₅CH₂COOH","C₆H₅CH₂COOH < CH₃COOH < FCH₂COOH < ClCH₂COOH < BrCH₂COOH"],"e":"Nhóm hút electron ổn định anion carboxylate; hiệu ứng của halogen ở vị trí α tăng từ Br đến F."},{"q":"Chất nào là alcohol bậc II?","o":["CH₃–CH(CH₃)–CH(OH)–CH₃","CH₃CH₂OH","(CH₃)₂C(OH)CH(CH₃)₂","C₆H₅C(OH)(CH₃)₂"],"e":"Carbon gắn OH trong chất đúng liên kết trực tiếp với hai carbon khác."},{"q":"Về phenol: (1) được dùng làm nguyên liệu sản xuất một số phẩm nhuộm; (2) tan rất nhiều trong nước lạnh; (3) nước brom dư tạo kết tủa 2,4,6-tribromophenol; (4) vòng phenol dễ thế brom hơn benzene trong điều kiện tương ứng. Những phát biểu đúng là?","o":["1, 3 và 4","1, 2 và 3","1, 2 và 4","Cả bốn"],"e":"Nhóm OH hoạt hóa vòng thơm; phenol chỉ tan hạn chế trong nước lạnh."},{"q":"Acid glutamic có cấu tạo HOOC–CH(NH₂)–CH₂–CH₂–COOH, pI = 3,2. Xét: (1) là hợp chất tạp chức; (2) CTPT C₅H₁₀NO₄; (3) là α-amino acid lưỡng tính; (4) ở pH 6 có điện tích ròng âm và chuyển về anode (+). Chọn các phát biểu đúng.","o":["1, 3 và 4","1 và 2","2 và 3","2, 3 và 4"],"e":"CTPT đúng C₅H₉NO₄; pH > pI nên mang điện tích ròng âm."},{"q":"Xét khả năng cho/nhận proton của ethanol trong môi trường NH₃ lỏng và môi trường HCl có tính acid mạnh. Mô tả nào phù hợp?","o":["Ethanol thể hiện tính acid đối với NH₃ và tính base đối với HCl","Ethanol chỉ có tính base trong cả hai","Ethanol chỉ có tính acid trong cả hai","Ethanol không có khả năng cho hay nhận proton"],"e":"Ethanol có thể nhường proton của OH cho base mạnh hơn và nhận proton trên O từ acid mạnh hơn."},{"q":"Thuốc thử nào dùng để phát hiện nước lẫn trong ethanol bằng sự đổi màu trắng sang xanh?","o":["CuSO₄ khan","NaCl khan","Cu kim loại","Ag kim loại"],"e":"CuSO₄ khan màu trắng tạo dạng hydrate màu xanh khi có nước."},{"q":"Trong mô hình bỏ qua ảnh hưởng lực ion, xét độ tan Ba(NO₃)₂ trong nước tinh khiết, NaCl 0,10 M, NaNO₃ 0,10 M và BaCl₂ 0,10 M. Môi trường nào KHÔNG chứa ion chung với Ba(NO₃)₂?","o":["Nước tinh khiết và NaCl 0,10 M","NaNO₃ và BaCl₂","Chỉ NaNO₃","Cả bốn đều chứa ion chung"],"e":"Ion chung là Ba²⁺ hoặc NO₃⁻; nước và NaCl không cung cấp các ion này."},{"q":"Cặp nào gồm hai hợp chất hữu cơ theo phân loại phổ thông?","o":["CH₃Cl và C₆H₅Br","CO₂ và CaCO₃","NaHCO₃ và NaCN","CO và CaC₂"],"e":"Các dẫn xuất halogen của hydrocarbon là hợp chất hữu cơ."},{"q":"Chất nào được xếp vào hợp chất hữu cơ?","o":["CH₃COONa","Na₂CO₃","CO₂","Al₄C₃"],"e":"Sodium acetate là muối của acid hữu cơ; carbonate, oxide carbon và carbide được xếp vô cơ."},{"q":"Chất nào là dẫn xuất hydrocarbon?","o":["CH₃OH","C₆H₆","CH₄","C₂H₄"],"e":"Methanol chứa O, có thể xem là dẫn xuất thay H của methane bằng OH."},{"q":"Dung dịch nào ở nồng độ thông thường làm quỳ tím chuyển xanh rõ rệt?","o":["CH₃CH₂CH₂NH₂","C₆H₅NH₂","CH₃COOH","H₂NCH₂COOH"],"e":"Propylamine là base; aniline là base yếu hơn nhiều và không làm quỳ tím hóa xanh rõ trong thử nghiệm phổ thông."},{"q":"Dạng chiếm ưu thế của alanine trong môi trường acid mạnh (pH khoảng 2) là gì?","o":["H₃N⁺–CH(CH₃)–COOH","H₃N⁺–CH(CH₃)–COO⁻","H₂N–CH(CH₃)–COO⁻","H₂N–CH(CH₃)–COOH"],"e":"Môi trường acid tăng sự proton hóa nhóm amino và carboxyl."},{"q":"Cặp chất nào có trong các chế phẩm sát khuẩn quen thuộc, xét về nhận diện hóa chất?","o":["Dung dịch iod trong alcohol và dung dịch H₂O₂","Nước Javel và benzene","Dung dịch NaCl và methane","Nước chlorine và chloroform"],"e":"Iod và hydrogen peroxide có hoạt tính sát khuẩn. Câu này chỉ nhận diện hóa chất, không chỉ định dùng cho mọi loại vết thương."},{"q":"Nhỏ phenolphthalein vào dung dịch CH₃COOH có pH 3. Màu quan sát là gì?","o":["Không màu","Hồng","Xanh","Vàng"],"e":"Phenolphthalein không màu trong môi trường acid."},{"q":"Nhỏ methyl orange vào dung dịch CH₃COOH có pH 2,5. Màu quan sát chủ yếu là gì?","o":["Đỏ","Vàng","Xanh","Không màu"],"e":"pH 2,5 thấp hơn vùng chuyển màu khoảng 3,1–4,4 của methyl orange."},{"q":"Acid aspartic có cấu tạo HOOC–CH₂–CH(NH₂)–COOH. Với dung dịch có pH 3, quỳ tím chuyển chủ yếu sang màu nào?","o":["Đỏ","Xanh","Mất màu hoàn toàn","Tím đậm do base mạnh"],"e":"Dung dịch được cho pH acid; acid aspartic có hai nhóm COOH và một nhóm amino."},{"q":"Phân biệt bốn mẫu riêng: glycerol, lòng trắng trứng, hồ tinh bột, dung dịch xà phòng. Bộ thuốc thử nào đủ dùng theo quy trình: iod nhận tinh bột; Cu(OH)₂ trong môi trường kiềm nhận protein màu tím và glycerol xanh lam; mẫu còn lại là xà phòng?","o":["Dung dịch iod và Cu(OH)₂ trong môi trường kiềm","Chỉ dung dịch iod","Chỉ phenolphthalein","Chỉ NaCl"],"e":"Phản ứng iod với tinh bột, biuret với protein và tạo phức với glycerol cho các dấu hiệu khác nhau."},{"q":"Trộn hai thể tích bằng nhau dung dịch Pb(NO₃)₂ 0,010 M và KI 0,010 M. Biết Ksp(PbI₂)=9,8×10⁻⁹; coi thể tích cộng được. Có tạo kết tủa không?","o":["Có, vì Q = 1,25×10⁻⁷ > Ksp","Không, vì Q = 1,25×10⁻⁹ < Ksp","Không, vì không có Pb²⁺","Vừa đúng bão hòa vì Q = Ksp"],"e":"Sau trộn: [Pb²⁺]=[I⁻]=0,005 M trước kết tủa; Q=0,005×0,005²."},{"q":"Cho độ âm điện H=2,1; C=2,5; N=3,0; O=3,5. Liên kết nào có chênh lệch độ âm điện lớn nhất?","o":["O–H","N–H","C–O","N–O"],"e":"Các chênh lệch lần lượt 1,4; 0,9; 1,0; 0,5."},{"q":"Trong dãy alcohol no, đơn chức có cấu trúc tương tự, khi mạch carbon dài hơn, độ tan trong nước thường thay đổi thế nào?","o":["Giảm do phần hydrocarbon kị nước tăng","Tăng vì mọi nhóm CH₂ đều ưa nước","Không đổi ở mọi độ dài mạch","Tăng vì số nhóm OH tự tăng theo mạch"],"e":"Khi giữ một nhóm OH, phần kị nước tăng thường làm giảm độ tan."},{"q":"Phenol phản ứng với HNO₃ loãng ở nhiệt độ thấp chủ yếu tạo hỗn hợp nào?","o":["o-Nitrophenol và p-nitrophenol","Chỉ m-nitrophenol","Chỉ 2,4,6-trinitrophenol trong mọi điều kiện","Nitrobenzene và methane"],"e":"OH định hướng phản ứng thế electrophile vào vị trí ortho và para."},{"q":"Chọn phát biểu đúng về ethanol, phenol và diethyl ether.","o":["Phenol độc và có thể gây biến tính protein","Ethanol là chất khí ở 25 °C, 1 atm","Ethanol sát khuẩn như nhau ở mọi nồng độ","Diethyl ether không có nguy cơ cháy"],"e":"Phenol độc và có thể hấp thu qua da; ethanol ở điều kiện thường là chất lỏng."},{"q":"Chọn phát biểu SAI.","o":["Ethanol là chất khí ở 25 °C và 1 atm","Mannitol là một polyol","Anisole là methoxybenzene","Phenol có thể làm biến tính protein"],"e":"Ethanol là chất lỏng ở 25 °C và áp suất khí quyển."},{"q":"Acid lactic có cấu tạo CH₃–CH(OH)–COOH. Hai loại nhóm chức có trong phân tử là gì?","o":["Hydroxyl alcohol và carboxyl","Aldehyde và carboxyl","Aldehyde và ether","Ketone và ether"],"e":"OH trên carbon no tạo chức alcohol; COOH là nhóm carboxyl."},{"q":"Điền vào chỗ trống: Nhóm chức là … quyết định những phản ứng hóa học đặc trưng của một loại hợp chất hữu cơ.","o":["Nguyên tử hoặc nhóm nguyên tử","Chỉ một phân tử dung môi","Chỉ nguyên tử carbon","Chỉ nhóm nguyên tử, không bao giờ là một nguyên tử"],"e":"Nhóm chức có thể là nguyên tử như halogen hoặc nhóm như OH, COOH."},{"q":"Dùng cấu tạo keto của curcumin: Ar–CH=CH–CO–CH₂–CO–CH=CH–Ar, với Ar = 4-hydroxy-3-methoxyphenyl. Phát biểu nào SAI?","o":["Phân tử có CTPT C₁₂H₂₀O₆","Có các nhóm phenol","Có các nhóm ketone ở dạng cấu tạo đã cho","Có liên kết C=C ở mạch nối hai vòng"],"e":"CTPT curcumin là C₂₁H₂₀O₆. OH gắn vòng thơm là phenol; curcumin còn có cân bằng keto–enol."},{"q":"Trong CH₃COOH, HCOOH, HCHO, glucose và C₂H₅OH, nhóm nào gồm toàn các chất cho phản ứng Tollens trong điều kiện thử thích hợp?","o":["HCOOH, HCHO, glucose","CH₃COOH, glucose, C₂H₅OH","CH₃COOH, HCOOH, HCHO","HCHO, glucose, C₂H₅OH"],"e":"Formic acid, formaldehyde và glucose có thể khử ion bạc trong thuốc thử Tollens."},{"q":"CH₃COOC₂H₅ thuộc loại hợp chất nào?","o":["Ester","Ketone","Alcohol","Aldehyde"],"e":"Nhóm –COO– nối hai phần hữu cơ là chức ester."},{"q":"C₂H₅OH thuộc loại hợp chất nào?","o":["Alcohol","Ketone","Ester","Dẫn xuất halogen"],"e":"Ethanol có nhóm OH gắn carbon no."},{"q":"Cấu trúc BỔ SUNG thay hình thiếu: HO–C₆H₃(NH₂)–COOH (OH tại 1, NH₂ tại 2, COOH tại 4). Nhóm chức nào KHÔNG có trong phân tử?","o":["Aldehyde –CHO","Phenol","Amino –NH₂","Carboxyl –COOH"],"e":"Cấu trúc có OH phenol, amino và carboxyl; không có CHO. Nhóm COOH đã chứa liên kết C=O nên không thể chọn carbonyl là không có."},{"q":"Glycine có pI≈6. Sau khi acid hóa đến pH 2, đặt trong điện trường một chiều, glycine có điện tích ròng và xu hướng chuyển động nào?","o":["Dương, chuyển về cathode (−)","Dương, chuyển về anode (+)","Âm, chuyển về cathode (−)","Âm, chuyển về anode (+)"],"e":"pH < pI nên điện tích ròng dương, bị hút về điện cực âm."},{"q":"Nhóm nào chỉ gồm carbohydrate có tính khử trong thuốc thử Tollens hoặc Fehling thích hợp?","o":["Glucose, fructose, lactose","Fructose, tinh bột, sucrose","Glucose, fructose, sucrose","Glucose, sucrose, cellulose"],"e":"Fructose chuyển hóa qua enediol trong môi trường kiềm; lactose có đầu khử; sucrose không có đầu khử tự do."},{"q":"Cặp polysaccharide nào có cấu trúc phân nhánh?","o":["Amylopectin và glycogen","Cellulose và amylose","Amylopectin và cellulose","Cellulose và glycogen"],"e":"Amylopectin và glycogen có nhánh với liên kết α(1→6) bên cạnh mạch α(1→4)."},{"q":"Chất nào thường cho màu xanh tím đặc trưng với dung dịch iod ở điều kiện thử thông thường?","o":["Tinh bột","Sucrose","Glucose","Cellulose"],"e":"Màu đặc trưng chủ yếu do iod tương tác với cấu trúc xoắn amylose."},{"q":"Glycogen cho màu gì đặc trưng khi thử với iod trong điều kiện thông thường?","o":["Nâu đỏ","Xanh tím đậm như amylose","Tím biuret","Không màu do không tương tác"],"e":"Cấu trúc phân nhánh và đoạn xoắn ngắn làm màu khác tinh bột."},{"q":"Chất nào ở trạng thái khí tại 25 °C, 1 atm và có mùi khai kiểu amine?","o":["Ethylamine","Aniline","Ethanol","Methyl acetate"],"e":"Ethylamine có nhiệt độ sôi thấp hơn nhiệt độ phòng."},{"q":"Chất nào không có đầu khử tự do, do đó không có chuyển quay thông qua mở vòng ở đầu anomer trong nước?","o":["Sucrose","Lactose","Maltose","Galactose"],"e":"Hai carbon anomer của sucrose đều tham gia liên kết glycoside."},{"q":"Đường nào KHÔNG có tính khử trong phép thử Tollens thông thường khi chưa thủy phân?","o":["Sucrose","Maltose","Lactose","Galactose"],"e":"Sucrose không có carbon anomer tự do."},{"q":"Trong sucrose, lactose, amylose và amylopectin, đường nào cho phản ứng Fehling rõ rệt ở mức thử định tính phổ thông?","o":["Lactose","Sucrose","Amylose","Amylopectin"],"e":"Lactose là disaccharide khử; với polysaccharide, phần đầu khử quá nhỏ so với kích thước phân tử để có phản ứng điển hình ở phép thử này."},{"q":"Khi khử nhóm carbonyl trong dạng mạch hở bằng tác nhân thích hợp, mô tả nào đúng cho glucose và fructose?","o":["Glucose cho sorbitol; fructose có thể cho sorbitol và mannitol","Cả hai chỉ cho ethanol","Glucose chỉ cho mannitol; fructose chỉ cho sorbitol","Cả hai luôn chỉ cho duy nhất sorbitol"],"e":"Khử aldehyde của glucose cho sorbitol; khử ketone của fructose tạo thêm tâm bất đối và có thể cho hai alditol."},{"q":"Monosaccharide có sáu carbon và nhóm aldehyde ở dạng mạch hở được gọi là gì?","o":["Aldohexose","Ketohexose","Aldopentose","Ketopentose"],"e":"Aldo- chỉ aldehyde; hexose chỉ sáu carbon."},{"q":"Monosaccharide có năm carbon và nhóm ketone ở dạng mạch hở được gọi là gì?","o":["Ketopentose","Ketohexose","Aldohexose","Aldopentose"],"e":"Keto- chỉ ketone; pentose chỉ năm carbon."},{"q":"Nhóm nào chỉ gồm polysaccharide?","o":["Cellulose, glycogen, chondroitin sulfate, heparin","Cellulose, glycogen, fructose, heparin","Cellulose, glycogen, sucrose, heparin","Cellulose, maltose, chondroitin sulfate, heparin"],"e":"Fructose là monosaccharide; sucrose và maltose là disaccharide."},{"q":"Sucrose gồm hai đơn vị nào liên kết qua hai carbon anomer?","o":["α-D-glucopyranose và β-D-fructofuranose","Hai β-D-galactopyranose","Hai α-D-glucopyranose","α-D-fructofuranose và β-D-glucopyranose"],"e":"Liên kết sucrose thường viết α-D-Glcp-(1→2)-β-D-Fruf."},{"q":"Nhóm nào chỉ gồm homopolysaccharide (polysaccharide thuần)?","o":["Glycogen, amylose, amylopectin","Sucrose, heparin, glycogen","Cellulose, amylose, hyaluronic acid","Fructose, amylopectin, heparin"],"e":"Ba chất ở đáp án đúng đều chỉ gồm các gốc glucose."},{"q":"Trong bối cảnh câu hỏi gốc về cyanide, xét RIÊNG cấu trúc hóa học của tinh bột, glucose, acetic acid và dầu triglyceride. Chất nào có thể có nhóm aldehyde tự do ở dạng mạch hở?","o":["Glucose","Acetic acid","Tinh bột với mọi gốc đều là aldehyde tự do","Dầu triglyceride"],"e":"Glucose mạch hở có CHO. Không suy ra rằng cho ăn glucose là cách điều trị ngộ độc cyanide; ngộ độc cần cấp cứu và thuốc giải độc đặc hiệu theo chuyên môn."},{"q":"Xét RIÊNG dạng mạch hở, trong fructose, tinh bột, acetic acid và dầu triglyceride, chất nào có nhóm ketone?","o":["Fructose","Tinh bột","Acetic acid","Dầu triglyceride"],"e":"Fructose mạch hở có ketone. Kiến thức phản ứng carbonyl không chứng minh hiệu quả điều trị cyanide bằng thực phẩm."},{"q":"Trong môi trường nước gần trung tính, thuốc thử nào phân biệt glucose với fructose qua oxi hóa nhẹ nhóm aldehyde?","o":["Nước brom","Thuốc thử Tollens trong kiềm","Thuốc thử Fehling trong kiềm","Thuốc thử Benedict trong kiềm"],"e":"Glucose làm mất màu nước brom trong điều kiện phù hợp; fructose không phản ứng tương tự khi tránh môi trường kiềm."},{"q":"Thay hình bằng mô tả cấu trúc: hai gốc D-glucopyranose nối qua liên kết α(1→4), còn một carbon anomer tự do. Đây là đường nào?","o":["Maltose","Lactose","Sucrose","Cellulose"],"e":"Maltose có liên kết α-D-Glcp-(1→4)-D-Glcp."},{"q":"Thay hình bằng mô tả cấu trúc: một β-D-galactopyranosyl nối (1→4) với D-glucose, còn đầu khử tự do. Đây là đường nào?","o":["Lactose","Maltose","Sucrose","Cellulose"],"e":"Lactose là β-D-Galp-(1→4)-D-Glcp."},{"q":"Thay hình bằng mô tả cấu trúc: α-D-glucopyranosyl nối từ C1 đến C2 của β-D-fructofuranoside, không còn carbon anomer tự do. Đây là đường nào?","o":["Sucrose","Maltose","Lactose","Cellulose"],"e":"Sucrose có liên kết giữa hai carbon anomer."},{"q":"Bài tập lý tưởng ở 25 °C: hòa tan 0,10 mol NaOH vào 100 mL nước; bỏ qua biến đổi thể tích và dùng nồng độ thay hoạt độ. pH tăng khoảng bao nhiêu so với nước tinh khiết pH 7?","o":["7 đơn vị","3 đơn vị","4 đơn vị","Giảm 7 đơn vị"],"e":"[OH⁻]≈1,0 M; pOH≈0; pH≈14. Đây là mô hình lý tưởng của bài tập."},{"q":"Bài tập lý tưởng ở 25 °C: hòa tan 0,10 mol HCl vào 100 mL nước; bỏ qua biến đổi thể tích và dùng nồng độ thay hoạt độ. pH giảm khoảng bao nhiêu so với nước tinh khiết pH 7?","o":["7 đơn vị","3 đơn vị","4 đơn vị","Tăng 7 đơn vị"],"e":"[H⁺]≈1,0 M nên pH≈0; giảm khoảng 7 theo mô hình đã nêu."},{"q":"Tính bước sóng de Broglie của electron với m=9,109×10⁻³¹ kg, v=1,00×10⁶ m/s, h=6,626×10⁻³⁴ J·s. Bỏ qua hiệu ứng tương đối tính.","o":["7,27×10⁻¹⁰ m","7,27×10⁻⁸ m","6,97×10⁻¹² m","7,27×10⁻⁶ m"],"e":"λ=h/(mv)=6,626×10⁻³⁴/(9,109×10⁻³¹×10⁶)≈7,27×10⁻¹⁰ m."},{"q":"Trộn các thể tích bằng nhau Pb(NO₃)₂ 0,010 M và KI 0,010 M. Tích ion Q=[Pb²⁺][I⁻]² ngay sau pha loãng, trước khi kết tủa xảy ra, là bao nhiêu?","o":["1,25×10⁻⁷","1,00×10⁻⁶","1,25×10⁻⁹","1,00×10⁻⁴"],"e":"Mỗi nồng độ giảm một nửa; Q=0,005×0,005²."},{"q":"Electron mₑ=9,109×10⁻³¹ kg, vₑ=4,6×10⁶ m/s; proton mₚ=1,673×10⁻²⁷ kg, vₚ=2,1×10⁴ m/s. Tỉ số λₑ/λₚ xấp xỉ bằng bao nhiêu?","o":["8,38","0,119","8,55","83,8"],"e":"λₑ/λₚ=mₚvₚ/(mₑvₑ)≈8,38."},{"q":"Acid yếu đơn chức HA có nồng độ ban đầu 0,50 mol/L, pH=2,80. Bỏ qua hoạt độ và sự tự điện li nước. pKa xấp xỉ bao nhiêu?","o":["5,30","4,80","4,58","3,42"],"e":"x=10⁻²·⁸; Ka=x²/(0,50−x)≈5,04×10⁻⁶ nên pKa≈5,30."},{"q":"Lysine có pKa₁=2,18; pKa₂=8,95; pKa₃=10,53. pI xấp xỉ bao nhiêu?","o":["9,74","7,22","5,57","6,63"],"e":"Với lysine, trạng thái trung hòa nằm giữa hai nấc pKa cao: pI=(8,95+10,53)/2."},{"q":"Đệm CH₃COOH 0,20 M/CH₃COONa 0,20 M trong cùng dung dịch, pKa=4,75. Theo Henderson–Hasselbalch, pH bằng bao nhiêu?","o":["4,75","4,55","9,25","9,75"],"e":"pH=pKa+log([base]/[acid])=4,75+log1."},{"q":"100 mL dung dịch cuối chứa 5,35 g NH₄Cl và NH₃ có nồng độ 0,010 M. Cho M(NH₄Cl)=53,5 g/mol, pKb(NH₃)=4,74, pKw=14. Theo công thức đệm, pH xấp xỉ bao nhiêu?","o":["7,26","8,26","9,26","10,26"],"e":"[NH₄⁺]=1,0 M; pKa(NH₄⁺)=9,26; pH=9,26+log(0,010/1,0)=7,26."},{"q":"H₂SO₄ 0,50 M ở 25 °C: coi nấc 1 phân li hoàn toàn, nấc 2 có Ka₂=1,2×10⁻². Bỏ qua hoạt độ. pH xấp xỉ bao nhiêu?","o":["0,29","1,00","0,50","2,00"],"e":"Gọi x là phần HSO₄⁻ phân li: (0,50+x)x/(0,50−x)=0,012; x≈0,0115; pH=−log(0,5115)≈0,29."},{"q":"Trộn 160 mL Ba(OH)₂ 0,080 M với 140 mL KOH 0,040 M ở 25 °C, thể tích cộng được và bỏ qua hoạt độ. pH xấp xỉ bao nhiêu?","o":["13,02","6,00","10,30","15,20"],"e":"n(OH⁻)=2×0,160×0,080+0,140×0,040=0,0312 mol; [OH⁻]=0,104 M."},{"q":"Đệm CH₃COOH 0,10 M/CH₃COONa 0,20 M trong cùng dung dịch có pKa=4,73. pH xấp xỉ bao nhiêu?","o":["5,03","4,73","5,74","4,03"],"e":"pH=4,73+log2≈5,03."},{"q":"Trong 1,00 L đệm có 0,100 mol CH₃COOH và 0,100 mol CH₃COOK. Thêm 0,0100 mol HCl, bỏ qua thay đổi thể tích, pKa=4,75. pH sau phản ứng xấp xỉ bằng bao nhiêu?","o":["4,66","4,83","4,75","4,35"],"e":"H⁺ chuyển acetate thành acid: n(base)=0,0900; n(acid)=0,110; pH=4,75+log(0,09/0,11)≈4,66."},{"q":"CH₃COOH 5,00% khối lượng, d=1,05 g/mL, M=60 g/mol, pKa=4,76. Bỏ qua hoạt độ, pH xấp xỉ bằng bao nhiêu?","o":["2,41","2,10","3,41","4,76"],"e":"1 L chứa 52,5 g acid nên C=0,875 M; [H⁺]≈√(10⁻⁴·⁷⁶×0,875), pH≈2,41."},{"q":"Cần bao nhiêu NaCl để pha 500 g dung dịch 0,90% khối lượng?","o":["4,50 g","5,50 g","5,00 g","4,00 g"],"e":"m=500×0,009=4,50 g."},{"q":"Chai rượu 450 mL, độ rượu 40% thể tích. Thể tích ethanol nguyên chất quy đổi trong chai là bao nhiêu?","o":["180 mL","90 mL","270 mL","450 mL"],"e":"V(ethanol)=450×0,40=180 mL."},{"q":"Trong môi trường acid, MnO₄⁻ bị khử thành Mn²⁺. Với M(KMnO₄)=158 g/mol, đương lượng gam của KMnO₄ là bao nhiêu?","o":["31,6 g/đương lượng","158 g/đương lượng","79,0 g/đương lượng","49,0 g/đương lượng"],"e":"Mn nhận 5 electron nên E=M/5=31,6."},{"q":"Hòa tan 5,00 g glucose trong 85,0 g nước. Nồng độ phần trăm khối lượng của dung dịch là bao nhiêu?","o":["5,56%","5,00%","5,88%","6,25%"],"e":"m(dung dịch)=90,0 g; C%=5/90×100≈5,56%."},{"q":"Độ tan mol của Mg(OH)₂ là s=1,2×10⁻⁴ M. Bỏ qua tự điện li nước và hoạt độ. Ksp bằng bao nhiêu?","o":["6,912×10⁻¹²","1,728×10⁻¹²","1,44×10⁻¹²","1,20×10⁻⁴"],"e":"[Mg²⁺]=s, [OH⁻]=2s; Ksp=4s³."},{"q":"18,0 g glucose (M=180 g/mol) được pha thành 1000 g dung dịch, d=1,25 g/mL. Nồng độ mol là bao nhiêu?","o":["0,125 M","0,080 M","0,100 M","1,25 M"],"e":"n=0,100 mol; V=1000/1,25=800 mL=0,800 L; C=0,125 M."},{"q":"Lấy 4,4–6,2 mmol/L làm khoảng so sánh trong bài tập. Glucose 100 mg/dL, M=180 g/mol, tương đương giá trị nào?","o":["5,56 mmol/L, nằm trong khoảng bài cho","0,56 mmol/L, thấp hơn khoảng","55,6 mmol/L, cao hơn khoảng","1,00 mmol/L, thấp hơn khoảng"],"e":"100 mg/dL=1,00 g/L; (1/180)×1000=5,56 mmol/L; không suy ra chẩn đoán chỉ từ bài đổi đơn vị."},{"q":"Cho 20,0 g glucose phản ứng hoàn toàn với thuốc thử Tollens dư. Cho M(glucose)=180 g/mol, M(Ag)=108 g/mol. Khối lượng Ag lý thuyết là bao nhiêu?","o":["24,0 g","12,0 g","20,0 g","36,0 g"],"e":"Một mol glucose tạo hai mol Ag; m=20/180×2×108=24 g."},{"q":"β-Carotene có công thức phân tử C₄₀H₅₆. Số nguyên tử hydrogen trong một phân tử là bao nhiêu?","o":["56","54","55","57"],"e":"Chỉ số H trong CTPT là 56."},{"q":"100 mL dung dịch chứa 8,775 g NaCl. Cho Na=23, Cl=35,5. Nồng độ mol bằng bao nhiêu?","o":["1,50 M","1,00 M","1,25 M","2,00 M"],"e":"M=58,5 g/mol; n=0,150 mol; V=0,100 L."},{"q":"Hòa tan 1,80 g NaCl vào 100 mL nước có d=1,00 g/mL. Nồng độ phần trăm khối lượng bằng bao nhiêu?","o":["1,77%","1,80%","0,18%","18,0%"],"e":"m(nước)=100 g; C%=1,8/101,8×100≈1,77%."},{"q":"Với cùng một phản ứng quy ước xác định đương lượng, cần lấy bao nhiêu dung dịch glucose 10 N để pha thành 100 mL dung dịch 2 N?","o":["20 mL","2,0 mL","10 mL","1,0 mL"],"e":"Bảo toàn lượng đương lượng khi pha loãng: N₁V₁=N₂V₂. Không dùng normality của glucose nếu chưa có cùng quy ước phản ứng."},{"q":"Pha 500 mL dung dịch glucose 5,00% khối lượng có d=1,02 g/mL. Cần bao nhiêu glucose?","o":["25,5 g","25,0 g","30,0 g","2,50 g"],"e":"m(dung dịch)=500×1,02=510 g; m(glucose)=510×0,05=25,5 g."},{"q":"CO(g)+H₂O(g) ⇌ CO₂(g)+H₂(g), Kc=1. Ban đầu [CO]=0,10 M, [H₂O]=0,40 M, chưa có sản phẩm. [CO₂] và [H₂] tại cân bằng là bao nhiêu?","o":["0,080 M và 0,080 M","0,060 M và 0,080 M","0,050 M và 0,080 M","0,080 M và 0,100 M"],"e":"x²/[(0,10−x)(0,40−x)]=1; 0,50x=0,040 nên x=0,080."},{"q":"Với cân bằng 2CO₂(g) ⇌ 2CO(g)+O₂(g), nồng độ cân bằng [CO₂]=1,20 M, [CO]=0,350 M, [O₂]=0,150 M. Giá trị số Kc theo quy ước nồng độ mol/L là bao nhiêu?","o":["0,0128","0,0230","0,0440","0,0470"],"e":"Kc=[CO]²[O₂]/[CO₂]²=0,350²×0,150/1,20²≈0,0128."},{"q":"Theo quy ước phân loại nhập môn thường dùng trong đề cương, chuỗi polypeptide được gọi là protein khi thường có số gốc α-amino acid ở mức nào?","o":["Trên khoảng 50 gốc","Chỉ một gốc","Luôn dưới 10 gốc","Chính xác hai gốc"],"e":"Mốc khoảng 50 là quy ước thực hành, không phải định nghĩa tuyệt đối của mọi protein; protein còn liên quan cấu trúc và chức năng."},{"q":"Theo quy ước nhập môn của đề cương, oligosaccharide gồm khoảng bao nhiêu đơn vị monosaccharide?","o":["2–10","2–50","20–100","Luôn hơn 100"],"e":"Giới hạn trên tùy hệ phân loại; trong quy ước bài này dùng khoảng 2–10."},{"q":"Chọn phát biểu SAI: xét dung dịch chưa xảy ra phản ứng và ở nhiệt độ xác định.","o":["Mọi dung dịch loãng đều chắc chắn chưa bão hòa","Dung dịch là hệ đồng nhất của dung môi và chất tan","Thành phần dung dịch có thể thay đổi trong một khoảng","Dung dịch bão hòa ở cân bằng với chất tan không hòa tan thêm lượng chất đó khi điều kiện giữ nguyên"],"e":"Chất ít tan có thể cho dung dịch bão hòa dù nồng độ rất nhỏ."}],"ds":[{"q":"Dân số học là môn nghiên cứu về:","o":["Quy mô, cơ cấu và biến động dân số","Bệnh tật của dân cư","Kinh tế học","Địa lý học"]},{"q":"Theo nghĩa hẹp, dân số học nghiên cứu:","o":["Dân số loài người trong một thời kỳ về số lượng thay đổi do sinh, chết và di cư","Toàn bộ các hiện tượng xã hội","Mọi đặc điểm kinh tế của dân cư","Văn hóa của dân cư"]},{"q":"Ba yếu tố cơ bản làm biến động dân số là:","o":["Sinh, chết, di cư","Sinh, kết hôn, ly hôn","Chết, thất nghiệp, sinh","Sinh, học tập, lao động"]},{"q":"Công thức cân bằng dân số là:","o":["P1 = P0 + (B − D) + (I − O)","P1 = P0 + B + D","P1 = P0 − B + D","P1 = B + D + I"]},{"q":"Đối tượng nghiên cứu chính của môn dân số học là:","o":["Con người","Động vật","Thực vật","Môi trường"]},{"q":"Theo tài liệu, phương pháp nào được xem là công cụ mạnh nhất để nhận thức xã hội?","o":["Phương pháp thống kê","Phương pháp toán học","Phương pháp thực nghiệm","Phương pháp mô hình"],"w":"Câu hỏi phụ thuộc một nhận định “theo tài liệu” nhưng không trích nguồn nhận định. Giữ khóa A, không xem “mạnh nhất” là so sánh đã được chứng minh trong mọi bối cảnh."},{"q":"Nguồn số liệu dân số quan trọng nhất là:","o":["Tổng điều tra dân số","Điều tra chọn mẫu","Báo chí","Hồ sơ bệnh án"]},{"q":"Tổng điều tra dân số có bao nhiêu đặc điểm cơ bản?","o":["4","2","3","5"],"w":"Số đặc điểm tùy bộ tiêu chí/giáo trình. File chỉ cho số 4, không liệt kê bốn đặc điểm để kiểm tra; giữ khóa nguyên gốc."},{"q":"Điều tra chọn mẫu dân số học thường được thực hiện khi:","o":["Không thể tiến hành tổng điều tra","Có quá nhiều cán bộ","Muốn điều tra toàn bộ dân số","Có đầy đủ hệ thống đăng ký"],"w":"Điều tra mẫu không chỉ thực hiện khi không thể tổng điều tra; phần hỏi nêu một tình huống nhưng không phải điều kiện duy nhất. Giữ nguyên câu và khóa."},{"q":"Nguồn số liệu phản ánh sinh, chết, kết hôn, ly hôn thường xuyên là:","o":["Thống kê hộ tịch","Tổng điều tra","Điều tra mẫu","Báo chí"]},{"q":"Theo nghĩa rộng, dân số học nghiên cứu:","o":["Quy mô, cơ cấu, phân bố dân số và các thay đổi do sinh, chết, di cư cùng các yếu tố xã hội","Chỉ quy mô dân số","Chỉ cơ cấu dân số","Chỉ biến động dân số"]},{"q":"Trong công thức cân bằng dân số, ký hiệu O là:","o":["Người xuất cư","Người chết","Người nhập cư","Người sinh"]},{"q":"Theo tài liệu, dân số trẻ là dân số có:","o":["Tỷ lệ trẻ em lớn","Tỷ lệ người già cao","Tỷ lệ nữ cao","Tỷ lệ lao động thấp"]},{"q":"Một trong những nhiệm vụ của dân số học là:","o":["Dự báo dân số","Điều trị bệnh","Quản lý bệnh viện","Khám chữa bệnh"]},{"q":"Phương pháp toán học trong dân số học chủ yếu được dùng để:","o":["Dự báo và biểu diễn các quá trình dân số","Phỏng vấn","Khám lâm sàng","Thu thập số liệu"]},{"q":"Điều tra thử trước tổng điều tra nhằm:","o":["Kiểm tra nội dung và quy trình điều tra","Tăng số dân","Giảm chi phí","Huấn luyện bác sĩ"]},{"q":"Điều tra 'dân số có mặt' có ưu điểm:","o":["Ít trùng và bỏ sót","Cung cấp dân số thường trú","Không cần điều tra viên","Không cần phiếu"]},{"q":"Ưu điểm của phương pháp phỏng vấn là:","o":["Điều tra viên được tập huấn nên hạn chế sai sót","Người dân tự ghi phiếu","Không cần điều tra viên","Không mất thời gian"]},{"q":"Hệ thống đăng ký hộ tịch đầy đủ đòi hỏi:","o":["Đăng ký hộ tịch mang tính pháp lý bắt buộc","Đăng ký tự nguyện","Chỉ đăng ký sinh","Chỉ đăng ký tử"]},{"q":"Điều tra biến động dân cư hằng năm phục vụ chủ yếu:","o":["Tính các chỉ tiêu thống kê dân số và KHHGĐ","Điều tra dịch bệnh","Điều tra giáo dục","Điều tra lao động"]},{"q":"Quy mô dân số là:","o":["Tổng số dân sinh sống tại một vùng lãnh thổ xác định ở một thời điểm xác định","Số hộ gia đình trong một vùng","Số người trong độ tuổi lao động","Số trẻ em dưới 15 tuổi"]},{"q":"Quy mô dân số trung bình năm được tính bằng:","o":["(P₀ + P₁)/2","P₁ − P₀","P₀ × P₁","(P₀ − P₁)/2"],"w":"Công thức trung bình đầu–cuối kỳ là cách tính gần đúng khi mức biến động phù hợp; nguồn không nêu giả thiết về diễn biến dân số trong năm."},{"q":"Gia tăng dân số là sự biến động của:","o":["Dân số đầu kỳ và cuối kỳ","Thu nhập","Mức sống","Lao động"]},{"q":"Theo tài liệu, mật độ dân số được tính bằng:","o":["Tổng dân số chia cho tổng diện tích","Tổng dân số nhân diện tích","Diện tích chia tổng dân số","Tổng số hộ chia diện tích"]},{"q":"Đơn vị của mật độ dân số là:","o":["Người/km²","Người/km","Hộ/km²","Người/ha"],"w":"Người/km² là đơn vị thông dụng, nhưng người/ha cũng là đơn vị mật độ có thể quy đổi. Câu hỏi không giới hạn đơn vị thông dụng nên có thể có cách hiểu khác; vẫn chấm A."},{"q":"Cơ cấu dân số theo giới tính chia dân số thành:","o":["Hai nhóm nam và nữ","Ba nhóm tuổi","Bốn nhóm dân cư","Năm nhóm xã hội"]},{"q":"Tỷ số giới tính được tính bằng:","o":["Số nam trên 100 nữ","Số nữ trên 100 nam","Số nam trên tổng dân số","Số nữ trên tổng dân số"]},{"q":"Theo tài liệu, dân số trẻ có tỷ lệ trẻ em 0–14 tuổi:","o":["Trên 35%","Dưới 20%","20–35%","Trên 50%"],"w":"Giữ ngưỡng phân loại dân số trẻ mà tài liệu cho; ngưỡng cần gắn với quy ước phân loại của giáo trình."},{"q":"Tháp dân số dùng để biểu diễn:","o":["Cơ cấu tuổi và giới tính của dân số","Thu nhập","Trình độ học vấn","Tôn giáo"]},{"q":"Mô hình tháp dân số mở rộng đặc trưng cho:","o":["Mức sinh cao","Dân số già","Mức sinh thấp","Dân số giảm"]},{"q":"Trong phương trình cân bằng dân số, yếu tố nào làm tăng dân số cơ học?","o":["Nhập cư","Xuất cư","Tử vong","Giảm sinh"]},{"q":"Nguyên nhân quan trọng nhất quyết định phân bố dân số là:","o":["Điều kiện kinh tế - xã hội","Khí hậu","Địa hình","Thổ nhưỡng"]},{"q":"Mật độ dân số Việt Nam năm 2019 khoảng:","o":["290 người/km²","190","259","350"]},{"q":"Vùng có mật độ dân số cao nhất năm 2019 là:","o":["Đồng bằng sông Hồng","Tây Nguyên","Đông Nam Bộ","Trung du miền núi phía Bắc"]},{"q":"Tỷ lệ dân số thành thị Việt Nam năm 2019 là:","o":["34,4%","23%","27%","30%"]},{"q":"SRB cân bằng tự nhiên khoảng:","o":["104–106","90–95","95–100","110–115"]},{"q":"Dân số già khi:","o":["Tỷ lệ ≥60 tuổi trên 10%","0-14>35%","≥65<5%","Tuổi trung vị<20"],"w":"Cần phân biệt “già hóa” với “dân số già” và chỉ tiêu 60+ với 65+. Nguồn nêu 60+ trên 10% nhưng không ghi hệ phân loại hoặc mốc tham chiếu; không tự đổi khóa."},{"q":"Tỷ số phụ thuộc chung phản ánh:","o":["Số người ngoài tuổi lao động trên 100 người trong tuổi lao động","Thu nhập","Mức sinh","Tử vong"]},{"q":"Theo LHQ, già hóa dân số bắt đầu khi ≥65 tuổi chiếm:","o":["7%","5%","10%","15%"],"w":"Ngưỡng tuổi và tỷ lệ phụ thuộc cách phân loại. Giữ 7% theo nguồn, không đổi sang một ngưỡng khác hay áp dụng cho mọi định nghĩa."},{"q":"Tháp dân số ổn định phản ánh:","o":["Quy mô dân số ổn định","Mức sinh cao","Dân số giảm","Không có người già"],"w":"Khái niệm dân số ổn định (stable) và dân số dừng (stationary) cần phân biệt; cơ cấu tuổi ổn định chưa nhất thiết đồng nghĩa tổng quy mô không đổi. Nguồn dùng cách diễn đạt giản lược."},{"q":"Quá trình biến động dân số tự nhiên trong dân số học chủ yếu thông qua hai hiện tượng nào sau đây?","o":["Sinh và Chết","Kết hôn và Ly hôn","Nhập cư và Xuất cư","Đô thị hóa và Di dân"]},{"q":"Thuật ngữ dân số học nào dùng để chỉ khả năng sinh học (năng lực sinh học) của một người phụ nữ hay một cặp vợ chồng có thể sinh con được?","o":["Khả năng sinh sản (Fertility)","Sinh sản (Reproductive)","Số lần sinh con sống (Parity)","Mức sinh thay thế (Replacement level)"],"w":"Trong thuật ngữ dân số học, khả năng sinh học thường gọi fecundity; fertility mô tả sinh sản thực tế/mức sinh. Nguồn ghi “Khả năng sinh sản (Fertility)”; giữ nguyên chữ và khóa."},{"q":"Công thức tính Tỷ suất sinh thô (CBR) là gì?","o":["CBR = (B / P) * 1.000","CBR = (P / B) * 1.000","CBR = (B / W_15-49) * 1.000","CBR = (D / P) * 1.000"]},{"q":"Theo định nghĩa của WHO, một đứa trẻ sau khi thoát ly hoàn toàn khỏi cơ thể người mẹ, chỉ cần có một trong các biểu hiện nào sau đây thì được coi là một \"trẻ sinh sống\" (live birth)?","o":["Tất cả các biểu hiện như hơi thở, tim đập, mạch đập dây rốn hoặc co bóp cơ tùy ý","Hơi thở, sự đập của tim, sự mạch đập của dây rốn","Sự co bóp rõ rệt của các cơ tùy ý","Chỉ cần có hơi thở hoặc tim đập"],"w":"Có lỗi bố cục liền kề: ba phương án số liệu 19,9‰ / 46‰ / 39‰ của câu 45 chen sau bốn lựa chọn câu này. HTML giữ bốn lựa chọn về trẻ sinh sống cho câu 44, chuyển ba lựa chọn số liệu về câu 45 và ghi lại vị trí gốc. Câu hỏi nói chỉ cần một dấu hiệu nhưng các lựa chọn B/C/D là tập con của A nên chưa loại trừ nhau hoàn toàn; giữ khóa A."},{"q":"Vào năm 1999, Tỷ suất sinh thô (CBR) của Việt Nam được ghi nhận ở mức bao nhiêu?","o":["19,9‰","46‰","39‰","17‰"],"w":"Ghép lại lỗi bố cục bằng nội dung sẵn có: A–C lấy từ các đoạn trước tiêu đề câu 45 (đoạn 268–270, chỉ số từ 0 trong bản trích xuất); D ở đoạn 273. Không thêm hoặc sửa số liệu. Khóa A giữ theo dòng đáp án trong nguồn; dữ kiện thuộc năm 1999."},{"q":"Tổng tỷ suất sinh (TFR) đo lường số con trung bình của một người phụ nữ đi qua hết thời kỳ sinh đẻ nếu chị ta tuân theo:","o":["Tỷ suất sinh đặc trưng theo tuổi (ASFR) của một năm cụ thể","Tỷ suất sinh thô (CBR) của một chu kỳ 10 năm","Xu hướng kết hôn của thế hệ trước","Quy mô gia đình lý tưởng do Nhà nước quy định"]},{"q":"Khi tỷ suất tái sinh ròng (NRR) bằng 1 (NRR = 1), điều này có nghĩa là gì?","o":["Một thế hệ mẹ trung bình sinh ra đúng một thế hệ con gái để thay thế mình (Đạt mức sinh thay thế)","Dân số đang tăng trưởng với tốc độ phi mã","Mức chết của trẻ em dưới 1 tuổi bằng 0","Không có sự biến động dân số tự nhiên"]},{"q":"Trong công thức tính Tỷ suất chết thô (CDR), đại lượng P đại diện cho:","o":["Số dân trung bình (hoặc số dân giữa năm) của quần thể nghiên cứu","Tổng số phụ nữ trong độ tuổi sinh đẻ","Số trẻ em sinh sống trong năm","Tổng số người chết vì mọi nguyên nhân trong năm"]},{"q":"Chỉ số IMR trong dân số học dùng để đo lường tỷ suất tử vong của nhóm đối tượng nào?","o":["Trẻ em dưới 1 tuổi (từ 0 đến dưới 365 ngày tuổi)","Trẻ em dưới 5 tuổi","Trẻ sơ sinh dưới 28 ngày tuổi","Thai nhi bị sẩy tự nhiên hoặc nạo phá"]},{"q":"Khi nghiên cứu cơ cấu nguyên nhân tử vong, chỉ số nào cho biết tỷ lệ phần trăm số người chết do một nguyên nhân cụ thể trong tổng số các ca tử vong nói chung?","o":["Tỷ lệ chết theo một nguyên nhân đặc trưng (PDSC_i)","Tỷ suất chết đặc trưng theo nguyên nhân (CSDR_i)","Tỷ suất chết thô (CDR)","Tỷ suất chết đặc trưng theo tuổi (ASDR_x)"]},{"q":"Tại sao Tỷ suất sinh thô (CBR) lại được gọi là chỉ số \"thô\"?","o":["Vì mẫu số của nó là tổng số dân (P), bao gồm cả những người không có khả năng sinh đẻ như nam giới, trẻ em và người già","Vì nó tính toán dựa trên số liệu chưa được làm sạch","Vì nó không nhân với hệ số k = 1.000","Vì nó chỉ áp dụng được ở các quốc gia có nền kinh tế thô sơ, chưa phát triển"]},{"q":"Nhược điểm lớn nhất của Tỷ suất chết thô (CDR) khi dùng để so sánh mức độ tử vong giữa hai quốc gia khác nhau là gì?","o":["Bị ảnh hưởng rất nặng nề bởi cơ cấu tuổi của dân số","Không tính đến yếu tố di dân tự do","Rất khó thu thập số liệu tử vong ở các nước đang phát triển","Công thức tính quá phức tạp và dễ sai sót"]},{"q":"Một cuộc điều tra ghi nhận trong năm, một huyện có số dân giữa năm là 50.000 người, tổng số trẻ sinh sống là 1.000 trẻ, và tổng số ca tử vong là 300 ca. Tỷ suất tăng tự nhiên (NIR) của huyện này là bao nhiêu?","o":["1,4%","2,0%","14%","0,7%"]},{"q":"Theo lý thuyết phân loại của Davis và Blake về các biến số trung gian ảnh hưởng đến mức sinh, hành vi \"Sử dụng các biện pháp tránh thai\" và \"Triệt sản\" thuộc nhóm nào","o":["Các yếu tố ảnh hưởng đến việc thụ thai (Conception variables)","Các yếu tố ảnh hưởng đến việc giao hợp (Intercourse variables)","Các yếu tố ảnh hưởng đến thai nghén và sinh đẻ (Gestation variables)","Các yếu tố môi trường tự nhiên"]},{"q":"Nhận định nào sau đây là đúng về mối quan hệ giữa trình độ học vấn của người mẹ và mức sinh đẻ tại Việt Nam theo các nghiên cứu dân số?","o":["Trình độ học vấn của mẹ và mức sinh thường có quan hệ nghịch (học vấn càng cao, mức sinh có xu hướng giảm)","Trình độ học vấn càng cao thì mức sinh càng cao (tỷ lệ thuận)","Học vấn hoàn toàn không có ảnh hưởng gì tới hành vi sinh đẻ","Mối quan hệ này chỉ đúng với nhóm phụ nữ trên 45 tuổi"]},{"q":"Tuổi kết hôn lần đầu của phụ nữ thấp (tảo hôn, kết hôn sớm) thường dẫn đến mức sinh cao chủ yếu là do cơ chế nào?","o":["Làm kéo dài thời gian chung sống trong thời kỳ sinh sản của người phụ nữ","Làm giảm tỷ lệ sẩy thai tự nhiên","Làm tăng tỷ suất tử vong của trẻ sơ sinh","Khiến người phụ nữ có sức khỏe sinh học tốt hơn"]},{"q":"Đường biểu diễn Tỷ suất chết đặc trưng theo tuổi (ASDR) của hầu hết các quần thể dân số trên thế giới thường có dạng hình chữ gì?","o":["Hình chữ U hoặc chữ J","Hình đường thẳng dốc xuống","Hình chữ S ngược","Hình chữ V úp ngược (hình parabol)"]},{"q":"Ý nghĩa thực tế của việc nghiên cứu chỉ số Tỷ suất chết đặc trưng theo nguyên nhân (CSDR_i) đối với ngành Y tế là gì?","o":["Để xác định các mặt bệnh ưu tiên, phân bổ ngân sách và xây dựng chiến lược phòng chống bệnh tật phù hợp","Để tính toán tuổi thọ trung bình chính xác của một thế hệ","Để quản lý việc cấp giấy chứng tử tại các trạm y tế xã","Để thay thế hoàn toàn cho chỉ số Tỷ suất chết thô (CDR)"]},{"q":"Theo tài liệu, tại các nước đang phát triển, nhóm nguyên nhân tử vong nào thường chiếm tỷ trọng cao trong cơ cấu tử vong ở các thập kỷ trước, nhưng đang giảm dần nhờ thành tựu y học?","o":["Các bệnh nhiễm trùng, ký sinh trùng và dịch bệnh lây nhiễm","Bệnh tim mạch và ung thư","Tai nạn giao thông và chấn thương lao động","Các bệnh thoái hóa do tuổi già"]},{"q":"Khi so sánh mức sinh giữa các vùng địa lý ở Việt Nam, vùng nào sau đây thường được ghi nhận là có mức sinh (TFR) thấp nhất cả nước, thường xuyên dưới mức sinh thay thế?","o":["Vùng Đông Nam Bộ và Đồng bằng sông Cửu Long","Vùng Tây Bắc","Vùng Tây Nguyên","Vùng Bắc Trung Bộ"],"w":"Câu hỏi không chỉ rõ năm tham chiếu và gộp hai vùng trong một lựa chọn dù hỏi thấp nhất. Giữ nội dung tài liệu, không coi đây là bảng xếp hạng cập nhật."},{"q":"Biến động dân số bao gồm hai cấu thành cơ bản nào?","o":["Biến động tự nhiên và biến động cơ học.","Biến động tự nhiên và tăng trưởng sinh học.","Biến động cơ học và tăng giảm mật độ.","Tăng trưởng tự nhiên và di dân quốc tế."]},{"q":"Theo nghĩa hẹp, tổ chức nào định nghĩa di dân là sự di chuyển dân cư từ một đơn vị lãnh thổ này đến một đơn vị lãnh thổ khác nhằm thiết lập nơi cư trú mới?","o":["Liên hiệp quốc","Tổ chức Di cư Quốc tế (IOM)","Tổ chức Y tế Thế giới (WHO)","Hội nghị quốc tế về Dân số và Phát triển"]},{"q":"Hiện tượng di chuyển dân cư từ một nước này sang một nước khác để sinh sống tạm thời hoặc vĩnh viễn được gọi là gì?","o":["Xuất cư","Nhập cư","Di dân nội địa","Di chuyển con lắc"],"w":"Di chuyển giữa hai nước có thể gọi là xuất cư từ góc nhìn nước đi, nhập cư từ nước đến, hoặc di cư quốc tế. Câu chưa chỉ rõ góc nhìn; giữ khóa A."},{"q":"Hình thức phân loại di dân quan trọng nhất dựa trên tiêu chí nào?","o":["Khoảng cách","Đặc trưng di dân","Độ dài thời gian cư trú","Địa bàn nơi đến"],"w":"Cụm “quan trọng nhất” phụ thuộc cách phân loại của giáo trình; file không giải thích tiêu chí xếp hạng."},{"q":"Hiện tượng \"Chảy máu chất xám\" thuộc loại hình di dân nào?","o":["Di dân quốc tế","Di dân nội địa","Di dân tự phát","Di dân mùa vụ"]},{"q":"Dòng di chuyển của cư dân nông thôn vào thành phố trong thời kỳ nông nhàn được gọi là hình thái di dân nào?","o":["Di dân mùa vụ (di chuyển con lắc)","Di chuyển lâu dài","Di dân có tổ chức","Chảy máu chất xám"],"w":"Di dân mùa vụ và di chuyển con lắc là các khái niệm cần phân biệt theo thời gian, tính lặp lại và nơi cư trú. Nguồn đặt chúng cùng ngoặc; giữ nguyên."},{"q":"Theo kết quả điều tra năm 2015, vùng nào có tỷ lệ di cư cao nhất nước ta?","o":["Đông Nam Bộ","Đồng bằng sông Hồng","Đồng bằng sông Cửu Long","Tây Nguyên"]},{"q":"Khái niệm \"Siêu đô thị\" (Mega City) dùng để chỉ các thành phố có quy mô dân số tối thiểu là bao nhiêu?","o":["Trên 10 triệu người","Trên 5 triệu người","Trên 15 triệu người","Trên 20 triệu người"],"w":"Cần phân biệt ngưỡng “từ 10 triệu” với “trên 10 triệu” khi hỏi tối thiểu. Giữ cách viết của nguồn, không sửa dấu so sánh."},{"q":"Theo tiêu chí phân loại đô thị hiện nay ở Việt Nam, quy mô dân số thấp nhất của một đô thị là bao nhiêu?","o":["4.000 người (vùng núi có thể thấp hơn)","2.000 người","2.500 người","50.000 người"],"w":"Câu dùng “hiện nay” nhưng không nêu văn bản phân loại đô thị, năm hiệu lực hay cấp đô thị. Không diễn giải 4.000 người là quy định hiện hành cho mọi loại đô thị."},{"q":"Tỷ lệ đô thị hóa của Việt Nam năm 2019 đạt bao nhiêu phần trăm?","o":["34,4%","23,5%","29,0%","29,6%"]},{"q":"Điểm khác biệt căn bản giữa di biến động dân cư do di dân và tăng trưởng dân số tự nhiên là gì?","o":["Di dân có thể lặp đi lặp lại nhiều lần trong đời một cá nhân, còn sinh và chết chỉ diễn ra một lần.","Di dân chỉ làm tăng mật độ dân cư chứ không làm thay đổi số lượng.","Tăng trưởng tự nhiên làm thay đổi cơ cấu giới tính rõ rệt hơn di dân.","Di dân chỉ diễn ra ở các nước đang phát triển, tăng trưởng tự nhiên diễn ra ở mọi quốc gia."]},{"q":"Theo nhà nghiên cứu Henry S. Shryock, hoạt động nào sau đây ĐƯỢC coi là di dân?","o":["Thay đổi nơi ở thường xuyên giữa các đơn vị hành chính và làm thay đổi các quan hệ xã hội.","Đi du lịch dài ngày xuyên quốc gia.","Qua lại biên giới để buôn bán làm ăn thường xuyên.","Đi thăm người thân ở tỉnh khác trong vòng 3 tháng."]},{"q":"Một địa phương có số người nhập cư ít hơn số người xuất cư thì Tỷ suất di dân thuần túy (NMR) của địa phương đó sẽ có giá trị như thế nào?","o":["Có giá trị âm (-)","Luôn bằng 0","Có giá trị dương (+)","Không thể xác định được"]},{"q":"Trong trường hợp số người xuất cư xấp xỉ bằng số người nhập cư khiến tỷ suất di cư thuần túy (NMR) quá nhỏ, người ta thường dùng chỉ tiêu nào để đánh giá toàn diện tình hình di cư?","o":["Tỷ suất tổng di dân (TR)","Tỷ suất xuất cư (OR)","Tỷ suất nhập cư (IR)","Tỷ lệ đô thị hóa (UR)"]},{"q":"Theo lý thuyết của Ravenstein, yếu tố nào sau đây được phân loại là một \"Lực đẩy\" tại vùng nơi dân chuyển đi?","o":["Đất canh tác ít, bạc màu, không có vốn và kỹ thuật chuyển đổi ngành nghề.","Cơ hội dễ kiếm việc làm và thu nhập cao.","Khí hậu ôn hòa, môi trường sống thuận lợi.","Môi trường văn hóa - xã hội tốt hơn nơi ở cũ."]},{"q":"Đặc điểm nổi bật nào minh chứng cho tính năng động và vai trò độc lập của cá nhân/gia đình trong hình thái di dân tự phát tại Việt Nam?","o":["Tự quyết định di chuyển và giải quyết đời sống mà không phụ thuộc vào kế hoạch hay sự hỗ trợ của Nhà nước.","Luôn nhận được sự giúp đỡ từ chính quyền địa phương nơi nhập cư.","Hạn chế tối đa việc khai thác tài nguyên thiên nhiên bừa bãi.","Chỉ di chuyển trong phạm vi nội tỉnh hoặc khoảng cách rất ngắn."]},{"q":"Theo tiêu chí phân loại đô thị tại Việt Nam hiện nay, tỷ lệ lao động phi nông nghiệp trong tổng số lao động phải đạt tối thiểu là bao nhiêu?","o":["Từ 60% trở lên","Trên 50%","Từ 70% trở lên","Từ 85% trở lên"],"w":"Câu dùng “hiện nay” nhưng thiếu năm, văn bản và loại đô thị. Tỷ lệ lao động phi nông nghiệp cần điều kiện phân loại; khóa 60% được giữ theo tài liệu."},{"q":"Sự thay đổi của dân số thành thị xuất phát từ 3 nhân tố: Tăng trưởng tự nhiên nội tại, tăng trưởng do di dân (cơ học) và nhân tố nào sau đây?","o":["Sự tái phân bố dân cư theo địa bàn thông qua các biện pháp hành chính.","Sự thay đổi kết cấu tuổi do chảy máu chất xám.","Sự chênh lệch tiền công giữa khu vực chính thức và phi chính thức.","Sự suy giảm tỷ lệ sinh ở khu vực nông thôn xung quanh."]},{"q":"Xu hướng di chuyển dân cư đặc trưng ở các nước phát triển được tài liệu nhắc đến là gì?","o":["Di chuyển đến các đô thị nhỏ vệ tinh xung quanh những đô thị lớn.","Tập trung ồ ạt vào các lõi đô thị trung tâm cực lớn.","Di chuyển từ đô thị về hẳn các vùng nông thôn hẻo lánh.","Di dân quốc tế bất hợp pháp sang các nước đang phát triển."]},{"q":"Dựa vào Bảng 4.1, khi xem xét \"nơi chuyển đến\" là TP. HCM, dòng di cư lớn nhất xuất phát từ vùng nào?","o":["Đồng bằng sông Cửu Long (ĐBSCL)","Đồng bằng sông Hồng (ĐBSH)","Đông Nam Bộ (DNB)","Bắc Trung Bộ và Duyên hải miền Trung (BTB & DHMT)"],"w":"Câu dẫn “Bảng 4.1” nhưng file được cung cấp không chứa bảng số liệu đó. Giữ câu và khóa A; không dựng thêm bảng hoặc số liệu để lấp phần thiếu."},{"q":"Theo định nghĩa của Tổ chức Y tế Thế giới được trích dẫn trong tài liệu, sức khỏe được hiểu là gì?","o":["Trạng thái thoải mái về thể chất, tinh thần và xã hội, chứ không chỉ là tình trạng không có bệnh tật hay thương tật.","Tình trạng hoàn toàn không có bệnh tật hay thương tật.","Trạng thái khỏe mạnh về cơ bắp và có lối sống lành mạnh, không mắc bệnh truyền nhiễm.","Tình trạng cơ thể phát triển cân đối và không có khiếm khuyết về mặt hình thể."]},{"q":"Vào năm 1990, tỷ lệ dân số trong độ tuổi lao động ở các nước phát triển là bao nhiêu?","o":["66,5%","60,0%","70,0%","71,0%"],"w":"Số liệu năm 1990 không kèm bảng hoặc nguồn thống kê gốc. Giữ 66,5% theo tài liệu, không chuyển thành số liệu hiện tại."},{"q":"Đối tượng nào sau đây ĐƯỢC tính vào khối \"Dân số hoạt động kinh tế\"?","o":["Những người đang làm việc trong lĩnh vực dân sự và những người làm việc trong lực lượng vũ trang.","Người làm công việc nội trợ hoặc trông nom nhà cửa, con cái trong hộ gia đình của chính họ.","Học sinh, sinh viên đang học tập thường xuyên tại các trường công hoặc trường tư.","Người hưởng lợi tức, nhận được thu nhập do đầu tư hoặc tài sản cho thuê mà không phải làm việc."],"w":"Dân số hoạt động kinh tế còn cần cách định nghĩa lực lượng lao động và thời kỳ tham chiếu; khóa đang nêu nhóm có việc làm, không phải liệt kê đầy đủ mọi nhóm."},{"q":"Tính đến thời điểm Tổng điều tra Dân số và Nhà ở ngày 01 tháng 04 năm 2019, dân số Việt Nam đạt hơn 96 triệu người và là quốc gia đông dân thứ mấy trong khu vực Đông Nam Á?","o":["Thứ ba","Thứ nhất","Thứ hai","Thứ tư"]},{"q":"Giáo dục chính quy được tài liệu định nghĩa là gì?","o":["Những lớp học theo một chương trình đã được nhà nước chuẩn hóa, được tiến hành trong các trường học.","Các lớp học có chương trình tùy thuộc vào mục đích và yêu cầu của người học, tổ chức ngoài nhà trường.","Các khóa huấn luyện kỹ năng ngắn hạn do các tổ chức tư nhân phối hợp thực hiện.","Tất cả các dạng học tập tự phát của con người nhằm truyền đạt kinh nghiệm xã hội."]},{"q":"Điền vào chỗ trống: \"Tỷ lệ gia tăng GNP bình quan đầu người = Tỷ lệ gia tăng GNP – ........................\"?","o":["Tỷ lệ gia tăng dân số","Tỷ lệ tham gia lực lượng lao động thô","Tỷ lệ tăng năng suất lao động","Tỷ suất tử vong thô"],"w":"Đẳng thức tốc độ tăng GNP bình quân bằng tăng GNP trừ tăng dân số là dạng gần đúng theo tốc độ phần trăm thông thường. Nguồn không nêu giả thiết xấp xỉ."},{"q":"Biểu thức toán học nào sau đây thể hiện Tổng chi phí tiêu dùng của xã hội (C)?","o":["C = Σ P_x c_x = Σ P (P_x/p) c_x = P Σ p_x c_x","C = Σ P_x a_x","C = P Σ p_x a_x","C = Y - P Σ p_x(a_x - c_x)"],"w":"Công thức nguồn dùng lẫn P và p trong P_x/p, sau đó dùng p_x, nhưng không có phần định nghĩa các ký hiệu kèm theo. Giữ nguyên công thức và không tự chuẩn hóa mẫu số."},{"q":"Theo số liệu Tổng điều tra dân số năm 2019, tỷ lệ dân số từ 65 tuổi trở lên ở nước ta chiếm bao nhiêu phần trăm?","o":["7,7%","24,3%","60,0%","69,0%"]},{"q":"Khối lượng sử dụng tài nguyên không tái tạo được (Q) phụ thuộc vào những yếu tố nào theo công thức trong tài liệu?","o":["Số dân (P), mức sử dụng tài nguyên bình quan mỗi người/năm (a), khoảng thời gian khai thác (T).","Tổng thu nhập xã hội (Y), diện tích đất nông nghiệp (ha), tỷ lệ gia tăng dân số (g).","Số người trong độ tuổi lao động, năng suất lao động thô, mức tiêu dùng bình quan.","Mật độ dân số, diện tích đất có rừng, hàm lượng hóa chất sử dụng trong sản xuất."]},{"q":"Tài liệu chia nguồn tài nguyên tự nhiên thành ba loại nào?","o":["Tài nguyên không tái tạo được, tài nguyên tái tạo được và tài nguyên vô hạn.","Tài nguyên đất, tài nguyên nước và tài nguyên không khí.","Tài nguyên khoáng sản, tài nguyên sinh vật và tài nguyên vô hạn.","Tài nguyên hữu hạn, tài nguyên phục hồi được và tài nguyên năng lượng."]},{"q":"Nhược điểm lớn nhất của \"Tỷ lệ tham gia lực lượng lao động thô\" (CLFPR) khiến nó bị ảnh hưởng lớn giống như tỷ suất sinh thô là gì?","o":["Bị ảnh hưởng bởi cơ cấu dân số và sử dụng toàn bộ dân số ở mẫu số (gồm cả người quá già, quá trẻ).","Không tính đến những người làm việc trong lực lượng vũ trang.","Sử dụng khoảng thời gian điều tra quá dài (trên một tháng).","Không thể phân tách riêng biệt giữa thành thị và nông thôn."]},{"q":"Nhóm dân cư nào sau đây có tỷ lệ tham gia lực lượng lao động và năng suất lao động cao hơn hẳn, nếu chiếm tỷ trọng cao sẽ giúp nền kinh tế đạt kết quả tốt hơn?","o":["Nhóm dân cư nam từ 25 đến 29 tuổi.","Nhóm dân cư nam từ 15 đến 19 tuổi.","Nhóm dân cư nữ từ 20 đến 24 tuổi.","Nhóm dân cư nữ từ 50 đến 54 tuổi."],"w":"So sánh năng suất và tỷ lệ tham gia lao động cần quần thể, năm và dữ liệu cụ thể. File không có bảng để xác nhận nhận định nam 25–29 cao hơn hẳn các nhóm còn lại."},{"q":"Tại sao ở các nước có nền kinh tế phát triển, nhu cầu muốn có nhiều con, đặc biệt là con trai của các cặp cha mẹ lại giảm thấp?","o":["Do chế độ bảo hiểm xã hội và phúc lợi tốt nên cha mẹ không phải lo thiếu chỗ dựa khi về già.","Do chi phí dịch vụ y tế và giáo dục chính quy quá đắt đỏ.","Do tỷ lệ ô nhiễm môi trường cao làm suy giảm khả năng sinh sản của nam giới.","Do quy định luật pháp bắt buộc áp dụng các biện pháp đình sản vĩnh viễn."]},{"q":"Sự khác biệt về cấu trúc của hệ thống giáo dục giữa quốc gia có \"dân số trẻ\" và quốc gia có \"dân số già\" (với giả thiết hầu hết trẻ em đến tuổi đều đi học) là gì?","o":["Dân số trẻ có số học sinh cấp I lớn hơn cấp II; dân số già thì ngược lại.","Dân số trẻ có số học sinh cấp II lớn hơn cấp I; dân số già thì ngược lại.","Dân số trẻ chỉ tập trung giáo dục không chính quy; dân số già chỉ phát triển giáo dục chính quy.","Không có sự khác biệt nào về quy mô học sinh giữa các cấp học."],"w":"So sánh số học sinh giữa các cấp cần cả độ dài cấp học và diễn biến số sinh. Nguồn nêu mô hình giản lược; không suy ra quy luật tuyệt đối cho mọi hệ thống giáo dục."},{"q":"Trình độ học vấn của phụ nữ phải đạt đến \"ngưỡng\" tối thiểu nào thì mới bắt đầu có ảnh hưởng rõ rệt làm giảm mức sinh ở khu vực châu Á?","o":["Học hết cấp Tiểu học và tiến lên trình độ Trung học cơ sở (THCS).","Học một vài năm đầu của cấp Tiểu học.","Học hết cấp Trung học phổ thông (THPT).","Tốt nghiệp các trường Cao đẳng hoặc Đại học."],"w":"Ngưỡng học vấn và mức sinh phụ thuộc nghiên cứu, thời kỳ và quần thể. File không dẫn nghiên cứu để kiểm tra ngưỡng chung cho châu Á."},{"q":"Nghiên cứu năm 1970 tại 8 nước châu Mỹ Latinh cho thấy các bà mẹ học hết Tiểu học có con bị chết ở độ tuổi sơ sinh ít hơn bao nhiêu phần trăm so với các bà mẹ mù chữ?","o":["25%","15%","40%","50%"],"w":"Nguồn dẫn một nghiên cứu năm 1970 ở tám nước nhưng không ghi tác giả, tên nghiên cứu hoặc bảng gốc; giữ số 25% mà không tự bổ sung trích dẫn."},{"q":"Nguyên nhân chủ yếu của hơn một nửa số trường hợp trẻ em dưới 5 tuổi bị chết ở các nước có thu nhập thấp được tài liệu chỉ ra là gì?","o":["Tình trạng thiếu dinh dưỡng (ở các cấp độ) và suy dinh dưỡng nặng.","Các bệnh tai nạn giao thông và tệ nạn xã hội tràn lan.","Tình trạng thiếu thốn cán bộ y tế chuyên khoa tại các thành phố lớn.","Sự suy giảm tầng ozon và hiện tượng Trái đất nóng lên."],"w":"Tỷ lệ và vai trò suy dinh dưỡng phụ thuộc năm, định nghĩa và cách phân bổ nguyên nhân tử vong. File không ghi mốc cho nhận định hơn một nửa; không xem là ước tính hiện hành."},{"q":"Tại sao mật độ dân số quá thấp tại một số khu vực lại gây trở ngại cho công tác dự phòng và phục vụ của hệ thống y tế?","o":["Một cán bộ hay một cơ sở y tế chỉ phục vụ được một số ít dân cư nên hiệu quả không cao, kèm theo trình độ văn hóa thấp khó vận động ăn ở hợp vệ sinh.","Ô nhiễm môi trường quá cao đòi hỏi chi phí lớn để xử lý nguồn nước bẩn.","Nhu cầu dịch vụ kế hoạch hóa gia đình tăng quá nhanh làm quá tải hệ thống.","Tập trung nhiều bệnh xã hội lây lan nguy hiểm như giang mai, HIV/AIDS."],"w":"Đáp án gộp dân cư thưa với trình độ văn hóa thấp; quan hệ thứ hai không thể suy ra chỉ từ mật độ dân số. Giữ nguyên câu nguồn, không mở rộng kết luận."},{"q":"Ở Việt Nam, giai đoạn 1943–1980 đã xảy ra hiện tượng đáng
