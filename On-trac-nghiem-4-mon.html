<!doctype html>
<html lang="vi" data-fs="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Ôn trắc nghiệm – 4 môn</title>
<style>
:root{--paper:#f6f0e3;--card:#fffdf7;--ink:#1d2330;--muted:#576071;--line:#cdc4ae;--primary:#1f3a5f;--primary-bg:#e6ecf5;--good:#226a42;--good-bg:#e1f0e5;--bad:#a2302a;--bad-bg:#f8e2df;--warn:#7a5200;--warn-bg:#fbf0d3}
*{box-sizing:border-box}
html{font-size:18px}
html[data-fs="2"]{font-size:21px}
html[data-fs="3"]{font-size:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.25}
h1{font-size:1.7rem;margin:0 0 .4rem}
h2{font-size:1.25rem;margin:2rem 0 .8rem}
p{margin:0 0 .8rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #c77d00;outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding:0 1rem}
.top{background:var(--card);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding-top:.7rem;padding-bottom:.7rem;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-weight:700;font-size:1.15rem;background:none;border:0;cursor:pointer;padding:.2rem 0}
.tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fs{display:flex;align-items:center;gap:.3rem}
.fs span{font-size:.8rem;color:var(--muted);margin-right:.2rem}
.fsb{min-width:2.4rem;height:2.4rem;border:2px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-weight:700;padding:0}
.fsb[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
main{padding-top:1.6rem;padding-bottom:3rem}
.lead{color:var(--muted);margin-bottom:1.2rem}
.btn{min-height:3rem;padding:.55rem 1.1rem;border:2px solid var(--ink);background:var(--card);border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{background:#efe8d6}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#162b49}
.btn.sm{min-height:2.5rem;padding:.3rem .8rem;font-size:.9rem}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;cursor:default}
.acts{display:flex;gap:.6rem;flex-wrap:wrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;text-align:left;padding:.95rem 1.1rem;background:var(--card);border:2px solid var(--line);border-radius:8px;margin-bottom:.7rem;cursor:pointer}
.row:hover:not(:disabled){border-color:var(--ink)}
.row:disabled{opacity:.5;cursor:default}
.row .rt{display:block;font-weight:700;font-size:1.1rem}
.row .rs{display:block;color:var(--muted);font-size:.88rem;margin-top:.1rem}
.row .go{font-size:1.6rem;color:var(--muted);flex:none}
.row .best{flex:none;text-align:right;font-size:.88rem;color:var(--muted)}
.row .best b{display:block;color:var(--ink);font-size:1.05rem}
.subj{border-left:12px solid var(--c)}
.back{background:none;border:0;padding:.3rem 0;margin-bottom:.8rem;font-weight:600;color:var(--primary);cursor:pointer;font-size:1rem}
.notice{background:var(--warn-bg);border:2px solid #d9b866;border-radius:8px;padding:1rem;margin-bottom:1.4rem}
.notice .acts{margin-top:.7rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.segb{padding:.9rem 1rem;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:8px;cursor:pointer}
.segb b{display:block;font-size:1.05rem}
.segb span{font-size:.88rem;color:var(--muted)}
.segb[aria-checked="true"]{border-color:var(--primary);background:var(--primary-bg);box-shadow:inset 0 0 0 1px var(--primary)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.chip{min-height:2.6rem;padding:.3rem .9rem;border:2px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:#fff}
.small{font-size:.88rem;color:var(--muted)}
/* quiz */
.qtop{position:sticky;top:0;z-index:5;background:var(--paper);padding:.6rem 0 .5rem;border-bottom:2px solid var(--line)}
.qtop .wrap{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.qcount{font-weight:700;font-size:1.05rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5rem;text-align:right}
.timer.low{color:var(--bad)}
.bar{height:8px;background:#e1d9c4}
.bar i{display:block;height:100%;background:var(--primary)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:1.1rem 1.1rem .4rem;margin:1.1rem 0 1rem}
.qmeta{display:flex;justify-content:space-between;gap:.5rem;font-size:.85rem;color:var(--muted);margin-bottom:.5rem;flex-wrap:wrap}
.qtext{font-size:1.18rem;font-weight:600;margin-bottom:1rem;white-space:pre-line}
.opt{display:flex;gap:.85rem;align-items:flex-start;width:100%;text-align:left;padding:.85rem .95rem;margin-bottom:.7rem;background:var(--card);border:2px solid var(--line);border-radius:8px;cursor:pointer;min-height:3.4rem}
.opt:hover{border-color:var(--ink)}
.let{flex:none;width:2.1rem;height:2.1rem;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:700;background:var(--card);color:var(--ink)}
.otx{flex:1;padding-top:.15rem}
.tag{display:block;font-weight:700;font-size:.9rem;margin-top:.2rem}
.opt.sel{border-color:var(--primary);background:var(--primary-bg)}
.opt.sel .let{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg);cursor:default}
.opt.ok .let{background:var(--good);border-color:var(--good);color:#fff}
.opt.ok .tag{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.opt.no .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.no .tag{color:var(--bad)}
.opt.lock{cursor:default}
.opt.lock:hover{border-color:var(--line)}
.opt.ok.lock:hover{border-color:var(--good)}.opt.no.lock:hover{border-color:var(--bad)}
.fb{border:2px solid;border-radius:8px;padding:.9rem 1rem;margin-bottom:1rem}
.fb.good{border-color:var(--good);background:var(--good-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb p{margin:.5rem 0 0}
.warn{background:var(--warn-bg);border:1px solid #d9b866;border-radius:6px;padding:.55rem .75rem;font-size:.92rem;color:var(--warn);margin-top:.6rem}
.flagbtn{background:none;border:0;padding:.3rem 0;cursor:pointer;font-weight:600;color:var(--warn);margin-bottom:1rem;font-size:.95rem}
.nav{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--line);padding:.65rem 0;z-index:5}
.nav .wrap{display:flex;gap:.6rem}
.nav .btn{flex:1;padding-left:.4rem;padding-right:.4rem}
.nav .btn.main{flex:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.45rem;margin:.8rem 0}
.cell{position:relative;height:2.9rem;border:2px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-weight:600;padding:0}
.cell.done{background:var(--primary);border-color:var(--primary);color:#fff}
.cell.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.cell.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.flag::after{content:"!";position:absolute;top:-8px;right:-6px;background:#c77d00;color:#fff;font-size:.75rem;border-radius:50%;width:1.2rem;height:1.2rem;line-height:1.2rem}
.cell.cur{outline:3px solid var(--ink);outline-offset:2px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
/* result */
.score{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:1.3rem;text-align:center;margin:1rem 0}
.score .big{font-family:Georgia,serif;font-size:3.6rem;font-weight:700;line-height:1.1}
.score .big small{font-size:1.3rem;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.2rem}
.stat{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:.7rem;text-align:center}
.stat b{display:block;font-size:1.6rem;font-family:Georgia,serif}
.stat.g b{color:var(--good)}.stat.r b{color:var(--bad)}
.rv{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:.9rem}
.rvh{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem;font-size:.9rem;flex-wrap:wrap}
.rvh .num{font-weight:700}
.st{font-weight:700}.st.ok{color:var(--good)}.st.no{color:var(--bad)}.st.bl{color:var(--warn)}
.rq{font-weight:600;margin-bottom:.7rem;white-space:pre-line}
.ro{display:flex;gap:.6rem;padding:.45rem .6rem;border-radius:6px;margin-bottom:.3rem;border:1px solid transparent;font-size:.97rem}
.ro .l{font-weight:700;flex:none;width:1.4rem}
.ro.ok{background:var(--good-bg);border-color:var(--good)}
.ro.no{background:var(--bad-bg);border-color:var(--bad)}
.ro b.m{display:block;font-size:.85rem}
.ro.ok b.m{color:var(--good)}.ro.no b.m{color:var(--bad)}
.field{width:100%;min-height:3.2rem;padding:.6rem .9rem;font:inherit;border:2px solid var(--ink);border-radius:8px;background:#fff}
.chip.s{border-left:8px solid var(--c)}
.sbadge{display:inline-block;border-left:6px solid var(--c);padding-left:.4rem;font-weight:600}
.foot{color:var(--muted);font-size:.82rem;border-top:2px solid var(--line);padding-top:1rem;margin-top:2.5rem}
.mask{position:fixed;inset:0;background:rgba(29,35,48,.55);display:grid;place-items:center;padding:1rem;z-index:20}
.modal{background:var(--card);border-radius:10px;padding:1.3rem;max-width:26rem;width:100%;border:2px solid var(--ink)}
.modal h2{margin-top:0}
.modal .acts{justify-content:flex-end;margin-top:1rem}
@media (max-width:520px){.seg{grid-template-columns:1fr}.stats{gap:.4rem}.score .big{font-size:3rem}.fs span{display:none}}
</style>
</head>
<body>
