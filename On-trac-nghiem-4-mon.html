e polymerase hoạt động.","Vì đoạn mồi là tín hiệu để tháo xoắn mạch kép DN","Vì đoạn mồi đóng vai trò nhận diện điểm khởi đầu (Ori)."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Ở tế bào nhân thực, quá trình sao chép DNA chủ yếu diễn ra ở bào quan nào?","o":["Nhân tế bào.","Tế bào chất.","Ribosome.","Mạng lưới nội chất hạt."]},{"q":"Sự mở xoắn của helicase gây ra hiện tượng căng xoắn quá mức ở phía trước chạc chữ Y. Enzyme nào giúp giải tỏa trạng thái này?","o":["Topoisomerase.","SSB protein.","Ligase.","DNA polymerase II."]},{"q":"Theo nguyên tắc bổ sung, nếu mạch khuôn có trình tự 3'-T-A-G-C-5' thì mạch mới tổng hợp tương ứng sẽ là:","o":["5'-A-T-C-G-3'.","5'-U-A-C-G-3'.","3'-A-T-C-G-5'.","5'-T-A-G-C-3'."]},{"q":"Liên kết hóa học nào đóng vai trò kết nối giữa các nucleotide liên tiếp nhau trên một mạch đơn của phân tử DNA?","o":["Liên kết phosphodiester.","Liên kết hydro.","Liên kết peptide.","Liên kết glycosidi"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Ở sinh vật nhân sơ, loại enzyme nào chịu trách nhiệm chính trong việc cắt bỏ đoạn mồi RNA và thay thế bằng các deoxynucleotide?","o":["DNA polymerase I.","DNA polymerase II.","DNA polymerase III.","DNA ligase."]},{"q":"Hoạt tính exonuclease 3' -> 5' của DNA polymerase đóng vai trò gì trong quá trình tổng hợp DNA?","o":["Sửa sai (proofreading), cắt bỏ nucleotide bị ghép nhầm trước khi tổng hợp tiếp.","Cắt bỏ đoạn mồi RNA ở đầu 5' của đoạn Okazaki.","Xúc tác tháo xoắn chuỗi DNA kép.","Nối các đoạn DNA ngắn lại với nhau."]},{"q":"Đặc điểm nào dưới đây mô tả đúng nhất về cơ chế hoạt động của enzyme Telomerase?","o":["Sử dụng khuôn RNA nội sinh của chính nó để tổng hợp mạch DNA, mang bản chất của một reverse transcriptase.","Sử dụng mạch DNA làm khuôn để tổng hợp mồi RNA, hoạt động như một primase.","Chỉ có hoạt tính exonuclease, cắt bỏ các đoạn telomere bị tổn thương.","Hoạt động không cần khuôn mẫu, gắn ngẫu nhiên các nucleotide vào đầu mút NST."]},{"q":"Sự khác biệt cơ bản về điểm khởi đầu sao chép (Ori) giữa sinh vật nhân thực và sinh vật nhân sơ là:","o":["Nhiễm sắc thể nhân thực có rất nhiều điểm Ori, trong khi nhiễm sắc thể nhân sơ chỉ có một điểm Ori duy nhất.","Điểm Ori ở nhân sơ giàu trình tự G-C, trong khi ở nhân thực giàu trình tự A-T.","Quá trình bắt đầu tại Ori ở nhân thực không cần tiêu tốn năng lượng ATP.","DNA nhân thực bắt đầu sao chép tại bất kỳ vị trí nào, không có điểm Ori cố định."],"w":"Mô tả chỉ một ori ở mọi nhân sơ có ngoại lệ (đặc biệt Archaea). Phù hợp hơn nếu giới hạn mô hình vi khuẩn E. coli; câu nguồn không giới hạn ở phần hỏi."},{"q":"Tại sao đầu mút nhiễm sắc thể tuyến tính ở sinh vật nhân thực lại bị ngắn lại sau mỗi lần phân bào (khi không có telomerase)?","o":["Do không thể thay thế đoạn mồi RNA nằm ở tận cùng đầu 5' của mạch mới tổng hợp do thiếu đầu 3'-OH.","Do cấu trúc nucleosome cản trở enzyme DNA polymerase trượt tới cuối mạch.","Do tác động phân giải của nuclease tự nhiên có trong nhân tế bào.","Do sự thiếu hụt nguyên liệu nucleotide xảy ra vào cuối chu kỳ sao chép"]},{"q":"Trong hệ thống sao chép của tế bào nhân thực, loại DNA polymerase nào đóng vai trò tương tự như tiểu phần khởi đầu, vừa có hoạt tính primase vừa tổng hợp đoạn DNA ngắn?","o":["DNA polymerase α (alpha).","DNA polymerase δ (delta).","DNA polymerase ε (epsilon).","DNA polymerase γ (gamma)."]},{"q":"Nhân tố PCNA (Proliferating Cell Nuclear Antigen) ở tế bào nhân thực có chức năng tương đồng với cấu trúc nào ở trực khuẩn E. coli?","o":["Kẹp trượt β (β-sliding clamp), giúp giữ DNA polymerase bám chặt vào mạch khuôn.","Protein SSB, giúp bảo vệ mạch đơn DNA khỏi bị nuclease phân giải.","Enzyme Helicase DnaB, có vai trò tháo xoắn chạc sao chép.","Lõi xúc tác (core enzyme) của DNA polymerase III."]},{"q":"Trong một chu kỳ tế bào bình thường, sự kiện sinh tổng hợp DNA (nhân đôi nhiễm sắc thể) chỉ được phép diễn ra trong giai đoạn nào?","o":["Pha S (Synthesis).","Pha G1 (Gap 1).","Pha G2 (Gap 2).","Pha M (Mitosis/Meiosis)."]},{"q":"Kích thước các đoạn Okazaki ở tế bào nhân thực so với trực khuẩn E. coli có sự khác biệt như thế nào?","o":["Ngắn hơn rất nhiều (khoảng 100 - 200 nucleotide so với 1000 - 2000 nucleotide ở vi khuẩn).","Dài hơn rất nhiều (khoảng 5000 - 10000 nucleotide so với 100 - 200 nucleotide ở vi khuẩn).","Có kích thước tương đương nhau (khoảng 1000 - 2000 nucleotide ở cả hai loại).","Thay đổi tùy thuộc vào lượng enzyme ligase có trong tế bào."]},{"q":"Nguyên nhân chính làm cho tốc độ di chuyển của chạc sao chép ở sinh vật nhân thực chậm hơn so với sinh vật nhân sơ là do:","o":["DNA nhân thực tồn tại ở cấu trúc nhiễm sắc thể phức tạp, cuộn xoắn quanh các protein histone (nucleosome).","Kích thước của bộ gen nhân thực lớn hơn rất nhiều so với nhân sơ.","DNA polymerase của nhân thực có hoạt tính xúc tác yếu hơn DNA polymerase của nhân sơ.","Sự thiếu hụt các dNTP cục bộ trong môi trường nhân tế bào."]},{"q":"Khi sao chép phân tử DNA vòng ở vi khuẩn, sự kiện hai phân tử DNA con bị móc lồng vào nhau (catenanes) được gỡ rối và tách rời hoàn toàn nhờ vào hoạt động của loại enzyme nào?","o":["Topoisomerase II (như DNA gyrase), thông qua cơ chế cắt cả hai mạch của một phân tử DN","Topoisomerase I, thông qua cơ chế cắt một mạch duy nhất.","DNA ligase, thông qua cơ chế tháo xoắn tự nhiên.","Helicase, thông qua việc phá vỡ liên kết hydro cuối cùng."],"w":"Tách hai vòng DNA con ở E. coli chủ yếu liên quan topoisomerase IV. Khóa ghi topoisomerase II “như DNA gyrase”; cần đối chiếu enzyme cụ thể. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Ở sinh vật nhân thực, quá trình loại bỏ đoạn mồi RNA và trưởng thành đoạn Okazaki chủ yếu dựa vào hoạt động cắt của enzyme nào đối với nhánh RNA (flap) bị đẩy lồi lên do Pol δ?","o":["FEN1 (Flap endonuclease 1).","RNase H1 trực tiếp cắt bỏ toàn bộ mồi mà không tạo nhánh.","DNA polymerase I (thông qua hoạt tính exonuclease 5' -> 3').","Enzyme telomerase thông qua hoạt tính phiên mã ngượ"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Bước quyết định đầu tiên trong việc khởi nguồn sao chép tại OriC của E. coli liên quan đến sự bám của protein nào vào các hộp 9-mer để làm biến dạng và tháo xoắn vùng 13-mer?","o":["Protein DnaA (khi gắn với ATP).","Protein DnaB (Helicase).","Protein DnaC (Helicase loader).","Protein DnaG (Primase)."]},{"q":"Giả sử có một đột biến làm vô hiệu hóa hoàn toàn gen mã hóa Telomerase trong dòng tế bào soma đang nuôi cấy in vitro. Hậu quả dài hạn nào sẽ xảy ra?","o":["Các tế bào sẽ mất dần telomere sau mỗi chu kỳ phân chia và cuối cùng đi vào trạng thái lão hóa (senescence) hoặc chết theo chương trình (apoptosis).","Các tế bào sẽ tăng cường tốc độ phân chia do cơ chế điều hòa âm tính bị phá vỡ, dẫn tới bất tử hó","Các tế bào sẽ không thể tổng hợp mạch ra chậm (lagging strand) ngay từ lần phân bào đầu tiên.","Các nhiễm sắc thể sẽ liên kết chéo nối đầu với nhau tạo thành hệ gen vòng lớn giúp tế bào sống sót."],"w":"Hậu quả phụ thuộc tế bào ban đầu có telomerase hoạt động hay cơ chế duy trì telomere khác hay không; câu nguồn chưa nêu các điều kiện này. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cơ chế sao chép vòng lăn (rolling-circle replication) KHÔNG thể được tìm thấy trong quá trình sinh học nào dưới đây?","o":["Quá trình nhân đôi hệ gen nhiễm sắc thể chính của tế bào người.","Quá trình nhân lên của một số loại thể thực khuẩn (bacteriophage).","Quá trình truyền plasmid qua hiện tượng tiếp hợp (conjugation) ở vi khuẩn.","Sự nhân bản của một số DNA virus vòng."]},{"q":"Enzyme chính xúc tác cho quá trình sinh tổng hợp RNA (phiên mã) là gì?","o":["RNA polymerase.","DNA polymerase.","Reverse transcriptase.","Helicase."]},{"q":"Trong quá trình phiên mã, chuỗi RNA mới được tổng hợp theo chiều nào?","o":["Từ 5' đến 3'.","Từ 3' đến 5'.","Cả hai chiều tùy thuộc vào mạch khuôn.","Từ 5' đến 3' trên mạch dẫn đầu và 3' đến 5' trên mạch ra chậm."]},{"q":"Trong quá trình phiên mã, nguyên tắc bổ sung giữa mạch khuôn DNA và mạch RNA mới tổng hợp diễn ra như thế nào?","o":["A liên kết với U, T liên kết với A, G liên kết với C, C liên kết với G.","A liên kết với T, G liên kết với","A liên kết với U, G liên kết với","A liên kết với A, U liên kết với T, G liên kết với"]},{"q":"Vị trí đặc hiệu trên phân tử DNA mà RNA polymerase bám vào để khởi đầu quá trình phiên mã được gọi là gì?","o":["Promoter (Vùng khởi động).","Terminator (Vùng kết thúc).","Origin of replication (Điểm khởi đầu sao chép).","Operator (Vùng vận hành)."]},{"q":"Trong quá trình phiên mã, enzyme RNA polymerase trượt dọc trên mạch khuôn của DNA theo chiều nào?","o":["Từ 3' đến 5'.","Từ 5' đến 3'.","Từ giữa gen ra hai phí","Tuỳ thuộc vào loại tế bào là nhân sơ hay nhân thự"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Base nitơ nào có trong cấu trúc của RNA nhưng KHÔNG có mặt trong cấu trúc của DNA?","o":["Uracil (U).","Thymine (T).","Adenine (A).","Cytosine (C)."]},{"q":"Nguyên liệu trực tiếp để tổng hợp nên phân tử RNA trong tế bào là gì?","o":["Các ribonucleoside triphosphate (ATP, UTP, GTP, CTP).","Các deoxynucleoside triphosphate (dATP, dTTP, dGTP, dCTP).","Các acid amin tự do.","Các đoạn mồi RNA ngắn."]},{"q":"Ở sinh vật nhân sơ (như vi khuẩn E. coli), quá trình phiên mã diễn ra ở vị trí nào trong tế bào?","o":["Tế bào chất.","Nhân tế bào.","Ribosome.","Mạng lưới nội chất."]},{"q":"Loại RNA nào mang thông tin di truyền từ DNA để làm khuôn mẫu trực tiếp cho quá trình tổng hợp protein?","o":["mRNA (RNA thông tin).","tRNA (RNA vận chuyển).","rRNA (RNA ribosome).","snRNA (RNA nhân nhỏ)."]},{"q":"Quá trình phiên mã kết thúc khi RNA polymerase gặp tín hiệu nào trên phân tử DNA?","o":["Trình tự kết thúc phiên mã (Terminator).","Codon kết thúc (UAA, UAG, UGA).","Hộp TATA (TATA box).","Vùng tăng cường (Enhancer)."]},{"q":"Điểm khác biệt về sản phẩm phiên mã giữa sinh vật nhân sơ và nhân thực là gì?","o":["Ở nhân thực tạo ra tiền mRNA (pre-mRNA) cần qua xử lý, còn ở nhân sơ mRNA có thể dịch mã ngay.","Ở nhân sơ tạo ra tiền mRNA, còn nhân thực tạo ra mRNA trưởng thành ngay.","Sinh vật nhân sơ chỉ tổng hợp tRNA, không tổng hợp mRN","Sản phẩm của nhân thực là chuỗi polypeptide, của nhân sơ là RN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Liên kết hóa học nào được hình thành giữa các nucleotide liền kề trên chuỗi RNA đang được tổng hợp?","o":["Liên kết phosphodiester.","Liên kết hydro.","Liên kết peptide.","Liên kết glycosidi"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Sự tháo xoắn phân tử DNA trong quá trình phiên mã có đặc điểm gì?","o":["Chỉ tháo xoắn cục bộ từng đoạn ngắn tại nơi RNA polymerase đang hoạt động.","Tháo xoắn hoàn toàn toàn bộ phân tử DNA trước khi bắt đầu phiên mã.","Không cần tháo xoắn vì RNA trượt bên ngoài chuỗi kép.","Được tháo xoắn toàn bộ nhờ enzyme Helicase trước khi RNA polymerase bám vào."]},{"q":"Giai đoạn nào KHÔNG thuộc quá trình sinh tổng hợp RNA?","o":["Trưởng thành và uốn nếp không gian của protein.","Khởi đầu phiên mã.","Kéo dài chuỗi polynucleotide.","Kết thúc phiên mã."]},{"q":"Đặc điểm nào dưới đây mô tả đúng nhất về cấu trúc của phân tử RNA được tổng hợp trong tế bào?","o":["Hầu hết tồn tại ở dạng mạch đơn, có thể cuộn gập tạo cấu trúc không gian.","Luôn tồn tại ở dạng mạch kép xoắn đều đặn.","Luôn có dạng mạch thẳng không bao giờ có liên kết bổ sung nội phân tử.","Cấu tạo từ các chuỗi polypeptide liên kết chéo với nhau."]},{"q":"Ở tế bào sinh vật nhân thực, loại enzyme nào chịu trách nhiệm chính trong việc phiên mã các gen mã hóa cho protein (tổng hợp mRNA)?","o":["RNA polymerase II.","RNA polymerase I.","RNA polymerase III.","DNA polymerase."]},{"q":"Ở vi khuẩn E. coli, tiểu phần nào của phức hệ RNA polymerase lõi có chức năng đặc hiệu nhận diện vùng promoter để bắt đầu phiên mã?","o":["Yếu tố sigm","Tiểu phần alph","Tiểu phần bet","Tiểu phần omeg"],"w":"Sigma giúp nhận diện promoter nhưng không phải tiểu phần của enzyme lõi khi chưa tạo holoenzyme. Câu nguồn gọi nó là thành phần của phức hệ lõi; cần đối chiếu. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1, T2, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Sự kiện gắn mũ (capping) ở đầu 5' của tiền mRNA (pre-mRNA) ở sinh vật nhân thực có bản chất hóa học là việc gắn thêm phân tử nào?","o":["7-methylguanosine.","Chuỗi poly-Adenine.","Một đoạn oligopeptide.","Nhóm phosphate vô cơ."]},{"q":"Chức năng sinh học quan trọng nhất của đuôi poly-A được gắn vào đầu 3' của mRNA ở sinh vật nhân thực là gì?","o":["Bảo vệ mRNA khỏi sự phân giải của enzyme exonuclease và hỗ trợ xuất khẩu mRNA ra tế bào chất.","Là tín hiệu để enzyme RNA polymerase nhận diện vị trí kết thúc phiên mã.","Xúc tác cho quá trình cắt bỏ intron và nối các exon.","Cung cấp năng lượng cho quá trình dịch mã tại ribosome"]},{"q":"Trong quá trình xử lý tiền mRNA (splicing) ở sinh vật nhân thực, phức hợp spliceosome cắt bỏ phần nào và nối phần nào lại với nhau?","o":["Cắt bỏ các intron, nối các exon lại với nhau.","Cắt bỏ các exon, nối các intron lại với nhau.","Cắt bỏ hộp TATA, nối vùng mã hóa với vùng điều hò","Cắt bỏ mũ 5' và đuôi 3', chỉ giữ lại vùng giữ"]},{"q":"Cơ chế kết thúc phiên mã KHÔNG phụ thuộc yếu tố Rho ở vi khuẩn (intrinsic termination) đặc trưng bởi hiện tượng nào?","o":["Sự hình thành cấu trúc kẹp tóc (hairpin loop) trên RNA mới tổng hợp theo sau là một chuỗi các uracil (U).","Sự gắn kết của protein Rho vào đuôi đang dài ra của RN","Sự phosphoryl hóa vùng CTD của enzyme RNA polymerase.","Sự suy kiệt nguyên liệu NTP trong tế bào chất."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Phức hợp Spliceosome xúc tác cho quá trình cắt nối RNA được cấu tạo từ những thành phần chủ yếu nào?","o":["Các snRNA (RNA nhân nhỏ) kết hợp với các protein tạo thành snRNPs.","Chỉ thuần túy là các enzyme protein nuclease và ligase.","rRNA và các protein tương tự như cấu trúc ribosome.","Các phân tử tRNA mang theo amino acid đặc hiệu."]},{"q":"Ở sinh vật nhân thực, RNA polymerase III có chức năng tổng hợp chủ yếu các loại phân tử nào?","o":["tRNA và 5S rRN","Hầu hết các rRNA (18S, 28S, 5.8S).","mRNA và snRN","DNA ty thể và DNA lục lạp."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hộp TATA (TATA box) - một trình tự quan trọng trong vùng promoter cốt lõi của gen sinh vật nhân thực - thường nằm ở vị trí nào so với điểm khởi đầu phiên mã (+1)?","o":["Khoảng vị trí -25 đến -30.","Ngay tại vị trí +1.","Khoảng vị trí -10.","Ở vùng hạ lưu (downstream) khoảng +50."]},{"q":"Ở vi khuẩn, vị trí promoter thường chứa hai trình tự bảo thủ (consensus sequence) quan trọng giúp yếu tố sigma nhận diện. Đó là những hộp (box) nào?","o":["Hộp -10 (Pribnow box) và hộp -35.","Hộp TATA và hộp CAAT.","Hộp GC và vùng khởi tăng cường (Enhancer).","Hộp Pribnow và trình tự Shine-Dalgarno."]},{"q":"Trong sự hình thành phức hợp tiền khởi đầu (PIC) ở sinh vật nhân thực, yếu tố phiên mã cơ bản (General Transcription Factor) nào gắn vào hộp TATA đầu tiên?","o":["TFIID (thông qua tiểu đơn vị TBP - TATA binding protein).","TFII","TFII","TFIIH."],"w":"Hai phương án T1 và T2 đều là “TFII”, thiếu ký hiệu phân biệt. Không suy đoán chữ cái bị thiếu; giữ nguyên cả hai lựa chọn. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1, T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Sự kiện nào đánh dấu sự chuyển từ giai đoạn khởi đầu sang giai đoạn kéo dài của RNA polymerase II ở sinh vật nhân thực, đồng thời tuyển mộ các yếu tố xử lý RNA (capping, splicing)?","o":["Sự phosphoryl hóa vùng đuôi CTD (Carboxyl-terminal domain) của RNA polymerase II bởi TFIIH.","Sự tách rời yếu tố sigma khỏi phức hệ enzyme lõi.","Sự gắn của yếu tố Rho vào phân tử RNA đang được tổng hợp.","Sự phá vỡ hoàn toàn liên kết hydro của toàn bộ gen."]},{"q":"Độc tố alpha-amanitin chiết xuất từ nấm mủ (Amanita phalloides) có khả năng gây ngộ độc tế bào nhân thực bằng cách ức chế mạnh nhất enzyme nào sau đây?","o":["RNA polymerase II.","RNA polymerase I.","DNA polymerase gamm","Enzyme peptidyl transferase trên ribosome."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Quá trình chỉnh sửa RNA (RNA editing) phổ biến ở động vật có vú, chẳng hạn như ở gen mã hóa thụ thể glutamate trong não, thường liên quan đến cơ chế biến đổi hóa học nào trên phân tử RNA trưởng thành?","o":["Sự khử amin có xúc tác (deamination) chuyển đổi Adenine thành Inosine.","Sự methyl hóa trực tiếp đường ribose tại vị trí 2'-OH.","Sự cắt đứt liên kết phosphodiester bằng endonuclease để chèn thêm các Uracil.","Sự đảo ngược chiều đọc của codon từ 5' - 3' thành 3' - 5'."]},{"q":"Trình tự tăng cường (Enhancer) ảnh hưởng đến mức độ phiên mã của gen nhân thực thông qua tính chất đặc biệt nào sau đây?","o":["Có thể hoạt động hiệu quả dù nằm cách xa promoter hàng ngàn cặp base, và ở cả hướng thượng lưu hoặc hạ lưu.","Hoạt động như một enzyme helicase phụ trợ để mở xoắn DN","Chỉ có thể kích hoạt phiên mã nếu nằm sát ngay vị trí -10 của promoter.","Là trình tự mã hóa trực tiếp cho các yếu tố phiên mã cơ bản."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Bào quan nào là nơi diễn ra quá trình sinh tổng hợp protein?","o":["Ribosome.","Ti thể.","Lưới nội chất trơn.","Nhân con."]},{"q":"Mã mở đầu trên phân tử mRNA quy định tín hiệu bắt đầu dịch mã là:","o":["5'-AUG-3'.","5'-UAA-3'.","5'-UAG-3'.","5'-UGA-3'."]},{"q":"Amino acid mở đầu chuỗi polypeptide ở sinh vật nhân thực là gì?","o":["Methionine.","Formyl-methionine.","Valine.","Leucine."]},{"q":"Phân tử nào đóng vai trò như 'người phiên dịch', mang amino acid tương ứng đến ribosome?","o":["tRN","mRN","rRN","snRN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1, T2, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Tính thoái hóa của mã di truyền có nghĩa là gì?","o":["Một amino acid có thể được mã hóa bởi nhiều bộ ba khác nhau.","Một bộ ba có thể mã hóa cho nhiều loại amino acid khác nhau.","Mã di truyền ở các loài bị biến đổi thoái hóa theo thời gian.","Mã di truyền được đọc chồng chéo lên nhau."]},{"q":"Các codon nào sau đây làm nhiệm vụ báo hiệu kết thúc quá trình dịch mã?","o":["UAA, UAG, UG","AUG, UAA, UAG.","UUU, UAA, UG","UAG, UGA, UGG."],"w":"Khóa Đ có “UG” chỉ hai base; đây là ký hiệu chưa đủ một codon. Bộ ba kết thúc chuẩn gồm UAA, UAG, UGA. Không tự thêm A vào đáp án nguồn."},{"q":"Liên kết hóa học nối các amino acid lại với nhau trong chuỗi polypeptide là:","o":["Liên kết peptide.","Liên kết phosphodiester.","Liên kết hydro.","Liên kết glycosidi"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Quá trình dịch mã sẽ dừng lại khi ribosome gặp tín hiệu nào?","o":["Codon kết thúc trên phân tử mRN","Codon kết thúc trên phân tử tRN","Hộp TATA trên gen.","Trình tự promoter."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Phân tử mRNA được đọc bởi ribosome theo chiều nào?","o":["Từ 5' đến 3'.","Từ 3' đến 5'.","Cùng lúc từ cả hai chiều.","Bắt đầu từ giữa phân tử ra hai đầu."]},{"q":"Sự kiện nào sau đây KHÔNG xảy ra trong quá trình dịch mã?","o":["Cắt bỏ intron, nối các exon.","Hoạt hóa amino aci","Hình thành liên kết peptide.","Ribosome dịch chuyển trên phân tử mRN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cấu trúc nào trên phân tử tRNA giúp nó nhận diện codon tương ứng trên mRNA?","o":["Anticodon (Bộ ba đối mã).","Đầu 3' mang gốc -OH tự do.","Đầu 5' mang gốc phosphate.","Nhánh Tψ"]},{"q":"Ở sinh vật nhân sơ, đặc điểm nổi bật của sự phiên mã và dịch mã là gì?","o":["Xảy ra đồng thời trong tế bào chất do không có màng nhân phân cách.","Phiên mã trong nhân, dịch mã trong tế bào chất.","Dịch mã bắt buộc phải xảy ra trước phiên mã.","Xảy ra nối tiếp nhau trên cùng một phân tử DN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Amino acid được gắn vào vị trí nào của phân tử tRNA?","o":["Đầu 3' có trình tự kết thúc là CC","Đầu 5' mang gốc phosphate.","Ở vòng đối mã (anticodon loop).","Ở vòng D (D loop)."],"w":"Đáp án ghi đầu 3′ kết thúc “CC”, thiếu ký tự so với trình tự CCA của tRNA. Không khôi phục ký tự vào lựa chọn gốc. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Giai đoạn hoạt hóa amino acid trong quá trình tổng hợp protein cần sử dụng năng lượng trực tiếp từ phân tử nào?","o":["ATP.","GTP.","CTP.","UTP."]},{"q":"Hai tiểu phần (lớn và nhỏ) của ribosome thường liên kết lại với nhau khi nào?","o":["Chỉ khi bắt đầu quá trình dịch mã trên phân tử mRN","Chúng luôn tồn tại ở dạng liên kết với nhau trong tế bào chất.","Chỉ khi tế bào bắt đầu phân chi","Sau khi chuỗi polypeptide đã được tổng hợp xong."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Enzyme đặc hiệu nào chịu trách nhiệm gắn đúng amino acid vào phân tử tRNA tương ứng của nó?","o":["Aminoacyl-tRNA synthetase.","Peptidyl transferase.","RNA polymerase.","Amino acid kinase."]},{"q":"Trong quá trình kéo dài chuỗi polypeptide, phức hợp aminoacyl-tRNA mới mang amino acid đi vào vị trí nào của ribosome?","o":["Vị trí A (Aminoacyl site).","Vị trí P (Peptidyl site).","Vị trí E (Exit site).","Vị trí bám mRN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hoạt tính của enzyme Peptidyl transferase, xúc tác hình thành liên kết peptide, thuộc về thành phần nào của cấu trúc ribosome?","o":["Phân tử rRNA của tiểu phần lớn (hoạt động như một ribozyme).","Phân tử protein của tiểu phần nhỏ.","Phân tử rRNA của tiểu phần nhỏ.","Phân tử protein của tiểu phần lớn."],"w":"Câu này nêu rRNA xúc tác như ribozyme; cần đối chiếu với khái quát mọi enzyme là protein ở câu 41."},{"q":"Ở sinh vật nhân sơ, trình tự Shine-Dalgarno trên mRNA có vai trò gì?","o":["Giúp tiểu đơn vị nhỏ của ribosome nhận diện và gắn đúng vị trí để khởi đầu dịch mã.","Là tín hiệu nhận diện để kết thúc kéo dài chuỗi polypeptide.","Cung cấp vị trí liên kết cho RNA polymerase.","Là điểm gắn kết của các yếu tố giải phóng (Release factor)."]},{"q":"Trong giai đoạn kéo dài chuỗi polypeptide, sự chuyển vị (translocation) của ribosome dọc theo mRNA cần năng lượng thủy phân từ phân tử nào?","o":["GTP.","ATP.","CTP.","UTP."]},{"q":"Tại vị trí P (Peptidyl) của ribosome trong giai đoạn kéo dài, phân tử tRNA đang mang thành phần nào?","o":["Chuỗi polypeptide đang được tổng hợp.","Một amino acid tự do chưa tạo liên kết.","Không mang gì (tRNA đã được giải phóng gốc amino acid).","Yếu tố giải phóng (Release Factor)."]},{"q":"Cấu trúc polysome (hay polyribosome) có chức năng sinh học là gì?","o":["Giúp tổng hợp nhanh chóng nhiều bản sao của cùng một chuỗi polypeptide từ một phân tử mRN","Giúp tổng hợp một chuỗi polypeptide dài từ nhiều phân tử mRNA khác nhau.","Bảo vệ mRNA khỏi sự phân giải của enzyme ligase.","Tăng cường độ chính xác cho quá trình dịch mã."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Khi codon kết thúc (như UAG) tiến vào vị trí A của ribosome, nhân tố nào sẽ gắn vào vị trí này để kích hoạt việc giải phóng chuỗi polypeptide?","o":["Yếu tố giải phóng (Release Factor - RF).","Một phân tử tRNA không mang amino aci","Yếu tố kéo dài (Elongation Factor - EF).","Enzyme Aminoacyl-tRNA synthetase."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Ở sinh vật nhân thực, cấu trúc nào ở đầu 5' của mRNA giúp tiểu phần nhỏ của ribosome nhận diện và bám vào để quét tìm codon mở đầu?","o":["Mũ 5' (7-methylguanosine cap).","Đuôi poly-","Hộp TAT","Đoạn intron."]},{"q":"Sự sai sót trong quá trình nạp amino acid vào tRNA hiếm khi xảy ra vì lý do nào sau đây?","o":["Enzyme aminoacyl-tRNA synthetase có cơ chế đọc sửa (proofreading) để thủy phân amino acid nếu gắn sai.","Phân tử tRNA có khả năng tự phát hiện và loại bỏ amino acid không phù hợp.","Ribosome luôn kiểm tra lại amino acid trước khi cho phép tạo liên kết peptide.","Mã di truyền có tính thoái hóa nên sai sót amino acid không ảnh hưởng nhiều."]},{"q":"Thuyết biến động (Wobble hypothesis) do Francis Crick đề xuất giải thích hiện tượng nào trong sinh học phân tử?","o":["Base thứ ba của codon trên mRNA có thể bắt cặp linh hoạt với base thứ nhất của anticodon mà không tuân thủ nghiêm ngặt nguyên tắc Watson-Crick.","Ribosome có khả năng dịch chuyển lùi lại để cắt bỏ nếu nhận thấy đã gắn nhầm amino aci","Vị trí các gen mã hóa tRNA trong hệ gen có thể thay đổi linh hoạt.","Tốc độ dịch mã dao động liên tục tùy thuộc vào nồng độ ion Magie trong tế bào."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Kháng sinh Puromycin ức chế quá trình dịch mã bằng cơ chế phân tử nào?","o":["Có cấu trúc tương tự đầu 3' của aminoacyl-tRNA, đi vào vị trí A, tham gia tạo liên kết peptide và gây kết thúc chuỗi sớm.","Gắn chặt vào tiểu phần 30S, ngăn cản hoàn toàn sự liên kết của mọi aminoacyl-tRN","Phá hủy đặc hiệu trung tâm xúc tác của enzyme peptidyl transferase.","Gắn vào yếu tố kéo dài EF-G, ức chế sự chuyển vị của phức hệ ribosome."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Quá trình sửa đổi sau dịch mã (post-translational modification) nào đóng vai trò như một 'thẻ đánh dấu' để đưa protein đến phức hợp proteasome nhằm phân giải?","o":["Sự Ubiquitin hóa (Ubiquitination).","Sự Phosphoryl hóa (Phosphorylation).","Sự Methyl hóa (Methylation).","Sự Glycosyl hóa (Glycosylation)."]},{"q":"Tín hiệu định vị hạt nhân (Nuclear Localization Signal - NLS) trên một chuỗi polypeptide mới tổng hợp có đặc điểm cấu trúc hóa học chủ yếu là gì?","o":["Chứa nhiều amino acid mang điện tích dương (như Lysine, Arginine).","Chứa nhiều amino acid mang điện tích âm (như Aspartate, Glutamate).","Chứa dải dài các amino acid kỵ nước (như Leucine, Isoleucine).","Chứa nhiều gốc Cysteine gần nhau để dễ tạo liên kết disulfide."]},{"q":"Trong quá trình nhắm đích protein đến lưới nội chất hạt, hạt nhận biết tín hiệu (SRP - Signal Recognition Particle) thực hiện chức năng gì?","o":["Bám vào chuỗi peptide tín hiệu kỵ nước mới sinh, làm ngưng tạm thời sự dịch mã và dẫn phức hợp ribosome-mRNA đến màng lưới nội chất.","Đóng vai trò như một enzyme protease cắt bỏ đoạn peptide tín hiệu sau khi chuỗi chui vào lòng lưới nội chất.","Hỗ trợ quá trình cuộn gập không gian bậc 3 của protein bên trong khoang lưới nội chất.","Vận chuyển các protein đã hoàn thiện từ bộ máy Golgi ra màng sinh chất."]},{"q":"Định luật phân ly của Mendel giải thích hiện tượng nào sau đây ở cấp độ tế bào?","o":["Sự phân ly đồng đều của các alen thuộc cùng một gen về các giao tử trong quá trình giảm phân.","Sự di truyền độc lập của các gen nằm trên các nhiễm sắc thể khác nhau.","Hiện tượng trội không hoàn toàn ở thể dị hợp tử.","Sự liên kết của các gen cùng nằm trên một nhiễm sắc thể."]},{"q":"Đối tượng nghiên cứu chính mà Gregor Mendel đã sử dụng để tìm ra các quy luật di truyền cơ bản là gì?","o":["Đậu Hà Lan (Pisum sativum).","Ruồi giấm (Drosophila melanogaster).","Vi khuẩn E. coli.","Chuột nhắt trắng (Mus musculus)."]},{"q":"Phép lai phân tích (test cross) do Mendel đề xuất được sử dụng nhằm mục đích chính là gì?","o":["Xác định kiểu gen của cá thể mang kiểu hình trội (là đồng hợp tử hay dị hợp tử).","Xác định tần số hoán vị gen giữa hai gen liên kết.","Đánh giá xem tính trạng có di truyền liên kết với giới tính hay không.","Tìm ra các alen lặn gây chết ẩn trong quần thể sinh vật."]},{"q":"Trong phép lai một cặp tính trạng trội lặn hoàn toàn giữa hai cơ thể dị hợp tử (Aa x Aa), tỷ lệ phân ly kiểu hình ở đời con F1 là bao nhiêu?","o":["3 trội : 1 lặn.","1 trội : 2 trung gian : 1 lặn.","1 trội : 1 lặn.","Toàn bộ là kiểu hình trội."]},{"q":"Theo quan điểm của Mendel, mỗi tính trạng của cơ thể sinh vật được quy định bởi:","o":["Một cặp nhân tố di truyền (ngày nay gọi là cặp alen).","Một gen duy nhất.","Một nhiễm sắc thể nguyên vẹn.","Điều kiện của môi trường sống."]},{"q":"Tỷ lệ phân ly kiểu hình 9:3:3:1 ở đời con là kết quả đặc trưng của phép lai nào (trong trường hợp gen phân ly độc lập và trội hoàn toàn)?","o":["Lai hai cơ thể dị hợp tử về hai cặp gen (AaBb x AaBb).","Lai phân tích cơ thể dị hợp tử hai cặp gen (AaBb x aabb).","Lai hai cơ thể dị hợp tử một cặp gen (Aa x Aa).","Lai cơ thể đồng hợp tử trội với dị hợp tử (AABB x AaBb)."]},{"q":"Khái niệm 'Alen' trong di truyền học được định nghĩa là:","o":["Các trạng thái biểu hiện khác nhau của cùng một gen tại một locus nhất định trên nhiễm sắc thể.","Các gen khác nhau cùng tham gia quy định một tính trạng phức tạp.","Các nhiễm sắc thể tương đồng trong tế bào lưỡng bội của sinh vật.","Sự biểu hiện của kiểu gen thành các đặc điểm hình thái ra bên ngoài."]},{"q":"Khi lai cây đậu Hà Lan thuần chủng hạt vàng, trơn (AABB) với cây hạt xanh, nhăn (aabb), F1 thu được 100% hạt vàng, trơn. Nếu cho F1 tự thụ phấn, tỷ lệ hạt xanh, nhăn xuất hiện ở F2 là bao nhiêu?","o":["1/16.","3/16.","9/16.","1/4."]},{"q":"Để các gen có thể phân ly độc lập theo đúng quy luật của Mendel, điều kiện tiên quyết về mặt tế bào học là gì?","o":["Các cặp gen quy định các cặp tính trạng phải nằm trên các cặp nhiễm sắc thể tương đồng khác nhau.","Các tính trạng nghiên cứu phải có hiện tượng trội lặn hoàn toàn.","Bố mẹ đem lai bắt buộc phải thuần chủng về tất cả các tính trạng.","Số lượng cá thể sinh ra ở đời con phải đủ lớn để đảm bảo tính thống kê."],"w":"Các gen rất xa nhau trên cùng NST cũng có thể cho tần số tái tổ hợp gần 50% và biểu hiện như phân ly độc lập; không chỉ có trường hợp khác NST."},{"q":"Một cá thể sinh vật có kiểu gen AaBbDd sẽ tạo ra tối đa bao nhiêu loại giao tử nếu các gen này phân ly độc lập trong giảm phân?","o":["8 loại.","4 loại.","6 loại.","16 loại."]},{"q":"Cơ thể thuần chủng (dòng thuần) trong nghiên cứu di truyền có đặc điểm là:","o":["Mang các cặp alen đồng hợp tử về tất cả các gen đang được xét đến.","Luôn mang kiểu hình trội ở tất cả các tính trạng của cơ thể.","Luôn biểu hiện tính trạng lặn ra kiểu hình một cách rõ rệt.","Có bộ nhiễm sắc thể lưỡng bội nguyên vẹn không bị đột biến."]},{"q":"Khi tiến hành lai phân tích một cơ thể dị hợp tử về hai cặp gen phân ly độc lập (AaBb x aabb), tỷ lệ phân ly kiểu hình ở đời con sẽ là:","o":["1 : 1 : 1 : 1.","9 : 3 : 3 : 1.","3 : 1.","1 : 1."]},{"q":"Đặc điểm sinh học nào của cây đậu Hà Lan KHÔNG phải là lý do trực tiếp giúp Mendel thành công trong thí nghiệm của mình?","o":["Bộ nhiễm sắc thể có số lượng lớn và cấu trúc trao đổi chéo phức tạp.","Dễ trồng, sinh trưởng nhanh và có chu kỳ sống tương đối ngắn.","Có cấu tạo hoa lưỡng tính, tự thụ phấn nghiêm ngặt trong tự nhiên.","Có nhiều cặp tính trạng tương phản, dễ dàng quan sát và phân biệt."]},{"q":"Cơ sở tế bào học của định luật phân ly độc lập Mendel diễn ra vào giai đoạn nào của quá trình phân bào?","o":["Sự phân ly ngẫu nhiên của các cặp nhiễm sắc thể tương đồng ở kỳ sau của giảm phân I.","Sự tiếp hợp và trao đổi chéo giữa các chromatid ở kỳ đầu của giảm phân I.","Sự tháo xoắn của nhiễm sắc thể kép thành dạng sợi mảnh ở kỳ cuối giảm phân II.","Sự nhân đôi của các phân tử DNA ở pha S thuộc kỳ trung gian."]},{"q":"Theo quy luật di truyền, giao tử bình thường do cơ thể lưỡng bội (2n) tạo ra có đặc điểm gì?","o":["Mang bộ nhiễm sắc thể đơn bội (n), chỉ chứa một alen của mỗi cặp gen.","Mang bộ nhiễm sắc thể lưỡng bội (2n), chứa một alen của mỗi cặp gen.","Mang bộ nhiễm sắc thể đơn bội (n), chứa cả hai alen của một cặp gen.","Mang bộ nhiễm sắc thể lưỡng bội (2n), chứa cả hai alen của một cặp gen."]},{"q":"Cho phép lai P: AaBbCc x AaBbCc (biết các gen phân ly độc lập, tính trạng trội là trội hoàn toàn). Tỷ lệ đời con F1 mang kiểu hình trội về cả 3 tính trạng đang xét là bao nhiêu?","o":["27/64.","9/64.","1/64.","3/64."]},{"q":"Theo quy luật xác suất, trong phép lai hai cơ thể dị hợp tử và đồng hợp tử lặn (AaBb x Aabb), tỷ lệ cá thể con xuất hiện kiểu gen đồng hợp lặn về cả hai gen (aabb) là bao nhiêu?","o":["1/8.","1/16.","1/4.","1/2."],"w":"Phần mô tả gọi một bên đồng hợp lặn nhưng phép lai thực tế là AaBb × Aabb; Aabb còn dị hợp ở locus A. Phép tính 1/8 phù hợp kiểu gen viết trong phép lai."},{"q":"Phương pháp lai nào thường được áp dụng đầu tiên để xác định một tính trạng do gen nằm trên nhiễm sắc thể thường hay nằm trên nhiễm sắc thể giới tính quy định?","o":["Lai thuận nghịch.","Lai phân tích.","Lai xa (lai khác loài).","Cho tự thụ phấn qua nhiều thế hệ."]},{"q":"Ở người, bệnh bạch tạng do một gen lặn a nằm trên nhiễm sắc thể thường quy định, alen trội A quy định da bình thường. Một cặp vợ chồng đều có da bình thường nhưng cùng mang kiểu gen dị hợp tử (Aa). Xác suất để đứa con đầu lòng của họ là con trai và bị bệnh bạch tạng là bao nhiêu?","o":["1/8.","1/4.","3/8.","1/2."]},{"q":"Ở một loài thực vật, alen A quy định thân cao trội hoàn toàn so với a thân thấp, alen B quy định hoa đỏ trội hoàn toàn so với b hoa trắng. Nếu cho lai cây thân cao, hoa đỏ (AaBb) với cây thân thấp, hoa đỏ (aaBb), tỷ lệ kiểu hình thân cao, hoa trắng ở đời con là:","o":["1/8.","3/8.","1/4.","3/16."],"w":"Bài toán tỷ lệ 1/8 cần giả thiết hai locus phân ly độc lập; nguồn không nêu điều kiện đó trong câu này."},{"q":"Một cơ thể động vật có kiểu gen AaBbDdEe giảm phân tạo giao tử bình thường. Xác suất để sinh ra một tinh trùng mang toàn alen trội (ABDE) là bao nhiêu?","o":["1/16.","1/4.","1/8.","1/32."],"w":"Tỷ lệ giao tử 1/16 cần giả thiết bốn locus phân ly độc lập hoặc mô hình tương đương. Câu nguồn chưa ghi rõ."},{"q":"Định luật phân ly độc lập của Mendel mang ý nghĩa sinh học quan trọng nhất ở khía cạnh nào?","o":["Giải thích cơ sở của quá trình tạo ra nguồn biến dị tổ hợp vô cùng phong phú trong sinh giới.","Cho phép nhà khoa học dự đoán chính xác tuyệt đối kiểu gen của mọi loài sinh vật.","Đảm bảo sự duy trì ổn định các tính trạng tốt qua nhiều thế hệ liên tiếp.","Làm bằng chứng trực tiếp chứng minh gen được cấu tạo từ phân tử DN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cho phép lai cá thể có kiểu gen AaBbDd với cá thể có kiểu gen aaBbD Các gen phân ly độc lập. Tỷ lệ xuất hiện kiểu gen aabbdd ở thế hệ con là bao nhiêu?","o":["1/32.","1/64.","1/16.","1/8."],"w":"Kiểu gen thứ hai bị dở ở “aaBbD”; không đoán alen còn thiếu dù khóa gợi ý một cách diễn giải."},{"q":"Giả sử Mendel nghiên cứu 8 cặp tính trạng ở đậu Hà Lan (biết loài này có 2n = 14, tức là 7 cặp NST). Hiện tượng di truyền nào chắc chắn sẽ xuất hiện và làm phức tạp hóa định luật phân ly độc lập của ông?","o":["Hiện tượng di truyền liên kết gen giữa ít nhất hai gen với nhau.","Hiện tượng gen gây chết ở trạng thái đồng hợp tử lặn.","Hiện tượng đột biến số lượng nhiễm sắc thể dị bội.","Hiện tượng di truyền ngoài nhân (di truyền qua tế bào chất)."],"w":"Có ít nhất hai locus cùng NST không có nghĩa chắc chắn quan sát được sai khác với phân ly độc lập nếu các locus ở rất xa nhau. Cách dùng “chắc chắn” cần đối chiếu."},{"q":"Một phép lai giữa hai cá thể có kiểu gen AaBb x AaBb sinh ra một quần thể gồm 160 cá thể con. Theo lý thuyết xác suất, có bao nhiêu cá thể con sẽ mang kiểu gen dị hợp tử về cả hai cặp gen (AaBb)?","o":["40 cá thể.","10 cá thể.","90 cá thể.","20 cá thể."],"w":"Kết quả 40 cá thể cần giả thiết các locus phân ly độc lập; nguồn không nêu rõ trong câu."},{"q":"Cho phép lai P: AaBbCcDd x AaBbCcD Hãy tính xác suất thu được một cá thể con F1 mang kiểu gen có chính xác 2 alen trội và 6 alen lặn. (Biết các gen phân ly độc lập).","o":["7/64 (hoặc 28/256).","28/64.","1/16.","35/128."],"w":"Kiểu gen thứ hai bị dở ở “AaBbCcD”. Không tự bổ sung alen cuối để khớp đáp án."},{"q":"Ở đậu Hà Lan, tính trạng hạt vàng (A) là trội hoàn toàn so với hạt xanh (a). Nếu lấy ngẫu nhiên một hạt vàng ở thế hệ F2 (tạo ra từ phép lai F1 dị hợp tử Aa x Aa) đem gieo, xác suất để cây mọc từ hạt này mang kiểu gen dị hợp tử (Aa) là bao nhiêu?","o":["2/3.","1/2.","3/4.","1/4."]},{"q":"Trong phép kiểm định thống kê Chi-bình phương ($\\chi^2$) nhằm đánh giá sự phù hợp của tỷ lệ phân ly kiểu hình thực tế so với lý thuyết của Mendel, số bậc tự do (degree of freedom - df) được xác định bằng công thức nào?","o":["Bằng số lớp kiểu hình xuất hiện ở đời con trừ đi 1 (n - 1).","Bằng tổng số cá thể thu được ở đời con trừ đi 1.","Bằng số lượng các cặp gen dị hợp tử đem lai.","Bằng tổng số loại kiểu gen khác nhau trừ đi 1."],"w":"Công thức df = số nhóm − 1 áp dụng khi các xác suất lý thuyết đã xác định và không ước lượng thêm tham số từ dữ liệu. Câu nguồn không nêu điều kiện thống kê."},{"q":"Cho lai hai cá thể có kiểu gen AaBbDdEeFf x AaBbDdEeFf. Số loại kiểu gen và số loại kiểu hình tối đa có thể xuất hiện ở đời con là bao nhiêu (giả sử các gen phân ly độc lập, trên các NST khác nhau và trội hoàn toàn)?","o":["243 loại kiểu gen, 32 loại kiểu hình.","32 loại kiểu gen, 243 loại kiểu hình.","120 loại kiểu gen, 64 loại kiểu hình.","256 loại kiểu gen, 16 loại kiểu hình."]},{"q":"Một quần thể thực vật tự thụ phấn, thế hệ xuất phát (P) có 100% cá thể mang kiểu gen dị hợp tử A Giả sử không có đột biến và chọn lọc tự nhiên, trải qua 3 thế hệ tự thụ phấn liên tiếp, tổng tỷ lệ cá thể mang kiểu gen đồng hợp tử (gồm AA và aa) trong quần thể ở thế hệ F3 là bao nhiêu?","o":["87.5%.","12.5%.","75.0%.","93.75%."],"w":"Kiểu gen khởi đầu ghi “dị hợp tử A”, có dấu hiệu thiếu alen a; giữ nguyên thay vì hoàn thiện kiểu gen theo suy đoán."},{"q":"Đối tượng chính mà Morgan sử dụng trong các thí nghiệm về di truyền liên kết là gì?","o":["Ruồi giấm (Drosophila melanogaster).","Đậu Hà Lan.","Cây hoa phấn.","Chuột nhắt trắng."]},{"q":"Theo quy luật liên kết gen của Morgan, các gen nằm trên cùng một nhiễm sắc thể thường:","o":["Di truyền cùng nhau tạo thành một nhóm liên kết.","Phân ly độc lập và tổ hợp tự do.","Luôn xảy ra trao đổi chéo ở mọi giới.","Tương tác với nhau để quy định một tính trạng."]},{"q":"Số nhóm gen liên kết ở mỗi loài sinh vật thường bằng:","o":["Số nhiễm sắc thể trong bộ đơn bội (n).","Số nhiễm sắc thể trong bộ lưỡng bội (2n).","Số lượng tính trạng của cơ thể.","Số lượng tâm động trên nhiễm sắc thể."]},{"q":"Hiện tượng hoán vị gen xảy ra do:","o":["Sự trao đổi đoạn giữa các chromatid khác nguồn trong cặp tương đồng.","Sự phân ly độc lập của các cặp nhiễm sắc thể.","Sự tổ hợp tự do của các giao tử trong thụ tinh.","Sự tiếp hợp giữa các nhiễm sắc thể không tương đồng."]},{"q":"Đơn vị dùng để đo khoảng cách giữa các gen trên bản đồ di truyền là:","o":["Centimorgan (cM).","Nanomet (nm).","Nucleotide (nt).","Đơn vị bản đồ (u)."],"w":"“Centimorgan” và “đơn vị bản đồ” có thể là hai cách gọi đơn vị đo khoảng cách di truyền. Có phương án tương đương với khóa; ứng dụng vẫn chấm ô Đ."},{"q":"Tần số hoán vị gen (f) không bao giờ vượt quá:","o":["50%.","100%.","25%.","75%."]},{"q":"Cơ sở tế bào học của quy luật liên kết gen hoàn toàn là:","o":["Sự phân ly của cặp nhiễm sắc thể tương đồng mang các gen tương ứng.","Sự trao đổi chéo giữa các chromatid tại kỳ đầu I giảm phân.","Sự tổ hợp của các nhiễm sắc thể tại kỳ giữ","Sự nhân đôi của DNA tại kỳ trung gian."]},{"q":"Tại sao Morgan lại chọn ruồi giấm làm đối tượng nghiên cứu?","o":["Chu kỳ sống ngắn, dễ nuôi, bộ NST ít (2n=8), nhiều biến dị.","Kích thước lớn, dễ quan sát bằng mắt thường.","Chỉ có hình thức sinh sản vô tính.","Các gen luôn phân ly độc lập với nhau."]},{"q":"Trong phép lai phân tích ruồi giấm cái F1 thân xám, cánh dài (BbVv) liên kết hoàn toàn, tỉ lệ kiểu hình thu được là:","o":["1 xám, dài : 1 đen, cụt.","1 xám, dài : 1 xám, cụt : 1 đen, dài : 1 đen, cụt.","3 xám, dài : 1 đen, cụt.","9 xám, dài : 3 xám, cụt : 3 đen, dài : 1 đen, cụt."],"w":"Kiểu gen BbVv chưa chỉ rõ liên kết cùng BV/bv hay liên kết đối Bv/bV. Khóa 1 xám dài : 1 đen cụt ngầm dùng liên kết cùng."},{"q":"Hoán vị gen có ý nghĩa gì trong tiến hóa và chọn giống?","o":["Làm tăng biến dị tổ hợp, tạo ra các tổ hợp gen mới.","Duy trì sự ổn định của các nhóm tính trạng tốt.","Hạn chế sự xuất hiện của các đột biến gen.","Làm giảm số lượng nhóm gen liên kết của loài."]},{"q":"Khoảng cách giữa các gen trên nhiễm sắc thể tỉ lệ thuận với:","o":["Tần số hoán vị gen.","Số lượng alen của mỗi gen.","Kích thước của nhiễm sắc thể.","Mức độ biểu hiện của tính trạng."],"w":"Tỷ lệ thuận gần đúng giữa tần số tái tổ hợp và khoảng cách hữu ích cho các khoảng ngắn; tần số tái tổ hợp quan sát không vượt 50%."},{"q":"Ở ruồi giấm, hiện tượng hoán vị gen thường chỉ xảy ra ở:","o":["Ruồi cái, không xảy ra ở ruồi đự","Ruồi đực, không xảy ra ở ruồi cái.","Cả ruồi đực và ruồi cái với tần số bằng nhau.","Các tế bào sinh dưỡng (soma)."]},{"q":"Ký hiệu kiểu gen nào sau đây thể hiện các gen liên kết đối (trans)?","o":["Ab/aB","AB/ab","Aa/Bb","Aabb"]},{"q":"Tần số hoán vị gen bằng 10% tương ứng với khoảng cách bản đồ là:","o":["10 cM.","1 cM.","100 cM.","0,1 cM."]},{"q":"Phép lai nào dùng để xác định tần số hoán vị gen?","o":["Lai phân tích cá thể dị hợp tử.","Lai giữa hai dòng thuần chủng.","Lai thuận nghịch.","Tự thụ phấn ở thực vật."]},{"q":"Cơ thể có kiểu gen AB/ab giảm phân có hoán vị gen với tần số f = 20%. Tỉ lệ loại giao tử Ab là:","o":["10%.","20%.","40%.","5%."]},{"q":"Cho phép lai AB/ab x ab/a Nếu khoảng cách giữa A và B là 20 cM thì tỉ lệ kiểu hình ab/ab ở đời con là:","o":["40%.","10%.","20%.","80%."],"w":"Kiểu gen phép lai bị dở ở “ab/a”; không tự thêm alen còn thiếu."},{"q":"Khi lai phân tích cơ thể dị hợp 2 cặp gen thu được 4 loại kiểu hình với tỉ lệ: 40% : 40% : 10% : 10%. Tần số hoán vị gen là:","o":["20%.","10%.","40%.","80%."]},{"q":"Cơ thể có kiểu gen Ab/aB giảm phân tạo ra giao tử AB chiếm tỉ lệ 5%. Tần số hoán vị gen là:","o":["10%.","5%.","20%.","40%."]},{"q":"Một cơ thể có kiểu gen AB/a Nếu có 20% số tế bào sinh tinh xảy ra hoán vị gen thì tần số hoán vị gen là:","o":["10%.","20%.","5%.","40%."],"w":"Kiểu gen nguồn ghi “AB/a”, bị thiếu alen. Quy đổi tần số tế bào trao đổi chéo sang tần số giao tử tái tổ hợp còn cần mô hình một trao đổi giữa hai chromatid."},{"q":"Bản đồ di truyền có vai trò gì?","o":["Dự đoán tần số các tổ hợp gen mới, xác định vị trí gen trên NST.","Thay đổi trình tự các gen trên nhiễm sắc thể.","Tăng số lượng nhiễm sắc thể của loài.","Ngăn chặn hiện tượng trao đổi chéo."]},{"q":"Nếu khoảng cách giữa gen A và B là 15 cM, gen B và C là 10 cM thì khoảng cách A và C là:","o":["25 cM hoặc 5 cM.","25 cM.","5 cM.","15 cM."]},{"q":"Ở thực vật, cho cây dị hợp 2 cặp gen (Aa, Bb) tự thụ phấn thu được kiểu hình lặn (aabb) chiếm 4%. Tần số hoán vị gen là (biết 2 giới như nhau):","o":["20%.","40%.","10%.","16%."],"w":"Với aabb = 4%, giao tử ab mỗi giới = 20%. Nếu dị hợp liên kết đối và cùng tần số hai giới thì f = 40%, không phải khóa 20%. Cần đối chiếu khóa; không thay đổi."},{"q":"Trong trường hợp liên kết gen hoàn toàn, phép lai AB/ab x Ab/aB cho tỉ lệ kiểu hình là:","o":["1 : 2 : 1.","3 : 1.","1 : 1 : 1 : 1.","9 : 3 : 3 : 1."],"w":"Tỷ lệ 1:2:1 là ba lớp kiểu hình nhưng cần biết lớp nào; với trội hoàn toàn, liên kết hoàn toàn thì A–B– : A–bb : aaB– = 2:1:1. Nguồn chưa nêu quy ước."},{"q":"Phát biểu nào ĐÚNG về liên kết gen?","o":["Liên kết gen làm hạn chế sự xuất hiện của biến dị tổ hợp.","Liên kết gen luôn đi kèm với hoán vị gen.","Liên kết gen chỉ xảy ra ở nhiễm sắc thể giới tính.","Số nhóm liên kết luôn lớn hơn số cặp nhiễm sắc thể."]},{"q":"Trong phép lai 3 điểm ABC/abc x abc/abc, thu được các cá thể tái tổ hợp kép là AbC/abc và aBc/ab Thứ tự các gen là:","o":["B - A -","A - B -","A - C -","B - C -"],"w":"Cả kiểu gen và các lựa chọn thứ tự gen đều bị dở, ví dụ “B - A -”. Không suy đoán phần bị mất. So sánh ABC/abc với AbC/aBc gợi ý B ở giữa, khác với phần đầu khóa đang ghi B-A-."},{"q":"Cho phép lai P: (AB/ab) Dd x (AB/ab) D Biết f(A,B) = 20% ở cả 2 giới. Tỉ lệ kiểu hình A-B-dd ở đời con là:","o":["13,5%.","48%.","16%.","12%."],"w":"Kiểu gen thứ hai bị dở ở “D”. Nếu bổ sung giả thiết Dd, trội hoàn toàn và độc lập với AB thì phép tính cho A–B–dd là 16,5%, không phải 13,5%. Đây chỉ là kiểm tra có điều kiện, không tự bổ sung giả thiết vào đề."},{"q":"Xét 1000 tế bào sinh tinh có kiểu gen AB/a Nếu tần số hoán vị gen là 18%, số tế bào đã xảy ra trao đổi chéo là:","o":["360 tế bào.","180 tế bào.","90 tế bào.","720 tế bào."],"w":"Kiểu gen ghi “AB/a” bị thiếu alen; số tế bào trao đổi chéo từ f còn cần giả thiết trao đổi chéo đơn giữa hai chromatid."},{"q":"Ở ruồi giấm, phép lai AB/ab x Ab/aB (f=20% ở ruồi cái). Tỉ lệ kiểu hình mang 2 tính trạng trội ở đời con là:","o":["50%.","45%.","54%.","41%."],"w":"Phép lai chưa chỉ rõ kiểu gen nào là ruồi cái, kiểu nào là ruồi đực; ở ruồi giấm chỉ ruồi cái có hoán vị giảm phân thông thường, nên kết quả có thể khác."},{"q":"Tính hệ số nhiễu (I) nếu tần số trao đổi chéo kép lý thuyết là 0,02 và thực tế là 0,015:","o":["0,25.","0,75.","0,005.","1,33."]},{"q":"Đặc điểm nào sau đây là đặc trưng cơ bản nhất của mọi loại virus?","o":["Ký sinh nội bào bắt buộc và chưa có cấu tạo tế bào.","Có khả năng sinh sản độc lập ở môi trường ngoài.","Vật chất di truyền luôn là DNA chuỗi kép.","Có cấu tạo tế bào nhân sơ với kích thước siêu nhỏ."]},{"q":"Thành phần cấu tạo cơ bản của mọi hạt virus bao gồm:","o":["Lõi axit nucleic và lớp vỏ protein (capsid).","Lõi DNA, vỏ protein và màng lipi","RNA, ribosome và màng sinh chất.","Vùng nhân, plasmid và vách peptidoglycan."]},{"q":"Vỏ capsid của virus được cấu tạo từ các tiểu phần protein gọi là:","o":["Capsomere.","Peplomer.","Nucleosome.","Prion."]},{"q":"Chu trình nhân lên phá vỡ tế bào chủ ngay lập tức được gọi là:","o":["Chu trình sinh tan (Lytic cycle).","Chu trình tiềm tan (Lysogenic cycle).","Sự xuất bào.","Sự phân đôi."]},{"q":"Lõi vật chất di truyền của virus có thể là:","o":["DNA hoặc RNA, chuỗi đơn hoặc chuỗi kép.","Chỉ có thể là DNA chuỗi kép.","Chỉ có thể là RNA chuỗi đơn.","Cả DNA và RNA tồn tại đồng thời."]},{"q":"Vỏ ngoài (envelope) của virus động vật thường có nguồn gốc từ:","o":["Màng sinh chất hoặc màng nội bào của tế bào chủ.","Sự tổng hợp lipid do gen của virus quy định.","Vách tế bào của vi khuẩn.","Màng nhân của tế bào thực vật."]},{"q":"Bacteriophage (thực khuẩn thể) là virus chuyên ký sinh ở:","o":["Vi khuẩn.","Thực vật.","Động vật.","Nấm."]},{"q":"Phage T4 xâm nhập vào E. coli bằng cách nào?","o":["Bơm lõi axit nucleic vào trong, để lại vỏ bên ngoài.","Thực bào toàn bộ hạt virus.","Dung hợp vỏ ngoài với màng vi khuẩn.","Xuyên trực tiếp qua vách tế bào."]},{"q":"Enzyme phiên mã ngược (Reverse transcriptase) đặc trưng cho nhóm nào?","o":["Retrovirus.","Adenovirus.","Bacteriophage T4.","Poxvirus."]},{"q":"HIV xâm nhập chủ yếu vào loại tế bào nào?","o":["Tế bào lympho T-CD4.","Tế bào lympho","Đại thực bào.","Hồng cầu."]},{"q":"Hệ gen virus tích hợp vào NST tế bào chủ và nhân lên cùng tế bào chủ gọi là:","o":["Chu trình tiềm tan.","Chu trình sinh tan.","Biến nạp.","Tải nạp."]},{"q":"Bộ gen virus khi đã tích hợp vào hệ gen vi khuẩn gọi là:","o":["Prophage.","Plasmi","Episome.","Transposon."]},{"q":"Gai glycoprotein (spike) trên vỏ ngoài có chức năng:","o":["Nhận diện và bám đặc hiệu vào thụ thể tế bào chủ.","Bảo vệ vật chất di truyền.","Xúc tác phiên mã ngượ","Tổng hợp ATP."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Virus không được coi là sinh vật sống độc lập vì:","o":["Thiếu hệ thống enzyme chuyển hóa và bộ máy dịch mã riêng.","Kích thước quá nhỏ.","Vật chất di truyền dễ đột biến.","Gây bệnh cho mọi loài."]},{"q":"Interferon do tế bào nhiễm virus tiết ra có tác dụng:","o":["Kích thích tế bào lân cận chống lại sự nhân lên của virus.","Tiêu diệt trực tiếp virus ngoại bào.","Kích thích sản xuất kháng thể.","Phân giải màng tế bào chủ."]},{"q":"Phân loại Baltimore chia virus thành 7 nhóm dựa trên:","o":["Bản chất vật chất di truyền và cơ chế tổng hợp mRN","Hình thái vỏ capsi","Đối tượng vật chủ.","Sự có mặt của vỏ ngoài."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Đột biến kháng nguyên (Antigenic drift) ở virus cúm xảy ra do:","o":["Đột biến điểm do enzyme sao chép RNA thiếu chức năng sửa sai.","Tái tổ hợp đoạn RNA giữa các chủng khác nhau.","Trao đổi đoạn DNA với NST người.","Tác động của thuốc kháng sinh."]},{"q":"Viroid khác virus ở điểm nào?","o":["Chỉ là RNA vòng trần, không có vỏ protein.","Kích thước lớn hơn.","Chứa cả DNA và RN","Chỉ ký sinh ở động vật."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Trôi dạt kháng nguyên (Antigenic shift) dẫn đến đại dịch cúm là do:","o":["Tái tổ hợp đoạn gen khi nhiều chủng cùng nhiễm một tế bào.","Lỗi nhân đôi RNA liên tụ","Thay đổi cấu trúc protein do nhiệt độ.","Nhận gen kháng thuốc từ vi khuẩn."],"w":"Nguồn gọi antigenic shift là “trôi dạt”, trong khi trôi dạt thường chỉ antigenic drift. Phương án Đ đang mô tả tái phân đoạn; giữ nguyên thuật ngữ nguồn. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Prion gây bệnh thoái hóa thần kinh vì chúng:","o":["Chỉ cấu tạo từ protein gấp khúc sai, không chứa axit nuclei","Là virus DNA siêu nhỏ.","Là vi khuẩn không vách.","Tự tổng hợp RNA trong nhân."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Enzyme RdRp bắt buộc phải có ở quá trình nhân lên của nhóm nào?","o":["Virus RN","Virus DNA chuỗi kép.","Phage DN","Retrovirus."],"w":"Hai câu cùng nhãn số 401 được giữ bằng hai mã riêng. Câu RdRp dùng “Virus RN” bị dở; phạm vi virus RNA nói chung còn cần phân biệt retrovirus. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Virus viêm gan B (HBV) khác các virus DNA khác ở điểm nào?","o":["Sử dụng phiên mã ngược từ RNA trung gian.","Dịch mã trực tiếp từ DN","Gắn DNA vào màng tế bào.","Không dùng bộ máy của tế bào chủ."],"w":"Hai câu cùng nhãn số 401 được giữ bằng hai mã riêng. Câu RdRp dùng “Virus RN” bị dở; phạm vi virus RNA nói chung còn cần phân biệt retrovirus. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Vật chất di truyền của SARS-CoV-2 là:","o":["RNA chuỗi đơn dương (+ssRNA).","RNA chuỗi kép.","DNA chuỗi đơn.","DNA chuỗi kép."]},{"q":"Virus thực vật thường xâm nhập qua con đường nào?","o":["Vết thương cơ học hoặc côn trùng truyền bệnh.","Bơm trực tiếp qua vách.","Thực bào.","Dung hợp màng."]},{"q":"Thuốc kháng HIV (ARV) thường ức chế enzyme nào?","o":["Reverse transcriptase, Protease và Integrase.","DNA polymerase.","RNA polymerase tế bào chủ.","Lysozyme."]},{"q":"Virus có bộ gen -ssRNA khi vào tế bào chủ bắt buộc phải:","o":["Mang sẵn enzyme RdRp bên trong hạt virus.","Dùng RNA polymerase của tế bào chủ.","Chuyển thành DNA ngay lập tứ","Đính trực tiếp vào ribosome."]},{"q":"Sự chuyển từ tiềm tan sang sinh tan ở phage Lambda thường do:","o":["Tế bào chủ bị tổn thương DNA (như tia UV) làm phân giải repressor.","Nguồn dinh dưỡng dồi dào.","Sự tổng hợp ligase.","Vi khuẩn vào pha suy vong."]},{"q":"Đồng thụ thể (coreceptor) giúp HIV dung hợp màng là:","o":["CCR5 hoặc CXCR4.","MHC lớp I.","Integrin.","TLR."]},{"q":"Trên virus cúm, protein Neuraminidase (NA) có vai trò:","o":["Cắt axit sialic để giải phóng virus mới nảy chồi.","Dung hợp màng.","Bảo vệ RN","Sao chép bộ gen."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Vector AAV trong liệu pháp gen ưu việt hơn Retrovirus vì:","o":["Ít tích hợp ngẫu nhiên, giảm nguy cơ ung thư.","Chứa được gen khổng lồ.","Không cần thụ thể.","Chỉ nhiễm tế bào đang phân chi"],"w":"Ưu điểm vector phụ thuộc ứng dụng, thiết kế và loại retroviral vector; câu nguồn không mô tả bối cảnh đánh giá. Không xem đây là khẳng định mọi vector AAV đều an toàn hơn. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hội chứng Down là dạng bệnh lý do đột biến số lượng nhiễm sắc thể nào sau đây gây ra?","o":["Thể ba nhiễm ở cặp nhiễm sắc thể số 21 (Trisomy 21).","Thể một nhiễm ở cặp nhiễm sắc thể số 21.","Thể ba nhiễm ở cặp nhiễm sắc thể số 18.","Đột biến mất đoạn trên nhiễm sắc thể số 21."]},{"q":"Bệnh nhân nam có dáng người cao lêu nghêu, tay chân dài, thiểu năng sinh dục (vô sinh) và có kiểu nhân 47, XXY mắc hội chứng gì?","o":["Hội chứng Klinefelter.","Hội chứng Turner.","Hội chứng siêu nam (Jacob - XYY).","Hội chứng Edwards."]},{"q":"Hội chứng Turner ở người (nữ giới thấp bé, không có kinh nguyệt, vô sinh) có bộ nhiễm sắc thể được ký hiệu là:","o":["45, X (hoặc 45, XO).","47, XXX.","47, XXY.","45, Y."]},{"q":"Hội chứng 'mèo kêu' (Cri-du-chat) đặc trưng bởi tiếng khóc như mèo, chậm phát triển, là do loại đột biến nhiễm sắc thể nào gây ra?","o":["Mất một phần nhánh ngắn của nhiễm sắc thể số 5 (5p-).","Thể ba nhiễm ở cặp nhiễm sắc thể số 5.","Đảo đoạn trên nhiễm sắc thể số 5.","Chuyển đoạn giữa nhiễm sắc thể số 5 và số 9."]},{"q":"Hội chứng Patau đặc trưng bởi các dị tật nghiêm trọng như sứt môi hở hàm ếch nặng, dị tật tim và não, do nguyên nhân di truyền nào?","o":["Thể ba nhiễm ở cặp nhiễm sắc thể số 13 (Trisomy 13).","Thể ba nhiễm ở cặp nhiễm sắc thể số 18.","Thể ba nhiễm ở cặp nhiễm sắc thể số 21.","Đột biến lặp đoạn trên nhiễm sắc thể số 13."]},{"q":"Nguyên nhân chủ yếu dẫn đến sự hình thành thể lệch bội gây hội chứng Down, Turner trong tự nhiên là do:","o":["Sự không phân ly của cặp nhiễm sắc thể trong quá trình giảm phân tạo giao tử.","Sự rối loạn phân chia tế bào chất trong nguyên phân.","Đột biến điểm xảy ra trên gen quy định thoi phân bào.","Sự trao đổi chéo không cân giữa hai nhiễm sắc thể tương đồng."]},{"q":"Đặc điểm nào sau đây KHÔNG phải là triệu chứng lâm sàng điển hình của người mắc hội chứng Down?","o":["Phát triển sinh dục sớm và chiều cao vượt trội so với tuổi.","Chậm phát triển trí tuệ và nhận thứ","Khoảng cách giữa hai mắt rộng, gốc mũi tẹt, có nếp gấp nôn.","Trương lực cơ yếu (nhược cơ) ở giai đoạn trẻ sơ sinh."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hội chứng Edwards (Trisomy 18) thường có tiên lượng như thế nào đối với thai nhi và trẻ sơ sinh?","o":["Rất xấu, đa số tử vong trong thời kỳ bào thai hoặc trong năm đầu tiên do dị tật đa cơ quan.","Tiên lượng tốt, có thể sống đến tuổi trưởng thành nếu được can thiệp y tế sớm.","Trẻ phát triển bình thường về mặt thể chất nhưng vô sinh khi lớn lên.","Thường dẫn đến ung thư máu ở giai đoạn trẻ em."]},{"q":"Ở người, sự không phân ly của cặp nhiễm sắc thể giới tính XY ở người bố trong giảm phân I sẽ tạo ra các loại tinh trùng đột biến nào?","o":["Tinh trùng mang cả XY và tinh trùng O (không có NST giới tính).","Tinh trùng XX và tinh trùng YY.","Tinh trùng X và tinh trùng Y bình thường.","Chỉ tạo ra tinh trùng mang nhiễm sắc thể O."]},{"q":"Phụ nữ mắc hội chứng Siêu nữ (Triple X) thường có sự phát triển thể chất gần như bình thường và có kiểu nhân là:","o":["47, XXX.","45, X.","47, XXY.","48, XXXX."]},{"q":"Nhiễm sắc thể Philadelphia (đột biến chuyển đoạn tương hỗ giữa NST số 9 và NST số 22) là dấu ấn sinh học đặc trưng của bệnh lý nào?","o":["Ung thư bạch cầu tủy mạn tính (CML).","Ung thư vú di truyền.","Hội chứng suy giảm miễn dịch bẩm sinh (SCID).","Bệnh thiếu máu hồng cầu hình liềm."]},{"q":"Nhóm bệnh do đột biến số lượng nhiễm sắc thể thường ảnh hưởng đến nhóm NST nào gây hậu quả nghiêm trọng nhất (thường gây sảy thai sớm)?","o":["Nhiễm sắc thể thường (Autosome) có kích thước lớn (như NST 1, 2, 3).","Nhiễm sắc thể giới tính X.","Nhiễm sắc thể giới tính Y.","Nhiễm sắc thể thường có kích thước nhỏ (như NST 21)."]},{"q":"Hội chứng Jacob (Siêu nam) ở nam giới có đặc điểm di truyền là:","o":["Kiểu nhân 47, XYY.","Kiểu nhân 47, XXY.","Mất một đoạn nhỏ trên NST Y.","Thể một nhiễm 45, Y."]},{"q":"Đột biến mất đoạn nhỏ (microdeletion) trên nhiễm sắc thể gây ra các hội chứng phức tạp thường được phát hiện chính xác nhất bằng kỹ thuật nào?","o":["Lai tại chỗ huỳnh quang (FISH).","Nhuộm băng G (G-banding) soi kính hiển vi quang học tiêu chuẩn.","Định type nhóm máu ABO và hệ Rh.","Nuôi cấy tế bào và đếm số lượng nhiễm sắc thể đơn thuần."],"w":"FISH là lựa chọn phù hợp nhất trong bốn lựa chọn đã cho khi đã biết vùng đích. Cụm “chính xác nhất” không phải so sánh với mọi kỹ thuật hiện có."},{"q":"Thể khảm (Mosaicism) ở hội chứng Down (ví dụ bệnh nhân có hai dòng tế bào: 46, XX / 47, XX,+21) được hình thành do cơ chế nào?","o":["Sự không phân ly NST 21 xảy ra trong quá trình nguyên phân ở các lần phân cắt phôi đầu tiên.","Sự không phân ly NST 21 trong quá trình giảm phân tạo trứng của người mẹ.","Sự không phân ly NST 21 trong quá trình giảm phân tạo tinh trùng của người bố.","Sự thụ tinh giữa một tinh trùng và một trứng đều mang đột biến Trisomy 21."],"w":"Thể khảm còn có thể hình thành do cơ chế trisomy rescue. Khóa nguồn mô tả một cơ chế, không phải cơ chế duy nhất."},{"q":"Hội chứng DiGeorge (bất thường tim bẩm sinh, suy giảm miễn dịch T-cell, hở hàm ếch) là do đột biến mất một đoạn nhỏ tại vị trí nào?","o":["Băng 22q11.2 (trên nhánh dài của NST số 22).","Băng 15q11-q13 (trên nhánh dài của NST số 15).","Nhánh ngắn của NST số 4 (4p-).","Nhánh ngắn của NST số 5 (5p-)."]},{"q":"Cơ chế di truyền nào giải thích sự xuất hiện của hội chứng Down có tính chất gia đình (Familial Down syndrome) truyền qua nhiều thế hệ?","o":["Do người bố hoặc mẹ là người mang (carrier) chuyển đoạn Robertson giữa NST 21 và một NST tâm đầu khác (thường là NST 14).","Do đột biến gen lặn trên NST 21 di truyền đồng hợp tử từ cả bố và mẹ.","Do sự không phân ly NST 21 liên tục lặp lại ở những phụ nữ sinh con trên 35 tuổi.","Do hiện tượng đa bội hóa toàn bộ bộ nhiễm sắc thể của phôi thai."]},{"q":"Bệnh U nguyên bào võng mạc (Retinoblastoma) liên quan đến sự mất dị hợp tử (LOH) của gen ức chế khối u RB1. Vị trí đột biến mất đoạn trên NST thường gặp ở bệnh này là:","o":["13q14 (thuộc nhánh dài NST số 13).","11p13 (thuộc nhánh ngắn NST số 11).","21q22 (thuộc nhánh dài NST số 21).","Xp21 (thuộc nhánh ngắn NST giới tính X)."]},{"q":"Sự kiện di truyền nào liên quan đến hiện tượng 'Nhị nhiễm sắc thể đơn dòng' (Uniparental Disomy) gây ra hội chứng Prader-Willi?","o":["Bệnh nhân nhận cả hai bản sao của nhiễm sắc thể 15 từ người mẹ và không có bản sao nào từ người bố.","Bệnh nhân nhận cả hai bản sao của nhiễm sắc thể 15 từ người bố.","Đột biến mất đoạn 15q11-q13 xảy ra trên nhiễm sắc thể có nguồn gốc từ người mẹ.","Chuyển đoạn tương hỗ không cân bằng giữa NST 15 và NST 21."]},{"q":"Đặc điểm sinh học phân tử của Chuyển đoạn Robertson (Robertsonian translocation) ở người là gì?","o":["Xảy ra sự đứt gãy và dung hợp tại tâm động của hai nhiễm sắc thể tâm đầu, làm giảm tổng số nhiễm sắc thể xuống còn 45 ở người mang đột biến.","Xảy ra trao đổi đoạn tương hỗ giữa hai nhiễm sắc thể tâm giữa, số lượng nhiễm sắc thể vẫn duy trì ở mức 46.","Sự đứt gãy và đảo ngược 180 độ của một đoạn nhiễm sắc thể tâm lệch, không làm thay đổi hình thái NST.","Xảy ra ở bất kỳ cặp nhiễm sắc thể nào trong tế bào tạo ra một nhiễm sắc thể khổng lồ mang hai tâm động."]},{"q":"Trong bệnh bạch cầu tủy mạn tính (CML), gen dung hợp BCR-ABL1 (do chuyển đoạn t(9;22)) mã hóa cho một protein đột biến có hoạt tính bất thường nào?","o":["Hoạt tính enzyme Tyrosine kinase liên tục được kích hoạt kích thích tế bào tăng sinh không kiểm soát.","Hoạt tính yếu tố phiên mã (Transcription factor) kìm hãm sự biểu hiện của gen ức chế khối u.","Hoạt tính Protease phân giải cấu trúc màng tế bào bạch cầu.","Hoạt tính DNA Polymerase sao chép DNA với tốc độ cực nhanh và nhiều sai sót."]},{"q":"Đột biến đứt gãy làm mất đoạn nhánh ngắn của nhiễm sắc thể số 4 (4p-) gây ra hội chứng đa dị tật nào sau đây?","o":["Hội chứng Wolf-Hirschhorn.","Hội chứng Cri-du-chat.","Hội chứng Angelman.","Hội chứng WAGR."]},{"q":"Trong quá trình giảm phân của người mang chuyển đoạn Robertson t(14;21) cân bằng, kiểu phân ly NST nào sẽ tạo ra giao tử sinh ra con cái khỏe mạnh bình thường hoặc là người mang chuyển đoạn (carrier)?","o":["Phân ly luân phiên (Alternate segregation).","Phân ly kề 1 (Adjacent-1 segregation).","Phân ly kề 2 (Adjacent-2 segregation).","Phân ly 3:0 (3-to-0 segregation)."]},{"q":"Hiện tượng 'Bất hoạt nhiễm sắc thể X' (X-inactivation) tạo thể Barr giúp giải thích tại sao nhóm bệnh lệch bội nào sau đây thường có biểu hiện lâm sàng nhẹ hơn nhiều so với lệch bội NST thường?","o":["Hội chứng Triple X (47, XXX) và hội chứng Klinefelter (47, XXY).","Hội chứng Down (Trisomy 21) và hội chứng Edwards (Trisomy 18).","Hội chứng Turner (45, X) và hội chứng Cri-du-chat (5p-).","Bệnh mù màu đỏ - lục và bệnh máu khó đông bẩm sinh."]},{"q":"Bệnh bạch cầu nguyên bào lympho cấp tính (ALL) ở trẻ em tiên lượng tốt thường mang dấu ấn đột biến chuyển đoạn nào?","o":["Chuyển đoạn t(12;21)(p13;q22) tạo gen dung hợp ETV6-RUNX1.","Chuyển đoạn t(8;14) tạo gen dung hợp MYC-IGH.","Chuyển đoạn t(9;22) tạo gen dung hợp BCR-ABL1.","Chuyển đoạn t(15;17) tạo gen dung hợp PML-RAR"]},{"q":"Bệnh U lympho Burkitt do đột biến chuyển đoạn t(8;14)(q24;q32) gây ra cơ chế phát sinh ung thư bằng cách nào?","o":["Làm gen tiền ung thư MYC chuyển đến và nằm dưới sự kiểm soát của vùng tăng cường (enhancer) gen chuỗi nặng kháng thể (IGH), gây biểu hiện MYC vượt mứ","Tạo ra một gen dung hợp mới có chức năng tương tự yếu tố sinh trưởng (Growth Factor) kích thích tế bào lympho phân chi","Làm đứt gãy và bất hoạt gen ức chế khối u p53 nằm trên nhiễm sắc thể số 14.","Làm thay đổi vị trí của tâm động khiến quá trình phân chia nhiễm sắc thể trong nguyên phân bị rối loạn tạo ra tế bào đa bội."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cơ chế phát sinh hội chứng Angelman (liên quan đến hiện tượng Genomic imprinting - Dấu ấn di truyền) xảy ra trong trường hợp nào?","o":["Mất đoạn nhỏ tại 15q11-q13 trên nhiễm sắc thể có nguồn gốc từ mẹ, hoặc bệnh nhân nhận cả 2 NST 15 từ bố (UPD).","Mất đoạn nhỏ tại 15q11-q13 trên nhiễm sắc thể có nguồn gốc từ bố, hoặc bệnh nhân nhận cả 2 NST 15 từ mẹ (UPD).","Đột biến lặp đoạn 15q11-q13 trên nhiễm sắc thể mang dấu ấn của người mẹ.","Đột biến mất đoạn 15q11-q13 xảy ra đồng thời trên cả hai nhiễm sắc thể tương đồng 15 của phôi thai."]},{"q":"Trong các dạng đột biến cấu trúc nhiễm sắc thể, loại đột biến nào mang nguy cơ sinh ra giao tử chứa nhiễm sắc thể có cầu nối dicentric (hai tâm) và mảnh acentric (không tâm) khi xảy ra trao đổi chéo ở kỳ đầu giảm phân I?","o":["Đảo đoạn ngoài tâm (Paracentric inversion).","Đảo đoạn quanh tâm (Pericentric inversion).","Chuyển đoạn tương hỗ (Reciprocal translocation).","Lặp đoạn song song (Tandem duplication)."]},{"q":"Hội chứng WAGR bao gồm ung thư Wilms, không có mống mắt, dị tật sinh dục tiết niệu và chậm phát triển. Tại sao bệnh này được xếp vào nhóm 'hội chứng gen lân cận' (Contiguous gene syndrome)?","o":["Do đột biến mất một đoạn NST (11p13) làm mất đi đồng thời nhiều gen độc lập nhưng nằm kề nhau (như WT1 và PAX6), mỗi gen quy định một triệu chứng riêng.","Do đột biến điểm trên một gen duy nhất nhưng gen này có tính đa hiệu (pleiotropy), chi phối sự phát triển của nhiều cơ quan khác nhau.","Do hiện tượng đột biến chuyển đoạn làm thay đổi vị trí của vùng nhân con (NOR) ảnh hưởng đến quá trình tổng hợp protein toàn cơ thể.","Do vi rút chèn đoạn DNA của chúng vào vùng điều hòa chung của một cụm gen tương đồng trên NST số 11."]},{"q":"Đột biến nhiễm sắc thể đều (Isochromosome) hình thành do cơ chế nào và là một biến thể cấu trúc thường gặp trong hội chứng bệnh lý nào sau đây?","o":["Sự phân chia sai mặt phẳng của tâm động (cắt ngang thay vì cắt dọc) trong phân bào; tạo thành isochromosome Xq (i(Xq)) gặp ở một tỷ lệ bệnh nhân mắc hội chứng Turner.","Sự đứt gãy ở hai đầu mút của một NST và nối lại tạo thành NST hình nhẫn (Ring chromosome); liên quan đến biến thể của hội chứng Down.","Sự trao đổi chéo không cân bằng giữa hai NST tương đồng trong giảm phân; liên quan đến cơ chế gây hội chứng DiGeorge.","Sự dung hợp giữa một NST tâm đầu và một NST tâm giữa tạo thành NST khổng lồ đa tâm; gặp ở bệnh bạch cầu tủy cấp."]},{"q":"Khái niệm nào sau đây mô tả đúng nhất về đột biến gen?","o":["Là những biến đổi nhỏ trong cấu trúc của gen, liên quan đến một hoặc một số cặp nucleotide.","Là sự thay đổi số lượng hoặc cấu trúc của toàn bộ nhiễm sắc thể trong tế bào.","Là sự tổ hợp lại các vật chất di truyền có sẵn của bố mẹ trong quá trình thụ tinh.","Là những biến đổi kiểu hình phát sinh trong quá trình phát triển cá thể do môi trường."]},{"q":"Đột biến điểm là dạng đột biến gen liên quan đến:","o":["Sự biến đổi của một cặp nucleotide.","Sự biến đổi của nhiều cặp nucleotide.","Sự biến đổi của một đoạn nhiễm sắc thể.","Sự thay đổi cấu trúc của toàn bộ phân tử DN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Thể đột biến được định nghĩa là:","o":["Những cá thể mang đột biến đã biểu hiện ra kiểu hình.","Những cá thể mang alen đột biến lặn ở trạng thái dị hợp tử.","Những tế bào mang gen bị thay đổi cấu trúc nhưng chưa dịch mã.","Toàn bộ các cá thể trong quần thể bị tác động bởi tác nhân gây đột biến."]},{"q":"Dạng đột biến nào sau đây gây ra hiện tượng 'dịch khung đọc' mã di truyền từ vị trí xảy ra đột biến đến cuối gen?","o":["Mất hoặc thêm một cặp nucleotide.","Thay thế một cặp nucleotide bằng cặp cùng loại.","Thay thế một cặp nucleotide bằng cặp khác loại.","Đảo vị trí giữa hai cặp nucleotide lân cận."]},{"q":"Đột biến vô nghĩa (nonsense mutation) là dạng đột biến làm cho:","o":["Bộ ba mã hóa axit amin biến thành bộ ba kết thú","Bộ ba mã hóa axit amin này thành bộ ba mã hóa axit amin khá","Bộ ba mở đầu biến thành bộ ba mã hóa cho axit amin bình thường.","Bộ ba kết thúc biến thành bộ ba mã hóa cho axit amin."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Tác nhân hóa học 5-Bromouracil (5-BU) thường gây ra dạng đột biến điểm nào sau đây?","o":["Thay thế cặp A-T bằng cặp G-X.","Thay thế cặp G-X bằng cặp A-T.","Thêm một cặp A-T.","Mất một cặp G-X."],"w":"5-BU có thể gây thay thế chuyển dạng theo cả hai hướng tùy quá trình bắt cặp. Cả A-T→G-X và G-X→A-T đều có thể xảy ra; câu dùng “thường” nhưng khóa chọn một hướng."},{"q":"Loại đột biến gen nào ít gây hậu quả nghiêm trọng nhất đối với cấu trúc của chuỗi polypeptide?","o":["Thay thế một cặp nucleotide xảy ra ở đoạn intron của gen sinh vật nhân thự","Mất một cặp nucleotide ở đầu vùng mã hóa của gen.","Thêm một cặp nucleotide ở giữa vùng mã hóa của gen.","Thay thế một cặp nucleotide tạo ra mã kết thúc sớm."],"w":"Đột biến intron không phải luôn vô hại, đặc biệt khi ảnh hưởng cắt nối/điều hòa. Câu dùng so sánh ít gây hậu quả nhất nhưng chưa nêu vị trí cụ thể trong intron. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Đột biến gen lặn chỉ biểu hiện ra kiểu hình khi:","o":["Tồn tại ở trạng thái đồng hợp tử lặn.","Nằm trong môi trường có tác nhân đột biến.","Tồn tại ở trạng thái dị hợp tử cùng alen trội.","Cá thể bước vào giai đoạn trưởng thành sinh dụ"],"w":"Khẳng định đột biến lặn chỉ biểu hiện khi đồng hợp cần phạm vi locus trên NST thường và mô hình trội hoàn toàn; locus trên X ở nam có thể biểu hiện ở trạng thái bán hợp. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Xét về mặt ý nghĩa tiến hóa, đột biến gen đóng vai trò là:","o":["Nguồn nguyên liệu sơ cấp chủ yếu cho quá trình tiến hó","Nguồn nguyên liệu thứ cấp của quá trình tiến hó","Yếu tố quy định hướng tiến hóa của sinh giới.","Cơ chế duy nhất tạo ra sự đa dạng sinh họ"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hiện tượng đột biến thay thế cặp nucleotit này bằng cặp nucleotit khác nhưng không làm thay đổi trình tự axit amin trong chuỗi polypeptide được gọi là:","o":["Đột biến đồng nghĩ","Đột biến sai nghĩ","Đột biến vô nghĩ","Đột biến dịch khung."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1, T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Bệnh nào sau đây ở người có nguyên nhân trực tiếp do đột biến gen gây ra?","o":["Bệnh thiếu máu hồng cầu hình liềm.","Hội chứng Down.","Hội chứng Turner.","Bệnh ung thư máu ác tính (do chuyển đoạn NST 9 và 22)."]},{"q":"Tần số đột biến của một gen cụ thể trong tự nhiên thường dao động trong khoảng nào?","o":["Từ 10^-6 đến 10^-4.","Từ 10^-2 đến 10^-1.","Từ 10^-8 đến 10^-7.","Khoảng 1% đến 5%."],"w":"Tần số đột biến phụ thuộc loài, locus, cách tính trên thế hệ hay lần phân bào; nguồn chỉ cho một khoảng mà chưa quy định đơn vị."},{"q":"Tính chất thoái hóa của mã di truyền có ý nghĩa sinh học gì đối với đột biến gen?","o":["Hạn chế sự xuất hiện kiểu hình đột biến có hại khi xảy ra thay thế nucleotide ở vị trí thứ ba của bộ b","Giúp gen có khả năng sửa chữa mọi hư hỏng trên cấu trúc phân tử DN","Tạo điều kiện cho đột biến dịch khung không làm thay đổi chức năng protein.","Làm cho tất cả các đột biến điểm đều trở thành đột biến có lợi."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ, T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Hậu quả của đa số đột biến gen trong tự nhiên đối với thể đột biến là:","o":["Có hại hoặc trung tính.","Hoàn toàn có lợi cho sinh vật.","Chỉ gây chết ở giai đoạn phôi thai.","Không bao giờ biểu hiện ra kiểu hình."],"w":"Tỷ lệ có hại/trung tính phụ thuộc vùng gen và bối cảnh chọn lọc; giữ nguyên cách khái quát trong tài liệu."},{"q":"Guanine dạng hiếm (G*) thường bắt cặp sai với loại nucleotide nào trong quá trình nhân đôi DNA?","o":["Thymine (T).","Adenine (A).","Cytosine (X).","Uracil (U)."]},{"q":"Một gen có chiều dài không đổi nhưng số liên kết hydro giảm đi 1 sau khi bị đột biến. Đột biến này thuộc dạng nào?","o":["Thay thế một cặp G-X bằng một cặp A-T.","Thay thế một cặp A-T bằng một cặp G-X.","Mất một cặp A-T.","Đảo vị trí cặp A-T và G-X."]},{"q":"Tia tử ngoại (UV) có thể gây ra đột biến gen thông qua cơ chế chủ yếu nào?","o":["Làm cho hai base Thymine (T) trên cùng một mạch liên kết cộng hóa trị với nhau tạo thành dimer.","Oxy hóa trực tiếp base Guanine thành 8-oxoguanine.","Chèn vào giữa các cặp base làm giãn khoảng cách giữa hai mạch DN","Gây đứt gãy đồng thời cả hai mạch liên kết phosphodiester của phân tử DN"],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cơ chế gây đột biến của 5-BU (A-T -> G-X) cần phải trải qua tối thiểu bao nhiêu lần nhân đôi DNA kể từ khi 5-BU xâm nhập?","o":["3 lần.","1 lần.","2 lần.","4 lần."]},{"q":"Một gen bình thường có 150 chu kỳ xoắn. Do đột biến, gen mất đi 6 nucleotide. Chiều dài của gen sau đột biến là:","o":["5089,8 Å.","5069,4 Å.","5100 Å.","4998 Å."],"w":"Phép tính chiều dài ngầm dùng 10 cặp base/vòng, 3,4 Å/cặp và hiểu mất 6 nucleotide toàn gen là mất 3 cặp. Câu nguồn chưa nêu các quy ước đó."},{"q":"Gen A dài 408 nm và có A = 20% tổng số nucleotit. Gen A bị đột biến thay thế một cặp A-T bằng một cặp G-X thành gen Số liên kết hydro của gen a là:","o":["3121.","3120.","3119.","2881."],"w":"K ghi “22”, ngoài thang 1–4 được mô tả trong tài liệu; giữ nguyên và không dùng trường này để phân bổ đề. Phần hỏi cũng bị dở sau “thành gen”."},{"q":"Tại sao đột biến gen xảy ra ở tế bào sinh dục mầm lại có vai trò quan trọng hơn trong tiến hóa so với đột biến ở tế bào xoma?","o":["Vì chúng có khả năng di truyền cho thế hệ sau thông qua con đường sinh sản hữu tính.","Vì tế bào sinh dục mầm có tốc độ phân chia nhanh hơn tế bào xom","Vì đột biến ở tế bào sinh dục luôn tạo ra các kiểu hình có lợi.","Vì đột biến xoma sẽ lập tức làm chết cơ thể sinh vật."]},{"q":"Nếu một đột biến điểm làm thay đổi vị trí của gốc axit amin trong vùng xúc tác (active site) của một enzyme, hậu quả trực tiếp nhất là gì?","o":["Enzyme có thể mất hoàn toàn hoặc giảm mạnh hoạt tính xúc tác đặc hiệu.","Enzyme sẽ hoạt động với tốc độ nhanh gấp đôi bình thường.","Phân tử mRNA mã hóa cho enzyme đó sẽ bị phân hủy ngay lập tứ","Tế bào sẽ ngay lập tức kích hoạt cơ chế tự chết (apoptosis)."]},{"q":"Một phân tử mRNA có chiều dài ngắn hơn bình thường rất nhiều mặc dù gen mã hóa cho nó không bị mất nucleotide nào. Nguyên nhân có thể do:","o":["Đột biến xảy ra ở trình tự nhận biết cắt spliceosome tại ranh giới intron/exon, làm lỗi quá trình cắt nối RN","Đột biến vô nghĩa tạo bộ ba kết thúc sớm trong gen.","Đột biến làm mất vùng promoter của gen.","Sự thay thế một axit amin bằng một axit amin khác có kích thước nhỏ hơn."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (Đ). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Acridine là một tác nhân hóa học có khả năng chèn vào giữa các cặp base của DN Nếu acridine chèn vào mạch khuôn đang tổng hợp, nó sẽ gây ra hậu quả gì?","o":["Gây đột biến thêm một cặp nucleotide.","Gây đột biến mất một cặp nucleotide.","Gây đột biến thay thế A-T thành G-X.","Gây đứt gãy mạch kép DN"],"w":"Ảnh hưởng của tác nhân xen kẽ phụ thuộc mô hình trượt mạch khuôn/mạch mới. Câu nguồn mô tả “mạch khuôn đang tổng hợp” chưa rõ; không tự diễn giải lại để quyết định khóa. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (phần hỏi, T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Cho biết gen quy định nhóm máu ABO có 3 alen là IA, IB, IO. Một người nhóm máu O kết hôn với người nhóm máu A Con của họ sinh ra có nhóm máu A Đây là kết quả của hiện tượng gì?","o":["Đột biến gen trong quá trình phát sinh giao tử của người mang nhóm máu O hoặc A","Sự phân ly độc lập bình thường của các alen.","Hiện tượng hoán vị gen ở kỳ đầu giảm phân I.","Giao phối không ngẫu nhiên trong quần thể người."],"w":"Bố/mẹ nhóm máu O và A hoàn toàn có thể sinh con nhóm A qua phân ly alen bình thường; không cần đột biến. Khóa Đ gán cho đột biến cần đối chiếu; không thay."},{"q":"Đột biến ức chế (Suppressor mutation) là một cơ chế di truyền thú vị, trong đó:","o":["Một đột biến thứ hai xảy ra ở một vị trí khác làm khôi phục lại một phần hoặc toàn bộ kiểu hình bình thường đã bị phá vỡ bởi đột biến thứ nhất.","Một đột biến làm ức chế hoàn toàn quá trình phiên mã của tất cả các gen nằm trên cùng một nhiễm sắc thể.","Sự xâm nhập của yếu tố virus làm ngừng hoạt động của hệ thống sửa chữa DN","Quá trình biểu hiện gen bị kìm hãm bởi việc gắn thêm các nhóm methyl vào vùng promoter."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Bệnh hồng cầu hình liềm là do đột biến thay thế cặp A-T bằng T-A ở bộ ba thứ 6 của gen beta-globin. Ở cấp độ phân tử, sự thay thế axit amin Glutamic acid (ưa nước) bằng Valine (kỵ nước) này đã gây ra hậu quả trực tiếp gì?","o":["Làm biến đổi cấu trúc không gian bậc 4 của Hemoglobin, các phân tử HbS dính vào nhau tạo thành dạng sợi polymer dài trong điều kiện oxy thấp.","Làm phân tử Hemoglobin mất khả năng liên kết hoàn toàn với ion Sắt (Fe2+), dẫn đến thiếu máu nhược sắ","Làm phân tử RNA thông tin bị phân hủy ngay trong nhân tế bào, không dịch mã được chuỗi globin.","Làm tăng ái lực của Hemoglobin với khí CO2 đến mức không thể nhả CO2 tại phổi."],"w":"Phát biểu HbS thay đổi cấu trúc bậc 4 cần phân biệt với sự polymer hóa giữa nhiều phân tử HbS; giữ nguyên câu chữ nguồn. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Xét một operon lac ở E. coli, một đột biến điểm xảy ra ở vùng vận hành (Operator - O) làm thay đổi trình tự nucleotide tại đây. Hậu quả nào sau đây là dễ xảy ra nhất?","o":["Protein ức chế không thể liên kết vào vùng O, dẫn đến các gen cấu trúc Z, Y, A được phiên mã liên tục ngay cả khi không có lactose.","RNA polymerase không thể liên kết vào vùng khởi động (Promoter), operon đóng vĩnh viễn.","Sản phẩm của gen Z (enzym beta-galactosidase) bị mất hoạt tính xúc tác phân giải lactose.","Gen điều hòa (lacI) tăng cường hoạt động sản sinh ra một lượng lớn protein ức chế."]},{"q":"Nếu giả thuyết 'Wobble' (sự rung lắc ở vị trí base thứ ba của codon) là đúng, thì đột biến thay thế nucleotide ở vị trí nào của bộ ba đối mã (anticodon) trên tRNA sẽ ít gây ảnh hưởng nhất?","o":["Vị trí thứ nhất của anticodon (tương ứng với vị trí thứ ba của codon trên mRNA).","Vị trí thứ ba của anticodon (tương ứng với vị trí thứ nhất của codon trên mRNA).","Vị trí thứ hai của anticodon.","Vùng vòng D (D-loop) của phân tử tRN"],"w":"Hiệu ứng thay base ở vị trí wobble không đảm bảo đột biến tRNA ít ảnh hưởng nhất trong mọi trường hợp; nguồn đang dùng mô hình giản lược. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T3). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Gen B có tổng số nucleotide là 3000, tỷ lệ A/G = 2/3. Một đột biến xảy ra làm gen B thành gen Gen b có tổng số 3901 liên kết hydro. Biết đột biến chỉ liên quan đến tối đa 3 cặp nucleotide. Đột biến này thuộc dạng:","o":["Thay thế 1 cặp A-T bằng 1 cặp G-X.","Mất 1 cặp G-X.","Thêm 1 cặp A-T và thay thế 1 cặp G-X bằng A-T.","Đảo vị trí 2 cặp A-T và G-X cho nhau."],"w":"Từ 3000 nucleotide, A/G=2/3 suy ra 3900 liên kết H ban đầu. Cả phương án Đ (+1 do A-T→G-X) và T2 (+2 do thêm A-T rồi −1 do G-X→A-T) đều cho 3901 trong giới hạn tối đa 3 cặp; câu có thể không duy nhất."},{"q":"Hiện tượng di truyền liên kết với giới tính được Thomas Hunt Morgan phát hiện đầu tiên trên đối tượng nào?","o":["Ruồi giấm (Drosophila melanogaster).","Đậu hà lan (Pisum sativum).","Cây hoa phấn (Mirabilis jalapa).","Chuột nhắt trắng (Mus musculus)."]},{"q":"Đặc điểm nổi bật của sự di truyền các tính trạng do gen lặn nằm trên nhiễm sắc thể X (không có alen tương ứng trên Y) là gì?","o":["Di truyền chéo (từ ông ngoại qua mẹ truyền cho cháu trai).","Di truyền thẳng (từ bố truyền cho 100% con trai).","Di truyền theo dòng mẹ (mẹ bị bệnh thì 100% con bị bệnh).","Tỷ lệ mắc bệnh ở hai giới đực và cái là luôn bằng nhau."]},{"q":"Ở người, bệnh nào sau đây do gen lặn nằm trên nhiễm sắc thể giới tính X quy định?","o":["Bệnh mù màu đỏ - lục và bệnh máu khó đông.","Bệnh bạch tạng và bệnh hồng cầu hình liềm.","Bệnh dính ngón tay số 2, 3 và tật có túm lông ở vành tai.","Hội chứng Down và hội chứng Turner."]},{"q":"Gen nằm trên vùng không tương đồng của nhiễm sắc thể Y di truyền theo quy luật nào?","o":["Di truyền thẳng (truyền 100% cho giới dị giao tử XY).","Di truyền chéo (từ bố truyền cho con gái).","Phân ly độc lập với giới tính.","Chỉ di truyền biểu hiện ở giai đoạn phôi thai."]},{"q":"Ở động vật có vú, tại sao giới đực thường có tỷ lệ mắc các bệnh di truyền lặn liên kết X cao hơn giới cái?","o":["Vì giới đực mang bộ NST XY, chỉ cần 1 alen lặn trên X là biểu hiện thành bệnh (trạng thái bán đồng hợp).","Vì nhiễm sắc thể Y ở giới đực mang nhiều gen gây bệnh hơn nhiễm sắc thể X.","Vì giới cái (XX) có cơ chế vô hiệu hóa nhiễm sắc thể X làm triệt tiêu gen mang bệnh.","Vì hormone sinh dục nam testosterone kích thích gen lặn hoạt động mạnh hơn."]},{"q":"Ở các loài chim và bướm, cặp nhiễm sắc thể giới tính của con đực và con cái lần lượt là:","o":["Đực ZZ, cái ZW.","Đực ZW, cái ZZ.","Đực XY, cái XX.","Đ
