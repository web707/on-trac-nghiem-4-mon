ởng thành.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Khái niệm Polysome (Polyribosome) dùng để chỉ cấu trúc nào?","o":["Nhóm nhiều ribosome cùng trượt trên một phân tử mARN để tăng hiệu suất tổng hợp protein","Chuỗi các nucleotide trên mARN","Phức hợp enzyme tháo xoắn ADN","Nhóm các tARN gắn chung một axit amin"],"e":"Polysome giúp tế bào sản xuất nhiều chuỗi polypeptide giống hệt nhau trong thời gian ngắn.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"So với phân tử ADN xoắn đôi, phân tử mARN có những đặc điểm cấu trúc khác biệt nổi bật nào?","o":["Là mạch đơn, chứa đường Ribose và bazo Uracil thay cho Deoxyribose và Thymine","Là mạch đôi, chứa đường Ribose và Thymine","Là mạch vòng, chứa đường Glucose","Không có chứa các bazo nitơ"],"e":"mARN là chuỗi đơn ribonucleotide cấu tạo từ đường Ribose và các bazo A, U, G, C.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Một đoạn gene ở sinh vật nhân sơ có mạch khuôn mang trình tự 3'- TAC GCG CTA TGA ATt -5'. Trình tự các ribonucleotide trên mARN tương ứng sinh ra là gì?","o":["5'- AUG CGC GAU ACU UAA -3'","5'- ATG CGC GAT ACT TAA -3'","3'- AUG CGC GAU ACU UAA -5'","5'- UAC GCG CUA UGA AUU -3'"],"e":"Theo nguyên tắc bổ sung: T->A, A->U, C->G, G->C và mARN xếp theo chiều 5' -> 3'.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Ba loại enzyme RNA polymerase khác nhau ở tế bào nhân thực (RNA Pol I, II, III) đảm nhận vai trò tổng hợp các loại ARN lần lượt là gì?","o":["RNA Pol I tổng hợp rARN; RNA Pol II tổng hợp mARN; RNA Pol III tổng hợp tARN và 5S rARN","RNA Pol I tổng hợp mARN; RNA Pol II tổng hợp tARN; RNA Pol III tổng hợp rARN","RNA Pol I tổng hợp tARN; RNA Pol II tổng hợp rARN; RNA Pol III tổng hợp mARN","Cả 3 enzyme đều tổng hợp mARN như nhau"],"e":"Ở nhân thực: Pol I chuyên trách rARN (trừ 5S); Pol II chuyên mARN & snARN; Pol III chuyên tARN & 5S rARN.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Hai quá trình biến đổi quan trọng gắn vào hai đầu của tiền mARN (pre-mARN) ngay sau phiên mã ở tế bào nhân thực là gì?","o":["Gắn mũ 7-methylguanosine (5'-cap) ở đầu 5' và đuôi poly-A ở đầu 3'","Gắn đuôi poly-A ở đầu 5' và mũ 7-methylguanosine ở đầu 3'","Cắt bỏ đầu 5' và gắn exon vào đầu 3'","Tháo bỏ chuỗi đuôi poly-A"],"e":"Đầu 5' được gắn mũ 5'-cap bảo vệ và giúp ribosome nhận diện; đầu 3' được gắn đuôi Poly-A tăng độ bền cho mARN.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Hiện tượng Cắt dán thay thế (Alternative splicing) ở tế bào sinh vật nhân thực mang ý nghĩa sinh học quan trọng nào?","o":["Cho phép từ một gene duy nhất có thể tạo ra nhiều loại mARN trưởng thành và nhiều isoform protein khác nhau","Làm tăng tần số đột biến gene","Loại bỏ hoàn toàn các protein hỏng","Giúp tế bào nhân đôi ADN nhanh hơn"],"e":"Alternative splicing tổ hợp các exon theo nhiều cách khác nhau, giúp đa dạng hóa hệ proteome của tế bào nhân thực.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Phức hợp Spliceosome đảm nhận vai trò nào trong quá trình xử lý ARN ở nhân tế bào nhân thực?","o":["Nhận biết và cắt chính xác các đoạn intron ra khỏi pre-mARN đồng thời nối các đoạn exon lại","Gắn đuôi Poly-A","Tháo xoắn chuỗi kép ADN","Kéo dài chuỗi polypeptide"],"e":"Spliceosome (gồm snRNA và snRNP) là máy cắt dán sinh học thực hiện loại bỏ intron.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Yếu tố Rho (Rho factor) tham gia vào giai đoạn kết thúc phiên mã ở vi khuẩn nhân sơ theo cơ chế nào?","o":["Bám vào chuỗi mARN mới, di chuyển theo hướng 5'->3' để bắt kịp RNA polymerase và dùng hoạt tính helicase tách mARN khỏi ADN khuôn","Phân hủy trực tiếp enzyme RNA polymerase","Cắt đuôi Poly-A","Tạo ra cấu trúc kẹp tóc (hairpin loop) trên ADN"],"e":"Kết thúc phiên mã phụ thuộc Rho (Rho-dependent termination) sử dụng protein ATP-dependent helicase Rho đuổi theo RNA pol để giải phóng mARN.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Cấu trúc kẹp tóc (hairpin loop) giàu G-C đi kèm chuỗi poly-U ở đầu 3' mARN là đặc trưng của cơ chế kết thúc phiên mã nào ở sinh vật nhân sơ?","o":["Kết thúc phiên mã độc lập với yếu tố Rho (Rho-independent / Intrinsic termination)","Kết thúc phiên mã nhờ yếu tố Rho","Gắn mũ 5'-cap","Cắt dán intron"],"e":"Cấu trúc kẹp tóc G-C làm dừng RNA pol, liền sau đó là chuỗi A-U yếu ớt dễ dàng bị đứt để giải phóng mARN mà không cần Rho.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Giả thuyết Wobble (Bắt cặp linh hoạt Wobble hypothesis) của Francis Crick giải thích vì sao cùng 1 loại tARN có thể nhận biết được nhiều codon khác nhau nhờ đặc điểm gì?","o":["Sự bắt cặp không theo quy luật bổ sung nghiêm ngặt ở vị trí bazo thứ 3 (đầu 3') của codon mARN với vị trí bazo thứ 1 (đầu 5') của anticodon tARN","Sự linh hoạt ở bazo thứ nhất của codon","tARN có thể mang 2 axit amin cùng lúc","Ribosome tháo rời bộ ba đối mã"],"e":"Vị trí bazo thứ 3 trên codon có thể tạo liên kết hydrogen linh hoạt (wobble) với bazo thứ 1 của anticodon (đặc biệt khi có Inosine I).","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Hiện tượng Can thiệp ARN (RNA interference - RNAi) sử dụng các phân tử miARN hoặc siARN để điều hòa biểu hiện gene theo cơ chế nào?","o":["Bắt cặp bổ sung với mARN mục tiêu để kích hoạt phức hợp RISC phân hủy mARN hoặc ức chế dịch mã","Kích thích RNA polymerase hoạt động nhanh hơn","Sửa đổi trực tiếp trình tự ADN nhân","Gắn thêm intron vào gene"],"e":"RNAi là cơ chế dập tắt gene (gene silencing) thông qua các ARN nhỏ bắt cặp gây bất hoạt mARN mục tiêu.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Khái niệm Ribozyme dùng để chỉ loại phân tử sinh học nào có đặc tính độc đáo?","o":["Phân tử ARN có khả năng hoạt động như một xúc tác sinh học (enzyme)","Một loại protein cấu tạo nên ribosome","Phân tử ADN có khả năng gắn axit amin","Enzyme chuyên tổng hợp lipids"],"e":"Ribozyme chứng minh ARN không chỉ lưu trữ thông tin mà còn có chức năng xúc tác (như rARN 23S/28S xúc tác tạo liên kết peptide).","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Đơn phân cấu tạo nên đại phân tử protein là gì?","o":["Axit amin (Amino acid)","Nucleotide","Glucose","Axit béo"],"e":"Protein là đại phân tử sinh học được cấu tạo theo nguyên tắc đa phân, đơn phân là các axit amin.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong tự nhiên, có khoảng bao nhiêu loại axit amin tiêu chuẩn tham gia cấu tạo nên hầu hết các loại protein trong sinh giới?","o":["20 loại","4 loại","64 loại","10 loại"],"e":"Có 20 loại axit amin tiêu chuẩn tham gia vào thành phần cấu tạo nên các protein sinh học.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các axit amin liên kết với nhau trong chuỗi polypeptide bằng loại liên kết hóa học nào?","o":["Liên kết peptide","Liên kết phosphodiester","Liên kết hydrogen","Liên kết glycosidic"],"e":"Nhóm carboxyl (-COOH) của axit amin này liên kết với nhóm amino (-NH2) của axit amin kế tiếp bằng liên kết peptide (-CO-NH-).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Cấu trúc bậc 1 của phân tử protein được đặc trưng bởi điều gì?","o":["Trình tự sắp xếp tuyến tính của các axit amin trong chuỗi polypeptide","Dạng xoắn alpha hoặc nếp gấp beta","Cấu trúc không gian ba chiều cuộn gập hoàn chỉnh","Sự kết hợp của nhiều chuỗi polypeptide"],"e":"Cấu trúc bậc 1 là thứ tự sắp xếp chuỗi thẳng của các axit amin được nối với nhau bằng liên kết peptide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Cấu trúc bậc 2 của protein (xoắn alpha và nếp gấp beta) được giữ ổn định chủ yếu nhờ loại liên kết nào?","o":["Liên kết hydrogen giữa các nguyên tử ở khung peptide","Cầu nối disulfide (-S-S-)","Liên kết kỵ nước","Liên kết ion"],"e":"Cấu trúc bậc 2 hình thành do các liên kết hydrogen giữa các nhóm C=O và N-H trên khung peptide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Cấu trúc bậc mấy của protein bắt đầu có chức năng sinh học hoàn chỉnh không gian ba chiều?","o":["Cấu trúc bậc 3","Cấu trúc bậc 1","Cấu trúc bậc 2","Cấu trúc chuỗi thẳng"],"e":"Cấu trúc bậc 3 là cấu hình không gian 3D hoàn chỉnh của 1 chuỗi polypeptide, bắt đầu thể hiện chức năng sinh học.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Cấu trúc bậc 4 của protein chỉ xuất hiện ở loại protein nào sau đây?","o":["Protein được cấu tạo từ hai hay nhiều chuỗi polypeptide liên kết với nhau","Protein chỉ có một chuỗi polypeptide","Protein dạng sợi đơn","Protein không có gốc axit amin"],"e":"Cấu trúc bậc 4 là sự liên kết không gian của từ 2 chuỗi polypeptide (subunit) trở lên (ví dụ: Hemoglobin gồm 4 chuỗi).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Hiện tượng protein bị mất cấu hình không gian ba chiều và mất chức năng sinh học do nhiệt độ cao hoặc pH môi trường thay đổi gọi là gì?","o":["Sự biến tính của protein (Denaturation)","Sự đồng hóa protein","Sự trùng hợp protein","Sự giải mã protein"],"e":"Sự biến tính phá hủy các liên kết yếu (hydrogen, ion, kỵ nước) làm sụp đổ cấu trúc bậc 2, 3, 4 của protein.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Mã mở đầu (Start codon) trên mARN quy định điểm bắt đầu dịch mã có trình tự nucleotide nào?","o":["5'- AUG -3'","5'- UAA -3'","5'- UAG -3'","5'- UGA -3'"],"e":"Codon 5'-AUG-3' trên mARN là mã mở đầu, mã hóa cho axit amin Methionine (ở nhân thực) hoặc Formyl-methionine (ở nhân sơ).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Ba bộ ba kết thúc (Stop codons) trên mARN làm nhiệm vụ báo hiệu dừng quá trình dịch mã là những bộ ba nào?","o":["5'- UAA -3', 5'- UAG -3', 5'- UGA -3'","5'- AUG -3', 5'- UAA -3', 5'- UAG -3'","5'- UAA -3', 5'- UAC -3', 5'- UGA -3'","5'- UAG -3', 5'- UGA -3', 5'- UGG -3'"],"e":"3 codon kết thúc gồm UAA (Ochre), UAG (Amber) và UGA (Opal) không mã hóa cho axit amin nào.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Bào quan trực tiếp thực hiện quá trình dịch mã tổng hợp protein trong tế bào là gì?","o":["Ribosome","Bộ máy Golgi","Ti thể","Peroxisome"],"e":"Ribosome (gồm tiểu đơn vị lớn và tiểu đơn vị nhỏ) là nhà máy tổng hợp protein của tế bào.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Tính thoái hóa (tính dư thừa) của mã di truyền có nghĩa là gì?","o":["Nhiều bộ ba khác nhau cùng mã hóa cho một loại axit amin","Một bộ ba mã hóa cho nhiều loại axit amin","Tất cả các loài đều dùng chung một bộ mã di truyền","Mã di truyền bị mất dần qua các thế hệ"],"e":"Tính thoái hóa: Do có 61 codon mã hóa cho 20 loại axit amin nên đa số axit amin được mã hóa bởi nhiều hơn 1 codon.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Tính đặc hiệu của mã di truyền có nghĩa là gì?","o":["Một bộ ba nhất định chỉ mã hóa cho duy nhất một loại axit amin","Một axit amin do nhiều bộ ba mã hóa","Mã di truyền có thể đọc gối lên nhau","Mã di truyền thay đổi tùy theo loài sinh vật"],"e":"Tính đặc hiệu khẳng định mỗi codon chỉ tương ứng với 1 loại axit amin duy nhất.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Tính phổ biến của mã di truyền có nghĩa là gì?","o":["Hầu hết tất cả các loài sinh vật trên Trái Đất đều dùng chung một bộ mã di truyền","Mã di truyền có ở khắp mọi nơi trong không khí","Mỗi sinh vật có một bộ mã di truyền riêng","Mã di truyền chỉ có ở tế bào nhân thực"],"e":"Tính phổ biến chứng minh tính thống nhất của sinh giới: từ vi khuẩn đến con người đều dùng chung bảng mã di truyền.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong giai đoạn hoạt hóa axit amin của dịch mã, năng lượng cung cấp cho quá trình này được lấy từ phân tử nào?","o":["ATP","GTP","CTP","TTP"],"e":"Axit amin được hoạt hóa nhờ tiêu tốn ATP tạo thành Aminoacyl-AMP trước khi gắn vào tARN.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Giai đoạn tổng hợp chuỗi polypeptide trên mARN diễn ra theo chiều nào của phân tử mARN?","o":["Chiều 5' -> 3'","Chiều 3' -> 5'","Từ hai đầu vào giữa","Chiều ngẫu nhiên"],"e":"Ribosome dịch chuyển dọc theo phân tử mARN theo chiều 5' -> 3' từng bộ ba một.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Axit amin đầu tiên được đưa vào chuỗi polypeptide ở tế bào sinh vật nhân thực (Eukaryote) là gì?","o":["Methionine (Met)","Formyl-methionine (fMet)","Valine","Alanine"],"e":"Ở sinh vật nhân thực, axit amin mở đầu là Methionine (ở nhân sơ là Formyl-methionine).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Sau khi chuỗi polypeptide hoàn thành, axit amin mở đầu (Methionine / Formyl-methionine) sẽ xử lý thế nào?","o":["Bị enzyme cắt bỏ khỏi chuỗi polypeptide để trở thành protein có chức năng sinh học","Được giữ lại vĩnh viễn ở đầu chuỗi","Biến đổi thành axit amin khác","Chuyển xuống cuối chuỗi"],"e":"Sau dịch mã, enzyme peptidase cắt bỏ axit amin mở đầu để tạo chuỗi hoàn chỉnh gấp cuộn thành protein chức năng.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Đặc điểm nào sau đây KHÔNG phải là chức năng sinh học của protein trong tế bào?","o":["Lưu trữ và bảo tồn thông tin di truyền qua các thế hệ","Xúc tác các phản ứng sinh hóa (Enzyme)","Cấu tạo nên màng tế bào và khung xương tế bào","Vận chuyển các chất và bảo vệ cơ thể (Kháng thể)"],"e":"Lưu trữ thông tin di truyền là chức năng của axit nucleic (ADN/ARN), không phải của protein.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Sự hình thành liên kết peptide giữa hai axit amin kề nhau trên ribosome do thành phần nào xúc tác?","o":["Trung tâm Peptidyl transferase của rARN trong tiểu đơn vị lớn ribosome","Enzyme DNA polymerase","Enzyme RNA polymerase","Enzyme Helicase"],"e":"Peptidyl transferase là một ribozyme (rARN 23S ở nhân sơ, 28S ở nhân thực) xúc tác nối các axit amin.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Một phân tử mARN trưởng thành có tổng số 900 nucleotide (kể cả mã mở đầu và mã kết thúc). Số axit amin trong chuỗi polypeptide hoàn chỉnh được tạo ra từ mARN này là bao nhiêu?","o":["298 axit amin","300 axit amin","299 axit amin","150 axit amin"],"e":"Số codon = 900 / 3 = 300. Chuỗi polypeptide sơ cấp = 300 - 1 (mã kết thúc) = 299 axit amin. Chuỗi hoàn chỉnh cắt bỏ Met mở đầu = 299 - 1 = 298 axit amin.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Ba vị trí liên kết với tARN trên tiểu đơn vị lớn của ribosome theo đúng thứ tự từ cổng vào đến cổng ra gồm những vị trí nào?","o":["Vị trí A (Aminoacyl), vị trí P (Peptidyl), vị trí E (Exit)","Vị trí E, vị trí P, vị trí A","Vị trí P, vị trí A, vị trí E","Vị trí A, vị trí E, vị trí P"],"e":"Trình tự di chuyển của tARN qua ribosome: Vị trí A (nhận tARN mang aa mới) -> Vị trí P (giữ chuỗi peptit) -> Vị trí E (giải phóng tARN không còn aa).","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Trình tự Shine-Dalgarno (SD sequence) trên mARN ở tế bào vi khuẩn nhân sơ mang vai trò quan trọng nào?","o":["Giúp tiểu đơn vị nhỏ ribosome (chứa rARN 16S) nhận biết và định vị đúng mã mở đầu AUG để bắt đầu dịch mã","Kết thúc quá trình phiên mã","Gắn đuôi Poly-A","Gắn axit amin vào tARN"],"e":"Trình tự giàu purine Shine-Dalgarno ở phía trước AUG bắt cặp bổ sung với đầu 3' của rARN 16S để định vị vị trí mở đầu.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Hiện tượng biến đổi sau dịch mã (Post-translational modification - PTM) của protein bao gồm các phản ứng nào?","o":["Gắn thêm nhóm chức (Phosphoryl hóa, Glycosyl hóa), cắt tỉa chuỗi peptit hoặc tạo cầu nối Disulfide","Cắt bỏ các đoạn intron","Gắn mũ 5'-cap","Tháo xoắn chuỗi kép ADN"],"e":"PTM biến đổi hóa học protein (phosphoryl hóa, glycosyl hóa...) giúp protein đạt cấu trúc và trạng thái hoạt động sinh học chuẩn xác.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Chaperone (như Hsp70, GroEL/GroES) là nhóm protein đặc biệt có chức năng sinh học quan trọng nào?","o":["Hỗ trợ và định hướng quá trình gấp cuộn chính xác của các chuỗi polypeptide mới sinh, ngăn ngừa sự kết cụm hỏng","Cắt bỏ đoạn mồi RNA","Nối các đoạn Okazaki","Tổng hợp nucleotide mới"],"e":"Chaperone giúp các chuỗi polypeptide cuộn gập đúng cấu hình 3D và phục hồi các protein bị biến tính nhẹ.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Các yếu tố giải phóng (Release Factors - RF1, RF2 ở nhân sơ hoặc eRF1 ở nhân thực) nhận biết mã kết thúc và chấm dứt dịch mã theo cơ chế nào?","o":["Bám trực tiếp vào vị trí A khi xuất hiện Stop codon, kích hoạt Peptidyl transferase bổ sung phân tử H2O giải phóng chuỗi peptit","Phân hủy trực tiếp phân tử mARN","Gắn một tARN đặc biệt vào Stop codon","Phá hủy thoi vô sắc"],"e":"Protein RF bắt chước cấu trúc tARN đi vào vị trí A, khiến Peptidyl transferase gắn nước thay vì axit amin, cắt đứt chuỗi polypeptide.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Cơ chế nhắm mục tiêu protein (Protein targeting / Signal hypothesis) nhờ đoạn peptide tín hiệu (Signal peptide) ở đầu N giúp đưa protein vào hệ thống màng nào?","o":["Lưới nội chất hạt (Rough ER) để tiết ra ngoài tế bào hoặc gắn lên màng","Trực tiếp vào nhân tế bào","Phân hủy trong Vacuole","Giữ lại trong tế bào chất"],"e":"Phức hợp SRP nhận biết Signal peptide ở đầu N, dẫn truyền ribosome đến màng Lưới nội chất hạt để tổng hợp protein tiết.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Con đường tiêu hủy protein bị hỏng hoặc hết hạn trong tế bào nhân thực thông qua hệ thống phân tử nào?","o":["Đánh dấu Ubiquitin và phân hủy tại phức hợp Proteasome 26S","Phân hủy bởi RNA polymerase","Đẩy ra ngoài qua vi ống","Chuyển thành DNA"],"e":"Hệ thống Ubiquitin-Proteasome là con đường cốt lõi phân hủy các protein sai hỏng hoặc kiểm soát chu kỳ tế bào.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Đột biến vô nghĩa (Nonsense mutation) ảnh hưởng trực tiếp tới quá trình dịch mã như thế nào?","o":["Biến đổi một codon mã hóa axit amin thành một Stop codon làm chuỗi polypeptide bị kết thúc sớm (ngắn lại)","Làm thay đổi một axit amin này thành axit amin khác","Không làm thay đổi trình tự axit amin","Dịch chuyển toàn bộ khung đọc mã"],"e":"Đột biến vô nghĩa tạo ra mã kết thúc sớm (UAA, UAG, UGA), tạo ra protein cụt ngón mất chức năng.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Bệnh Prion (như bệnh bò điên BSE, Creutzfeldt-Jakob) xuất phát từ cơ chế bất thường đặc biệt nào của phân tử protein?","o":["Protein PrP biến đổi từ dạng xoắn alpha (PrPC) sang dạng nếp gấp beta sai hỏng (PrPSc) và kích thích các protein bình thường biến đổi theo","Đột biến mất toàn bộ gene","Do sự xâm nhập của virus DNA","Thiếu hụt chất béo trong khẩu phần"],"e":"Prion là hạt protein lây nhiễm không chứa axit nucleic, gây hại do sự thay đổi cấu trúc không gian (alpha -> beta) lây lan chuỗi.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Gene được định nghĩa là gì trong sinh học di truyền?","o":["Một đoạn phân tử DNA mang thông tin mã hóa cho một sản phẩm xác định (chuỗi polypeptide hay phân tử RNA)","Toàn bộ phân tử DNA trong tế bào","Một phân tử protein nằm trên nhiễm sắc thể","Mỗi tập hợp gồm 3 nucleotide bất kỳ"],"e":"Gene là một đoạn xác định của phân tử DNA mang thông tin mã hóa cho một sản phẩm sinh học chức năng (chuỗi polypeptide hoặc RNA).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Mỗi gene cấu trúc điển hình gồm có 3 vùng trình tự theo thứ tự từ đầu 3' đến 5' trên mạch khuôn lần lượt là gì?","o":["Vùng điều hòa, vùng mã hóa, vùng kết thúc","Vùng mã hóa, vùng điều hòa, vùng kết thúc","Vùng kết thúc, vùng mã hóa, vùng điều hòa","Vùng khởi động, vùng vận hành, vùng ức chế"],"e":"Gene cấu trúc gồm 3 vùng chính: Vùng điều hòa (đầu 3' mạch khuôn), Vùng mã hóa (ở giữa), Vùng kết thúc (đầu 5' mạch khuôn).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Gene không phân mảnh (các vùng mã hóa liên tục không chứa intron) là đặc điểm cấu trúc gene của nhóm sinh vật nào?","o":["Sinh vật nhân sơ (Prokaryote)","Sinh vật nhân thực (Eukaryote)","Động vật có xương sống","Thực vật hạt kín"],"e":"Hầu hết các gene ở sinh vật nhân sơ (vi khuẩn) là gene không phân mảnh, vùng mã hóa gồm toàn bộ các exon liên tục.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Gene phân mảnh (vùng mã hóa gồm các exon xen kẽ với các intron) đặc trưng cho nhóm sinh vật nào?","o":["Sinh vật nhân thực (Eukaryote)","Sinh vật nhân sơ (Prokaryote)","Vi khuẩn Lam","Vi khuẩn E. coli"],"e":"Gene sinh vật nhân thực có cấu trúc phân mảnh: các đoạn mã hóa exon bị xen kẽ bởi các đoạn không mã hóa intron.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Dựa vào chức năng sản phẩm, gene được chia thành hai loại lớn nào?","o":["Gene cấu trúc và gene điều hòa","Gene trội và gene lặn","Gene phân mảnh và gene không phân mảnh","Gene nhân và gene tế bào chất"],"e":"Gene cấu trúc mã hóa sản phẩm tạo cấu trúc/chức năng tế bào; Gene điều hòa mã hóa sản phẩm kiểm soát sự biểu hiện của gene khác.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Khái niệm Operon dùng để chỉ cụm cấu trúc di truyền phổ biến ở đối tượng sinh vật nào?","o":["Cụm các gene cấu trúc có liên quan về chức năng được phân bố liền nhau và dùng chung một cơ chế điều hòa ở sinh vật nhân sơ","Một gene đơn độc ở tế bào nhân thực","Bộ nhiễm sắc thể đơn bội","Phân tử RNA thông tin trưởng thành"],"e":"Operon là cụm gồm nhiều gene cấu trúc xếp kề nhau, cùng được dịch mã/phiên mã chung bởi 1 promoter và operator ở sinh vật nhân sơ.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Mô hình Operon Lac ở vi khuẩn E. coli được phát hiện đầu tiên bởi hai nhà khoa học nào?","o":["François Jacob và Jacques Monod","James Watson và Francis Crick","Thomas Morgan và Gregor Mendel","Carl Correns và Hugo de Vries"],"e":"Jacob và Monod đã đề xướng mô hình điều hòa Operon Lac ở E. coli vào năm 1961 (đạt giải Nobel 1965).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong mô hình cấu trúc Operon Lac ở E. coli, vùng vận hành (Operator - O) có chức năng gì?","o":["Là vị trí tương tác đặc hiệu với protein ức chế để ngăn cản hoặc mở đường cho phiên mã","Là nơi RNA polymerase bám vào khởi động phiên mã","Mã hóa cho enzyme phân hủy lactose","Tổng hợp protein ức chế"],"e":"Vùng O (Operator) nằm giữa Promoter và cụm gene cấu trúc, là nơi bám của protein ức chế để điều tiết phiên mã.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong Operon Lac, ba gene cấu trúc Z, Y, A chịu trách nhiệm mã hóa cho các enzyme thực hiện chức năng gì?","o":["Chuyển hóa và phân giải đường Lactose trong tế bào vi khuẩn","Tổng hợp đường Glucose","Tổng hợp axit amin Tryptophan","Phân hủy thuốc kháng sinh"],"e":"Gene Z, Y, A mã hóa cho beta-galactosidase, permease và transacetylase để hấp thu và phân giải lactose.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Gene điều hòa (lacI) nằm phía trước Operon Lac có vai trò gì?","o":["Mã hóa cho protein ức chế (Repressor protein)","Là một phần thuộc cấu trúc Operon Lac","Mã hóa cho enzyme RNA polymerase","Trực tiếp phân hủy đường lactose"],"e":"Gene điều hòa lacI liên tục tổng hợp protein ức chế; tuy nhiên lacI không nằm trong thành phần cấu trúc của Operon Lac.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Khi môi trường nuôi dưỡng vi khuẩn E. coli KHÔNG có đường Lactose, Operon Lac sẽ ở trạng thái nào?","o":["Bị ức chế (không diễn ra phiên mã các gene Z, Y, A) do protein ức chế bám vào Operator","Hoạt động phiên mã mạnh mẽ","Cụm gene cấu trúc bị đột biến mất đoạn","RNA polymerase bám chặt vào Operator"],"e":"Khi không có lactose, protein ức chế bám vào O chặn đường di chuyển của RNA polymerase, làm ngưng phiên mã.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Khi môi trường xuất hiện đường Lactose, chất đóng vai trò là chất cảm ứng (Inducer) bám vào protein ức chế là chất nào?","o":["Allolactose (hoặc Lactose)","Glucose","Galactose","Maltose"],"e":"Allolactose liên kết làm thay đổi cấu hình không gian của protein ức chế, khiến nó rời khỏi Operator, mở đường cho phiên mã.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Đột biến gene là những biến đổi nhỏ diễn ra ở mức độ cấu trúc nào của gene?","o":["Thay đổi trong chuỗi polynucleotide tại một hoặc một số cặp nucleotide","Thay đổi số lượng nhiễm sắc thể trong tế bào","Mất toàn bộ bộ nhiễm sắc thể","Thay đổi cấu trúc không gian của protein"],"e":"Đột biến gene là những biến đổi trong cấu trúc của gene liên quan đến một hoặc một số cặp nucleotide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Đột biến điểm (Point mutation) là dạng đột biến gene liên quan đến bao nhiêu cặp nucleotide?","o":["Chỉ liên quan đến 1 cặp nucleotide","Liên quan đến từ 2 đến 5 cặp nucleotide","Liên quan đến toàn bộ gene","Chỉ liên quan đến đoạn intron"],"e":"Đột biến điểm là dạng đột biến gene chỉ liên quan đến biến đổi tại duy nhất 1 cặp nucleotide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các dạng đột biến điểm cơ bản bao gồm những dạng nào?","o":["Thay thế, thêm, hoặc mất 1 cặp nucleotide","Mất, lặp, đảo, chuyển đoạn","Lệch bội và đa bội","Cắt dán và nối đoạn"],"e":"3 dạng đột biến điểm cơ bản là: Thay thế 1 cặp nucleotide, Thêm 1 cặp nucleotide, và Mất 1 cặp nucleotide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Dạng đột biến thay thế cặp nucleotide làm xuất hiện mã kết thúc sớm gọi là đột biến gì?","o":["Đột biến vô nghĩa (Nonsense mutation)","Đột biến sai nghĩa (Missense mutation)","Đột biến đồng nghĩa / im lặng (Silent mutation)","Đột biến dịch khung (Frameshift mutation)"],"e":"Đột biến vô nghĩa biến đổi 1 codon mã hóa axit amin thành 1 Stop codon (UAA, UAG, UGA).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Dạng đột biến làm thay đổi cặp nucleotide nhưng KHÔNG làm thay đổi loại axit amin tương ứng do tính thoái hóa của mã di truyền gọi là gì?","o":["Đột biến đồng nghĩa / im lặng (Silent mutation)","Đột biến sai nghĩa","Đột biến vô nghĩa","Đột biến dịch khung"],"e":"Đột biến im lặng thay đổi bazo nhưng codon mới vẫn mã hóa cho chính axit amin ban đầu.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các dạng đột biến điểm nào thường dẫn đến hiện tượng dịch khung đọc mã (Frameshift mutation) gây ảnh hưởng nghiêm trọng tới trình tự chuỗi polypeptide?","o":["Thêm hoặc mất 1 cặp nucleotide","Thay thế 1 cặp nucleotide","Đảo vị trí hai cặp nucleotide","Biến đổi bazo nitơ dạng hiếm"],"e":"Thêm hoặc mất 1 cặp nucleotide làm lệch toàn bộ khung đọc mã di truyền từ vị trí đột biến về sau.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme endonuclease đặc hiệu cắt DNA tại các trình tự nhận biết đối xứng ngắn (Palindromic sequence) dùng trong công nghệ gene gọi là gì?","o":["Enzyme cắt hạn chế (Restriction enzyme / Restricbase)","DNA Ligase","Taq Polymerase","Reverse Transcriptase"],"e":"Restriction enzyme (như EcoRI, BamHI) cắt liên kết phosphodiester tại các vị trí palindrome xác định.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Thể truyền (Vector) phổ biến nhất được sử dụng để chuyển gene tái tổ hợp vào vi khuẩn là gì?","o":["Plasmid (phân tử DNA vòng nhỏ ngoài nhân của vi khuẩn)","Nhiễm sắc thể nhân","Phân tử mARN","Ribosome"],"e":"Plasmid có khả năng tự nhân đôi độc lập, mang gene đánh dấu nên rất lý tưởng làm thể truyền trong công nghệ gene.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong điều hòa Operon Lac ở vi khuẩn E. coli, sự kiểm soát dương tính (Positive control) thực hiện thông qua phức hợp nào?","o":["Phức hợp CAP-cAMP bám vào vùng Promoter để kích hoạt tăng cường mức độ phiên mã","Protein ức chế lacI bám vào Operator","Allolactose gắn vào ribosome","Enzyme beta-galactosidase"],"e":"Khi nồng độ Glucose thấp, nồng độ cAMP tăng cao -> Phức hợp CAP-cAMP gắn vào Promoter giúp RNA pol bám hiệu quả hơn (kiểm soát dương).","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Operon Tryptophan (Trp operon) ở E. coli thuộc loại Operon nào và hoạt động theo cơ chế nào?","o":["Operon ức chế (Repressible operon): Bình thường mở, chỉ tắt khi nồng độ Tryptophan dư thừa gắn với Aporepressor tạo phức hợp ức chế","Operon cảm ứng (Inducible operon)","Operon luôn luôn bật không bao giờ tắt","Operon không dùng protein ức chế"],"e":"Trp operon mã hóa enzyme tổng hợp tryptophan; khi môi trường thừa Trp, Trp đóng vai trò co-repressor kích hoạt protein ức chế để tắt operon.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Các mức độ điều hòa biểu hiện gene ở sinh vật nhân thực (Eukaryote) diễn ra phức tạp qua những giai đoạn nào?","o":["Điều hòa cấu trúc nhiễm sắc thể (Epigenetics), điều hòa phiên mã, sau phiên mã, dịch mã và sau dịch mã","Chỉ diễn ra ở mức độ phiên mã giống như nhân sơ","Chỉ diễn ra ở mức độ dịch mã","Chỉ diễn ra khi tế bào phân chia"],"e":"Sinh vật nhân thực điều hòa ở mọi cấp độ từ cuộn gập cromatin, phiên mã, xử lý ARN, dịch mã đến biến đổi protein.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Phản ứng Chuỗi Polymerase (PCR - Polymerase Chain Reaction) dùng để làm gì và gồm 3 bước chu kỳ nhiệt nào?","o":["Khuếch đại in vitro một đoạn DNA xác định; gồm 3 bước: Biến tính nhiệt (Denaturation), Bắt cặp mồi (Annealing), Kéo dài (Extension)","Cắt DNA thành các đoạn nhỏ; gồm 2 bước","Tổng hợp protein nhân tạo","Giải trình tự toàn bộ hệ gen"],"e":"PCR nhân bản DNA định hướng qua các chu kỳ biến tính (~95°C), bắt cặp mồi (~55°C) và kéo dài (~72°C nhờ Taq pol).","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Thư viện cDNA (cDNA library) được tổng hợp từ loại phân tử sinh học nguồn nào nhờ enzyme phiên mã ngược (Reverse Transcriptase)?","o":["Từ toàn bộ các phân tử mARN trưởng thành trích xuất từ tế bào","Từ DNA genomic chứa cả intron","Từ chuỗi polypeptide","Từ tARN"],"e":"cDNA (complementary DNA) tổng hợp bằng phiên mã ngược mARN trưởng thành nên chỉ chứa các vùng mã hóa exon của gene đang hoạt động.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Cơ chế Làm suy giảm phiên mã (Attenuation) ở Operon Tryptophan phụ thuộc vào yếu tố đặc biệt nào?","o":["Sự hình thành cấu trúc kẹp tóc dừng phiên mã sớm trên đoạn mARN đầu (Leader peptide - trpL) phụ thuộc vào tốc độ dịch mã của Ribosome ứng với nồng độ Trp-tARN","Sự cắt dán intron","Hoạt tính của enzyme Restriction","Sự phân hủy của plasmid"],"e":"Attenuation kết hợp chặt chẽ giữa dịch mã đoạn leader trpL và phiên mã: khi thừa Trp, ribosome trượt nhanh tạo kẹp tóc 3-4 (terminator) dập tắt phiên mã sớm.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Hiện tượng Biến đổi biểu di truyền (Epigenetics) điều hòa hoạt động của gene mà KHÔNG làm thay đổi trình tự DNA bao gồm các cơ chế cốt lõi nào?","o":["Methyl hóa DNA (tại đảo CpG) và Biến đổi hóa học đuôi Histone (Acetylation, Methylation...)","Đột biến điểm làm thay đổi bazo nitơ","Chuyển đoạn nhiễm sắc thể","Cắt bỏ exon"],"e":"Epigenetics điều hòa đóng/mở cấu trúc chromatin thông qua methyl hóa cytosine trên DNA và acetyl hóa/methyl hóa đuôi histone.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Hệ thống chỉnh sửa gen CRISPR-Cas9 có nguồn gốc tự nhiên từ đâu và hoạt động nhờ hai thành phần chính nào?","o":["Hệ thống miễn dịch thích ứng ở vi khuẩn; gồm enzyme nuclease Cas9 và đoạn sgRNA (single guide RNA) định hướng","Tế bào động vật có vú; gồm DNA polymerase và mARN","Virus nấm; gồm Ligase và tRNA","Cây trồng gen nhảy; gồm transposon và cDNA"],"e":"CRISPR-Cas9 vốn là cơ chế chống vi-rút của vi khuẩn, được cải tiến dùng sgRNA dẫn đường cho nuclease Cas9 cắt đứt chính xác vị trí DNA mục tiêu.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Các Yếu tố tăng cường (Enhancer) và Yếu tố dập tắt (Silencer) có thể nằm cách rất xa Promoter nhưng vẫn điều hòa phiên mã gene nhân thực nhờ cơ chế nào?","o":["Sự uốn cong vòng của sợi DNA (DNA looping) mang các protein Activator/Repressor tiếp xúc với phức hợp phiên mã tại Promoter nhờ protein Mediator","Di chuyển trực tiếp dọc theo sợi DNA","Cắt rời khỏi DNA để bám vào RNA","Biến đổi trực tiếp mARN"],"e":"DNA tạo vòng (looping) đưa Enhancer ở xa lại gần Promoter, tương tác với các yếu tố phiên mã tổng quát và RNA pol II qua phức hợp Mediator.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Kỹ thuật Giải trình tự thế hệ mới (NGS - Next Generation Sequencing / RNA-seq) cho phép đánh giá điều hòa biểu hiện gene ở quy mô nào?","o":["Phân tích định lượng toàn bộ hệ phiên mã (Transcriptome) của tế bào tại một thời điểm xác định","Chỉ đọc được trình tự 1 gene duy nhất","Chỉ đo nồng độ protein trong máu","Thay thế kỹ thuật nhân bản vi khuẩn"],"e":"RNA-seq kết hợp NGS cho phép giải trình tự và định lượng song song hàng triệu đoạn RNA, phản ánh toàn bộ trạng thái biểu hiện gene của tế bào.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Đặc điểm sinh học cơ bản nhất khẳng định virus KHÔNG phải là một tế bào sống hoàn chỉnh là gì?","o":["Chưa có cấu trúc tế bào, chỉ là dạng sống không bào và là ký sinh nội bào bắt buộc","Không có màng sinh chất","Có kích thước siêu nhỏ chỉ quan sát được dưới kính hiển vi điện tử","Không chứa protein"],"e":"Virus chưa có cấu trúc tế bào hoàn chỉnh, không có trao đổi chất độc lập nên phải ký sinh nội bào bắt buộc.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Hai thành phần cấu tạo bắt buộc luôn có ở mọi loại virus (virus trần) bao gồm những gì?","o":["Lõi axit nucleic (DNA hoặc RNA) và vỏ protein (capsid)","Lõi DNA và vỏ phospholipid","Lõi RNA và màng tế bào","Bộ máy Golgi và ribosome"],"e":"Mọi virus (virion) đều gồm 2 phần bắt buộc: Lõi bộ gen axit nucleic và vỏ capsid bằng protein.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Khác với tế bào sinh vật (luôn chứa cả DNA và RNA), hệ gen của một loại virus có đặc điểm gì?","o":["Chỉ chứa duy nhất một trong hai loại axit nucleic: DNA hoặc RNA","Luôn luôn chứa đồng thời cả DNA và RNA","Không chứa bất kỳ loại axit nucleic nào","Chỉ cấu tạo từ chuỗi amino acid"],"e":"Mỗi hạt virus chỉ chứa DNA hoặc RNA làm chất liệu di truyền (gọi là DNA virus hoặc RNA virus).","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Vỏ capsid của virus được cấu tạo từ các đơn vị tiểu phần protein gọi là gì?","o":["Capsomere","Nucleosome","Peptidoglycan","Codon"],"e":"Vỏ capsid được lắp ráp từ các hình thái đơn vị protein gọi là capsomere.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Phức hợp gồm lõi axit nucleic và vỏ capsid gộp chung lại được gọi là gì?","o":["Nucleocapsid","Envelope","Bacteriophage","Prion"],"e":"Cấu trúc hạt virus cơ bản gồm lõi axit nucleic bọc trong vỏ capsid được gọi là nucleocapsid.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Lớp vỏ ngoài (envelope) ở một số loại virus phức tạp (như virus Cúm, HIV, SARS-CoV-2) có nguồn gốc chủ yếu từ đâu?","o":["Từ màng sinh chất hoặc màng nội bào của tế bào chủ khi virus nảy chồi ra ngoài","Do virus tự tổng hợp mới hoàn toàn","Từ vỏ tế bào vi khuẩn","Từ thành phần xenlulozo"],"e":"Vỏ ngoài lớp kép lipid thu được từ màng tế bào chủ trong quá trình xuất bào/nảy chồi (budding).","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Các gai glycoprotein cắm trên vỏ ngoài của virus đóng vai trò mấu chốt nào?","o":["Gắn đặc hiệu vào các thụ thể (receptor) trên bề mặt tế bào chủ để khởi đầu sự xâm nhập","Giúp virus tự di chuyển trong không khí","Thực hiện quá trình quang hợp","Phân hủy ADN của tế bào chủ"],"e":"Gai glycoprotein (như gai Spike của SARS-CoV-2) giúp nhận diện và bám đặc hiệu lên thụ thể tế bào chủ.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Khái niệm Thể thực khuẩn (Bacteriophage hay Phage) dùng để chỉ loại virus chuyên ký sinh ở đối tượng nào?","o":["Vi khuẩn","Thực vật","Động vật có xương sống","Nấm men"],"e":"Bacteriophage (phage) là nhóm virus chuyên ký sinh và xâm nhiễm tế bào vi khuẩn.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Năm giai đoạn cơ bản trong chu trình nhân lên chuẩn của virus theo đúng thứ tự là gì?","o":["Hấp phụ -> Xâm nhập -> Tổng hợp -> Lắp ráp -> Giải phóng","Xâm nhập -> Hấp phụ -> Tổng hợp -> Lắp ráp -> Giải phóng","Tổng hợp -> Hấp phụ -> Xâm nhập -> Lắp ráp -> Giải phóng","Hấp phụ -> Tổng hợp -> Xâm nhập -> Giải phóng -> Lắp ráp"],"e":"Trình tự nhân lên gồm 5 bước: 1. Hấp phụ (bám), 2. Xâm nhập, 3. Tổng hợp sinh học, 4. Lắp ráp, 5. Giải phóng.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Trong chu trình sinh tan (Lytic cycle) của thể thực khuẩn, điều gì sẽ xảy ra với tế bào chủ ở bước giải phóng?","o":["Tế bào chủ bị phá hủy (vỡ ra/tan bào) giải phóng hàng loạt virus mới","Tế bào chủ tiếp tục phân chia bình thường","Tế bào chủ biến thành bào tử","Tế bào chủ tự nhân đôi ADN của mình"],"e":"Chu trình tan làm ly giải hoàn toàn màng tế bào chủ để giải phóng virion ra ngoài.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Trong chu trình tiềm tan (Lysogenic cycle), bộ gen của virus tồn tại ở trạng thái nào trong tế bào chủ?","o":["Cài đặt tích hợp vào hệ gen của tế bào chủ ở dạng Prophage (hoặc Provirus) và nhân đôi cùng tế bào","Lập tức phá hủy ADN tế bào chủ","Tự do trong tế bào chất mà không liên kết ADN","Biến mất hoàn toàn"],"e":"Ở chu trình tiềm tan, ADN virus gắn tích hợp vào nhiễm sắc thể tế bào chủ dưới dạng prophage, không làm tan tế bào.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Enzyme phiên mã ngược (Reverse Transcriptase) đặc trưng có ở nhóm Retrovirus (như HIV) có chức năng gì?","o":["Tổng hợp DNA từ khuôn mẫu RNA","Tổng hợp RNA từ khuôn mẫu DNA","Cắt đứt chuỗi protein","Nối các đoạn RNA"],"e":"Reverse Transcriptase đảo ngược dòng thông tin di truyền: tổng hợp c-DNA từ khuôn mẫu RNA của virus.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Thuốc kháng sinh (Antibiotics) có tác dụng tiêu diệt hoặc tiêu trừ virus không?","o":["Không, vì kháng sinh chỉ tác động lên cấu trúc và cơ chế trao đổi chất của vi khuẩn","Có, diệt được mọi loại virus","Chỉ diệt được virus có vỏ ngoài","Chỉ diệt được virus RNA"],"e":"Kháng sinh nhắm vào vách peptidoglycan, ribosome 70S... của vi khuẩn nên hoàn toàn không có hiệu lực với virus.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Biện pháp hiệu quả và bền vững nhất để phòng ngừa các bệnh truyền nhiễm do virus ở người và động vật là gì?","o":["Tiêm vắc-xin (Vaccine) chủ động tạo miễn dịch","Uống thuốc kháng sinh liều cao","Sử dụng vitamin C","Truyền huyết thanh liên tục"],"e":"Vắc-xin kích thích hệ miễn dịch tạo kháng thể và tế bào nhớ, cung cấp khả năng bảo vệ chủ động chống virus.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Viroid là tác nhân gây bệnh nhỏ hơn virus, có đặc điểm cấu trúc độc đáo nào?","o":["Chỉ gồm một đoạn phân tử RNA vòng ngắn, không có vỏ protein capsid","Chỉ gồm một phân tử protein không có RNA","Gồm DNA vòng kép","Có vỏ ngoài bằng lipid"],"e":"Viroid là phân tử RNA trần dạng vòng, không có vỏ capsid, chủ yếu gây bệnh ở thực vật (như bệnh củ khoai tây thoi).","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Prion là tác nhân gây bệnh đặc biệt có bản chất cấu tạo hoàn toàn từ thành phần nào?","o":["Chỉ gồm phân tử Protein bị biến đổi cấu hình không gian sai hỏng, không chứa axit nucleic","Chỉ gồm DNA","Chỉ gồm RNA","Gồm Lipopolysaccharide"],"e":"Prion là các hạt protein lây nhiễm, không chứa bất kỳ axit nucleic nào (gây bệnh xốp não, bò điên).","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Tại sao các loại virus chứa bộ gen là RNA (như virus Cúm, HIV, SARS-CoV-2) thường có tốc độ đột biến cao hơn nhiều so với virus DNA?","o":["Vì enzyme RNA polymerase (hoặc Reverse Transcriptase) tái bản RNA không có hoạt tính sửa sai (Proofreading)","Vì RNA có kích thước quá lớn","Vì virus RNA không có vỏ capsid","Vì RNA dễ bị nhiệt độ phá hủy"],"e":"Enzyme nhân bản RNA thiếu cơ chế đọc sửa sai (proofreading) 3'->5' nên tỷ lệ tích lũy sai sót đột biến rất cao.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Sự lắp ráp hạt virus hoàn chỉnh trong tế bào chủ diễn ra như thế nào?","o":["Các thành phần vỏ protein capsid và lõi axit nucleic tự lắp ráp theo cơ chế tương tác hóa-lý","Nhờ thoi phân bào đưa vào","Nhờ ti thể gắn nối","Cần có sự phân chia của nhân tế bào"],"e":"Quá trình đóng gói hạt virus mới là sự tự lắp ráp (self-assembly) ngẫu nhiên dựa trên ái lực hóa sinh giữa vỏ và lõi.","ch":"Chương 6: Virus","df":"Dễ"},{"q":"Hệ thống phân loại Baltimore chia virus thành 7 nhóm dựa trên tiêu chí mấu chốt nào?","o":["Cấu trúc axit nucleic (DNA/RNA, sợi đơn/kép) và cơ chế tổng hợp mARN của virus","Kích thước của hạt virus","Loại triệu chứng bệnh gây ra ở người","Số lượng capsomere trên vỏ capsid"],"e":"Phân loại Baltimore (Nhóm I -> VII) dựa vào chất liệu di truyền (dsDNA, ssDNA, dsRNA, (+)ssRNA, (-)ssRNA, ssRNA-RT, dsDNA-RT) và đường hướng tạo mARN.","ch":"Chương 6: Virus","df":"Trung bình"},{"q":"Sự khác biệt cốt lõi về chức năng giữa virus RNA sợi dương ((+)ssRNA) và virus RNA sợi âm ((-)ssRNA) khi xâm nhập vào tế bào chủ là gì?","o":["RNA sợi dương có thể làm mARN dịch mã trực tiếp tạo protein; RNA sợi âm phải mang sẵn RNA-dependent RNA polymerase để phiên mã ra sợi bổ sung (+)","RNA sợi âm dịch mã trực tiếp, RNA sợi dương thì không","RNA sợi dương không có vỏ capsid","RNA sợi âm không tích hợp vào tế bào"],"e":"(+)ssRNA có trình tự như mARN nên dịch mã ngay; (-)ssRNA phải nhờ enzyme RdRp đi kèm tổng hợp nên sợi (+) khuôn mẫu trước.","ch":"Chương 6: Virus","df":"Trung bình"},{"q":"Hiện tượng Trôi dạt kháng nguyên (Antigenic drift) ở virus Cúm diễn ra do cơ chế nào?","o":["Sự tích lũy dần dần các đột biến điểm nhỏ trên gene mã hóa gai Hemagglutinin (HA) và Neuraminidase (NA)","Sự tái tổ hợp các đoạn gen giữa hai chủng virus khác nhau","Sự mất đi vỏ ngoài lipid","Sự kết hợp với vi khuẩn"],"e":"Antigenic drift là đột biến điểm tích lũy từ từ khiến vắc-xin cúm cần thay đổi hàng năm.","ch":"Chương 6: Virus","df":"Trung bình"},{"q":"Cơ chế Cướp mũ 5' (Cap-snatching) ở virus Cúm (Influenza virus) phục vụ cho mục đích sinh học nào?","o":["Enzyme endonuclease của virus cắt trộm đầu mũ 5'-cap từ pre-mARN tế bào chủ gắn vào RNA virus để qua mặt ribosome và khởi đầu dịch mã protein virus","Phân hủy đuôi Poly-A của mARN tế bào","Tháo xoắn ADN nhân","Tạo vòng ADN"],"e":"Cap-snatching giúp virus cúm vừa vô hiệu hóa mARN tế bào chủ vừa có sẵn đầu 5'-cap cho mARN của chính mình sử dụng ribosome tế bào.","ch":"Chương 6: Virus","df":"Khó"},{"q":"Liệu pháp Phage (Phage therapy) ứng dụng bacteriophage trong y học hiện đại nhằm giải quyết khủng hoảng y tế nào?","o":["Điều trị các bệnh nhiễm trùng do vi khuẩn siêu đa kháng thuốc (Superbugs / AMR) mà thuốc kháng sinh thông thường hoàn toàn bất lực","Chữa trị các bệnh ung thư di truyền","Thay thế vắc-xin ngừa virus","Tăng cường trí nhớ"],"e":"Phage therapy sử dụng các thể thực khuẩn đặc hiệu để tiêu diệt chính xác vi khuẩn kháng thuốc (AMR) mà không gây tác dụng phụ tới vi sinh vật có lợi.","ch":"Chương 6: Virus","df":"Khó"}],"tp":[{"q":"Quá trình con người tiếp nhận, xử lý, lưu trữ và phản ánh thông tin về thế giới xung quanh được gọi là gì?","o":["Quá trình nhận thức","Quá trình cả   xúc","Quá trình ý chí","Quá trình nhân cách"]},{"q":"Nhận thức cả   tính bao gồ   hai hình thức cơ bản nào sau đây?","o":["Cả   giác và tri giác","hái niệ   và suy luận","Trí nhớ và tư duy","Phân tích và tổng hợp"]},{"q":"Quá trình tâ   lý phản ánh   ột cách trọn vẹn các thuộc tính bề ngoài của sự vật, hiện tượng  hi chúng trực tiếp tác động vào giác quan được gọi là:","o":["Tri giác","Cả   giác","Biểu tượng","hái niệ"]},{"q":"Hình ảnh sự vật, hiện tượng được lưu giữ trong trí nhớ sau  hi sự vật  hông còn trực tiếp hiện diện trước   ắt thuộc hình thức nào?","o":["Biểu tượng","Cả   giác","Tri giác","Suy luận"]},{"q":"Nhận thức lý tính bao gồ   các thao tác tư duy cơ bản nào?","o":["Phân tích, tổng hợp, so sánh, lập luận","Quan sát, lắng nghe, sờ nắn","Ghi nhớ, lưu trữ, tái hiện","Cả   nhận, phản xạ, tưởng tượng"]},{"q":"Trí nhớ là  hả năng thực hiện chuỗi quá trình nào sau đây đối với thông tin?","o":["Ghi nhận, lưu trữ, tái hiện","Tiếp nhận, chuyển giao, xóa bỏ","Cả   nhận, phân tích, phán đoán","Tập trung, phản xạ, ứng biến"]},{"q":"Loại trí nhớ có  hả năng lưu giữ thông tin trong  hoảng thời gian từ vài giây đến vài phút được gọi là:","o":["Trí nhớ ngắn hạn","Trí nhớ tức thì","Trí nhớ dài hạn","Trí nhớ cả   xúc"]},{"q":"Ba giai đoạn chính của quá trình ghi nhớ theo thứ tự logic là gì?","o":["ã hóa → Lưu trữ → Tái hiện","Lưu trữ →   ã hóa → Tái hiện","Tái hiện →   ã hóa → Lưu trữ","ã hóa → Tái hiện → Lưu trữ"]},{"q":"Tổng hợp những đặc điể   tâ   lý, đạo đức, trí tuệ và năng lực xã hội được hình thành trong quá trình sống, học tập và lao động gọi là:","o":["Nhân cách","hí chất","Tính cách","Ý thức"]},{"q":"Đặc điể   nào sau đây  HÔNG phải là đặc điể   cơ bản của nhân cách?","o":["Tính bẩ   sinh  hông bao giờ thay đổi","Tính ổn định nhưng phát triển","Tính độc đáo, riêng biệt","Tính tổng hợp và tính xã hội"]},{"q":"Phẩ   chất đạo đức nghề nghiệp nào dưới đây là nền tảng cốt lõi của nhân cách người thầy thuốc?","o":["Trung thực, tận tâ  , tôn trọng người bệnh","Tha   vọng cá nhân và thăng tiến nhanh","Đương đầu với   ọi rủi ro  hông cần tính toán","Cứng rắn,  hông cần đồng cả   với nỗi đau bệnh nhân"]},{"q":"Yếu tố nào sau đây giữ đóng vai trò là tiền đề sinh học cho sự hình thành nhân cách?","o":["Di truyền và cấu trúc hệ thần  inh","Giáo dục nhà trường","ôi trường văn hóa xã hội","Trải nghiệ   nhó   bạn bè"]},{"q":"ôi trường đầu tiên và có ảnh hưởng trực tiếp nhất đến sự hình thành nhân cách từ thời thơ ấu là:","o":["Gia đình","Nhà trường","Bạn đồng lứa","ạng xã hội"]},{"q":"Cấu trúc não bộ nào đóng vai trò đặc biệt quan trọng trong việc điều hòa cả   xúc, trí nhớ và động lực hành vi?","o":["Hệ Li  bic","Tủy sống","Tiểu não","Hành não"]},{"q":"Hor  one nào sau đây liên quan trực tiếp đến phản ứng stress và trạng thái lo âu của con người?","o":["Cortisol","Insulin","Thyroxine","Growth Hor  one (GH)"]},{"q":"Yếu tố nào giữ vai trò CHỦ ĐẠO trong sự hình thành và phát triển nhân cách theo chuẩn   ực xã hội?","o":["Yếu tố giáo dục","Yếu tố di truyền","ôi trường tự nhiên","ay   ắn ngẫu nhiên"]},{"q":"hi bác sĩ dùng ống nghe để nghe tiếng rì rào phế nang của bệnh nhân, bác sĩ đang sử dụng hình thức nhận thức nào là chủ yếu?","o":["Nhận thức cả   tính","Nhận thức lý tính","Tư duy trừu tượng","Suy luận logic"]},{"q":"Bác sĩ tổng hợp các triệu chứng sốt cao, ban đỏ, giả   tiểu cầu để đưa ra chẩn đoán 'Sốt xuất huyết Dengue'. Đây là biểu hiện của quá trình nào?","o":["Nhận thức lý tính","Nhận thức cả   tính đơn thuần","Tái hiện trí nhớ cả   xúc","Phản xạ  hông điều  iện"]},{"q":"So với nhận thức cả   tính, nhận thức lý tính có đặc điể   nào sau đây?","o":["Chậ   hơn,   ang tính trừu tượng, chính xác và phản ánh bản chất sự vật","Nhanh chóng, trực tiếp, sinh động nhưng dễ nhầ   lẫn","Phản ánh trực tiếp các bề ngoài của sự vật","hông cần sử dụng dữ liệu từ các giác quan"]},{"q":"Sinh viên y  hoa ghi nhớ số lượng, liều lượng thuốc cần cấp cứu ngay trong ca trực. Loại trí nhớ này chủ yếu là:","o":["Trí nhớ ngắn hạn","Trí nhớ dài hạn","Trí nhớ vận động","Trí nhớ cả   xúc"]},{"q":"Theo định nghĩa trong  hoa học hành vi, hành vi con người được hiểu là:","o":["Phản ứng hoặc hoạt động có thể quan sát được của con người đối với   ôi trường.","Các suy nghĩ và cả   xúc nội tâ    hông bao giờ biểu hiện ra bên ngoài.","Những phản xạ sinh học bẩ   sinh  hông thể thay đổi theo thời gian.","Các hoạt động giao tiếp bằng lời nói giữa người bệnh và nhân viên y tế."]},{"q":"Đặc điể   nào dưới đây  hông phải là đặc điể   cơ bản của hành vi con người?","o":["Bắt buộc phải được quy định bằng các văn bản pháp luật.","Có thể quan sát được thông qua hành động, lời nói, cử chỉ.","Có tính   ục đích nhằ   đạt được   ột tiêu chí/  ục tiêu nhất định.","ang tính đa dạng và chịu ảnh hưởng bởi nhiều yếu tố tác động."]},{"q":"Lực lượng nào dưới đây thuộc nhó   \"hành vi sức  hỏe\"?","o":["Tiê   chủng phòng bệnh đầy đủ.","Hút thuốc lá thường xuyên.","Tự ý bỏ điều trị lao.","Uống rượu bia quá   ức."]},{"q":"Phản xạ co giật, nôn hoặc ho  hi có dị vật thuộc loại hành vi nào?","o":["Hành vi tự nhiên.","Hành vi xã hội.","Hành vi có   ục đích.","Hành vi sai lệch xã hội."]},{"q":"Đặc điể   chính của hành vi tự nhiên là gì?","o":["ang tính bẩ   sinh,  hông cần qua học tập.","Chịu sự chi phối hoàn toàn bởi văn hóa địa phương.","Luôn có sự lập  ế hoạch tỉ   ỉ trước  hi thực hiện.","Được điều chỉnh bằng các quy định pháp luật."]},{"q":"Yếu tố sinh lý nào dưới đây đóng vai trò quy định các đặc điể   cơ bản như tính cách, năng lực vận động và phản xạ của cá nhân?","o":["Yếu tố di truyền (Gen).","Niề   tin tôn giáo.","ôi trường là   việc.","Trình độ học vấn."]},{"q":"Quá trình tâ   lý nào bao gồ   niề   tin,  iến thức và thái độ trực tiếp ảnh hưởng đến quyết định và hành động của con người?","o":["Nhận thức.","Nội tiết.","Di truyền.","Văn hóa."]},{"q":"Hệ thống các quy tắc, giá trị,  huôn   ẫu xã hội nhằ   điều chỉnh hành vi cá nhân được gọi là:","o":["Chuẩn   ực hành vi.","Lập trường cá nhân.","Phản xạ có điều  iện.","Động cơ tâ   lý."]},{"q":"Dạng chuẩn   ực nào do Nhà nước quy định,   ang tính bắt buộc chung và có chế tài xử lý vi phạ  ?","o":["Chuẩn   ực pháp luật.","Chuẩn   ực đạo đức.","Chuẩn   ực phong tục.","Chuẩn   ực văn hóa."]},{"q":"Việc nhân viên y tế tôn trọng quyền riêng tư, bảo   ật thông tin và  hông phân biệt đối xử với người bệnh thuộc hệ thống chuẩn   ực nào?","o":["Chuẩn   ực đạo đức nghề nghiệp (Y đức).","Chuẩn   ực chuyên   ôn  ỹ thuật.","Chuẩn   ực phong tục tập quán.","Chuẩn   ực pháp luật hành chính."]},{"q":"Hành vi chấp hành đúng quy trình  ỹ thuật rửa tay ngoại  hoa của phẫu thuật viên là tuân thủ loại chuẩn   ực nào?","o":["Chuẩn   ực Chuyên   ôn  ỹ thuật.","Chuẩn   ực Phong tục tập quán.","Chuẩn   ực Giao tiếp xã hội.","Chuẩn   ực Tín ngưỡng."]},{"q":"\"Hành vi cá nhân\" được định nghĩa là:","o":["Bất  ỳ hoạt động, phản ứng nào của cá nhân dựa trên suy nghĩ, cả   xúc và nhu cầu riêng.","Quy tắc ứng xử chung do Nhà nước ban hành.","Các hành vi giao tiếp tuân theo quy chuẩn của tập thể.","Các phản ứng sinh học  hông chịu tác động bởi   ôi trường."]},{"q":"Biểu hiện nào sau đây phản ánh sự sai lệch hành vi cá nhân trong y  hoa?","o":["Bác sĩ bỏ qua triệu chứng nhỏ do chủ quan, dẫn đến chẩn đoán sai.","Nhân viên y tế từ chối nhận quà biếu của bệnh nhân.","Sinh viên y  hoa tha   gia chiến dịch tiê   chủng cộng đồng.","Điều dưỡng tuân thủ nghiê   ngặt y lệnh điều trị."]},{"q":"Hành vi xã hội sai lệch là hành vi:","o":["hông phù hợp với chuẩn   ực xã hội, gây xung đột hoặc nguy hại cho cộng đồng.","Phù hợp với   ong   uốn cá nhân nhưng  hông đạt hiệu quả.","ang tính bản năng nhằ   duy trì sự sống.","Bị chi phối duy nhất bởi các yếu tố sinh học."]},{"q":"Yếu tố nào sau đây là nguyên nhân từ phía xã hội/  ôi trường dẫn đến sai lệch hành vi của nhân viên y tế?","o":["Quy trình là   việc  hông rõ ràng, thiếu sự giá   sát.","Bản thân thiếu  iến thức chuyên   ôn.","Trạng thái   ệt   ỏi thể chất của cá nhân.","Nhận thức sai lệch về ưu tiên cá nhân."]},{"q":"Biện pháp nào dưới đây hướng đến việc  hắc phục sai lệch hành vi cá nhân?","o":["Tự đánh giá và rèn luyện  ỹ năng quản lý cả   xúc, stress.","Xây dựng văn hóa là   việc lành   ạnh trong   ôi trường y tế.","Thiết lập quy chế  hen thưởng và  ỷ luật của bệnh viện.","Cải tiến quy trình báo cáo sự cố y  hoa toàn diện."]},{"q":"ột người bệnh bị chẩn đoán ung thư tiến triển nhưng nhất quyết từ chối phác đồ hóa trị vì nghe tin đồn \"hóa trị là   bệnh nhân chết nhanh hơn\". Xét về góc độ  hoa học hành vi, nguyên nhân chính dẫn đến hành vi né tránh này là:","o":["Do nhận thức sai lệch xuất phát từ thông tin  hông chính xác và tâ   lý sợ hãi.","Do phản xạ tự nhiên của cơ thể đối với hóa chất.","Do người bệnh cố tình vi phạ   chuẩn   ực pháp luật y tế.","Do sự suy giả   thể chất  hiến người bệnh  hông đủ năng lực hành vi."]},{"q":"Hoạt động nhó   giữa bác sĩ, điều dưỡng và dược sĩ lâ   sàng để lập  ế hoạch điều trị cho   ột ca bệnh phức tạp được xếp vào loại hành vi nào?","o":["Hành vi xã hội và hành vi có   ục đích.","Hành vi tự nhiên.","Hành vi bản năng   ang tính sinh học.","Hành vi đáp ứng phản xạ  hông điều  iện."]},{"q":"Người bệnh sau phẫu thuật lớn chịu cơn đau cấp tính thường xuất hiện thái độ cáu  ỉnh, gắt gỏng và né tránh việc thă    há   của bác sĩ. Yếu tố chính chi phối hành vi này của người bệnh là gì?","o":["Yếu tố sinh lý (đau đớn thể chất).","Yếu tố văn hóa - tâ   linh.","Yếu tố pháp lý hành chính.","Yếu tố   ôi trường bệnh viện quá tải."]},{"q":"Trường hợp   ột bệnh nhân   ắc tiểu đường tuýp     iên trì thực hiện chế độ ăn  iêng nghiê   ngặt và tập thể dục hằng ngày nhằ     ục tiêu  iể   soát chỉ số HbA1c thể hiện sự tác động rõ rệt nhất của yếu tố tâ   lý nào?","o":["Động cơ và nhu cầu cải thiện sức  hỏe.","Căng thẳng tiêu cực (Stress).","Phản ứng sợ hãi sự trừng phạt.","Định  iến xã hội."]},{"q":"Đạo đức được định nghĩa là gì?","o":["Hệ thống các chuẩn   ực, nguyên tắc nhằ   điều chỉnh hành vi con người trong   ối quan hệ với người  hác và xã hội.","Hệ thống các văn bản  đoán","Chờ người nhà đến  ý ca    ết rồi   ới tiến hành xử trí"]},{"q":"Điều    trong 12 Điều y đức quy định như thế nào về tác phong là   việc của người cán bộ y tế trong ca trực/nhiệ   vụ?","o":["hông được rời bỏ vị trí trong  hi là   nhiệ   vụ, theo dõi và xử trí  ịp thời các diễn biến của người bệnh","Được phép rời vị trí nếu đã bàn giao bằng   iệng","Được nghỉ ngơi ngoài vị trí là   việc nếu bệnh nhân đã ổn định","Phân công cho học viên, sinh viên theo dõi thay để xử lý công việc cá nhân"]},{"q":"Theo Điều    trong 12 Điều y đức, nhân viên y tế phải là   gì  hi người bệnh ra viện?","o":["Dặn dò chu đáo, hướng dẫn họ tiếp tục điều trị, tự chă   sóc và giữ gìn sức  hỏe","Thu hồi lại toàn bộ hồ sơ bệnh án cá nhân của người bệnh","Yêu cầu người bệnh  ý ca    ết  hông quay lại  hi reo rắc biến chứng","Chỉ cần đưa giấy ra viện và thu tiền viện phí"]},{"q":"Theo Điều    trong 12 Điều y đức,  hi người bệnh tử vong, thái độ và ứng xử chuẩn   ực của nhân viên y tế là gì?","o":["Thông cả   sâu sắc, chia buồn và hướng dẫn, giúp đỡ gia đình họ là   các thủ tục cần thiết","Nhanh chóng di chuyển tử thi ra  hỏi  hoa để tránh ảnh hưởng tâ   lý bệnh nhân  hác","Báo cảnh sát trước  hi giải thích cho gia đình người bệnh","Ủy quyền hoàn toàn cho nhân viên nhà hộ táng tự xử lý"]},{"q":"Lời dạy nổi tiếng của Chủ tịch Hồ Chí   inh đối với ngành Y tế được trích dẫn trong bài giảng là gì?","o":["Lương y phải như từ   ẫu","Thầy thuốc giỏi trước hết phải là người hiền","Đạo y là đạo cứu người","Bác sĩ như người   ẹ hiền"]},{"q":"Theo Điều 11 trong 12 Điều y đức,  hi bản thân xảy ra sai sót chuyên   ôn, người cán bộ y tế phải có thái độ như thế nào?","o":["Tự giác nhận trách nhiệ   về   ình,  hông đổ lỗi cho đồng nghiệp, cho tuyến trước","Tì   lý do  hách quan để giải thích cho người bệnh","Báo cáo cấp trên và giữ  ín thông tin với đồng nghiệp","Nhờ đồng nghiệp đứng ra nhận thay để giả   bớt hình phạt"]},{"q":"Theo Điều 12 trong 12 Điều y đức, nhiệ   vụ của người thầy thuốc đối với cộng đồng bao gồ   nội dung nào?","o":["Hăng hái tha   gia công tác thông tin - giáo dục sức  hỏe, phòng chống dịch bệnh, cấp cứu tại cộng đồng","Tổ chức các đợt bán thuốc  huyến   ãi tại cộng đồng","Tập trung là   công tác  há   chữa bệnh tại viện, hạn chế tha   gia hoạt động xã hội","Chỉ tha   gia chống dịch  hi có lệnh điều động  hẩn cấp từ Bộ Y tế"]},{"q":"Theo Điều    trong 12 Điều y đức, điều  iện BẮT BUỘC để đưa người bệnh/người tha   gia vào các thử nghiệ   lâ   sàng, phương pháp chẩn đoán hoặc điều trị   ới là gì?","o":["Sự cho phép của Bộ Y tế và sự chấp nhận của người bệnh","Sự đồng ý của Giá   đốc bệnh viện và Trưởng  hoa","Sự bảo lãnh tài chính từ đơn vị tài trợ nghiên cứu","Quyết định của Hội đồng  hoa học cơ sở"]},{"q":"Theo Điều    trong 12 Điều y đức, hành vi nào sau đây bị CẤ   trong giao tiếp và cung cấp dịch vụ y tế?","o":["Có thái độ ban ơn, lạ   dụng nghề nghiệp, gây phiền hà cho người bệnh","Ưu tiên  há   bệnh cho đối tượng chính sách xã hội","Giữ  ín bí   ật riêng tư của người bệnh  hi thă    há","Phổ biến quyền lợi và nghĩa vụ của người bệnh  hi nhập viện"]},{"q":"Điều    trong 12 Điều y đức yêu cầu người thầy thuốc phải giải thích điều gì cho người bệnh hoặc gia đình người bệnh?","o":["Tình hình bệnh tật để hiểu cùng hợp tác điều trị; phổ biến chế độ, chính sách, quyền lợi và nghĩa vụ của người bệnh","Toàn bộ giá thành nhập  hẩu của các loại vật tư y tế","Lý do nhân viên y tế bị quá tải công việc","Các quy định xử phạt vi phạ   hành chính trong bệnh viện"]},{"q":"Nội dung nào dưới đây thể hiện nguyên tắc  ê đơn thuốc an toàn và hợp lý theo Điều    trong 12 Điều y đức?","o":["ê đơn phù hợp với chẩn đoán và bảo đả   sử dụng thuốc hợp lý, an toàn;  hông vì lợi ích cá nhân   à giao thuốc  é   chất lượng","ê đơn theo nguyện vọng cá nhân của người bệnh hoặc gia đình","Ưu tiên  ê các loại thuốc ngoại đắt tiền để đả   bảo hiệu quả điều trị tối đa","ê đơn theo các   ẫu có sẵn do công ty dược phẩ   tài trợ"]},{"q":"Hệ thống các giá trị, chuẩn   ực được hình thành, bồi đắp qua hàng nghìn nă   dựng nước và giữ nước, được cộng đồng thừa nhận và lưu truyền gọi là gì?","o":["Đạo đức truyền thống","Pháp luật quốc gia","Quy chuẩn  ỹ thuật y tế","Điều lệ hiệp hội nghề nghiệp"]},{"q":"ột trong những đặc điể   nổi bật của đạo đức truyền thống Việt Na   là:","o":["Tính bền vững, lâu đời gắn liền với lịch sử dân tộc","Tính biến đổi liên tục  hông  ế thừa","Tính áp đặt bắt buộc bằng chế tài hành chính","Tính tách rời  hỏi đời sống cộng đồng"]},{"q":"Câu ca dao \"Thương người như thể thương thân\" phản ánh giá trị đạo đức truyền thống nào của dân tộc Việt Na  ?","o":["Lòng nhân ái, tinh thần thương người","Lòng yêu nước, ý chí tự cường","Truyền thống hiếu học","Cần cù, dũng cả   trong lao động"]},{"q":"Truyền thống \"Tôn sư trọng đạo\", \"Nhất tự vi sư, bán tự vi sư\" nhắc nhở sinh viên y  hoa điều gì trong rèn luyện?","o":["Học tập suốt đời, tôn trọng người đi trước và truyền đạt  iến thức cho thế hệ sau","Chỉ học tập  hi có sự giá   sát của thầy cô","Tuyệt đối  hông phản biện các ý  iến y học của thế hệ trước","Tập trung vào thực hành lâ   sàng, bỏ qua học lý thuyết"]},{"q":"Tư tưởng đạo đức Hồ Chí   inh được hình thành từ những nguồn gốc nào sau đây?","o":["Truyền thống đạo đức dân tộc, tinh hoa văn hóa nhân loại, chủ nghĩa   ác – Lênin và  inh nghiệ   thực tiễn","Chỉ dựa trên chủ nghĩa   ác – Lênin và  inh nghiệ   đấu tranh cách   ạng","Chỉ tiếp thu triết học Nho giáo và Phật giáo Đông Phương","Tiếp thu toàn bộ văn hóa phương Tây  hông qua chọn lọc"]},{"q":"Theo tư tưởng Hồ Chí   inh, nội dung cốt lõi của \"Trung với nước, hiếu với dân\" đối với người hành nghề y là gì?","o":["Đặt quyền lợi sức  hỏe người bệnh và cộng đồng lên trên lợi ích cá nhân","Đặt lợi ích cá nhân lên trên để phát triển phòng  há   riêng","Chỉ phục vụ những người bệnh có đóng góp cho nhà nước","Ưu tiên giải quyết các công việc quản lý hành chính trước  CB"]},{"q":"Trong phẩ   chất \"Cần,  iệ  , Liê  , Chính, Chí công vô tư\", chữ \"Liê  \" đối với người thầy thuốc được hiểu là:","o":["Trong sạch,  hông tha   nhũng,  hông lạ   dụng chức quyền","Siêng năng, nhiệt tình trong chă   sóc người bệnh","Tiết  iệ   vật tư, tránh lãng phí trang thiết bị y tế","Chính trực, công bằng trong phân loại bệnh nhân"]},{"q":"Quan điể   \"Nói đi đôi với là  , nêu gương đạo đức\" của Bác Hồ đòi hỏi sinh viên y  hoa phải là   gì?","o":["Tự rèn luyện, là   gương cho đồng nghiệp, người bệnh và xã hội","Tuyên truyền đạo đức nhưng ưu tiên thực hành  ỹ thuật chuyên   ôn","Đòi hỏi người  hác tuân thủ đạo đức trước  hi bản thân thực hiện","Chỉ nêu gương  hi là   việc ở các bệnh viện công lập"]},{"q":"hái niệ   \"Y đức\" được hiểu đầy đủ là gì?","o":["Tập hợp các phẩ   chất đạo đức và chuẩn   ực nghề nghiệp   à người thầy thuốc cần có trong quá trình chă   sóc, bảo vệ sức  hỏe nhân dân","Tập hợp các quy định pháp luật xử phạt vi phạ   ngành y","Danh   ục các  ỹ năng lâ   sàng bác sĩ phải hoàn thành","Lời thề Hippocrates áp dụng bắt buộc tại tất cả các quốc gia"]},{"q":"Nội dung nào sau đây  HÔNG thuộc các thành tố cơ bản của Y đức?","o":["Lợi nhuận tài chính của cơ sở  há   chữa bệnh","Lòng nhân ái và tinh thần trách nhiệ","Trung thực, công bằng và phong cách ứng xử đúng   ực","Chuyên   ôn  ết hợp với đạo đức"]},{"q":"Y đức có vai trò trực tiếp nào đối với chất lượng  há   chữa bệnh?","o":["Giúp thầy thuốc thực hiện đầy đủ, cẩn trọng các quy trình y  hoa, tránh sai sót nguy hiể","Thay thế hoàn toàn cho   áy   óc và thiết bị y tế hiện đại","Rút ngắn thời gian điều trị lâ   sàng xuống   ột nửa","Tự động  hỏi bệnh  hông cần dùng thuốc"]},{"q":"ột trong những   ặt tích cực của công tác giáo dục y đức hiện nay tại các trường y dược là:","o":["ôn Y đức - Đạo đức nghề nghiệp được đưa vào chương trình đào tạo chính quy từ đại cương đến lâ   sàng","Đã loại bỏ hoàn toàn các   ôn học lý thuyết để tập trung thực hành","Chỉ tổ chức giảng dạy cho đối tượng sau đại học","Giao hoàn toàn việc rèn luyện y đức cho sinh viên tự tì   hiểu"]},{"q":"Thách thức nào dưới đây đang ảnh hưởng tiêu cực đến tính nhân văn trong chă   sóc người bệnh hiện nay?","o":["Áp lực công việc, quá tải bệnh viện và sự tác động của cơ chế thương   ại hóa y tế","Số lượng người bệnh quá ít gây giả   trải nghiệ   thực tế","ôi trường y tế quá an toàn và  hông có rủi ro","Sự hỗ trợ quá   ức của các quỹ từ thiện y tế"]},{"q":"Bộ phẩ   chất đạo đức cốt lõi của người thầy thuốc cách   ạng được tó   tắt thành những yếu tố nào?","o":["Tâ   đức - Trí đức - Phong cách đạo đức - Tinh thần cách   ạng","Danh - Lợi - Tài - Quyền","Lý luận - Thực hành -  ỹ thuật - Doanh thu","Thái độ - Hành vi -  ỷ luật - Tài chính"]},{"q":"Phẩ   chất \"Tâ   đức\" của người thầy thuốc cách   ạng thể hiện rõ nhất qua nội dung nào?","o":["Yêu nghề, yêu người bệnh, luôn đặt sức  hỏe và tính   ạng người bệnh lên trên hết","Đạt được nhiều bằng cấp và học hà    hoa học cao","Sử dụng thành thạo các thiết bị chẩn đoán đắt tiền","Quản lý tài chính bệnh viện chặt chẽ"]},{"q":"Yêu cầu \"Trí đức\" của người thầy thuốc cách   ạng đòi hỏi điều gì?","o":["hông ngừng học tập nâng cao trình độ chuyên   ôn, áp dụng  H T   ới và sử dụng  iến thức có đạo đức","Chỉ cần học   ột lần trong trường đại học là đủ hành nghề cả đời","Lạ   dụng tối đa  ỹ thuật cao để tăng doanh thu cho bệnh viện","Tập trung nghiên cứu lý thuyết,  hông cần áp dụng thực tiễn"]},{"q":"Biểu hiện nào sau đây thuộc về \"Phong cách đạo đức\" của người thầy thuốc?","o":["hiê   tốn, biết lắng nghe, đồng cả   và trung thực, công bằng","Cộc cằn, gắt gỏng  hi người bệnh hỏi nhiều","Phân biệt đối xử giữa bệnh nhân giàu và bệnh nhân nghèo","Che giấu sai sót chuyên   ôn đối với cấp trên"]},{"q":"Trong quá trình đào tạo chính quy, biện pháp nào giúp sinh viên y  hoa rèn luyện y đức hiệu quả?","o":["Lồng ghép Y đức vào chương trình học, thực hành lâ   sàng và tha   gia các hoạt động cộng đồng","Cho sinh viên tự đọc tài liệu ở nhà   à  hông cần thảo luận tình huống","Chỉ tổ chức thi lý thuyết vào cuối  hóa học","Cách ly sinh viên  hỏi các tình huống giao tiếp với người bệnh thực tế"]},{"q":"Vai trò của cơ sở y tế và cơ quan quản lý trong việc nâng cao y đức là gì?","o":["Giá   sát, đánh giá,  hen thưởng  ịp thời cán bộ là   tốt và xử lý nghiê   các hành vi vi phạ","Bỏ qua các vi phạ   nhỏ để giữ uy tín cho bệnh viện","Giao toàn bộ trách nhiệ   theo dõi đạo đức cho người bệnh","hông cần xây dựng tiêu chí đánh giá y đức"]},{"q":"Cơ sở triết học cho việc giáo dục đạo đức thầy thuốc XHCN dựa trên:","o":["Triết học   ác – Lênin và Tư tưởng Hồ Chí   inh về y đức","Triết học hiện sinh phương Tây","Học thuyết  inh tế thị trường tự do","Các quy tắc tôn giáo cổ đại"]},{"q":"Giao tiếp là hoạt động gì giữa con người với con người?","o":["Giao lưu, tiếp xúc nhằ   tạo ra hoặc chia sẻ thông tin, cả   xúc để đạt   ục đích","ua bán, trao đổi hàng hóa dịch vụ theo cơ chế thị trường","Truyền đạt thông tin   ột chiều từ người quản lý đến cấp dưới","Tranh luận để phân định đúng sai trong các vấn đề xã hội"]},{"q":"Phương tiện giao tiếp bao gồ   các yếu tố nào?","o":["Cả phương tiện ngôn ngữ và phi ngôn ngữ","Chỉ bao gồ   ngôn ngữ nói","Chỉ bao gồ   ngôn ngữ viết","Chỉ bao gồ   hình ảnh và  ý hiệu"]},{"q":"ô hình SBI dùng trong  ỹ năng đưa phản hồi là viết tắt của ba từ tiếng Anh nào?","o":["Situation - Behavior - I  pact","Syste   - Behavior - I  pact","Situation - Belief - Idea","Solution - Behavior - I  prove  ent"]},{"q":"Đối tượng nào sau đây được xếp vào nhó   người bệnh đặc biệt?","o":["Người bệnh nhi, người cao tuổi, người bệnh có rối loạn tâ   trí/ hó tính","Người bệnh thanh thiếu niên có sức  hỏe bình thường","Người bệnh tái  há   định  ỳ đúng hẹn","Sinh viên y  hoa đi thực tập lâ   sàng"]},{"q":"hái niệ   \"Ứng xử\" trong giao tiếp được hiểu là gì?","o":["Cách thức con người lựa chọn để đối xử với nhau và là phản ứng  hi nhận được cách đối xử của người  hác","Tập hợp các quy định pháp luật bắt buộc   ọi người phải tuân thủ","Thái độ i   lặng  hi xảy ra xung đột hoặc bất đồng ý  iến","hả năng thuyết phục người  hác tuân theo quan điể   cá nhân"]},{"q":"Văn hóa giao tiếp ứng xử được định nghĩa như thế nào?","o":["Là những hành vi ứng xử đạt   ục đích giao tiếp,   ang lại sự hài lòng và phù hợp với hoàn cảnh cụ thể","Là việc tuân thủ tuyệt đối các nghi lễ truyền thống cổ xưa","Là  ỹ năng nói chuyện lưu  hoát trước đá   đông","Là việc luôn luôn đồng ý với   ọi ý  iến của đối phương"]},{"q":"ột trong những vai trò quan trọng của giao tiếp trong  há   chữa bệnh là gì?","o":["Tạo niề   tin với người bệnh, cải thiện hiệu quả chẩn đoán và điều trị","Thay thế cho các xét nghiệ   cận lâ   sàng","Giả   bớt số lượng nhân viên y tế cần thiết tại bệnh viện","Rút ngắn thời gian đào tạo bác sĩ chuyên  hoa"]},{"q":"Yếu tố nào sau đây thuộc về giao tiếp phi ngôn ngữ?","o":["Cử chỉ, tư thế, ánh   ắt và biểu cả    huôn   ặt","Từ ngữ chuyên ngành y  hoa","Tờ hướng dẫn sử dụng thuốc","Lời dặn trực tiếp của bác sĩ"]},{"q":"Hành động nào thể hiện  ỹ năng \"Lắng nghe tích cực\"  hi giao tiếp với người bệnh?","o":["Dành sự chú ý hoàn toàn, gật đầu và hỏi lại để xác nhận thông tin","Liên tục ngắt lời người bệnh để tiết  iệ   thời gian","Vừa ghi chép hồ sơ vừa nói chuyện   à  hông nhìn người bệnh","Đưa ra chẩn đoán ngay  hi người bệnh   ới nói câu đầu tiên"]},{"q":"Để đả   bảo nguyên tắc ngôn ngữ rõ ràng, dễ hiểu  hi giải thích cho người bệnh, thầy thuốc nên là   gì?","o":["Tránh dùng thuật ngữ y  hoa  hó hiểu, dùng câu ngắn và thông tin cụ thể","Sử dụng tối đa các thuật ngữ y  hoa tiếng Anh chuyên ngành","Nói thật nhanh để cung cấp được nhiều thông tin nhất","Chỉ nói những từ ngữ chung chung,   ơ hồ"]},{"q":"Phản hồi trong y tế được hiểu là gì?","o":["Thông tin được truyền đạt về hành vi hoặc  ết quả của người  hác để cải thiện hiệu quả công việc/học tập","Việc phê bình cấp dưới trước   ặt đồng nghiệp","Sự từ chối thực hiện nhiệ   vụ được giao","Báo cáo định  ỳ hàng tháng của  hoa phòng"]},{"q":"hác biệt cốt lõi giữa phản hồi xây dựng và sự chỉ trích là gì?","o":["Phản hồi xây dựng tập trung vào hành vi cụ á","Không chứa tế bào mô khuyết"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình","e":"Thực vật C4 có cấu trúc giải phẫu Kranz (tế bào bao bao mạch chứa lục lạp đảm nhận chu trình Calvin)."},{"q":"Điểm khác biệt chính giữa dòng electron không vòng và dòng electron vòng trong pha sáng là gì?","o":["Dòng electron không vòng cần cả PSII và PSI, tạo ra ATP, NADPH và O2","Dòng electron vòng tạo ra cả ATP và NADPH","Dòng electron vòng giải phóng lượng O2 lớn hơn","Dòng electron không vòng không cần sự tham gia của H2O"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình","e":"Dòng e- không vòng trải qua cả PSII và PSI tạo ATP, NADPH và O2; dòng e- vòng chỉ qua PSI tạo duy nhất ATP."},{"q":"Enzyme PEP carboxylase ở thực vật C4 và CAM có ưu điểm gì vượt trội so với enzyme RuBisCO?","o":["Không có hoạt tính oxygenase và có lực gắn kết (ái lực) rất cao với CO2","Có thể tổng hợp ATP trực tiếp","Hoạt động không cần nước","Xúc tác được cả phản ứng phân hủy Glucose"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình","e":"PEP carboxylase chỉ cố định CO2, không liên kết với O2 nên không gây ra hiện tượng hô hấp sáng."},{"q":"Trong hô hấp sáng, ba bào quan nào tham gia phối hợp thực hiện biến đổi hóa học?","o":["Lục lạp, Ti thể, Peroxisome","Lục lạp, Không bào, Bộ máy Golgi","Ti thể, Nhai bào, Lưới nội chất","Lục lạp, Nhân, Ti thể"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình","e":"Hô hấp sáng đòi hỏi sự hợp tác liên hoàn của 3 bào quan: Lục lạp -> Peroxisome -> Ti thể."},{"q":"Sự phân không gian cố định CO2 ở thực vật C4 diễn ra cụ thể giữa hai loại tế bào nào?","o":["Cố định ban đầu ở tế bào mô màng giậu, chu trình Calvin ở tế bào bao bao mạch","Cố định ban đầu ở tế bào bao bao mạch, chu trình Calvin ở tế bào mô màng giậu","Cố định ban đầu ở biểu bì, chu trình Calvin ở khí khổng","Cố định ban đầu ở rễ, chu trình Calvin ở lá"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó","e":"Ở thực vật C4, CO2 được gắn vào PEP tại tế bào mô giậu tạo malate/OAA, sau đó chuyển sang tế bào bao bao mạch giải phóng CO2 cho RuBisCO."},{"q":"Nếu chiếu ánh sáng có bước sóng đơn sắc 700 nm vào hệ thống quang hợp thực vật, điều gì sẽ xảy ra đối với các sản phẩm của pha sáng?","o":["Chỉ tạo ra ATP (dòng e- vòng), không giải phóng O2 và không tạo NADPH","Tạo ra cả ATP, NADPH và O2 bình thường","Chỉ tạo ra NADPH và O2","Ngừng toàn bộ hoạt động tổng hợp ATP"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó","e":"Ánh sáng 700nm chỉ kích thích được PSI (P700), không kích thích được PSII (P680) nên không có quang phân nước (không O2) và diễn ra truyền e- vòng tạo ATP."},{"q":"Thực vật CAM tránh mất nước trong môi trường hoang mạc khô hạn bằng cách tách biệt hai quá trình cố định CO2 theo cơ chế nào?","o":["Tách biệt về vị trí bào quan trong cùng tế bào","Tách biệt về mặt không gian (Hai loại tế bào khác nhau)","Không cần cố định CO2 mà dùng trực tiếp carbon hữu cơ từ đất"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó","e":"Thực vật CAM sử dụng sự phân chia thời gian: mở khí khổng ban đêm tích trữ malate trong không bào, ban ngày đóng khí khổng và giải phóng CO2 cho chu trình Calvin."},{"q":"Chất hóa học DCMU (Diuron) diệt cỏ bằng cách ngăn cản dòng truyền electron giữa PSII và Plastoquinone. Tác động trực tiếp nhất của DCMU lên quang hợp là gì?","o":["Ngừng dòng electron không vòng, dừng tạo NADPH và O2","Ức chế trực tiếp enzyme RuBisCO ở pha tối","Làm thủng màng thylakoid gây rò rỉ H+","Tăng cường dòng electron vòng ở PSI"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó","e":"DCMU chặn chuỗi truyền electron ở ngay sau PSII làm dừng sự giải phóng O2 và không thể truyền e- tạo NADPH."},{"q":"Tại sao năng suất sinh học của thực vật C4 thường cao hơn nhiều so với thực vật C3 trong điều kiện nhiệt độ cao và ánh sáng mạnh?","o":["Vì thực vật C4 không có hiện tượng hô hấp sáng lãng phí năng lượng nhờ cơ chế bơm tập trung CO2 quanh RuBisCO","Vì thực vật C4 sử dụng ít năng lượng ATP hơn ở pha tối","Vì thực vật C4 hấp thụ được cả ánh sáng hồng ngoại","Vì lục lạp của thực vật C4 chứa lượng diệp lục gấp 10 lần thực vật C3"],"ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó","e":"Thực vật C4 loại bỏ được hô hấp sáng nhờ nồng độ CO2 tại tế bào bao bao mạch luôn cao, giúp tối ưu hóa hiệu suất quang hợp."},{"q":"Quá trình nguyên phân xảy ra chủ yếu ở loại tế bào nào trong cơ thể sinh vật đa bào?","o":["Tế bào sinh dưỡng (soma) và tế bào sinh dục sơ khai","Tế bào sinh dục chín","Giao tử đực","Giao tử cái"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Nguyên phân diễn ra ở tế bào sinh dưỡng và tế bào sinh dục sơ khai để giúp cơ thể lớn lên và tái tạo mô."},{"q":"Sự nhân đôi của DNA và nhiễm sắc thể (NST) diễn ra ở pha nào của kỳ trung gian?","o":["Pha S","Pha G1","Pha G2","Kỳ đầu"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Pha S (Synthesis) là pha tổng hợp DNA và nhân đôi nhiễm sắc thể."},{"q":"Một tế bào lưỡng bội (2n) sau 1 lần nguyên phân bình thường sẽ tạo ra bao nhiêu tế bào con?","o":["2 tế bào con (2n)","1 tế bào con (2n)","4 tế bào con (n)","2 tế bào con (n)"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Nguyên phân từ 1 tế bào mẹ 2n tạo ra 2 tế bào con có bộ NST 2n giống hệt nhau và giống tế bào mẹ."},{"q":"Các nhiễm sắc thể co xoắn cực đại và có hình thái đặc trưng rõ nhất ở kỳ nào của nguyên phân?","o":["Kỳ giữa","Kỳ đầu","Kỳ sau","Kỳ cuối"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Tại kỳ giữa, NST co xoắn cực đại, giúp quan sát hình thái NST rõ nhất dưới kính hiển vi."},{"q":"Ở kỳ giữa của nguyên phân, các nhiễm sắc thể tập trung thành mấy hàng trên mặt phẳng phân chia của thoi phân bào?","o":["1 hàng","2 hàng","3 hàng","Tập trung hỗn loạn không thành hàng"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Trong nguyên phân, các NST kép xếp thành 1 hàng trên mặt phẳng xích đạo ở kỳ giữa."},{"q":"Sự tách các chromatid chị em trong NST kép thành hai NST đơn diễn ra ở kỳ nào?","o":["Kỳ sau","Kỳ đầu","Kỳ giữa","Kỳ cuối"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Ở kỳ sau, tâm động phân chia, tách 2 chromatid chị em thành 2 NST đơn phân ly về 2 cực."},{"q":"Thoi phân bào (thoi vô sắc) bắt đầu được hình thành ở kỳ nào của nguyên phân?","o":["Kỳ đầu","Kỳ giữa","Kỳ sau","Kỳ cuối"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Thoi phân bào được hình thành từ hai trung thể ở kỳ đầu để chuẩn bị đính vào tâm động NST."},{"q":"Màng nhân và nhân con biến mất ở kỳ nào và xuất hiện lại ở kỳ nào trong nguyên phân?","o":["Biến mất ở kỳ đầu, xuất hiện lại ở kỳ cuối","Biến mất ở kỳ giữa, xuất hiện lại ở kỳ sau","Biến mất ở kỳ sau, xuất hiện lại ở kỳ cuối","Biến mất ở pha S, xuất hiện lại ở kỳ giữa"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Màng nhân và nhân con tiêu biến ở kỳ đầu và tái xuất hiện ở kỳ cuối."},{"q":"Sự phân chia tế bào chất ở tế bào thực vật khác tế bào động vật ở điểm nào?","o":["Hình thành vách ngăn tế bào ở trung tâm đi ra","Thắt màng sinh chất từ ngoài vào trong","Không phân chia tế bào chất","Phân chia tế bào chất trước khi phân chia nhân"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Do có thành cellulose cứng, tế bào thực vật phân chia tế bào chất bằng cách hình thành vách ngăn ở giữa."},{"q":"Sự thắt màng tế bào từ ngoài vào trong để phân chia tế bào chất là đặc điểm của loại tế bào nào?","o":["Tế bào động vật","Tế bào thực vật","Tế bào vi khuẩn","Tế bào nấm"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Tế bào động vật không có thành cellulose nên phân chia bằng cách thắt màng tế bào ở mặt phẳng xích đạo."},{"q":"Một tế bào người (2n = 46) đang ở kỳ giữa của nguyên phân sẽ có bao nhiêu nhiễm sắc thể kép?","o":["46 NST kép","23 NST kép","92 NST kép","46 NST đơn"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Ở kỳ giữa, tế bào có 2n NST kép, đối với người là 46 NST kép."},{"q":"Một tế bào người (2n = 46) ở kỳ sau của nguyên phân sẽ chứa bao nhiêu nhiễm sắc thể đơn?","o":["92 NST đơn","46 NST đơn","23 NST đơn","92 NST kép"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Ở kỳ sau, 46 NST kép tách thành 92 NST đơn phân ly về 2 cực tế bào."},{"q":"Cấu trúc nào đính nhiễm sắc thể vào thoi phân bào trong quá trình nguyên phân?","o":["Tâm động (kinetochore)","Màng nhân","Nhân con","Đoạn đầu mút (telomere)"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Các vi ống của thoi phân bào đính vào phức hợp protein kinetochore tại tâm động của NST."},{"q":"Pha G1 của kỳ trung gian chủ yếu diễn ra hoạt động nào sau đây?","o":["Gia tăng tế bào chất, tổng hợp RNA và protein","Nhân đôi DNA","Tách các chromatid chị em","Hình thành thoi vô sắc"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Pha G1 là khoảng thời gian tế bào sinh trưởng, tích lũy chất, tổng hợp RNA và protein."},{"q":"Pha G2 của kỳ trung gian có nhiệm vụ chính nào?","o":["Nhân đôi trung thể và tổng hợp các chất chuẩn bị cho phân bào","Phân chia tế bào chất","Nhân đôi toàn bộ nhiễm sắc thể","Phân ly các nhiễm sắc thể đơn"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Pha G2 hoàn tất việc tổng hợp protein (như tubulin) và chuẩn bị năng lượng cho sự phân bào."},{"q":"Số lượng chromatid trong một tế bào có bộ NST 2n = 8 ở kỳ giữa nguyên phân là bao nhiêu?","o":["16 chromatid","8 chromatid","32 chromatid","4 chromatid"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Ở kỳ giữa có 8 NST kép, mỗi NST kép gồm 2 chromatid => 8 x 2 = 16 chromatid."},{"q":"Ý nghĩa sinh học quan trọng nhất của nguyên phân là gì?","o":["Duy trì ổn định bộ NST đặc trưng của loài qua các thế hệ tế bào","Tạo ra sự đa dạng di truyền ở thế hệ sau","Giảm một nửa số lượng NST trong giao tử","Tạo ra các tế bào con mang bộ NST đơn bội (n)"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Nguyên phân truyền đạt nguyên vẹn bộ NST 2n của tế bào mẹ cho các tế bào con."},{"q":"Chu kỳ tế bào bao gồm hai giai đoạn chính nào?","o":["Kỳ trung gian và quá trình nguyên phân (pha M)","Pha G1 và pha G2","Kỳ đầu và kỳ cuối","Phân chia nhân và phân chia tế bào chất"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Chu kỳ tế bào gồm Kỳ trung gian (chiếm đa số thời gian) và Pha M (phân chia tế bào)."},{"q":"Thành phần protein chính cấu tạo nên các vi ống của thoi phân bào là gì?","o":["Tubulin","Actin","Myosin","Histone"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Thoi phân bào được cấu tạo từ các vi ống cấu thành bởi dimer protein Tubulin."},{"q":"Nếu một tế bào 2n = 14 tiến hành nguyên phân liên tiếp 3 lần thì tổng số tế bào con thu được là bao nhiêu?","o":["8","6","14","16"],"ch":"Chương 3: Phân bào và sinh sản","df":"Dễ","e":"Số tế bào con tạo thành sau k lần nguyên phân là 2^k = 2^3 = 8 tế bào."},{"q":"Có 5 tế bào sinh dưỡng của cùng một loài (2n = 20) cùng nguyên phân 4 lần. Tính tổng số nhiễm sắc thể có trong tất cả các tế bào con thu được.","o":["1600 NST","800 NST","3200 NST","400 NST"],"ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình","e":"Số tế bào con = 5 * 2^4 = 80 tế bào. Tổng số NST = 80 * 20 = 1600 NST đơn."},{"q":"Phức hợp checkpoint nào kiểm tra sự đính kết chính xác của các nhiễm sắc thể vào thoi phân bào trước khi tế bào bước vào kỳ sau?","o":["Điểm kiểm soát thoi phân bào (M checkpoint / SAC)","Điểm kiểm soát G1/S","Điểm kiểm soát G2/M","Điểm kiểm soát pha S"],"ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình","e":"Spindle Assembly Checkpoint (SAC) đảm bảo mọi tâm động đều đính vào vi ống trước khi kích hoạt phân tách chromatid."},{"q":"Hoạt tính của kinase phụ thuộc cyclin (CDK) điều hòa chu kỳ tế bào phụ thuộc trực tiếp vào yếu tố nào?","o":["Sự liên kết với phân tử Cyclin tương ứng và trạng thái phosphorylated","Nồng độ Glucose trong bào tương","Số lượng ribosome trong tế bào","Cường độ hô hấp tế bào"],"ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình","e":"CDK hoạt động khi liên kết với Cyclin biến đổi theo chu kỳ và được biến đổi phosphoryl hóa thích hợp."},{"q":"Loại vạch/vòng cấu tạo từ vi sợi actin và myosin tham gia vào sự phân chia tế bào chất ở tế bào động vật gọi là gì?","o":["Vòng thắt (Contractile ring)","Vách tế bào sơ cấp","Phiến tế bào (Cell plate)","Khung xương vi ống"],"ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình","e":"Vòng co rút (contractile ring) gồm vi sợi actin và myosin II thắt màng sinh chất chia đôi tế bào động vật."},{"q":"Khi xử lý tế bào đang phân bào bằng hóa chất Colchicine, quá trình nguyên phân sẽ bị dừng lại ở kỳ nào?","o":["Kỳ giữa","Kỳ đầu","Kỳ sau","Kỳ cuối"],"ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình","e":"Colchicine ức chế sự trùng hợp tubulin làm thoi vô sắc không hình thành, làm tế bào bị dừng ở kỳ giữa."},{"q":"Protein Cohesin giữ vai trò liên kết hai chromatid chị em. Enzyme nào trực tiếp phân hủy Cohesin để cho phép các chromatid phân ly ở kỳ sau?","o":["Separase","Securin","APC/C (Anaphase-Promoting Complex)","Helicase"],"ch":"Chương 3: Phân bào và sinh sản","df":"Khó","e":"Separase là protease trực tiếp cắt đứt protein Cohesin; trước đó APC/C đã phân hủy Securin để kích hoạt Separase."},{"q":"Nếu một cặp NST không phân ly ở kỳ sau của nguyên phân trong 1 tế bào thuộc phôi sớm (2n = 46), các tế bào con sinh ra sẽ có bộ NST như thế nào?","o":["Một tế bào 2n+1 (47) và một tế bào 2n-1 (45)","Cả hai tế bào đều là 2n (46)","Hai tế bào đều là n=23","Một tế bào 4n (92) và một tế bào không có NST"],"ch":"Chương 3: Phân bào và sinh sản","df":"Khó","e":"Sự không phân ly 1 cặp NST kép ở kỳ sau nguyên phân dẫn đến một tế bào con thừa 1 NST (2n+1) và một tế bào con thiếu 1 NST (2n-1), gây nên thể khảm."},{"q":"G2/M DNA Damage Checkpoint ngăn cản tế bào tiến vào nguyên phân khi phát hiện tổn thương DNA nhờ cơ chế nào?","o":["Kích hoạt protein p53 và kinase ATM/ATR làm ức chế phức hợp Cyclin B - CDK1 (MPF)","Ức chế enzyme RNA polymerase","Phân hủy trực tiếp thoi vô sắc","Tăng cường tổng hợp DNA ở kỳ đầu"],"ch":"Chương 3: Phân bào và sinh sản","df":"Khó","e":"ATM/ATR phát hiện đứt gãy DNA,
