hương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Nếu một cặp NST không phân ly ở kỳ sau của nguyên phân trong 1 tế bào thuộc phôi sớm (2n = 46), các tế bào con sinh ra sẽ có bộ NST như thế nào?","o":["Một tế bào 2n+1 (47) và một tế bào 2n-1 (45)","Cả hai tế bào đều là 2n (46)","Hai tế bào đều là n=23","Một tế bào 4n (92) và một tế bào không có NST"],"e":"Sự không phân ly 1 cặp NST kép ở kỳ sau nguyên phân dẫn đến một tế bào con thừa 1 NST (2n+1) và một tế bào con thiếu 1 NST (2n-1), gây nên thể khảm.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"G2/M DNA Damage Checkpoint ngăn cản tế bào tiến vào nguyên phân khi phát hiện tổn thương DNA nhờ cơ chế nào?","o":["Kích hoạt protein p53 và kinase ATM/ATR làm ức chế phức hợp Cyclin B - CDK1 (MPF)","Ức chế enzyme RNA polymerase","Phân hủy trực tiếp thoi vô sắc","Tăng cường tổng hợp DNA ở kỳ đầu"],"e":"ATM/ATR phát hiện đứt gãy DNA, kích hoạt p53/Chiph1/Chkp2 tạm dừng chu kỳ bằng cách duy trì phosphorylation ức chế CDK1.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Hiện tượng endoreplication (nội nhân đôi) diễn ra khi tế bào trải qua các pha nào của chu kỳ tế bào mà bỏ qua nguyên phân?","o":["Lặp lại liên tục các pha S và G mà không tiến hành pha M và phân chia tế bào chất","Chỉ thực hiện pha M liên tục","Thực hiện phân chia tế bào chất mà không nhân đôi DNA","Tiến hành giảm phân thay vì nguyên phân"],"e":"Endoreplication là quá trình DNA nhân đôi nhiều lần qua chu kỳ S-G nhưng bỏ qua pha M (nguyên phân), tạo ra tế bào đa bội.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Vai trò của động cơ protein (motor proteins) Kinesin-5 và Dynein đối với sự vận động của thoi phân bào là gì?","o":["Kinesin-5 trượt giữa các vi ống cực đẩy 2 cực ti thể/trung thể ra xa, Dynein kéo cực trung thể về màng tế bào","Trực tiếp nhân đôi đoạn DNA ở tâm động","Phân hủy màng nhân ở kỳ cuối","Thắt màng tế bào ở mặt phẳng xích đạo"],"e":"Motor protein Kinesin-5 đẩy hai cực thoi phân bào xa nhau ra, còn Dynein giúp kéo trung thể di chuyển về phía ngoại vi tế bào.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Quá trình giảm phân diễn ra ở loại tế bào nào sau đây?","o":["Tế bào sinh dục chín","Tế bào sinh dưỡng (soma)","Tế bào sinh dục sơ khai","Tế bào hợp tử"],"e":"Giảm phân chỉ diễn ra ở các tế bào sinh dục chín để tạo ra các giao tử đơn bội (n).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Kết quả của quá trình giảm phân từ 1 tế bào mẹ lưỡng bội (2n) bình thường tạo ra bao nhiêu tế bào con?","o":["4 tế bào con đơn bội (n)","2 tế bào con lưỡng bội (2n)","4 tế bào con lưỡng bội (2n)","2 tế bào con đơn bội (n)"],"e":"Giảm phân gồm 2 lần phân bào liên tiếp nhưng chỉ có 1 lần nhân đôi DNA, tạo 4 tế bào con đơn bội (n).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Hiện tượng tiếp hợp và trao đổi đoạn giữa các chromatid không chị em diễn ra ở kỳ nào?","o":["Kỳ đầu I","Kỳ giữa I","Kỳ đầu II","Kỳ giữa II"],"e":"Ở kỳ đầu I của giảm phân, các NST tương đồng tiếp hợp và có thể trao đổi chéo tạo hoán vị gen.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ở kỳ giữa I của giảm phân, các nhiễm sắc thể tập trung trên mặt phẳng xích đạo thành mấy hàng?","o":["2 hàng song song","1 hàng","4 hàng song song","Không xếp thành hàng"],"e":"Ở kỳ giữa I, các cặp NST tương đồng kép xếp thành 2 hàng song song trên mặt phẳng xích đạo.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự phân ly của các nhiễm sắc thể ở kỳ sau I của giảm phân diễn ra như thế nào?","o":["Các NST kép trong cặp tương đồng phân ly độc lập về 2 cực","Tách tâm động, các chromatid chị em phân ly về 2 cực","Tất cả NST kép đi về 1 cực tế bào","Các NST đơn phân ly độc lập về 2 cực"],"e":"Ở kỳ sau I, mỗi NST kép trong cặp tương đồng phân ly về một cực (tâm động chưa chia).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự nhân đôi của nhiễm sắc thể xảy ra ở giai đoạn nào trong giảm phân?","o":["Pha S của kỳ trung gian trước giảm phân I","Kỳ trung gian giữa giảm phân I và giảm phân II","Kỳ đầu I","Kỳ đầu II"],"e":"NST chỉ nhân đôi 1 lần duy nhất ở kỳ trung gian trước khi bước vào giảm phân I.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Bộ nhiễm sắc thể của các tế bào con được tạo ra sau khi kết thúc giảm phân I là gì?","o":["n NST kép","2n NST đơn","2n NST kép","n NST đơn"],"e":"Giảm phân I là phân bào giảm nhiễm, kết thúc tạo ra 2 tế bào con chứa bộ NST đơn bội kép (n NST kép).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Bộ nhiễm sắc thể của các tế bào con tạo ra sau khi kết thúc hoàn toàn giảm phân II là gì?","o":["n NST đơn","n NST kép","2n NST đơn","2n NST kép"],"e":"Giảm phân II là phân bào đẳng nhiễm, tách các chromatid chị em tạo 4 tế bào chứa n NST đơn.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ở kỳ sau II của giảm phân, sự kiện quan trọng nào xảy ra đối với nhiễm sắc thể?","o":["Tâm động phân chia, các chromatid chị em tách nhau thành NST đơn phân ly về 2 cực","Trao đổi chéo giữa các chromatid","Các NST kép phân ly độc lập","NST bắt đầu nhân đôi"],"e":"Ở kỳ sau II, tâm động phân chia làm 2 chromatid chị em tách ra thành 2 NST đơn đi về 2 cực.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Từ 1 tế bào sinh tinh (2n) qua giảm phân bình thường sẽ tạo ra sản phẩm nào?","o":["4 tinh trùng (n) có khả năng thụ tinh","1 tinh trùng (n) và 3 thể cực","2 tinh trùng (2n)","4 thể cực"],"e":"1 tế bào sinh tinh giảm phân tạo ra 4 tinh trùng đơn bội (n).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Từ 1 tế bào sinh trứng (2n) qua giảm phân bình thường sẽ tạo ra sản phẩm nào?","o":["1 tế bào trứng (n) lớn và 3 thể định hướng (thể cực)","4 tế bào trứng (n)","2 tế bào trứng (n) và 2 thể cực","1 tế bào trứng (2n)"],"e":"1 tế bào sinh trứng giảm phân phân chia tế bào chất không đều, tạo 1 trứng (n) và 3 thể cực (tiêu biến).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ý nghĩa quan trọng nhất của sự trao đổi chéo nhiễm sắc thể ở kỳ đầu I giảm phân là gì?","o":["Tạo ra các tổ hợp gen mới, duy trì sự đa dạng di truyền (biến dị tổ hợp)","Tăng số lượng tế bào con","Giữ nguyên bộ NST của tế bào mẹ","Làm thay đổi số lượng NST trong tế bào"],"e":"Sự trao đổi đoạn giữa các chromatid khác nguồn gốc hoán vị gen, tạo ra vô số biến dị tổ hợp.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Một tế bào người (2n = 46) ở kỳ giữa I của giảm phân sẽ có bao nhiêu nhiễm sắc thể kép?","o":["46 NST kép","23 NST kép","92 NST kép","46 NST đơn"],"e":"Ở kỳ giữa I, tế bào chứa 2n NST kép xếp thành 2 hàng, ở người là 46 NST kép (23 cặp).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Số lượng nhiễm sắc thể trong mỗi tế bào ở kỳ giữa II của giảm phân (ở loài 2n = 8) là bao nhiêu?","o":["4 NST kép","8 NST kép","8 NST đơn","4 NST đơn"],"e":"Sau giảm phân I, tế bào có n NST kép. Với 2n = 8 thì n = 4 NST kép.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự kết hợp giữa 3 quá trình nào đảm bảo duy trì ổn định bộ NST đặc trưng của loài qua các thế hệ sinh sản hữu tính?","o":["Nguyên phân, giảm phân và thụ tinh","Đường phân, chu trình Krebs và chuỗi truyền e-","Nhân đôi DNA, phiên mã và dịch mã","Thụ tinh, thụ phấn và nảy mầm"],"e":"Bộ 3 quá trình Nguyên phân - Giảm phân - Thụ tinh giúp duy trì bộ NST 2n ổn định qua các thế hệ.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ở kỳ giữa II của giảm phân, các nhiễm sắc thể tập trung xếp thành mấy hàng trên mặt phẳng xích đạo?","o":["1 hàng","2 hàng","4 hàng","Không xếp thành hàng"],"e":"Ở kỳ giữa II (tương tự nguyên phân), n NST kép xếp thành 1 hàng trên mặt phẳng xích đạo.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Khác biệt lớn nhất giữa Giảm phân II và Nguyên phân là gì?","o":["Giảm phân II xảy ra ở tế bào đơn bội (n NST kép), còn Nguyên phân thường diễn ra ở tế bào 2n","Giảm phân II không phân ly chromatid","Nguyên phân không có thoi vô sắc","Giảm phân II có nhân đôi DNA"],"e":"Cơ chế phân chia kỳ sau II giống nguyên phân nhưng tế bào tham gia giảm phân II mang bộ NST đơn bội (n kép).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Phức hợp tiếp hợp (synaptonemal complex) hình thành ở giai đoạn nào để gắn kết hai NST tương đồng?","o":["Kỳ đầu I","Kỳ giữa I","Kỳ đầu II","Kỳ cuối I"],"e":"Synaptonemal complex là cấu trúc protein xuất hiện ở kỳ đầu I liên kết cặp NST tương đồng để trao đổi chéo.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Điểm bắt chéo (Chiasmata) là vị trí thể hiện điều gì trên nhiễm sắc thể?","o":["Vị trí xảy ra sự tiếp hợp và trao đổi đoạn giữa hai chromatid không chị em","Vị trí tâm động đính vào thoi phân bào","Vị trí đoạn đầu mút NST","Vị trí tổng hợp RNA"],"e":"Chiasmata là hình ảnh nút thắt bắt chéo đánh dấu vị trí các đoạn chromatid vừa trao đổi đoạn cho nhau.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Nếu có 10 tế bào sinh tinh tiến hành giảm phân thì sẽ tạo ra bao nhiêu tinh trùng?","o":["40","10","20","80"],"e":"1 tế bào sinh tinh cho 4 tinh trùng => 10 tế bào sinh tinh tạo 10 x 4 = 40 tinh trùng.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Có 3 tế bào sinh trứng của loài (2n = 8) giảm phân. Hỏi có bao nhiêu thể cực (thể định hướng) bị tiêu biến và tổng số NST trong các thể cực đó là bao nhiêu?","o":["9 thể cực với tổng cộng 36 NST đơn","3 thể cực với tổng cộng 12 NST đơn","12 thể cực với tổng cộng 48 NST đơn","6 thể cực với tổng cộng 24 NST đơn"],"e":"1 tế bào sinh trứng tạo 3 thể cực (n=4). 3 tế bào tạo 3 x 3 = 9 thể cực. Tổng số NST = 9 x 4 = 36 NST đơn.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Một cơ thể có bộ NST 2n = 6 với 3 cặp NST ký hiệu AaBbCc. Nếu không xảy ra trao đổi chéo, số loại giao tử tối đa cơ thể này có thể tạo ra qua giảm phân là bao nhiêu?","o":["8","4","16","6"],"e":"Số loại giao tử tối đa = 2^n với n là số cặp NST dị hợp. 2^3 = 8 loại giao tử.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Kỳ đầu I của giảm phân được chia thành 5 giai đoạn nhỏ theo đúng thứ tự tiến trình là gì?","o":["Leptotene -> Zygotene -> Pachytene -> Diplotene -> Diakinesis","Zygotene -> Leptotene -> Diplotene -> Pachytene -> Diakinesis","Diakinesis -> Diplotene -> Pachytene -> Zygotene -> Leptotene","Leptotene -> Pachytene -> Zygotene -> Diplotene -> Diakinesis"],"e":"Thứ tự 5 gđ kỳ đầu I: Leptotene (sợi mảnh), Zygotene (tiếp hợp), Pachytene (co ngắn/TĐC), Diplotene (bắt chéo), Diakinesis (hướng cực).","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Sự phân ly độc lập của các cặp nhiễm sắc thể tương đồng xảy ra ở thời điểm nào, tạo nên cơ sở cho quy luật Mendel?","o":["Sự sắp xếp ngẫu nhiên ở kỳ giữa I và phân ly về 2 cực ở kỳ sau I","Sự tách tâm động ở kỳ sau II","Sự tiếp hợp ở kỳ đầu I","Sự thắt màng ở kỳ cuối II"],"e":"Cách xếp 2 hàng ngẫu nhiên ở kỳ giữa I quyết định hướng phân ly độc lập của các cặp NST tương đồng về 2 cực ở kỳ sau I.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Protein Shugoshin (SGO1) có vai trò đặc biệt nào trong đợt phân bào giảm phân I?","o":["Bảo vệ Cohesin tại vùng tâm động không bị phân hủy ở kỳ sau I, giữ 2 chromatid chị em dính nhau","Trực tiếp cắt đứt dây thoi vô sắc","Phân hủy màng nhân ở kỳ đầu II","Kích thích nhân đôi DNA lần thứ 2"],"e":"Shugoshin bảo vệ Cohesin ở tâm động không bị cắt bởi Separase trong giảm phân I, ngăn 2 chromatid chị em tách ra sớm.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Một tế bào sinh tinh có kiểu gen $\\frac{AB}{ab}$ tiến hành giảm phân, nếu có sự trao đổi chéo giữa A và B ở kỳ đầu I thì kết thúc giảm phân sẽ tạo ra những loại giao tử nào với tỉ lệ ra sao?","o":["4 loại giao tử 1 AB : 1 Ab : 1 aB : 1 ab","2 loại giao tử 1 AB : 1 ab","2 loại giao tử 1 Ab : 1 aB","3 loại giao tử 2 AB : 1 Ab : 1 ab"],"e":"1 tế bào sinh tinh có TĐC tạo ra 4 tinh trùng thuộc 4 loại giao tử với tỉ lệ bằng nhau 1:1:1:1 (2 giao tử liên kết, 2 giao tử hoán vị).","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Nếu 1 cặp NST tương đồng không phân ly trong Giảm phân I, còn Giảm phân II diễn ra bình thường, kết quả tạo ra các giao tử có bộ NST như thế nào?","o":["50% giao tử (n + 1) và 50% giao tử (n - 1)","25% (n + 1), 25% (n - 1) và 50% n","100% giao tử đột biến n + 1","100% giao tử bình thường n"],"e":"Không phân ly GPI khiến 1 tế bào con mang cả cặp tương đồng (n+1), 1 tế bào rỗng (n-1). Giảm phân II phân chia tạo 2 giao tử (n+1) và 2 giao tử (n-1).","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Nếu sự không phân ly của 1 chiếc NST kép xảy ra ở Giảm phân II trong 1 tế bào con (tế bào kia GPII bình thường), giao tử sinh ra sẽ gồm:","o":["50% n, 25% (n + 1) và 25% (n - 1)","50% (n + 1) và 50% (n - 1)","100% giao tử n","75% n và 25% (n + 1)"],"e":"Tế bào phân bào bình thường cho 2 giao tử n. Tế bào bị lỗi GPII cho 1 giao tử (n+1) và 1 giao tử (n-1). Tỉ lệ chung: 2/4 n, 1/4 (n+1), 1/4 (n-1).","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Tại sao sự nhân đôi DNA bị bế mạc/bỏ qua hoàn toàn trong kỳ trung gian ngắn giữa Giảm phân I và Giảm phân II (Interkinesis)?","o":["Do hoạt tính CDK2/Cyclin E bị ức chế và yếu tố Cdt1/ORC bị ngăn chặn không cho tái khởi động nguồn nhân đôi DNA (replication origin)","Do tế bào không còn nguồn cung cấp nucleotide","Do enzyme DNA polymerase bị phân hủy hết ở kỳ cuối I","Do màng nhân không tái sinh ở kỳ cuối I"],"e":"Cơ chế duy trì ức chế tái cấp phép nhân đôi (re-licensing inhibition) ngăn phức hợp tiền khởi đầu nhân đôi hình thành ở Interkinesis.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Ở động vật có vú, tế bào trứng thường bị ngưng trệ (arrest) lần thứ hai ở giai đoạn nào cho đến khi có sự thụ tinh của tinh trùng?","o":["Kỳ giữa II (Metaphase II)","Kỳ đầu I (Diplotene I)","Kỳ sau I","Kỳ sau II"],"e":"Trứng người rụng dừng ở Kỳ giữa II do yếu tố CSF (Cytostatic Factor) duy trì hoạt tính MPF; sự xâm nhập của tinh trùng giải phóng Ca2+ mới kích hoạt hoàn tất giảm phân II.","ch":"Chương 3: Phân bào và sinh sản","df":"Khó"},{"q":"Đối tượng thực nghiệm chính được Gregor Mendel sử dụng để phát hiện ra các quy luật di truyền là gì?","o":["Đậu Hà Lan (Pisum sativum)","Ruồi giấm (Drosophila melanogaster)","Vi khuẩn E. coli","Cây ngô (Zea mays)"],"e":"Mendel đã sử dụng Đậu Hà Lan làm đối tượng chính vì tính tự thụ phấn nghiêm ngặt và dễ lai tạo.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Theo Mendel, nhân tố di truyền quy định tính trạng được truyền từ bố mẹ sang con cái ngày nay được gọi là gì?","o":["Gene","Protein","Nhiễm sắc thể","Nucleotide"],"e":"Khái niệm 'nhân tố di truyền' của Mendel sau này được Johannsen gọi là gene.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Trong phép lai một cặp tính trạng thuần chủng tương phản (AA x aa), thế hệ F1 thu được kiểu hình như thế nào?","o":["100% kiểu hình trội","100% kiểu hình lặn","50% trội : 50% lặn","75% trội : 25% lặn"],"e":"Thế hệ F1 đồng nhất mang kiểu gen Aa và biểu hiện kiểu hình trội.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tỉ lệ phân phân tính kiểu hình đặc trưng ở thế hệ F2 trong phép lai 1 cặp tính trạng của Mendel (F1 tự thụ phấn) là bao nhiêu?","o":["3 trội : 1 lặn","1 trội : 1 lặn","9 trội : 7 lặn","1 trội : 2 trung gian : 1 lặn"],"e":"Phép lai Aa x Aa cho tỉ lệ kiểu hình ở F2 là 3 trội : 1 lặn.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tỉ lệ phân tính kiểu gen ở F2 trong phép lai 1 cặp tính trạng của Mendel (Aa x Aa) là bao nhiêu?","o":["1 AA : 2 Aa : 1 aa","3 AA : 1 aa","1 AA : 1 aa","1 AA : 1 Aa : 1 aa"],"e":"Phép lai Aa x Aa cho tỉ lệ kiểu gen là 1/4 AA : 2/4 Aa : 1/4 aa.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Phép lai phân tích là phép lai giữa cá thể mang kiểu hình trội chưa biết kiểu gen với cá thể mang đặc điểm gì?","o":["Đồng hợp lặn","Đồng hợp trội","Dị hợp","Có kiểu hình trội thuần chủng"],"e":"Phép lai phân tích dùng cá thể đồng hợp lặn để kiểm tra kiểu gen của cá thể mang kiểu hình trội.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Nếu kết quả phép lai phân tích thu được 100% cá thể mang kiểu hình trội, cá thể mang kiểu hình trội đem lai có kiểu gen như thế nào?","o":["Đồng hợp trội","Dị hợp","Đồng hợp lặn","Thể đột biến"],"e":"AA x aa -> 100% Aa (kiểu hình trội), chứng tỏ cá thể đem lai là đồng hợp trội (AA).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Nội dung chính của Quy luật phân ly của Mendel là gì?","o":["Mỗi nhân tố di truyền trong cặp phân ly về một giao tử trong quá trình tạo giao tử","Các nhân tố di truyền hòa lẫn vào nhau ở thế hệ con","Các tính trạng trội luôn lấn áp hoàn toàn tính trạng lặn ở mọi thế hệ","Sự phân ly của tính trạng này phụ thuộc vào tính trạng khác"],"e":"Quy luật phân ly khẳng định hai allele trong cặp phân ly đồng đều về các giao tử.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tỉ lệ kiểu hình phân ly ở F2 trong phép lai hai cặp tính trạng độc lập của Mendel (AaBb x AaBb) là bao nhiêu?","o":["9 : 3 : 3 : 1","3 : 3 : 1 : 1","1 : 1 : 1 : 1","9 : 6 : 1"],"e":"Tỉ lệ phân tính 9 : 3 : 3 : 1 = (3 : 1)(3 : 1) là tỉ lệ đặc trưng của phân ly độc lập.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Cơ sở tế bào học quan trọng nhất của Quy luật phân ly độc lập là gì?","o":["Sự phân ly độc lập và tổ hợp ngẫu nhiên của các cặp nhiễm sắc thể tương đồng trong giảm phân","Sự tiếp hợp và trao đổi chéo giữa các chromatid ở kỳ đầu I","Sự nhân đôi DNA ở kỳ trung gian","Sự tự thụ phấn của thế hệ F1"],"e":"Các cặp allele nằm trên các cặp NST tương đồng khác nhau phân ly độc lập về các giao tử.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cá thể có kiểu gen AaBb (các gene phân ly độc lập) khi giảm phân bình thường sẽ cho ra mấy loại giao tử?","o":["4 loại giao tử với tỉ lệ ngang nhau","2 loại giao tử","8 loại giao tử","1 loại giao tử"],"e":"Kiểu gen có 2 cặp dị hợp cho 2^2 = 4 loại giao tử (AB, Ab, aB, ab) tỉ lệ 1:1:1:1.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Điều kiện cơ bản nhất để các quy luật di truyền của Mendel nghiệm đúng là gì?","o":["Mỗi gene quy định một tính trạng và các gene nằm trên các cặp NST tương đồng khác nhau","Phải có hiện tượng hoán vị gen","Các gene phải liên kết hoàn toàn với nhau","Số lượng cá thể nghiên cứu phải thật nhỏ"],"e":"Quy luật Mendel yêu cầu các cặp gene quy định tính trạng phân ly độc lập (nằm trên các cặp NST khác nhau).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Thuật ngữ 'Allele' dùng để chỉ cái gì?","o":["Các trạng thái biểu hiện khác nhau của cùng một gene nằm ở cùng vị trí (locus) trên NST tương đồng","Hai gene khác nhau nằm trên cùng một NST","Tập hợp tất cả các gene trong một tế bào","Các protein do gene mã hóa"],"e":"Allele là các biến thể khác nhau của cùng một locus gene.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Phép lai phân tích cá thể dị hợp 2 cặp gene phân ly độc lập (AaBb x aabb) cho tỉ lệ kiểu hình ở đời con là bao nhiêu?","o":["1 : 1 : 1 : 1","9 : 3 : 3 : 1","3 : 1","1 : 2 : 1"],"e":"AaBb cho 4 loại giao tử nhân với aabb cho 1 loại giao tử -> Tỉ lệ kiểu hình 1 : 1 : 1 : 1.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Trội không hoàn toàn là hiện tượng di truyền mà ở đó cá thể dị hợp (Aa) biểu hiện kiểu hình như thế nào?","o":["Trung gian giữa kiểu hình của bố và mẹ thuần chủng","Giống hệt kiểu hình bố","Giống hệt kiểu hình mẹ","Biểu hiện cả hai kiểu hình trội và lặn cùng lúc"],"e":"Trội không hoàn toàn tạo ra kiểu hình trung gian ở cá thể dị hợp.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng đồng trội (Codominance) được thể hiện rõ nhất ở ví dụ nào sau đây?","o":["Nhóm máu ABO ở người (nhóm máu AB có allele IA và IB cùng biểu hiện)","Màu hoa phấn (đỏ x trắng -> hồng)","Chiều cao cây đậu Hà Lan","Màu mắt ở ruồi giấm"],"e":"Ở nhóm máu AB, cả hai allele IA và IB đều biểu hiện sản phẩm kháng nguyên trên màng hồng cầu.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cơ thể có kiểu gen AABbCcDD khi giảm phân bình thường sẽ tạo ra tối đa bao nhiêu loại giao tử?","o":["4 loại giao tử","8 loại giao tử","16 loại giao tử","2 loại giao tử"],"e":"Số cặp gene dị hợp n = 2 (Bb, Cc). Số loại giao tử = 2^2 = 4 loại.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Trong phép lai một cặp tính trạng có hiện tượng trội không hoàn toàn (Aa x Aa), tỉ lệ kiểu hình ở F2 là bao nhiêu?","o":["1 trội : 2 trung gian : 1 lặn","3 trội : 1 lặn","1 trội : 1 lặn","100% trung gian"],"e":"Khi trội không hoàn toàn, tỉ lệ kiểu hình trùng với tỉ lệ kiểu gen: 1 AA : 2 Aa : 1 aa.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Phương pháp nghiên cứu di truyền độc đáo giúp Mendel thành công khi khám phá các quy luật di truyền là gì?","o":["Phương pháp phân tích cơ thể lai","Phương pháp nhuộm màu nhiễm sắc thể","Phương pháp gây đột biến nhân tạo","Phương pháp tách chiết DNA"],"e":"Mendel sáng tạo ra phương pháp phân tích cơ thể lai (theo dõi riêng từng tính trạng, sử dụng thống kê toán học).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Cặp allele quy định hai trạng thái tính trạng đối lập nhau được gọi là gì?","o":["Cặp tính trạng tương phản","Cặp gene liên kết","Cặp gene bổ trợ","Cặp gene át chế"],"e":"Cặp tính trạng tương phản là hai trạng thái biểu hiện khác nhau của cùng một loại tính trạng (VD: hoa đỏ - hoa trắng).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Cho phép lai P: AaBbCcDd x AaBbCcDd (các gene phân ly độc lập, trội lặn hoàn toàn). Tỉ lệ cá thể mang kiểu hình trội về tất cả 4 tính trạng ở đời con F1 là bao nhiêu?","o":["81/256","27/64","1/256","9/16"],"e":"Mỗi cặp phép lai (Aa x Aa) cho 3/4 kiểu hình trội. Với 4 cặp: (3/4)^4 = 81/256.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Cho phép lai P: AaBbDd x AabbDd. Tỉ lệ cá thể thu được có kiểu gen AabBDd ở đời con là bao nhiêu?","o":["1/8","1/16","1/32","1/4"],"e":"Aa x Aa -> 1/2 Aa; Bb x bb -> 1/2 Bb; Dd x Dd -> 1/2 Dd. Tích tỉ lệ = 1/2 * 1/2 * 1/2 = 1/8.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở phép lai 3 cặp tính trạng AaBbCc x AaBbCc, số lượng kiểu gen tối đa thu được ở đời con F1 là bao nhiêu?","o":["27 loại kiểu gen","8 loại kiểu gen","16 loại kiểu gen","64 loại kiểu gen"],"e":"Mỗi cặp phép lai cho 3 loại kiểu gen. Với 3 cặp: 3^3 = 27 loại kiểu gen.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Trường hợp đa allele (multiple alleles) xảy ra khi nào trong quần thể sinh vật?","o":["Khi một locus gene trên NST có từ 3 allele trở lên tồn tại trong quần thể","Khi một cá thể chứa nhiều hơn 2 allele trong tế bào sinh dưỡng","Khi có nhiều gene cùng quy định một tính trạng","Khi một gene quy định nhiều tính trạng khác nhau"],"e":"Đa allele là hiện tượng một locus gene trong quần thể có nhiều hơn 2 trạng thái allele (VD: hệ nhóm máu ABO có 3 allele IA, IB, IO).","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở một loài thực vật, allele A quy định hoa đỏ trội hoàn toàn so với a quy định hoa trắng. Thực hiện phép lai Aa x Aa thu được các hạt F1. Cho tất cả cây hoa đỏ F1 tự thụ phấn, tỉ lệ kiểu hình thu được ở F2 là bao nhiêu?","o":["5 hoa đỏ : 1 hoa trắng","3 hoa đỏ : 1 hoa trắng","7 hoa đỏ : 1 hoa trắng","1 hoa đỏ : 1 hoa trắng"],"e":"Hoa đỏ F1 gồm 1/3 AA và 2/3 Aa. Tự thụ phấn: 1/3 AA -> 1/3 AA; 2/3 Aa -> 2/3(1/4 AA : 1/2 Aa : 1/4 aa) = 1/6 AA : 1/3 Aa : 1/6 aa. Tổng hoa trắng (aa) = 1/6 => Hoa đỏ = 5/6 => Tỉ lệ 5 đỏ : 1 trắng.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở người, bệnh mù màu do allele lặn m nằm trên NST giới tính X (không có allele trên Y). Bố mẹ bình thường sinh đứa con trai đầu lòng bị bệnh mù màu. Xác suất để đứa con thứ hai của họ là một con gái bình thường không mang allele bệnh là bao nhiêu?","o":["1/4","1/2","1/8","3/8"],"e":"Bố mẹ bình thường sinh con trai bị bệnh (XmY) -> Mẹ có kiểu gen XMXm, Bố XMY. Phép lai: XMXm x XMY -> Con gái gồm 1/2 XMXM (bình thường không mang allele bệnh) và 1/2 XMXm. Xác suất sinh con gái không mang allele bệnh = 1/2 (xác suất ra con gái) * 1/2 = 1/4.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Cho biết allele A quy định thân cao trội hoàn toàn so với a quy định thân thấp. Phép lai giữa hai cây thể tứ bội AAaa x AAaa (giảm phân bình thường cho giao tử 2n) sẽ cho tỉ lệ kiểu hình ở đời con là bao nhiêu?","o":["35 cao : 1 thấp","3 cao : 1 thấp","11 cao : 1 thấp","15 cao : 1 thấp"],"e":"Cây AAaa giảm phân cho tỉ lệ giao tử 1/6 AA : 4/6 Aa : 1/6 aa. Kiểu hình lặn (aaaa) = 1/6 aa * 1/6 aa = 1/36 => Kiểu hình trội (cao) = 35/36 => Tỉ lệ 35 cao : 1 thấp.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Xét 3 cặp gene A, a; B, b; C, c phân ly độc lập. Phép lai P: AaBbCc x AaBbCc cho F1. Lấy ngẫu nhiên một cá thể mang kiểu hình trội về cả 3 tính trạng ở F1, xác suất để cá thể này có kiểu gen thuần chủng (AABBCC) là bao nhiêu?","o":["1/27","1/64","1/8","8/27"],"e":"Trong số các cá thể mang kiểu hình trội (A-B-C-), ở mỗi cặp gene, tỉ lệ cá thể thuần chủng (AA trong số A-) là 1/3. Xác suất AABBCC trong số A-B-C- = (1/3)^3 = 1/27.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Ở một loài động vật, allele A gây chết ở thể đồng hợp lặn aa ngay giai đoạn phôi. Phép lai giữa hai cá thể dị hợp Aa x Aa thu được đời con F1. Nếu cho các cá thể F1 ngẫu phối với nhau, tỉ lệ cá thể sống sót mang kiểu hình lặn ở thế hệ F2 là bao nhiêu?","o":["1/9","1/4","1/16","1/8"],"e":"Aa x Aa -> F1 sống sót gồm 1/3 AA : 2/3 Aa. Tần số allele ở F1: p(A) = 2/3, q(a) = 1/3. Ngẫu phối thu được aa ở F2 = q^2 = (1/3)^2 = 1/9.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Đối tượng sinh học chính được Thomas Hunt Morgan sử dụng để phát hiện ra quy luật di truyền liên kết và hoán vị gen là gì?","o":["Ruồi giấm (Drosophila melanogaster)","Đậu Hà Lan (Pisum sativum)","Vi khuẩn E. coli","Cây ngô (Zea mays)"],"e":"Morgan đã phát hiện các quy luật liên kết gen và hoán vị gen nhờ sử dụng ruồi giấm làm sinh vật mô hình.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Các gene nằm trên cùng một nhiễm sắc thể di truyền cùng nhau tạo thành cái gì?","o":["Nhóm gene liên kết","Cặp allele tương đồng","Hệ gen đa allele","Cụm gene bổ trợ"],"e":"Tất cả các gene nằm trên cùng một nhiễm sắc thể di truyền cùng nhau tạo thành một nhóm gene liên kết.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Số nhóm gene liên kết ở mỗi loài sinh vật lưỡng bội (2n) thường tương ứng với số lượng nào?","o":["Bộ nhiễm sắc thể đơn bội (n)","Bộ nhiễm sắc thể lưỡng bội (2n)","Số lượng gene trong tế bào","Số lượng chromatid ở kỳ giữa"],"e":"Số nhóm gene liên kết ở một loài lưỡng bội thường bằng số nhiễm sắc thể trong bộ đơn bội (n).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ở loài ruồi giấm (Drosophila melanogaster) có bộ NST 2n = 8, số nhóm gene liên kết là bao nhiêu?","o":["4","8","16","2"],"e":"Số nhóm gene liên kết bằng n = 2n / 2 = 8 / 2 = 4 nhóm.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng hoán vị gen xảy ra do sự kiện tế bào học nào ở kỳ đầu I của giảm phân?","o":["Sự tiếp hợp và trao đổi đoạn giữa các chromatid không chị em trong cặp NST tương đồng","Sự nhân đôi ngẫu nhiên của DNA","Sự phân ly không đồng đều của hai cực tế bào","Sự tiêu biến của màng nhân"],"e":"Sự trao đổi chéo giữa 2 trong 4 chromatid không chị em ở kỳ đầu I dẫn đến hoán vị gen.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một đặc điểm đặc biệt về hiện tượng hoán vị gen ở ruồi giấm (Drosophila melanogaster) là gì?","o":["Chỉ xảy ra ở ruồi giấm cái, không xảy ra ở ruồi giấm đực","Chỉ xảy ra ở ruồi giấm đực","Xảy ra ở cả hai giới với tần số như nhau","Không bao giờ xảy ra hoán vị gen"],"e":"Ở ruồi giấm, hiện tượng trao đổi chéo dẫn đến hoán vị gen chỉ xảy ra ở giới cái (XX).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tần số hoán vị gen (f) tối đa thu được giữa hai locus gene trên cùng một nhiễm sắc thể không vượt quá giá trị nào?","o":["50%","25%","75%","100%"],"e":"Tần số hoán vị gen f luôn nhỏ hơn hoặc bằng 50% (f ≤ 50%).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Khoảng cách tương đối giữa hai gene trên bản đồ di truyền được đo bằng đơn vị nào?","o":["Centimorgan (cM) hoặc % hoán vị","Nanomet (nm)","Cặp base (bp)","Micromet (μm)"],"e":"Đơn vị đo khoảng cách bản đồ di truyền là centimorgan (cM), trong đó 1 cM tương ứng 1% tần số hoán vị gen.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cơ thể có kiểu gen liên kết $\\frac{AB}{ab}$ (liên kết hoàn toàn) khi giảm phân sẽ tạo ra những loại giao tử nào?","o":["2 loại giao tử với tỉ lệ 1 AB : 1 ab","4 loại giao tử với tỉ lệ 1 AB : 1 Ab : 1 aB : 1 ab","2 loại giao tử với tỉ lệ 1 Ab : 1 aB","1 loại giao tử AB"],"e":"Liên kết hoàn toàn $\\frac{AB}{ab}$ chỉ tạo 2 loại giao tử liên kết là AB và ab với tỉ lệ ngang nhau.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cơ thể có kiểu gen $\\frac{AB}{ab}$ xảy ra hoán vị gen với tần số f = 20%. Tỉ lệ các loại giao tử hoán vị (Ab và aB) là bao nhiêu?","o":["Ab = aB = 10%","Ab = aB = 20%","Ab = aB = 40%","Ab = aB = 5%"],"e":"Tỉ lệ mỗi giao tử hoán vị = f / 2 = 20% / 2 = 10%.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cơ thể có kiểu gen $\\frac{AB}{ab}$ xảy ra hoán vị gen với tần số f = 20%. Tỉ lệ các loại giao tử liên kết (AB và ab) là bao nhiêu?","o":["AB = ab = 40%","AB = ab = 20%","AB = ab = 10%","AB = ab = 50%"],"e":"Tỉ lệ mỗi giao tử liên kết = (1 - f) / 2 = (100% - 20%) / 2 = 40%.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Phép lai phân tích cá thể dị hợp tử về 2 cặp gene liên kết hoàn toàn AB/ab X ab/ab thu được tỉ lệ kiểu hình đời con như thế nào?","o":["1 : 1","1 : 1 : 1 : 1","3 : 1","9 : 3 : 3 : 1"],"e":"AB/ab (cho 1 AB : 1 ab) x ab/ab (cho 1 ab) -> Đời con: 1 AB/ab: 1 ab/ab (tỉ lệ kiểu hình 1 : 1).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Sự di truyền liên kết giới tính là hiện tượng gì?","o":["Các gene quy định tính trạng thường nằm trên nhiễm sắc thể giới tính (X hoặc Y)","Các gene quy định giới tính nằm trên nhiễm sắc thể thường","Tính trạng chỉ biểu hiện ở giới cái","Tính trạng không bao giờ di truyền cho thế hệ sau"],"e":"Di truyền liên kết giới tính là hiện tượng các gene quy định tính trạng nằm trên nhiễm sắc thể giới tính X hoặc Y.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng di truyền chéo (mẹ truyền cho con trai, bố truyền cho con gái) đặc trưng cho quy luật di truyền nào?","o":["Gene lặn nằm trên nhiễm sắc thể giới tính X (không có allele trên Y)","Gene nằm trên nhiễm sắc thể giới tính Y (không có allele trên X)","Gene nằm trên nhiễm sắc thể thường phân ly độc lập","Gene nằm trong ti thể"],"e":"Gene lặn trên X không có allele trên Y thể hiện đặc tính di truyền chéo: Mẹ X^aX^a truyền X^a cho con trai X^aY, Bố X^aY truyền X^a cho con gái.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng di truyền thẳng (truyền trực tiếp từ bố cho 100% con trai) đặc trưng cho quy luật nào?","o":["Gene nằm trên đoạn không tương đồng của nhiễm sắc thể Y","Gene nằm trên nhiễm sắc thể X","Gene liên kết hoàn toàn trên NST thường","Gene hoán vị trên NST thường"],"e":"Gene nằm trên đoạn không tương đồng của Y chỉ truyền cho con trai (XY) tạo di truyền thẳng.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ở chim, bướm và một số loài cá, cặp nhiễm sắc thể giới tính ở giới cái và giới đực lần lượt là gì?","o":["Giới cái là XY (hoặc ZW), giới đực là XX (hoặc ZZ)","Giới cái là XX, giới đực là XY","Cả hai giới đều là XX","Cả hai giới đều là XY"],"e":"Ở loài chim, bướm, bò sát: Giới cái là dị giao tử (ZW hoặc XY), giới đực là đồng giao tử (ZZ hoặc XX).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Mối quan hệ giữa khoảng cách hai gene trên nhiễm sắc thể và tần số hoán vị gen giữa chúng là gì?","o":["Khoảng cách càng xa, tần số hoán vị gen càng cao (tỉ lệ thuận)","Khoảng cách càng xa, tần số hoán vị gen càng thấp (tỉ lệ nghịch)","Khoảng cách và tần số hoán vị gen không liên quan gì tới nhau","Tần số hoán vị gen luôn cố định bằng 50% bất chấp khoảng cách"],"e":"Hai gene nằm càng xa nhau trên NST thì xác suất xảy ra trao đổi chéo giữa chúng càng lớn.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ý nghĩa sinh học quan trọng nhất của quy luật liên kết gen hoàn toàn là gì?","o":["Duy trì sự ổn định của các nhóm tính trạng tốt luôn đi cùng nhau qua các thế hệ","Tạo ra vô số biến dị tổ hợp phong phú","Làm thay đổi số lượng nhiễm sắc thể","Tăng cường khả năng hoán vị gen"],"e":"Liên kết gen giúp bảo tồn các nhóm gen có lợi đi cùng nhau trên một NST.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ý nghĩa thực tiễn nổi bật của quy luật hoán vị gen đối với công tác chọn giống là gì?","o":["Tạo ra các biến dị tổ hợp mới, giúp lập bản đồ di truyền (bản đồ định vị gene)","Giữ nguyên kiểu gen của bố mẹ ở thế hệ sau","Loại bỏ hoàn toàn các đột biến có hại","Làm giảm khả năng thích nghi của sinh vật"],"e":"Hoán vị gen tạo biến dị tổ hợp và cho phép xác định khoảng cách tương đối để lập bản đồ di truyền.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một cá thể có kiểu gen $\\frac{Ab}{aB}$ (dị hợp tử đối). Các giao tử hoán vị của cơ thể này gồm những giao tử nào?","o":["AB và ab","Ab và aB","AB và Ab","aB và ab"],"e":"Kiểu gen $\\frac{Ab}{aB}$ có giao tử liên kết là Ab, aB; giao tử hoán vị sinh ra do trao đổi chéo là AB, ab.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Cho 3 gene A, B, C cùng nằm trên 1 nhiễm sắc thể. Biết khoảng cách giữa A và B là 8 cM, khoảng cách giữa B và C là 15 cM, khoảng cách giữa A và C là 23 cM. Thứ tự trật tự sắp xếp các gene trên NST là gì?","o":["A - B - C","B - A - C","A - C - B","C - A - B"],"e":"Do khoảng cách AC = AB + BC (23 = 8 + 15) nên B nằm giữa A và C => Trật tự: A - B - C.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Tiến hành phép lai phân tích ruồi giấm cái thân xám, cánh dài dị hợp $\\frac{AB}{ab}$ thu được thế hệ con phân tính: 41% xám dài, 41% đen ngắn, 9% xám ngắn, 9% đen dài. Tần số hoán vị gen f bằng bao nhiêu?","o":["18%","9%","41%","36%"],"e":"Tần số hoán vị gen f bằng tổng tỉ lệ các kiểu hình hoán vị (xám ngắn + đen dài) = 9% + 9% = 18%.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở phép lai AB/ab X AB/ab (liên kết hoàn toàn ở cả hai giới), tỉ lệ phân tính kiểu hình ở đời con F1 là bao nhiêu?","o":["3 trội-trội : 1 lặn-lặn","1 trội-trội : 2 trội-lặn : 1 lặn-lặn","9 : 3 : 3 : 1","1 : 1 : 1 : 1"],"e":"Giao tử: (1/2 AB : 1/2 ab) x (1/2 AB : 1/2 ab) -> Kiểu gen 1/4 AB/AB: 2/4 AB/ab: 1/4 ab/ab -> Kiểu hình: 3 (A-B-) : 1 (aabb).","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Mèo đực tam thể (mang cả lông đen và lông cam) rất hiếm gặp trong tự nhiên. Cơ sở di truyền học của hiện tượng này thường liên quan đến hội chứng bất thường NST nào?","o":["Thể ba nhiễm Klinefelter (XXY)","Thể một nhiễm Turner (XO)","Thể tam bội (3n)","Đột biến mất đoạn NST X"],"e":"Gene màu lông nằm trên X ($X^B$ đen, $X^O$ cam). Mèo đực bình thường (XY) chỉ có 1 X nên chỉ có 1 màu. Mèo đực tam thể phải có bộ NST XXY (có cả $X^B X^O Y$).","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở ruồi giấm, cho giao phối giữa ruồi cái thân xám, cánh dài dị hợp với ruồi đực thân xám, cánh dài. Đời F1 thu được 66% thân xám, cánh dài; 9% thân xám, cánh ngắn; 9% thân đen, cánh dài; 16% thân đen, cánh ngắn. Tần số hoán vị gen f của ruồi cái P là bao nhiêu?","o":["36%","16%","32%","20%"],"e":"Ruồi đực không hoán vị cho giao tử ab = 0.5. Đời con $\\frac{ab}{ab}$ = 16% = (giao tử ab cái) * 0.5 -> Giao tử ab cái = 32%. Vì ab > 25% nên đây là giao tử liên kết. Tần số hoán vị f = 100% - 2 * 32% = 36% (Lưu ý: Tùy đáp án, f = 1 - 2*0.32 = 0.36 = 36%). Sửa lại tính đúng: f = 1 - 2*0.32 = 0.36 = 36%.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Ở một loài thực vật lưỡng bội, xét phép lai $\\frac{Ab}{aB} \\times \\frac{Ab}{aB}$. Khi hoán vị gen xảy ra ở cả 2 giới với tần số f = 30%, tỉ lệ kiểu hình mang 2 tính trạng trội (A-B-) thu được ở F1 được tính theo công thức tổng quát $0.5 + \\% (\\frac{ab}{ab})$ có giá trị là bao nhiêu?","o":["52.25%","60.5%","59%","66%"],"e":"Kiểu gen $\\frac{Ab}{aB}$ cho giao tử hoán vị ab = f/2 = 15% (0.15). Tỉ lệ kiểu gen lặn $\\frac{ab}{ab}$ = 0.15 * 0.15 = 0.0225 (2.25%). Tỉ lệ kiểu hình A-B- = 50% + % (aabb) = 50% + 2.25% = 52.25%.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Di truyền theo dòng mẹ (di truyền ngoài nhân) là hiện tượng con cái sinh ra luôn có kiểu hình giống với cá thể nào?","o":["Cá thể mẹ","Cá thể bố","Trung gian giữa bố và mẹ","Tỉ lệ 3 trội : 1 lặn"],"e":"Trong di truyền ngoài nhân, tế bào chất của hợp tử chủ yếu do tế bào trứng của mẹ cung cấp, nên con cái nhận gene ngoài nhân hoàn toàn từ mẹ.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hai bào quan chính chứa hệ gene riêng trong tế bào nhân thực là gì?","o":["Ti thể và Lục lạp","Lưới nội chất và Bộ máy Golgi","Ribosome và Lysosome","Không bào và Peroxisome"],"e":"Ti thể và lục lạp là hai bào quan có DNA riêng (mtDNA và cpDNA/ptDNA) có khả năng tự nhân đôi.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Đặc điểm dạng cấu trúc DNA của ti thể (mtDNA) và lục lạp (cpDNA) giống với cấu trúc DNA của sinh vật nào?","o":["Vi khuẩn (DNA vòng kép, không liên kết với histone)","DNA thẳng của động vật bậc cao","DNA đơn dạng sợi","RNA thông tin"],"e":"DNA ti thể và lục lạp đều có dạng vòng kép không liên kết với protein histone, tương tự DNA của vi khuẩn.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Nhà khoa học nào đã phát hiện ra hiện tượng di truyền ngoài nhân đầu tiên ở cây hoa phấn (Mirabilis jalapa)?","o":["Carl Correns","Gregor Mendel","Thomas Hunt Morgan","James Watson"],"e":"Carl Correns (1909) phát hiện sự di truyền màu lá đốm ở cây hoa phấn do gene trong lục lạp quy định.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tại sao giao tử đực (tinh trùng) thường đóng góp rất ít hoặc không đóng góp gene tế bào chất cho hợp tử?","o":["Vì tinh trùng có kích thước rất nhỏ và hầu như chỉ truyền nhân tế bào vào trong trứng","Vì ti thể của tinh trùng bị phân hủy hoàn toàn trước khi thụ tinh","Vì DNA ti thể đực không có khả năng nhân đôi","Vì tinh trùng không chứa ti thể"],"e":"Khối tế bào chất của trứng lớn gấp hàng ngàn lần tinh trùng; ti thể ở đuôi tinh trùng thường bị loại bỏ khi vào trứng.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Phương pháp thí nghiệm nào được sử dụng để xác định một tính trạng do gene trong nhân hay gene ngoài nhân quy định?","o":["Phép lai thuận nghịch","Phép lai phân tích","Phép lai tự thụ phấn","Phép lai khác loài"],"e":"Phép lai thuận nghịch nếu cho kết quả khác nhau và đời con luôn mang kiểu hình của mẹ thì tính trạng do gene ngoài nhân quy định.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ở cây hoa phấn (Mirabilis jalapa), lấy hạt phấn của cây có lá xanh lai với noãn của cây có lá đốm (khảm). Đời con sinh ra sẽ có kiểu hình như thế nào?","o":["Gồm cả cây lá xanh, cây lá trắng và cây lá đốm","100% cây lá xanh","100% cây lá đốm","100% cây lá trắng"],"e":"Tế bào noãn cây lá đốm chứa hỗn hợp lục lạp bình thường (xanh) và đột biến (trắng); khi phân chia ngẫu nhiên sẽ sinh ra cả 3 loại cây.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Kết quả phân ly kiểu hình ở đời con đối với tính trạng do gene ngoài nhân quy định có tuân theo các tỉ lệ Mendel (3:1 hay 9:3:3:1) không?","o":["Không tuân theo các tỉ lệ định luật Mendel","Luôn tuân theo đúng tỉ lệ 3 : 1","Luôn tuân theo tỉ lệ 9 : 3 : 3 : 1","Tuân theo tỉ lệ 1 : 2 : 1"],"e":"Các gene trong tế bào chất không phân ly đồng đều trong giảm phân nên không tuân theo quy luật Mendel.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng bất thụ đực di truyền qua tế bào chất (CMS - Cytoplasmic Male Sterility) ở cây trồng có ứng dụng quan trọng nào?","o":["Tạo dòng mẹ bất thụ đực để sản xuất hạt lai F1 kinh tế mà không cần khử tay","Làm tăng tốc độ quang hợp của cây","Giúp cây kháng sâu bệnh tốt hơn","Tạo ra cây trồng tự thụ phấn nghiêm ngặt"],"e":"CMS giúp tạo dòng mẹ không có hạt phấn chín, ứng dụng sản xuất hạt lai F1 ở ngô, lúa quy mô công nghiệp.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Nếu một người mẹ bị mắc bệnh do đột biến gene trong DNA ti thể, xác suất các con của bà sinh ra bị bệnh là bao nhiêu?","o":["100% các con (cả con trai và con gái) đều bị bệnh","Chỉ 50% con trai bị bệnh","Chỉ 50% con gái bị bệnh","0% (không truyền cho con)"],"e":"Mẹ truyền ti thể cho 100% các con nên tất cả con sinh ra từ mẹ mang đột biến ti thể đều nhận gene bệnh.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Nếu một người bố bị bệnh do đột biến gene trong DNA ti thể lấy người mẹ bình thường thì các con của họ sinh ra có bị bệnh không?","o":["100% các con sinh ra đều bình thường (không bị bệnh)","100% con trai bị bệnh","100% con gái bị bệnh","50% con bị bệnh"],"e":"Người bố không truyền ti thể cho hợp tử nên không thể truyền bệnh ti thể cho bất kỳ con nào.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Thuyết nội cộng sinh (Endosymbiotic theory) giải thích nguồn gốc tiến hóa của ti thể và lục lạp từ sinh vật nào?","o":["Từ các vi khuẩn cổ nhân sơ bị tế bào nhân thực tổ tiên thực bào","Từ bộ máy Golgi biến đổi thành","Từ nhân tế bào tách ra","Từ màng sinh chất cuộn gập tạo thành"],"e":"Thuyết nội cộng sinh khẳng định ti thể và lục lạp vốn là các vi khuẩn hiếu khí và vi khuẩn lam sống cộng sinh trong tế bào chủ.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Ribosome có mặt trong ti thể và lục lạp thuộc loại nào?","o":["Ribosome 70S (giống ở vi khuẩn)","Ribosome 80S (giống ở tế bào chất nhân thực)","Ribosome 100S","Không chứa ribosome"],"e":"Ti thể và lục lạp có ribosome kích thước 70S tương tự như ở vi khuẩn nhân sơ.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Khái niệm Heteroplasmy (tính dị chất ti thể) dùng để chỉ trạng thái tế bào như thế nào?","o":["Trong cùng một tế bào chứa cả các phân tử mtDNA bình thường và mtDNA đột biến","Tế bào chỉ chứa 1 loại ti thể","Tế bào không có ti thể","Ti thể và lục lạp trao đổi DNA cho nhau"],"e":"Heteroplasmy xảy ra khi có sự tồn tại song song của cả phân tử mtDNA kiểu dại và đột biến trong cùng tế bào.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Khái niệm Homoplasmy (tính đồng chất ti thể) chỉ trạng thái tế bào có đặc điểm gì?","o":["Tất cả các phân tử mtDNA trong tế bào đều hoàn toàn giống nhau (cùng là kiểu dại hoặc cùng là đột biến)","Tế bào chứa hai bộ nhân khác nhau","Ti thể kết hợp với lục lạp","Ti thể phân chia không có DNA"],"e":"Homoplasmy là trạng thái đồng nhất tuyệt đối của toàn bộ phân tử mtDNA trong một tế bào.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Sự phân chia của ti thể và lục lạp trong tế bào diễn ra theo cơ chế nào?","o":["Tự phân đôi độc lập với sự phân chia nhân tế bào (tương tự như vi khuẩn)","Nguyên phân có thoi vô sắc","Giảm phân tạo giao tử","Tự tổng hợp mới hoàn toàn từ nhân"],"e":"Ti thể và lục lạp sinh sản bằng cách tự phân đôi, không phụ thuộc hoàn toàn vào chu kỳ phân bào của nhân.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Thế hệ con sinh ra từ phép lai thuận và phép lai nghịch đối với tính trạng do gene trong nhân quy định (nếu không liên kết giới tính) sẽ có đặc điểm gì?","o":["Kết quả kiểu hình ở đời con là hoàn toàn giống nhau","Kết quả kiểu hình ở đời con là khác nhau","Đời con luôn giống mẹ","Đời con luôn giống bố"],"e":"Gene trên NST thường cho kết quả lai thuận nghịch giống nhau; nếu kết quả khác nhau và luôn giống mẹ thì đó là di truyền tế bào chất.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Lớp vỏ protein mã hóa cho các enzyme phức hợp hô hấp ở ti thể có nguồn gốc tổng hợp hoàn toàn từ đâu?","o":["Một phần do gene ti thể mã hóa, một phần do gene trong nhân tế bào mã hóa","100% do gene ti thể mã hóa","100% do gene trong nhân mã hóa","Do vi khuẩn bên ngoài cung cấp"],"e":"Ti thể là bào quan bán tự trị; nhiều chuỗi polypeptide của phức hợp chuỗi truyền e- do gene nhân mã hóa và nhập bào vào ti thể.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Tại sao các bệnh do đột biến DNA ti thể thường gây ra tổn thương nghiêm trọng nhất ở hệ thần kinh và cơ bắp?","o":["Vì mô thần kinh và cơ bắp đòi hỏi mức tiêu thụ năng lượng ATP cực lớn","Vì ti thể chỉ tồn tại ở tế bào thần kinh và cơ","Vì gene ti thể chỉ biểu hiện ở hai loại mô này","Vì ti thể ngăn cản sự phân chia của tế bào thần kinh"],"e":"Ti thể là nhà máy sản xuất ATP, các tế bào thần kinh và cơ bắp cần rất nhiều ATP nên nhạy cảm nhất khi ti thể suy giảm chức năng.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Cơ chế phân ly ngẫu nhiên các bào quan ti thể/lục lạp trong quá trình phân bào được gọi là hiện tượng gì?","o":["Sự phân ly tế bào chất ngẫu nhiên (Replicative segregation)","Sự phân ly độc lập Mendel","Sự hoán vị gene ngoài nhân","Sự tái tổ hợp nhiễm sắc thể"],"e":"Replicative segregation khiến tỉ lệ ti thể đột biến/bình thường phân bố không đồng đều giữa các tế bào con qua mỗi đợt phân bào.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Khái niệm 'Ngưỡng biểu hiện' (Threshold effect) trong bệnh di truyền ti thể có nghĩa là gì?","o":["Tế bào chỉ phát bệnh khi tỷ lệ phân tử mtDNA đột biến vượt qua một mức phần trăm nhất định","Chỉ cần 1 phân tử mtDNA đột biến là tế bào bị bệnh ngay","Bệnh chỉ xuất hiện khi cá thể đạt 18 tuổi","Tất cả các tế bào trong cơ thể phải mang 100% mtDNA đột biến"],"e":"Mô chỉ bị rối loạn chức năng khi tỉ lệ mtDNA đột biến đạt tới ngưỡng (thường từ 60% - 90% tùy mô).","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở nấm men (Saccharomyces cerevisiae), đột biến 'poky' hoặc 'petite' gây ra đặc điểm tăng trưởng chậm và tạo khuẩn lạc nhỏ là do rối loạn bào quan nào?","o":["Đột biến khuyết tật ở ti thể làm mất khả năng hô hấp hiếu khí","Đột biến ở lục lạp","Đột biến mất đoạn nhiễm sắc thể nhân","Đột biến màng tế bào"],"e":"Đột biến petite ở nấm men ảnh hưởng đến mtDNA làm hỏng xích truyền e- ti thể, bắt buộc nấm men chỉ sống bằng lên men chậm chạp.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Tại sao tốc độ đột biến trên DNA ti thể (mtDNA) lại cao hơn khoảng 10 - 20 lần so với DNA trong nhân tế bào?","o":["Do ti thể thiếu protein histone bảo vệ, thiếu hệ thống sửa chữa DNA hiệu quả và tiếp xúc trực tiếp với các gốc oxy hóa tự do (ROS)","Do mtDNA có kích thước quá lớn","Do ti thể phân chia bằng giảm phân","Do mtDNA là dạng sợi đơn RNA"],"e":"Môi trường nội ti thể chứa nhiều ROS tạo ra từ hô hấp, kết hợp thiếu histone và sửa chữa kém khiến tỉ lệ đột biến tích lũy rất nhanh.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Hiện tượng di truyền hiệu ứng mẹ (Maternal effect) khác với di truyền tế bào chất (Maternal inheritance) ở điểm mấu chốt nào?","o":["Hiệu ứng mẹ do các sản phẩm (mRNA/protein) tích trữ trong trứng do gene trong nhân của mẹ mã hóa quy định kiểu hình con","Hiệu ứng mẹ do gene trong ti thể quy định","Hiệu ứng mẹ tuân theo di truyền liên kết Y","Hiệu ứng mẹ không ảnh hưởng tới F1"],"e":"Hiệu ứng mẹ là do gene nhân của mẹ tổng hợp mRNA/protein đưa vào noãn bào quyết định sự phát triển sớm của phôi con.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Ở ốc bươu Limnaea peregra, hướng xoắn của vỏ ốc (xoắn phải D hay xoắn trái d) được quy định bởi gene nhân theo cơ chế hiệu ứng mẹ. Cho phép lai P: Cái xoắn trái (dd) x Đực xoắn phải (DD). Kiểu hình hướng xoắn vỏ ốc ở thế hệ F1 và F2 lần lượt sẽ là gì?","o":["F1 100% xoắn trái; F2 100% xoắn phải","F1 100% xoắn phải; F2 100% xoắn trái","F1 100% xoắn trái; F2 3 xoắn phải : 1 xoắn trái","F1 100% xoắn phải; F2 3 xoắn phải : 1 xoắn trái"],"e":"Mẹ P có kiểu gen dd -> F1 (Dd) đều xoắn trái theo mẹ. Mẹ F1 có kiểu gen Dd -> F2 (1DD:2Dd:1dd) đều xoắn phải theo kiểu gen mẹ Dd.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Khái niệm 'Mitochondrial Eve' (Eva ti thể) trong di truyền chủng tộc người học khẳng định điều gì?","o":["Tất cả loài người hiện đại đều thừa hưởng dòng mtDNA nguyên thủy từ một người phụ nữ sống tại Châu Phi khoảng 150.000 - 200.000 năm trước","Người phụ nữ duy nhất sống ở thời tiền sử","Mẹ của tất cả các loài động vật có vú","Người phụ nữ đầu tiên được lai tạo nhân tạo"],"e":"Bằng phân tích cây di truyền mtDNA không bị tái tổ hợp qua dòng mẹ, các nhà khoa học truy nguyên nguồn gốc người hiện đại về một tổ tiên cái chung tại châu Phi.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Cơ chế 'Paternal Mitochondrial Elimination' (Loại bỏ ti thể từ bố) ở hầu hết sinh vật đa bào sau thụ tinh được thực hiện nhờ con đường sinh học nào?","o":["Sự đánh dấu Ubiquitin hóa ti thể tinh trùng và tiêu hủy qua con đường Tự thực bào (Autophagy / Mitophagy)","Sự phân hủy do ánh sáng mặt trời","Sự đẩy ti thể bố ra ngoài màng tế bào trứng","Sự trung hòa do enzyme nhân"],"e":"Ti thể của tinh trùng khi chui vào trứng lập tức bị hệ thống Ubiquitin-Proteasome và Mitophagy của trứng nhận diện và chủ động phân hủy.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Sự phục hồi tính hữu thụ đực ở dòng cây bất thụ đực tế bào chất (CMS) nhờ sự tương tác của gene nào?","o":["Gene khôi phục tính hữu thụ (Rf - Restorer of fertility) nằm trong nhân tế bào","Gene khác nằm trong lục lạp","Gene tổng hợp diệp lục","Gene kháng thuốc trừ cỏ"],"e":"Tính bất thụ đực do gene ti thể gây ra có thể bị áp chế hoàn toàn bởi sự có mặt của gene trội Rf nằm trên NST nhân.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Đột biến nhiễm sắc thể được chia thành hai dạng chính nào sau đây?","o":["Đột biến cấu trúc NST và đột biến số lượng NST","Đột biến điểm và đột biến khung","Đột biến thay thế và đột biến thêm bớt","Đột biến giao tử và đột biến xôma"],"e":"Đột biến NST gồm 2 loại lớn: Đột biến cấu trúc NST (mất, lặp, đảo, chuyển đoạn) và đột biến số lượng NST (lệch bội, đa bội).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Dạng đột biến cấu trúc NST nào làm giảm bớt số lượng gene trên nhiễm sắc thể?","o":["Mất đoạn NST","Lặp đoạn NST","Đảo đoạn NST","Chuyển đoạn tương hỗ"],"e":"Đột biến mất đoạn làm mất đi một đoạn khối lượng cơ bản chứa gene trên NST.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Dạng đột biến cấu trúc NST làm tăng chiều dài của NST và làm gia tăng số lượng bản sao của gene là gì?","o":["Lặp đoạn NST","Mất đoạn NST","Đảo đoạn NST","Chuyển đoạn NST"],"e":"Lặp đoạn làm một đoạn NST được lặp lại một hay nhiều lần, làm tăng số lượng gene tương ứng.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Dạng đột biến cấu trúc NST nào không làm thay đổi hàm lượng DNA và số lượng gene trên nhiễm sắc thể?","o":["Đảo đoạn NST","Mất đoạn NST","Lặp đoạn NST","Chuyển đoạn không tương hỗ"],"e":"Đảo đoạn chỉ làm thay đổi trật tự phân bố gene trên NST mà không làm thay đổi số lượng gene hay hàm lượng DNA.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Đột biến mất đoạn nhỏ ở nhánh ngắn nhiễm sắc thể số 5 ở người gây ra hội chứng di truyền nào?","o":["Hội chứng tiếng mèo kêu (Cri-du-chat)","Hội chứng Down","Hội chứng Turner","Hội chứng Klinefelter"],"e":"Hội chứng Cri-du-chat do mất đoạn nhánh ngắn NST số 5 (5p-).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Thể lệch bội (aneuploidy) là hiện tượng số lượng nhiễm sắc thể bị thay đổi như thế nào?","o":["Thay đổi số lượng ở một hoặc một số cặp NST tương đồng","Tăng lên theo bội số của bộ đơn bội (3n, 4n, 5n...)","Giảm xuống một nửa ở tất cả các cặp","Không thay đổi số lượng NST"],"e":"Thể lệch bội là đột biến làm tăng hoặc giảm số lượng NST ở 1 hoặc một vài cặp NST tương đồng.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Công thức ký hiệu bộ nhiễm sắc thể của Thể ba (trisomy) là gì?","o":["2n + 1","2n - 1","2n + 2","2n - 2"],"e":"Thể ba có 1 cặp NST chứa 3 chiếc, bộ NST ký hiệu là 2n + 1.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Công thức ký hiệu bộ nhiễm sắc thể của Thể một (monosomy) là gì?","o":["2n - 1","2n + 1","2n - 2","n - 1"],"e":"Thể một có 1 cặp NST chỉ còn lại 1 chiếc, bộ NST ký hiệu là 2n - 1.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hội chứng Down ở người do đột biến lệch bội nào gây ra?","o":["Thể ba ở nhiễm sắc thể số 21 (Trisomy 21)","Thể ba ở nhiễm sắc thể số 18 (Trisomy 18)","Thể một ở nhiễm sắc thể số 21","Thể ba ở nhiễm sắc thể giới tính X"],"e":"Hội chứng Down do có 3 chiếc NST số 21 (2n + 1 = 47 NST).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hội chứng Turner ở nữ giới có bộ nhiễm sắc thể giới tính là gì?","o":["XO (45, X)","XXY (47, XXY)","XXX (47, XXX)","XYY (47, XYY)"],"e":"Hội chứng Turner là thể một ở cặp NST giới tính nữ, ký hiệu XO (2n - 1 = 45).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hội chứng Klinefelter ở nam giới có bộ nhiễm sắc thể giới tính dạng nào?","o":["XXY (47, XXY)","XO (45, X)","XYY (47, XYY)","XX (46, XX)"],"e":"Hội chứng Klinefelter là thể ba ở cặp NST giới tính ở nam, ký hiệu XXY (2n + 1 = 47).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng Tự đa bội (Autopolyploidy) là dạng đột biến làm tăng số lượng bộ NST đơn bội từ nguồn gốc nào?","o":["Từ cùng một loài","Từ hai loài khác nhau lai với nhau","Từ sự mất đoạn NST","Từ sự đảo đoạn NST"],"e":"Tự đa bội là sự gia tăng số bộ NST đơn bội của cùng 1 loài (3n, 4n, 5n... của cùng loài đó).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hiện tượng Dị đa bội (Allopolyploidy) được hình thành từ cơ chế di truyền nào?","o":["Lai xa giữa hai loài khác nhau kết hợp với đa bội hóa (song nhị bội)","Tự thụ phấn ở thể lệch bội","Sự nhân đôi DNA nhưng không phân chia tế bào chất ở 1 loài","Đột biến chuyển đoạn NST"],"e":"Dị đa bội hình thành do lai xa giữa 2 loài khác nhau tạo con lai bất thụ (nA + nB), sau đó đa bội hóa thành dạng song nhị bội (2nA + 2nB) hữu thụ.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Các thể đa bội lẻ (như 3n, 5n) thường có đặc điểm sinh học nổi bật nào?","o":["Không có khả năng sinh sản hữu tính (bất thụ) do giảm phân bị rối loạn","Sinh sản hữu tính bình thường và mạnh mẽ","Kích thước cơ quan sinh dưỡng thu nhỏ lại","Luôn gây chết ngay ở giai đoạn phôi"],"e":"Thể đa bội lẻ không tạo ra giao tử bình thường trong giảm phân nên bất thụ (ứng dụng tạo quả không hạt như dưa hấu 3n).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hóa chất tác động thế nào lên tế bào phân bào để tạo ra thể đa bội?","o":["Colchicine ức chế sự hình thành thoi vô sắc làm NST nhân đôi nhưng không phân ly","Colchicine làm đứt gãy cấu trúc màng nhân","Colchicine ngăn cản sự nhân đôi DNA ở pha S","Colchicine kích thích tế bào thắt màng nhanh hơn"],"e":"Colchicine cản trở sự trùng hợp tubulin tạo thoi phân bào, khiến bộ NST đã nhân đôi không thể phân ly về 2 cực.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Dạng đột biến cấu trúc NST nào làm xuất hiện các nhóm gene liên kết mới?","o":["Chuyển đoạn giữa các nhiễm sắc thể không tương đồng","Đảo đoạn chứa tâm động","Lặp đoạn NST","Mất đoạn đầu mút"],"e":"Chuyển đoạn giữa các NST khác cặp tương đồng đưa các gene từ NST này sang NST khác, làm hình thành nhóm gene liên kết mới.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Sự nhân đôi quá mức của đoạn lặp Bar trên nhiễm sắc thể X ở ruồi giấm dẫn đến hậu quả gì về kiểu hình?","o":["Mắt rựa bị thu nhỏ thành mắt dẹt","Thân xám chuyển thành thân đen","Cánh dài chuyển thành cánh ngắn","Chân biến thành râu"],"e":"Lặp đoạn Bar trên NST X ở ruồi giấm làm mắt lồi bình thường thu hẹp dần thành mắt dẹt.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"So với thể lưỡng bội (2n), các thể đa bội chẵn (4n, 6n) ở thực vật thường có đặc điểm sinh dưỡng như thế nào?","o":["Tế bào to hơn, cơ quan sinh dưỡng (lá, quả, thân) lớn hơn và có sức chống chịu tốt","Tế bào nhỏ hơn, lá bé và quả nhỏ hơn","Thân yếu và chết sớm","Không có khả năng tổng hợp diệp lục"],"e":"Thực vật đa bội có hàm lượng DNA tăng gấp bội làm tế bào to, dẫn đến cơ quan sinh dưỡng phát triển vượt trội.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Hội chứng Edwards ở người là đột biến lệch bội dạng nào?","o":["Thể ba ở nhiễm sắc thể số 18 (Trisomy 18)","Thể ba ở nhiễm sắc thể số 13 (Trisomy 13 - Patau)","Thể một ở nhiễm sắc thể số 21","Thể ba ở nhiễm sắc thể giới tính Y"],"e":"Hội chứng Edwards do thể ba ở cặp NST số 18.","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Dạng đột biến cấu trúc NST nào làm cho các gene vốn xa nhau có thể lại gần nhau, dẫn đến thay đổi mức độ hoạt động của gene?","o":["Đảo đoạn NST hoặc Chuyển đoạn NST","Mất đoạn nhỏ đầu mút","Lặp đoạn","Nhân đôi toàn bộ bộ NST"],"e":"Đảo đoạn và chuyển đoạn làm thay đổi vị trí của gene trên NST, làm thay đổi sự tương tác giữa gene với vùng điều hòa xung quanh (hiệu ứng vị trí).","ch":"Chương 4: Di truyền và biến dị","df":"Dễ"},{"q":"Một loài sinh vật có bộ NST lưỡng bội 2n = 14. Số lượng nhiễm sắc thể trong tế bào sinh dưỡng của Thể ba kép (Double trisomy) và Thể tam bội (Triploidy) lần lượt là bao nhiêu?","o":["Thể ba kép = 16; Thể tam bội = 21","Thể ba kép = 15; Thể tam bội = 21","Thể ba kép = 16; Thể tam bội = 28","Thể ba kép = 15; Thể tam bội = 16"],"e":"Thể ba kép có 2 cặp dư 1 chiếc: 2n + 1 + 1 = 14 + 2 = 16. Thể tam bội: 3n = 3 * 7 = 21.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Nhiễm sắc thể Philadelphia ($Ph^1$) gây ra bệnh ung thư máu dòng tủy mạn tính (CML) ở người hình thành từ loại đột biến cấu trúc NST nào?","o":["Chuyển đoạn tương hỗ giữa nhiễm sắc thể số 9 và nhiễm sắc thể số 22 [t(9;22)]","Mất đoạn toàn bộ nhiễm sắc thể số 21","Đảo đoạn nhiễm sắc thể số 9","Lặp đoạn nhiễm sắc thể số 22"],"e":"NST Philadelphia hình thành do chuyển đoạn giữa 9 và 22, tạo gene lai BCR-ABL kích thích phân bào vô kiểm soát.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Thí nghiệm lai xa nổi tiếng của Karpachenko giữa Cải củ ($2n_C = 18$) và Cải bắp ($2n_B = 18$) tạo ra cây lai song nhị bội hữu thụ có bộ NST chứa bao nhiêu chiếc?","o":["36 nhiễm sắc thể ($18_C + 18_B$)","18 nhiễm sắc thể","54 nhiễm sắc thể","27 nhiễm sắc thể"],"e":"Cây lai song nhị bội mang bộ NST lưỡng bội hoàn chỉnh của cả 2 loài gốc: $2n_C + 2n_B = 18 + 18 = 36$ NST.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Tại sao đột biến mất đoạn NST thường gây hậu quả nghiêm trọng và tử vong cao hơn so với đột biến lặp đoạn?","o":["Vì làm mất hẳn các gene thiết yếu dẫn đến mất cân bằng hệ gene nghiêm trọng","Vì lặp đoạn làm gia tăng số lượng NST","Vì mất đoạn kích thích ung thư phát triển lập tức","Vì lặp đoạn luôn luôn vô hại"],"e":"Mất đoạn làm thiếu hụt vĩnh viễn các thông tin di truyền thiết yếu, gây mất cân bằng sinh lý nghiêm trọng hơn việc thừa gene do lặp đoạn.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Nhiễm sắc thể đều (Isochromosome) được hình thành từ cơ chế bất thường nào trong phân bào?","o":["Tâm động phân chia theo chiều ngang thay vì chia theo chiều dọc ở kỳ sau","Sự trao đổi chéo không cân giữa hai chromatid","Mất toàn bộ hai đoạn đầu mút","Sự kết cặp sai giữa hai NST khác cặp tương đồng"],"e":"Isochromosome xuất hiện khi tâm động tách ngang, tạo ra 1 NST gồm 2 nhánh ngắn giống hệt nhau và 1 NST gồm 2 nhánh dài giống hệt nhau.","ch":"Chương 4: Di truyền và biến dị","df":"Trung bình"},{"q":"Chuyển đoạn Robertsonian (Robertsonian translocation) diễn ra phổ biến nhất giữa các nhiễm sắc thể có hình thái đặc trưng nào?","o":["Hai nhiễm sắc thể tâm đầu (Acrocentric chromosomes) bị mất nhánh ngắn và nối tâm dài với nhau","Hai nhiễm sắc thể tâm giữa","Một nhiễm sắc thể tâm giữa và một nhiễm sắc thể tâm lệch","Giữa hai nhiễm sắc thể giới tính X và Y"],"e":"Chuyển đoạn Robertsonian xảy ra ở các NST tâm đầu (13, 14, 15, 21, 22): 2 nhánh dài sáp nhập tại tâm tạo 1 NST lớn, 2 nhánh ngắn tiêu biến.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Một cá thể mang chuyển đoạn tương hỗ dị hợp tử giữa hai NST không tương đồng khi giảm phân sẽ xếp hình cấu trúc đặc trưng nào ở kỳ đầu I để đảm bảo các đoạn tương đồng tiếp hợp?","o":["Hình chữ thập (Cross-like structure / Tetravalent)","Hình vòng tròn đơn","Hình chuỗi thẳng gồm 4 NST","Hình kẹp tóc"],"e":"Ở dị hợp chuyển đoạn tương hỗ, 4 NST (2 NST bình thường và 2 NST biến đổi) phải bắt cặp tạo cấu trúc hình chữ thập ở kỳ đầu I.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Tại sao đột biến đảo đoạn ngoài tâm động (Paracentric inversion) khi diễn ra trao đổi chéo trong vùng đảo đoạn lại dẫn đến hình thành chromatid cầu tâm động (dicentric bridge) và đoạn không tâm động (acentric fragment)?","o":["Do sự trao đổi chéo đơn trong vòng đảo đoạn nối 2 tâm động với nhau và tạo ra đoạn đứt rời không có tâm động","Do tâm động bị phân hủy lập tức","Do sự trùng hợp bất thường của vi ống","Do các chromatid bị dính chặt vào màng nhân"],"e":"Trao đổi chéo trong vòng đảo đoạn ngoài tâm động tạo ra 1 chromatid có 2 tâm động (kéo căng tạo cầu) và 1 chromatid không tâm động (bị thất lạc ở kỳ sau).","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Ở một loài cây lưỡng bội 2n = 24, hỏi có tối đa bao nhiêu loại thể ba (trisomic) đơn khác nhau có thể được tạo ra trong quần thể?","o":["12 loại thể ba","24 loại thể ba","36 loại thể ba","6 loại thể ba"],"e":"Số loại thể ba đơn tối đa bằng số cặp NST tương đồng n = 2n / 2 = 24 / 2 = 12 loại.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"Nhiễm sắc thể nhẫn (Ring chromosome) được khởi đầu tạo thành từ loại tổn thương cấu trúc nào?","o":["Mất đoạn ở cả hai đầu mút (telomere) của NST, làm lộ ra hai đầu dính và nối tròn lại với nhau","Đảo đoạn chứa tâm động","Lặp đoạn lặp lại 3 lần","Chuyển đoạn không tương hỗ"],"e":"NST nhẫn xuất hiện do gãy đứt ở 2 vùng telomere của cả 2 nhánh; 2 đầu đứt dính tự nối lại tạo cấu trúc vòng tròn khép kín.","ch":"Chương 4: Di truyền và biến dị","df":"Khó"},{"q":"ADN là tên viết tắt của hợp chất sinh học nào sau đây?","o":["Axit Deoxyribonucleic","Axit Ribonucleic","Axit Amino Nucleic","Adenosine Diphosphate"],"e":"ADN (DNA) là viết tắt của Axit Deoxyribonucleic.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Đơn phân cấu tạo nên phân tử ADN là gì?","o":["Nucleotide","Axit amin","Glucose","Axit béo"],"e":"ADN là đại phân tử sinh học được cấu tạo theo nguyên tắc đa phân, đơn phân là các nucleotide.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Mỗi đơn phân nucleotide của ADN gồm có mấy thành phần cấu tạo chính?","o":["3 thành phần (Gốc phosphate, đường Deoxyribose, bazo nitơ)","2 thành phần","4 thành phần","1 thành phần"],"e":"1 nucleotide ADN gồm: 1 gốc phosphate, 1 đường pentose (deoxyribose C5H10O4) và 1 bazo nitơ (A, T, G, C).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Bốn loại bazo nitơ cấu tạo nên phân tử ADN bao gồm những loại nào?","o":["Adenine (A), Thymine (T), Guanine (G), Cytosine (C)","Adenine (A), Uracil (U), Guanine (G), Cytosine (C)","Adenine (A), Thymine (T), Uracil (U), Cytosine (C)","Thymine (T), Uracil (U), Guanine (G), Cytosine (C)"],"e":"4 loại bazo nitơ trong ADN là A, T, G, C (Uracil U chỉ có trong ARN).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại đường 5-carbon có trong cấu trúc của nucleotide ADN là gì?","o":["Deoxyribose (C5H10O4)","Ribose (C5H10O5)","Glucose (C6H12O6)","Fructose"],"e":"Đường trong ADN là đường Deoxyribose (mất 1 nguyên tử oxy ở vị trí C2' so với Ribose).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Mô hình cấu trúc không gian dạng xoắn đôi của ADN được công bố bởi hai nhà khoa học nào vào năm 1953?","o":["James Watson và Francis Crick","Gregor Mendel và Thomas Morgan","Carl Correns và Hugo de Vries","Robert Hooke và Louis Pasteur"],"e":"Watson và Crick công bố mô hình cấu trúc xoắn đôi ADN năm 1953 (dựa trên ảnh x-quang của Rosalind Franklin).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Liên kết nối các nucleotide trên cùng một mạch đơn ADN thành chuỗi polynucleotide là loại liên kết nào?","o":["Liên kết phosphodiester","Liên kết hydrogen","Liên kết peptide","Liên kết glycosidic"],"e":"Liên kết phosphodiester nối nhóm 3'-OH của đường trước với nhóm 5'-phosphate của đường tiếp theo trên 1 mạch.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Hai mạch đơn của phân tử ADN xoắn đôi liên kết với nhau theo nguyên tắc bổ sung bằng loại liên kết nào?","o":["Liên kết hydrogen","Liên kết phosphodiester","Liên kết ion","Liên kết kim loại"],"e":"Hai mạch song song ngược chiều của ADN liên kết với nhau bằng các liên kết hydrogen giữa các bazo nitơ bổ sung.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Theo nguyên tắc bổ sung trong phân tử ADN xoắn đôi, các cặp bazo nitơ liên kết với nhau như thế nào?","o":["A liên kết với T bằng 2 liên kết H; G liên kết với C bằng 3 liên kết H","A liên kết với T bằng 3 liên kết H; G liên kết với C bằng 2 liên kết H","A liên kết với G bằng 2 liên kết H; T liên kết với C bằng 3 liên kết H","A liên kết với C bằng 2 liên kết H; G liên kết với T bằng 3 liên kết H"],"e":"Nguyên tắc bổ sung: Adenine bắt cặp với Thymine (2 liên kết H), Guanine bắt cặp với Cytosine (3 liên kết H).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Định luật Chargaff về thành phần nucleotide trong ADN kép khẳng định tỉ lệ nào đúng?","o":["A = T và G = C (hay A + G = T + C)","A = G và T = C","A + T = G + C","A = C và G = T"],"e":"Do sự bắt cặp bổ sung A-T và G-C nên trong ADN kép luôn có %A = %T và %G = %C.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Hai mạch của phân tử ADN có chiều như thế nào so với nhau?","o":["Song song và ngược chiều nhau (một mạch 5' -> 3', mạch kia 3' -> 5')","Song song và cùng chiều 5' -> 3'","Song song và cùng chiều 3' -> 5'","Vuông góc với nhau"],"e":"Hai mạch polynucleotide của ADN xoắn đôi xếp song song ngược chiều nhau (antiparallel).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Quá trình nhân đôi (tái bản) ADN diễn ra theo hai nguyên tắc cơ bản nào?","o":["Nguyên tắc bổ sung và nguyên tắc bán bảo tồn (bán bảo toàn)","Nguyên tắc bổ sung và nguyên tắc bảo tồn hoàn toàn","Nguyên tắc gián đoạn và nguyên tắc liên tục","Nguyên tắc ngẫu nhiên và nguyên tắc bán bảo tồn"],"e":"Tái bản ADN tuân theo nguyên tắc bổ sung (A-T, G-C) và nguyên tắc bán bảo tồn (mỗi ADN con có 1 mạch cũ, 1 mạch mới).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme chính trực tiếp thực hiện chức năng kéo dài chuỗi polynucleotide mới trong tái bản ADN là gì?","o":["DNA polymerase","RNA polymerase","Helicase","Ligase"],"e":"DNA polymerase tổng hợp mạch mới bằng cách gắn nucleotide tự do vào đầu 3'-OH của mạch đang kéo dài.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme DNA polymerase chỉ có thể tổng hợp chuỗi polynucleotide mới theo một chiều duy nhất là chiều nào?","o":["Chiều 5' -> 3'","Chiều 3' -> 5'","Cả hai chiều 5' -> 3' và 3' -> 5'","Chiều ngẫu nhiên"],"e":"DNA polymerase bắt buộc kéo dài chuỗi theo chiều 5' -> 3' (đọc mạch khuôn 3' -> 5').","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme có vai trò tháo xoắn và cắt đứt các liên kết hydrogen để tách hai mạch ADN trong tái bản là gì?","o":["Helicase","DNA Ligase","Primase","Topoisomerase"],"e":"Helicase di chuyển dọc theo ADN cắt đứt liên kết hydrogen, mở chạc tái bản.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme DNA Ligase có vai trò chính nào trong nhân đôi ADN?","o":["Nối các đoạn Okazaki lại với nhau bằng liên kết phosphodiester","Tháo xoắn phân tử ADN","Tổng hợp đoạn mồi RNA","Cắt đứt liên kết hydrogen"],"e":"DNA Ligase nối các khe hở giữa các đoạn Okazaki trên mạch gián đoạn.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các đoạn ADN ngắn được tổng hợp gián đoạn trên mạch khuôn 5' -> 3' trong tái bản ADN được gọi là gì?","o":["Đoạn Okazaki","Đoạn mồi (Primer)","Exon","Intron"],"e":"Các đoạn Okazaki là các đoạn ngắn được tổng hợp gián đoạn trên mạch chậm (lagging strand).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Tại sao enzyme DNA polymerase cần có một đoạn mồi (RNA primer) để bắt đầu tổng hợp mạch mới?","o":["Vì DNA polymerase chỉ có thể kéo dài chuỗi từ đầu 3'-OH tự do đã có sẵn","Vì DNA polymerase không thể liên kết với mạch khuôn","Vì đoạn mồi cung cấp năng lượng cho phản ứng","Vì đoạn mồi phá hủy liên kết hydrogen cũ"],"e":"DNA polymerase không thể tự khởi đầu chuỗi mới mà cần đầu 3'-OH do enzyme Primase tổng hợp đoạn mồi cung cấp.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Một phân tử ADN tự nhân đôi k lần liên tiếp sẽ tạo ra tổng cộng bao nhiêu phân tử ADN con?","o":["2^k phân tử ADN con","2k phân tử ADN con","k^2 phân tử ADN con","2^k - 2 phân tử ADN con"],"e":"Sau k lần tái bản, từ 1 ADN ban đầu sinh ra 2^k phân tử ADN con.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong 2^k phân tử ADN con tạo ra sau k lần nhân đôi từ 1 ADN ban đầu, có bao nhiêu phân tử ADN hoàn toàn do nguyên liệu mới từ môi trường cung cấp?","o":["2^k - 2","2^k","2","2^k - 1"],"e":"Luôn có 2 phân tử ADN chứa 1 mạch cũ của mẹ; do đó số ADN hoàn toàn mới = 2^k - 2.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Một phân tử ADN xoắn đôi có tổng số 3000 nucleotide, trong đó số nucleotide loại A = 600. Tính số nucleotide loại G và tổng số liên kết hydrogen của ADN này.","o":["G = 900; Số liên kết H = 3900","G = 900; Số liên kết H = 3600","G = 600; Số liên kết H = 3600","G = 900; Số liên kết H = 4200"],"e":"N = 2A + 2G = 3000 -> A = T = 600 -> G = C = (3000 - 1200)/2 = 900. Số liên kết H = 2A + 3G = 2*600 + 3*900 = 3900.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Thí nghiệm nổi tiếng năm 1958 của Meselson và Stahl sử dụng đồng vị phóng xạ N15 và N14 nhằm chứng minh nguyên tắc nào trong sinh học?","o":["Nguyên tắc bán bảo tồn trong tái bản ADN","Nguyên tắc bổ sung giữa A-T và G-C","Nguyên tắc di truyền liên kết","Nguyên tắc mã hóa bộ ba của mã di truyền"],"e":"Meselson và Stahl nuôi E. coli trong môi trường N15 sau đó chuyển sang N14 và li tâm tỉ trọng để chứng minh tái bản bán bảo tồn.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Khác biệt mấu chốt về điểm khởi đầu tái bản (Origin of Replication - ori) giữa sinh vật nhân sơ (Prokaryote) và sinh vật nhân thực (Eukaryote) là gì?","o":["Nhân sơ chỉ có 1 điểm ori trên phân tử ADN vòng, nhân thực có nhiều điểm ori cùng lúc trên mỗi ADN thẳng","Nhân sơ có hàng ngàn điểm ori, nhân thực chỉ có 1 điểm ori","Nhân sơ không cần điểm ori","Nhân thực tái bản từ hai đầu telomere đi vào"],"e":"ADN vi khuẩn nhân sơ dạng vòng nhỏ chỉ có 1 ori; ADN nhân thực dài gấp hàng ngàn lần nên chứa nhiều ori nhân đôi đồng thời.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Enzyme Topoisomerase (Gyrase) đóng vai trò giải quyết sự cố lý - hóa nào trước chạc tái bản ADN?","o":["Giải tỏa lực căng xoắn cực đại phát sinh phía trước chạc tái bản do hoạt động tháo xoắn của Helicase","Tổng hợp đoạn mồi RNA","Loại bỏ đoạn mồi RNA","Gắn gốc phosphate vào đầu 5'"],"e":"Topoisomerase cắt và nối lại tạm thời các mạch ADN để giải áp lực siêu xoắn (supercoiling) phía trước chạc mở rộng.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Hoạt tính sửa sai (Proofreading) 3' -> 5' exonuclease của enzyme DNA polymerase có ý nghĩa sinh học quan trọng nào?","o":["Phát hiện và cắt bỏ ngay nucleotide bị lắp sai ngẫu nhiên trong quá trình tổng hợp mạch mới để đảm bảo độ chính xác cực cao","Phân hủy đoạn mồi RNA","Nối hai đoạn Okazaki","Tháo xoắn chuỗi kép"],"e":"Hoạt tính 3' -> 5' exonuclease giúp DNA polymerase lùi lại 1 bước, cắt bỏ nucleotide lắp sai trước khi tiếp tục tổng hợp.","ch":"Chương 5: Sinh học phân tử","df":"Trung bình"},{"q":"Sự cố co ngắn đầu mút nhiễm sắc thể (End-replication problem) chỉ xảy ra ở phân tử ADN nhân thực dạng thẳng mà không xuất hiện ở phân tử ADN nhân sơ dạng vòng là do nguyên nhân nào?","o":["Mạch chậm bị mất đoạn mồi RNA ở đầu 5' cuối cùng mà DNA polymerase không thể lấp đầy vì thiếu đầu 3'-OH tự do","Do DNA nhân thực không có enzyme DNA Ligase","Do sinh vật nhân thực thiếu enzyme Helicase ở đầu mút","Do các bazo nitơ ở đầu mút bị phân hủy nhanh chóng"],"e":"Sau khi loại bỏ mồi RNA ở cực 5' cuối mạch chậm, DNA pol không thể điền khuyết do không có đầu 3'-OH trước đó, khiến ADN ngắn dần qua mỗi đợt phân bào.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Enzyme Telomerase duy trì độ dài đầu mút Telomere ở tế bào mầm và tế bào ung thư hoạt động theo cơ chế đặc biệt nào?","o":["Sử dụng một mẫu khuôn RNA tích hợp bên trong chính nó để phiên mã ngược kéo dài chuỗi lặp Telomere","Sử dụng DNA polymerase I kéo dài trực tiếp","Cắt đoạn ADN từ nhiễm sắc thể khác nối vào","Sử dụng ATP tổng hợp nucleotide mới không cần khuôn"],"e":"Telomerase là một phức hợp Ribonucleoprotein chứa khuôn RNA cố định, xúc tác tổng hợp phiên mã ngược kéo dài các đoạn lặp TTAGGG ở đầu mút.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Một phân tử ADN N15 nhân đôi 3 lần trong môi trường chỉ chứa N14. Lấy toàn bộ các phân tử ADN con thu được tiếp tục nhân đôi 2 lần nữa trong môi trường N15. Tính số phân tử ADN con chứa cả hai loại N15 và N14.","o":["14 phân tử","2 phân tử","16 phân tử","30 phân tử"],"e":"Giai đoạn 1 (3 lần trong N14) tạo 8 ADN (gồm 2 ADN mang 1 m15/1 m14 và 6 ADN mang 2 m14). Tổng có 2 m15 và 14 m14. Giai đoạn 2 (2 lần trong N15): 14 m14 ban đầu sẽ đóng vai trò khuôn tạo ra đúng 14 ADN con mang hỗn hợp 1 m14/1 m15.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Ở vi khuẩn E. coli, vai trò phân công công việc giữa hai enzyme DNA polymerase I và DNA polymerase III trong tái bản ADN là gì?","o":["DNA pol III kéo dài chính phần lớn mạch mới, DNA pol I chịu trách nhiệm gỡ bỏ mồi RNA (nhờ 5'->3' exonuclease) và điền khuyết DNA","DNA pol I tổng hợp mạch mới, DNA pol III gỡ đoạn mồi","DNA pol I chỉ hoạt động ở mạch khuôn 3'->5', DNA pol III ở mạch 5'->3'","Hai enzyme hoạt động hoàn toàn giống hệt nhau"],"e":"DNA pol III xúc tác chính kéo dài chuỗi tốc độ cao; DNA pol I gỡ bỏ mồi RNA bằng 5'->3' exonuclease và điền các nucleotide DNA thay thế.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"Cấu trúc 'Trombone model' miêu tả cơ chế phối hợp hoạt động của các phức hợp enzyme tại chạc tái bản ADN nhằm giải quyết hiện tượng nào?","o":["Giúp hai phân tử DNA polymerase III hoạt động đồng thời tổng hợp mạch liên tục và mạch gián đoạn theo cùng một chiều di chuyển của chạc mở rộng nhờ sự uốn cong tạo vòng của mạch chậm","Mô tả sự xoắn lại của màng nhân","Mô tả quá trình tháo xoắn của histon","Mô tả sự phân hủy ADN ở kỳ cuối"],"e":"Mô hình Trombone giải thích mạch gián đoạn uốn vòng lại giúp Dimer DNA polymerase III tiến về cùng một hướng với chạc tái bản.","ch":"Chương 5: Sinh học phân tử","df":"Khó"},{"q":"ARN là tên viết tắt của hợp chất sinh học nào sau đây?","o":["Axit Ribonucleic","Axit Deoxyribonucleic","Axit Amino Nucleic","Adenosine Monophosphate"],"e":"ARN (RNA) là viết tắt của Axit Ribonucleic.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại bazo nitơ đặc trưng chỉ có trong ARN mà không có trong cấu trúc ADN là gì?","o":["Uracil (U)","Thymine (T)","Guanine (G)","Adenine (A)"],"e":"ARN chứa bazo nitơ Uracil (U) thay thế cho Thymine (T) trong ADN.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại đường 5-carbon có trong thành phần cấu tạo đơn phân của ARN là gì?","o":["Ribose (C5H10O5)","Deoxyribose (C5H10O4)","Glucose","Galactose"],"e":"Thành phần đường trong đơn phân ribonucleotide của ARN là Ribose.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Bốn loại đơn phân ribonucleotide cấu tạo nên phân tử ARN là gì?","o":["A, U, G, C","A, T, G, C","A, U, T, C","U, T, G, C"],"e":"4 loại ribonucleotide trong ARN bao gồm: Adenine (A), Uracil (U), Guanine (G) và Cytosine (C).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại ARN nào làm khuôn trực tiếp cho quá trình dịch mã tổng hợp chuỗi polypeptide (protein)?","o":["mARN (ARN thông tin)","tARN (ARN vận chuyển)","rARN (ARN ribosome)","snARN (ARN nhân nhỏ)"],"e":"mARN (messenger RNA) mang thông tin di truyền từ ADN làm khuôn cho tổng hợp protein.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại ARN có chức năng vận chuyển axit amin tương ứng tới ribosome trong quá trình dịch mã là gì?","o":["tARN (ARN vận chuyển)","mARN (ARN thông tin)","rARN (ARN ribosome)","miARN (microRNA)"],"e":"tARN (transfer RNA) mang đầu gắn axit amin và bộ ba đối mã anticodon để đưa axit amin vào chuỗi.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Loại ARN chiếm tỉ lệ khối lượng lớn nhất (khoảng 80%) và là thành phần cấu tạo nên ribosome là gì?","o":["rARN (ARN ribosome)","mARN (ARN thông tin)","tARN (ARN vận chuyển)","siARN (small interfering RNA)"],"e":"rARN (ribosomal RNA) kết hợp với các protein tạo nên cấu trúc ribosome.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Bộ ba nucleotide nằm trên phân tử tARN có nhiệm vụ đọc bổ sung với codon trên mARN được gọi là gì?","o":["Anticodon (Bộ ba đối mã)","Codon (Bộ ba mã hóa)","Triplet (Bộ ba trên ADN)","Promoter"],"e":"Mỗi phân tử tARN có một thùy mang bộ ba đối mã anticodon để bắt cặp bổ sung với codon mARN.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Quá trình tổng hợp phân tử ARN từ mạch khuôn ADN được gọi là quá trình gì?","o":["Phiên mã (Transcription)","Dịch mã (Translation)","Tái bản (Replication)","Biến tính (Denaturation)"],"e":"Phiên mã là quá trình truyền thông tin từ ADN sang ARN.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Enzyme xúc tác chính cho quá trình phiên mã tổng hợp mARN là gì?","o":["RNA polymerase","DNA polymerase","DNA Ligase","Helicase"],"e":"RNA polymerase vừa tháo xoắn ADN vừa tổng hợp chuỗi mARN theo nguyên tắc bổ sung.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Trong quá trình phiên mã, RNA polymerase di chuyển trượt trên mạch khuôn ADN theo chiều nào?","o":["Chiều 3' -> 5'","Chiều 5' -> 3'","Cả hai chiều cùng lúc","Chiều ngẫu nhiên"],"e":"RNA polymerase đọc mạch khuôn ADN theo chiều 3' -> 5' để tổng hợp chuỗi mARN mới theo chiều 5' -> 3'.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Chuỗi mARN mới được tổng hợp kéo dài theo chiều nào?","o":["Chiều 5' -> 3'","Chiều 3' -> 5'","Từ giữa ra hai đầu","Chiều không cố định"],"e":"Mọi chuỗi polynucleotide mới (cả ADN và ARN) luôn được kéo dài theo chiều 5' -> 3'.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Theo nguyên tắc bổ sung trong phiên mã, nucleotide loại A trên mạch khuôn ADN sẽ liên kết với nucleotide loại nào của môi trường nội bào?","o":["Uracil (U)","Thymine (T)","Guanine (G)","Cytosine (C)"],"e":"Trong phiên mã: A (ADN) bắt cặp U (ARN), T (ADN) bắt cặp A (ARN), G (ADN) bắt cặp C (ARN), C (ADN) bắt cặp G (ARN).","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Vùng trình tự ADN nằm ở đầu gene giúp RNA polymerase nhận biết và bám vào để khởi đầu phiên mã được gọi là gì?","o":["Vùng khởi động (Promoter)","Vùng vận hành (Operator)","Vùng kết thúc (Terminator)","Gene điều hòa"],"e":"Promoter chứa các đoạn trình tự đặc trưng (như TATA box) để RNA polymerase gắn vào.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Cấu trúc hình học không gian đặc trưng của phân tử tARN có hình dạng nào?","o":["Hình lá rau râm (hoặc lá ba thùy)","Dạng vòng tròn kép","Dạng mạch thẳng tắp không gấp nếp","Dạng hình cầu khép kín"],"e":"tARN gấp nếp tạo cấu trúc 2D hình lá ba thùy (cloverleaf structure) nhờ các liên kết H nội phân tử.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Khác biệt lớn nhất về kết quả phiên mã ở sinh vật nhân sơ (Prokaryote) và nhân thực (Eukaryote) là gì?","o":["Nhân sơ tạo mARN trưởng thành trực tiếp dịch mã ngay; nhân thực tạo tiền mARN phải qua biến đổi cắt bỏ intron nối exon","Nhân sơ không dùng enzyme RNA polymerase","Nhân thực tổng hợp mARN dạng vòng","Nhân sơ phiên mã trong nhân tế bào"],"e":"Gene nhân thực có cấu trúc phân mảnh (intron/exon) nên mARN sơ cấp (pre-mARN) phải biến đổi biến thành mARN trưởng thành.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các đoạn trình tự không mã hóa cho axit amin nằm trong gene phân mảnh ở sinh vật nhân thực được gọi là gì?","o":["Intron","Exon","Promoter","Codon"],"e":"Intron là các đoạn không mã hóa bị loại bỏ trong quá trình hoàn thiện mARN.","ch":"Chương 5: Sinh học phân tử","df":"Dễ"},{"q":"Các đoạn trình tự mang thông tin mã hóa cho các axit amin giữ lại trên mARN trưởng thành được gọi là gì?","o":["Exon","Intron","Operator","Cắt dán"],"e":"Exon là các đoạn chứa thông tin mã hóa được giữ lại và nối với nhau tạo mARN trư
