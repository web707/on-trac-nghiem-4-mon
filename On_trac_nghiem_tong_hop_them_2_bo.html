<script id="data" type="application/json">{"tl":[{"q":"Ai là Bộ trưởng Bộ Y tế đầu tiên của nước Việt Nam độc lập?","o":["Bác sĩ Phạm Ngọc Thạch","Giáo sư Hồ Đắc Di","Giáo sư Đặng Văn Ngữ","Giáo sư Tôn Thất Tùng"]},{"q":"Ba giai đoạn chính của quá trình ghi nhớ theo thứ tự logic là gì?","o":["Mã hóa → Lưu trữ → Tái hiện","Lưu trữ → mã hóa → Tái hiện","Tái hiện → mã hóa → Lưu trữ","mã hóa → Tái hiện → Lưu trữ"]},{"q":"Bác sĩ tổng hợp các triệu chứng sốt cao, ban đỏ, giảm tiểu cầu để đưa ra chẩn đoán 'Sốt xuất huyết Dengue'. Đây là biểu hiện của quá trình nào?","o":["Nhận thức lý tính","Nhận thức cảm tính đơn thuần","Tái hiện trí nhớ cảm xúc","Phản xạ không điều kiện"]},{"q":"Biện pháp nào dưới đây hướng đến việc khắc phục sai lệch hành vi cá nhân?","o":["Tự đánh giá và rèn luyện kỹ năng quản lý cảm xúc, stress.","Xây dựng văn hóa là việc lành mạnh trong môi trường y tế.","Thiết lập quy chế khen thưởng và kỷ luật của bệnh viện.","Cải tiến quy trình báo cáo sự cố y khoa toàn diện."],"w":"Phương án T1 có cụm “văn hóa là việc” có dấu hiệu lỗi chữ trong nguồn. Giữ nguyên, không tự thêm chữ vào nội dung."},{"q":"Biểu hiện nào sau đây phản ánh sự sai lệch hành vi cá nhân trong y khoa?","o":["Bác sĩ bỏ qua triệu chứng nhỏ do chủ quan, dẫn đến chẩn đoán sai.","Nhân viên y tế từ chối nhận quà biếu của bệnh nhân.","Sinh viên y khoa tham gia chiến dịch tiêm chủng cộng đồng.","Điều dưỡng tuân thủ nghiêm ngặt y lệnh điều trị."]},{"q":"Biểu hiện nào sau đây thuộc về \"Phong cách đạo đức\" của người thầy thuốc?","o":["khiêm tốn, biết lắng nghe, đồng cảm và trung thực, công bằng","Cộc cằn, gắt gỏng khi người bệnh hỏi nhiều","Phân biệt đối xử giữa bệnh nhân giàu và bệnh nhân nghèo","Che giấu sai sót chuyên môn đối với cấp trên"]},{"q":"Bộ phẩm chất đạo đức cốt lõi của người thầy thuốc cách mạng được tóm tắt thành những yếu tố nào?","o":["Tâm đức - Trí đức - Phong cách đạo đức - Tinh thần cách mạng","Danh - Lợi - Tài - Quyền","Lý luận - Thực hành - kỹ thuật - Doanh thu","Thái độ - Hành vi - kỷ luật - Tài chính"]},{"q":"Câu ca dao \"Thương người như thể thương thân\" phản ánh giá trị đạo đức truyền thống nào của dân tộc Việt Nam ?","o":["Lòng nhân ái, tinh thần thương người","Lòng yêu nước, ý chí tự cường","Truyền thống hiếu học","Cần cù, dũng cảm trong lao động"]},{"q":"Cấu trúc não bộ nào đóng vai trò đặc biệt quan trọng trong việc điều hòa cảm xúc, trí nhớ và động lực hành vi?","o":["Hệ Lim bic","Tủy sống","Tiểu não","Hành não"],"w":"Tên hệ thần kinh trong đáp án nguồn ghi “Hệ Lim bic”, bị tách khoảng trắng. Nội dung vẫn giữ đúng văn bản trích xuất; không đổi khóa."},{"q":"Chức năng nào của đạo đức đóng vai trò như 'tòa án bên trong', giúp con người tự kiềm chế và ngăn chặn hành vi tiêu cực?","o":["Chức năng kiểm soát xã hội (tự kiểm soát/lương tâm )","Chức năng giáo dục","Chức năng kinh tế","Chức năng quản lý hành chính"]},{"q":"Cơ sở triết học cho việc giáo dục đạo đức thầy thuốc XHCN dựa trên:","o":["Triết học mác – Lênin và Tư tưởng Hồ Chí minh về y đức","Triết học hiện sinh phương Tây","Học thuyết kinh tế thị trường tự do","Các quy tắc tôn giáo cổ đại"]},{"q":"Đặc điểm chính của hành vi tự nhiên là gì?","o":["mang tính bẩm sinh, không cần qua học tập.","Chịu sự chi phối hoàn toàn bởi văn hóa địa phương.","Luôn có sự lập kế hoạch tỉ mỉ trước khi thực hiện.","Được điều chỉnh bằng các quy định pháp luật."]},{"q":"Đặc điểm nào dưới đây không phải là đặc điểm cơ bản của hành vi con người?","o":["Bắt buộc phải được quy định bằng các văn bản pháp luật.","Có thể quan sát được thông qua hành động, lời nói, cử chỉ.","Có tính mục đích nhằm đạt được một tiêu chí/ mục tiêu nhất định.","mang tính đa dạng và chịu ảnh hưởng bởi nhiều yếu tố tác động."]},{"q":"Đặc điểm nào sau đây KHÔNG phải là đặc điểm cơ bản của nhân cách?","o":["Tính bẩm sinh không bao giờ thay đổi","Tính ổn định nhưng phát triển","Tính độc đáo, riêng biệt","Tính tổng hợp và tính xã hội"]},{"q":"Đặc điểm tiếp nhận thông tin của người cao tuổi mà thầy thuốc cần lưu ý khi giao tiếp là gì?","o":["Thường chậm tiếp nhận thông tin, cần lặp lại và kiểm tra lại sự hiểu biết","Tiếp nhận thông tin rất nhanh và không cần giải thích lại","Rất thích nghe các thuật ngữ chuyên môn phức tạp","không quan tâm đến thái độ của nhân viên y tế"]},{"q":"Dạng chuẩn mực nào do Nhà nước quy định, mang tính bắt buộc chung và có chế tài xử lý vi phạm ?","o":["Chuẩn mực pháp luật.","Chuẩn mực đạo đức.","Chuẩn mực phong tục.","Chuẩn mực văn hóa."]},{"q":"Danh y Tuệ Tĩnh (Nguyễn Bá Tĩnh) nổi tiếng với tư tưởng chỉ đạo nào trong y học cổ truyền Việt Nam ?","o":["Thuốc Nam chữa người Nam Việt","Tây y kết hợp Đông y","Lương y như từ mẫu","Trị bệnh từ khi chưa có bệnh"]},{"q":"Đạo đức được định nghĩa là gì?","o":["Hệ thống các chuẩn mực, nguyên tắc nhằm điều chỉnh hành vi con người trong mối quan hệ với người khác và xã hội.","Hệ thống các văn bản quy phạm pháp luật do nhà nước ban hành nhằm cưỡng chế hành vi.","Tập hợp các quy định kỹ thuật và quy trình thao tác chuẩn trong hành nghề y khoa.","Những quan điểm cá nhân mang tính tự phát, không phụ thuộc vào đời sống xã hội."]},{"q":"Đạo đức học là ngành khoa học thuộc lĩnh vực nào?","o":["Khoa học xã hội","khoa học tự nhiên","khoa học kỹ thuật","khoa học thực nghiệm thuần túy"]},{"q":"Để đảm bảo nguyên tắc ngôn ngữ rõ ràng, dễ hiểu khi giải thích cho người bệnh, thầy thuốc nên làm gì?","o":["Tránh dùng thuật ngữ y khoa khó hiểu, dùng câu ngắn và thông tin cụ thể","Sử dụng tối đa các thuật ngữ y khoa tiếng Anh chuyên ngành","Nói thật nhanh để cung cấp được nhiều thông tin nhất","Chỉ nói những từ ngữ chung chung, mơ hồ"]},{"q":"Điều 7 trong 12 Điều y đức quy định như thế nào về tác phong làm việc của người cán bộ y tế trong ca trực/nhiệm vụ?","o":["không được rời bỏ vị trí trong khi làm nhiệm vụ, theo dõi và xử trí kịp thời các diễn biến của người bệnh","Được phép rời vị trí nếu đã bàn giao bằng miệng","Được nghỉ ngơi ngoài vị trí làm việc nếu bệnh nhân đã ổn định","Phân công cho học viên, sinh viên theo dõi thay để xử lý công việc cá nhân"]},{"q":"Điều 4 trong 12 Điều y đức yêu cầu người thầy thuốc phải giải thích điều gì cho người bệnh hoặc gia đình người bệnh?","o":["Tình hình bệnh tật để hiểu cùng hợp tác điều trị; phổ biến chế độ, chính sách, quyền lợi và nghĩa vụ của người bệnh","Toàn bộ giá thành nhập khẩu của các loại vật tư y tế","Lý do nhân viên y tế bị quá tải công việc","Các quy định xử phạt vi phạm hành chính trong bệnh viện"]},{"q":"Đối tượng nào sau đây được xếp vào nhóm người bệnh đặc biệt?","o":["Người bệnh nhi, người cao tuổi, người bệnh có rối loạn tâm trí/ khó tính","Người bệnh thanh thiếu niên có sức khỏe bình thường","Người bệnh tái khám định kỳ đúng hẹn","Sinh viên y khoa đi thực tập lâm sàng"]},{"q":"Đối tượng nghiên cứu của đạo đức học bao gồm các yếu tố nào sau đây?","o":["Hệ thống chuẩn mực - nguyên tắc đạo đức, quan hệ đạo đức, ý thức và hành vi đạo đức.","Các định lý toán học và định luật vật lý ứng dụng trong y tế.","Cấu trúc giải phẫu và cơ chế sinh lý của cơ thể người.","Quy trình chế biến và bảo quản thuốc công nghiệp."]},{"q":"Giá trị trung tâm của đạo đức y học Việt Nam được đúc kết qua câu nói dân gian nào?","o":["Lương y như từ mẫu","Cứu một người phúc đẳng hà sa","Y thuật là tiên phong, y đức là thứ yếu","Bệnh tật do mệnh trời định"]},{"q":"Giáo sư Đặng Văn Ngữ có đóng góp nổi bật nào đối với nền y học Việt Nam trong kháng chiến?","o":["Nghiên cứu thành công cách sản xuất ra thuốc nước Penicillin","Sáng chế ra thuốc gây mê nội khí quản","Phát triển phẫu thuật mổ tim hở","Thành lập ngành phẫu thuật Nhi khoa"]},{"q":"Giáo sư Hồ Đắc Di là người đầu tiên sáng tạo ra phương pháp phẫu thuật nào?","o":["Phẫu thuật nối thông dạ dày - tá tràng để điều trị hẹp môn vị","Phẫu thuật cắt gan có kế hoạch","Phẫu thuật mổ tim kín","Phẫu thuật sọ nào ở trẻ em"],"w":"Phương án cuối ghi “Phẫu thuật sọ nào ở trẻ em”, có dấu hiệu lỗi chữ. Giữ nguyên để đối chiếu với Word."},{"q":"Giáo sư Tôn Thất Tùng nổi tiếng thế giới với công trình nghiên cứu y khoa nào?","o":["Phương pháp cắt gan có kế hoạch (phương pháp Tôn Thất Tùng)","Phương pháp ghép thận tự thân","Phương pháp sản xuất kháng sinh Penicillin","Phương pháp điều trị bệnh Lao bằng hóa trị liệu"]},{"q":"Giao tiếp là hoạt động gì giữa con người với con người?","o":["Giao lưu, tiếp xúc nhằm tạo ra hoặc chia sẻ thông tin, cảm xúc để đạt mục đích","mua bán, trao đổi hàng hóa dịch vụ theo cơ chế thị trường","Truyền đạt thông tin một chiều từ người quản lý đến cấp dưới","Tranh luận để phân định đúng sai trong các vấn đề xã hội"]},{"q":"Giao tiếp y tế được định nghĩa là quá trình trao đổi điều gì giữa thầy thuốc và người bệnh/người nhà?","o":["Thông tin, cảm xúc và tư duy nhằm chăm sóc, tư vấn và điều trị hiệu quả","Chỉ trao đổi tài chính và chi phí khám bệnh","Các đơn thuốc và kết quả xét nghiệm đã in sẵn","Thông tin cá nhân và quan điểm chính trị"]},{"q":"Hai bộ sách y học nổi tiếng do Danh y Tuệ Tĩnh biên soạn là gì?","o":["Nam dược thần hiệu và Hồng nghĩa giác tư y thư","Hải Thượng y tông tâm lĩnh và Nam dược thần hiệu","Y học nhập môn và Hồng nghĩa giác tư y thư","Lãn Ông tâm lĩnh và Nam dược thần hiệu"]},{"q":"Hành động nào sau đây thể hiện rõ nhất phạm trù 'Thiện' trong hành nghề y khoa?","o":["Tận tâm cứu chữa, mang lại sức khỏe và bảo vệ cuộc sống của người bệnh.","kê đơn thuốc thật đắt tiền để thu lợi nhuận cao.","Che giấu sai sót chuyên môn để bảo vệ uy tín bệnh viện.","Phân biệt đối xử giữa người bệnh giàu và người bệnh nghèo."]},{"q":"Hành động nào thể hiện kỹ năng \"Lắng nghe tích cực\" khi giao tiếp với người bệnh?","o":["Dành sự chú ý hoàn toàn, gật đầu và hỏi lại để xác nhận thông tin","Liên tục ngắt lời người bệnh để tiết kiệm thời gian","Vừa ghi chép hồ sơ vừa nói chuyện mà không nhìn người bệnh","Đưa ra chẩn đoán ngay khi người bệnh mới nói câu đầu tiên"]},{"q":"\"Hành vi cá nhân\" được định nghĩa là:","o":["Bất kỳ hoạt động, phản ứng nào của cá nhân dựa trên suy nghĩ, cảm xúc và nhu cầu riêng.","Quy tắc ứng xử chung do Nhà nước ban hành.","Các hành vi giao tiếp tuân theo quy chuẩn của tập thể.","Các phản ứng sinh học không chịu tác động bởi môi trường."]},{"q":"Hành vi chấp hành đúng quy trình kỹ thuật rửa tay ngoại khoa của phẫu thuật viên là tuân thủ loại chuẩn mực nào?","o":["Chuẩn mực Chuyên môn kỹ thuật.","Chuẩn mực Phong tục tập quán.","Chuẩn mực Giao tiếp xã hội.","Chuẩn mực Tín ngưỡng."]},{"q":"Hành vi xã hội sai lệch là hành vi:","o":["không phù hợp với chuẩn mực xã hội, gây xung đột hoặc nguy hại cho cộng đồng.","Phù hợp với mong muốn cá nhân nhưng không đạt hiệu quả.","Mang tính bản năng nhằm duy trì sự sống.","Bị chi phối duy nhất bởi các yếu tố sinh học."]},{"q":"Hệ thống các giá trị, chuẩn mực được hình thành, bồi đắp qua hàng nghìn năm dựng nước và giữ nước, được cộng đồng thừa nhận và lưu truyền gọi là gì?","o":["Đạo đức truyền thống","Pháp luật quốc gia","Quy chuẩn kỹ thuật y tế","Điều lệ hiệp hội nghề nghiệp"]},{"q":"Hệ thống các quy tắc, giá trị, khuôn mẫu xã hội nhằm điều chỉnh hành vi cá nhân được gọi là:","o":["Chuẩn mực hành vi.","Lập trường cá nhân.","Phản xạ có điều kiện.","Động cơ tâm lý."]},{"q":"Hệ thống chuẩn mực quy định thái độ và hành vi của người lao động trong một ngành nghề xác định được gọi là gì?","o":["Đạo đức nghề nghiệp","Đạo đức gia đình","Đạo đức tôn giáo","Đạo đức quốc tế"]},{"q":"Hình ảnh sự vật, hiện tượng được lưu giữ trong trí nhớ sau khi sự vật không còn trực tiếp hiện diện trước mắt thuộc hình thức nào?","o":["Biểu tượng","Cảm giác","Tri giác","Suy luận"]},{"q":"Hoạt động nhóm giữa bác sĩ, điều dưỡng và dược sĩ lâm sàng để lập kế hoạch điều trị cho một ca bệnh phức tạp được xếp vào loại hành vi nào?","o":["Hành vi xã hội và hành vi có mục đích.","Hành vi tự nhiên.","Hành vi bản năng mang tính sinh học.","Hành vi đáp ứng phản xạ không điều kiện."]},{"q":"Hormone nào sau đây liên quan trực tiếp đến phản ứng stress và trạng thái lo âu của con người?","o":["Cortisol","Insulin","Thyroxine","Growth Hormone (GH)"]},{"q":"Khác biệt cốt lõi giữa phản hồi xây dựng và sự chỉ trích là gì?","o":["Phản hồi xây dựng tập trung vào hành vi cụ thể và có hướng cải thiện; chỉ trích mang tính mơ hồ, đánh giá con người","Phản hồi xây dựng luôn do cấp trên đưa ra; chỉ trích do đồng nghiệp đưa ra","Phản hồi xây dựng được thực hiện bằng văn bản; chỉ trích bằng lời nói","Không có sự khác biệt giữa hai khái niệm này"]},{"q":"Khác với pháp luật mang tính cưỡng chế bằng bộ máy nhà nước, đạo đức điều chỉnh hành vi con người dựa trên cơ chế nào?","o":["Sự tự giác, lương tâm , dư luận xã hội và niềm tin nội tâm .","Chế tài phạt tiền và cải tạo giam giữ.","Các quyết định hành chính bắt buộc thi hành.","Quy định bồi thường thiệt hại kinh tế."]},{"q":"Khái niệ \"Ứng xử\" trong giao tiếp được hiểu là gì?","o":["Cách thức con người lựa chọn để đối xử với nhau và là phản ứng khi nhận được cách đối xử của người khác","Tập hợp các quy định pháp luật bắt buộc mọi người phải tuân thủ","Thái độ im lặng khi xảy ra xung đột hoặc bất đồng ý kiến","Khả năng thuyết phục người khác tuân theo quan điểm cá nhân"],"w":"Phần hỏi ghi “Khái niệ” có dấu hiệu thiếu chữ. Không tự sửa hoặc bổ sung ký tự vào câu nguồn."},{"q":"Khái niệ \"Y đức\" được hiểu đầy đủ là gì?","o":["Tập hợp các phẩm chất đạo đức và chuẩn mực nghề nghiệp mà người thầy thuốc cần có trong quá trình chăm sóc, bảo vệ sức khỏe nhân dân","Tập hợp các quy định pháp luật xử phạt vi phạm ngành y","Danh mục các kỹ năng lâm sàng bác sĩ phải hoàn thành","Lời thề Hippocrates áp dụng bắt buộc tại tất cả các quốc gia"],"w":"Phần hỏi ghi “Khái niệ” có dấu hiệu thiếu chữ. Không tự sửa hoặc bổ sung ký tự vào câu nguồn."},{"q":"Khi bác sĩ dùng ống nghe để nghe tiếng rì rào phế nang của bệnh nhân, bác sĩ đang sử dụng hình thức nhận thức nào là chủ yếu?","o":["Nhận thức cảm tính","Nhận thức lý tính","Tư duy trừu tượng","Suy luận logic"]},{"q":"Khi đối mặt với người bệnh hoặc người nhà đang có thái độ bức xúc, phản ứng đầu tiên của thầy thuốc nên là gì?","o":["Giữ bình tĩnh, xác nhận cảm xúc của họ và lắng nghe","Tranh cãi ngay để làm rõ đúng sai","Yêu cầu bảo vệ đưa họ ra khỏi phòng khám ngay lập tức","Bỏ đi chỗ khác không tiếp tục làm việc"]},{"q":"Khi nghiên cứu về 'Sự chuyển biến từ Lời thề Hippocrates đến Tuyên ngôn Geneva', nhà nghiên cứu đang áp dụng phương pháp nào?","o":["Phương pháp lịch sử","Phương pháp phân tích hóa học","Phương pháp diễn xướng","Phương pháp mô phỏng lâm sàng"]},{"q":"Khi người bệnh nhi đến khám , kỹ năng giao tiếp nào sau đây là phù hợp nhất?","o":["Giữ giọng điệu nhẹ nhàng, sử dụng ngôn ngữ đáng yêu và tạo sự tin tưởng","Sử dụng thuật ngữ y khoa chuyên sâu để giải thích cho trẻ","Yêu cầu trẻ phải ngồi yên tuyệt đối không được khóc","Chỉ nói chuyện với cha mẹ và hoàn toàn ngó lơ trẻ"]},{"q":"Khi tiếp nhận phản hồi từ đồng nghiệp hoặc thầy cô, thái độ đúng đắn đầu tiên cần có là gì?","o":["Lắng nghe, không ngắt lời và tránh bào chữa ngay lập tức","Phản bác lại ngay để bảo vệ quan điểm cá nhân","Im lặng nhưng tỏ thái độ không hài lòng","Đổ lỗi cho hoàn cảnh khách quan"]},{"q":"Loại trí nhớ có khả năng lưu giữ thông tin trong khoảng thời gian từ vài giây đến vài phút được gọi là:","o":["Trí nhớ ngắn hạn","Trí nhớ tức thì","Trí nhớ dài hạn","Trí nhớ cảm xúc"]},{"q":"Lời dạy nổi tiếng của Chủ tịch Hồ Chí minh đối với ngành Y tế được trích dẫn trong bài giảng là gì?","o":["Lương y phải như từ mẫu","Thầy thuốc giỏi trước hết phải là người hiền","Đạo y là đạo cứu người","Bác sĩ như người mẹ hiền"]},{"q":"Lực lượng nào dưới đây thuộc nhóm \"hành vi sức khỏe\"?","o":["Tiêm chủng phòng bệnh đầy đủ.","Hút thuốc lá thường xuyên.","Tự ý bỏ điều trị lao.","Uống rượu bia quá mức."],"w":"Phần hỏi dùng “Lực lượng nào” trong khi các phương án là các hành vi. Cụm “hành vi sức khỏe” cũng chưa phân biệt hành vi có lợi và hành vi nguy cơ; giữ nguyên câu và khóa Đ, không tự viết lại phần hỏi."},{"q":"Mô hình SBI dùng trong kỹ năng đưa phản hồi là viết tắt của ba từ tiếng Anh nào?","o":["Situation - Behavior - Impact","System - Behavior - Impact","Situation - Belief - Idea","Solution - Behavior - I provement"],"w":"Phương án cuối có “I provement”, có dấu hiệu chữ bị khuyết/tách. Giữ đúng chuỗi gốc."},{"q":"Môi trường đầu tiên và có ảnh hưởng trực tiếp nhất đến sự hình thành nhân cách từ thời thơ ấu là:","o":["Gia đình","Nhà trường","Bạn đồng lứa","Mạng xã hội"]},{"q":"Một người bệnh bị chẩn đoán ung thư tiến triển nhưng nhất quyết từ chối phác đồ hóa trị vì nghe tin đồn \"hóa trị làm bệnh nhân chết nhanh hơn\". Xét về góc độ khoa học hành vi, nguyên nhân chính dẫn đến hành vi né tránh này là:","o":["Do nhận thức sai lệch xuất phát từ thông tin không chính xác và tâm lý sợ hãi.","Do phản xạ tự nhiên của cơ thể đối với hóa chất.","Do người bệnh cố tình vi phạm chuẩn mực pháp luật y tế.","Do sự suy giảm thể chất khiến người bệnh không đủ năng lực hành vi."]},{"q":"Một trong những mặt tích cực của công tác giáo dục y đức hiện nay tại các trường y dược là:","o":["Môn Y đức - Đạo đức nghề nghiệp được đưa vào chương trình đào tạo chính quy từ đại cương đến lâm sàng","Đã loại bỏ hoàn toàn các môn học lý thuyết để tập trung thực hành","Chỉ tổ chức giảng dạy cho đối tượng sau đại học","Giao hoàn toàn việc rèn luyện y đức cho sinh viên tự tìm hiểu"],"w":"Nhận định dùng “hiện nay” và “tại các trường y dược” nhưng không kèm năm hoặc danh sách cơ sở; chỉ chấm theo khóa tài liệu, không coi là thống kê cập nhật."},{"q":"Một trong những đặc điểm làm cho giao tiếp y tế khác biệt so với giao tiếp thông thường là gì?","o":["Tính nhạy cảm cao vì liên quan trực tiếp đến sức khỏe và sinh mạng con người","Thời gian giao tiếp luôn kéo dài nhiều giờ","Không cần chú ý đến cảm xúc của đối phương","Chỉ diễn ra tại các bệnh viện tuyến trung ương"]},{"q":"Một trong những đặc điểm nổi bật của đạo đức truyền thống Việt Nam là:","o":["Tính bền vững, lâu đời gắn liền với lịch sử dân tộc","Tính biến đổi liên tục không kế thừa","Tính áp đặt bắt buộc bằng chế tài hành chính","Tính tách rời khỏi đời sống cộng đồng"]},{"q":"Một trong những vai trò quan trọng của giao tiếp trong khám chữa bệnh là gì?","o":["Tạo niềm tin với người bệnh, cải thiện hiệu quả chẩn đoán và điều trị","Thay thế cho các xét nghiệm cận lâm sàng","Giảm bớt số lượng nhân viên y tế cần thiết tại bệnh viện","Rút ngắn thời gian đào tạo bác sĩ chuyên khoa"]},{"q":"Người bệnh sau phẫu thuật lớn chịu cơn đau cấp tính thường xuất hiện thái độ cáu kỉnh, gắt gỏng và né tránh việc thăm khám của bác sĩ. Yếu tố chính chi phối hành vi này của người bệnh là gì?","o":["Yếu tố sinh lý (đau đớn thể chất).","Yếu tố văn hóa - tâm linh.","Yếu tố pháp lý hành chính.","Yếu tố môi trường bệnh viện quá tải."]},{"q":"Nguồn gốc sinh học và tâm lý của đạo đức được thể hiện qua yếu tố nào sau đây?","o":["Cảm xúc cảm thông, thương xót và lòng trắc ẩn tự nhiên của con người.","Điều kiện kinh tế - xã hội của đất nước.","Các văn bản quy phạm pháp luật.","Các nghi lễ tôn giáo bắt buộc."]},{"q":"Nguồn gốc xã hội của đạo đức phát sinh từ nhu cầu nào sau đây?","o":["Nhu cầu ổn định các mối quan hệ xã hội, bảo đảm trật tự chung và duy trì sự đoàn kết.","Nhu cầu giải trí và sáng tạo nghệ thuật của con người.","Nhu cầu tích lũy tài sản cá nhân trong thời kỳ công nghiệp.","Nhu cầu mở rộng lãnh thổ của các quốc gia."]},{"q":"Nhận thức cảm tính bao gồm hai hình thức cơ bản nào sau đây?","o":["Cảm giác và tri giác","Khái niệm và suy luận","Trí nhớ và tư duy","Phân tích và tổng hợp"]},{"q":"Nhận thức lý tính bao gồm các thao tác tư duy cơ bản nào?","o":["Phân tích, tổng hợp, so sánh, lập luận","Quan sát, lắng nghe, sờ nắn","Ghi nhớ, lưu trữ, tái hiện","Cảm nhận, phản xạ, tưởng tượng"]},{"q":"Nội dung nào dưới đây thể hiện nguyên tắc kê đơn thuốc an toàn và hợp lý theo Điều 6 trong 12 Điều y đức?","o":["Kê đơn phù hợp với chẩn đoán và bảo đảm sử dụng thuốc hợp lý, an toàn; không vì lợi ích cá nhân mà giao thuốc kém chất lượng","Kê đơn theo nguyện vọng cá nhân của người bệnh hoặc gia đình","Ưu tiên kê các loại thuốc ngoại đắt tiền để đảm bảo hiệu quả điều trị tối đa","Kê đơn theo các mẫu có sẵn do công ty dược phẩm tài trợ"]},{"q":"Nội dung nào sau đây KHÔNG thuộc các thành tố cơ bản của Y đức?","o":["Lợi nhuận tài chính của cơ sở khám chữa bệnh","Lòng nhân ái và tinh thần trách nhiệm","Trung thực, công bằng và phong cách ứng xử đúng mực","Chuyên môn kết hợp với đạo đức"]},{"q":"Mối quan hệ đạo đức trong đời sống y khoa KHÔNG bao gồm mối quan hệ nào sau đây?","o":["Quan hệ cạnh tranh thương mại triệt hạ giữa các tập đoàn dược phẩm .","Quan hệ giữa thầy thuốc với người bệnh (cá nhân - cá nhân).","Quan hệ giữa thầy thuốc với đồng nghiệp (cá nhân - tập thể).","Quan hệ giữa ngành y tế với cộng đồng xã hội."]},{"q":"Phẩm chất \"Tâm đức\" của người thầy thuốc cách mạng thể hiện rõ nhất qua nội dung nào?","o":["Yêu nghề, yêu người bệnh, luôn đặt sức khỏe và tính mạng người bệnh lên trên hết","Đạt được nhiều bằng cấp và học hàm khoa học cao","Sử dụng thành thạo các thiết bị chẩn đoán đắt tiền","Quản lý tài chính bệnh viện chặt chẽ"]},{"q":"Phẩm chất đạo đức nghề nghiệp nào dưới đây là nền tảng cốt lõi của nhân cách người thầy thuốc?","o":["Trung thực, tận tâm , tôn trọng người bệnh","Tham vọng cá nhân và thăng tiến nhanh","Đương đầu với mọi rủi ro không cần tính toán","Cứng rắn, không cần đồng cảm với nỗi đau bệnh nhân"]},{"q":"Phạm trù đạo đức nào phản ánh năng lực tự ý thức, tự đánh giá và tự điều chỉnh hành vi của bản thân trước các chuẩn mực xã hội?","o":["Lương tâm","Danh dự","Công bằng","Quyền lực"]},{"q":"Phạm trù đạo đức nào thể hiện lòng thương người, sống có tình có nghĩa và coi trọng giá trị con người trong Y học cổ truyền?","o":["Nhân nghĩa","Danh dự","Pháp luật","Lợi ích"]},{"q":"Phản hồi trong y tế được hiểu là gì?","o":["Thông tin được truyền đạt về hành vi hoặc kết quả của người khác để cải thiện hiệu quả công việc/học tập","Việc phê bình cấp dưới trước mặt đồng nghiệp","Sự từ chối thực hiện nhiệm vụ được giao","Báo cáo định kỳ hàng tháng của khoa phòng"]},{"q":"Phản xạ co giật, nôn hoặc ho khi có dị vật thuộc loại hành vi nào?","o":["Hành vi tự nhiên.","Hành vi xã hội.","Hành vi có mục đích.","Hành vi sai lệch xã hội."]},{"q":"Phương pháp nghiên cứu đạo đức học nào tìm hiểu sự hình thành và phát triển các quan niệm đạo đức qua các thời kỳ lịch sử?","o":["Phương pháp lịch sử","Phương pháp logic","Phương pháp so sánh","Phương pháp thực nghiệm"]},{"q":"Phương tiện giao tiếp bao gồm các yếu tố nào?","o":["Cả phương tiện ngôn ngữ và phi ngôn ngữ","Chỉ bao gồm ngôn ngữ nói","Chỉ bao gồm ngôn ngữ viết","Chỉ bao gồm hình ảnh và ký hiệu"]},{"q":"Quá trình con người tiếp nhận, xử lý, lưu trữ và phản ánh thông tin về thế giới xung quanh được gọi là gì?","o":["Quá trình nhận thức","Quá trình cảm xúc","Quá trình ý chí","Quá trình nhân cách"]},{"q":"Quá trình tâm lý nào bao gồm niềm tin, kiến thức và thái độ trực tiếp ảnh hưởng đến quyết định và hành động của con người?","o":["Nhận thức.","Nội tiết.","Di truyền.","Văn hóa."]},{"q":"Quá trình tâm lý phản ánh một cách trọn vẹn các thuộc tính bề ngoài của sự vật, hiện tượng khi chúng trực tiếp tác động vào giác quan được gọi là:","o":["Tri giác","Cảm giác","Biểu tượng","Khái niệm"]},{"q":"Quan điểm \"Nói đi đôi với làm , nêu gương đạo đức\" của Bác Hồ đòi hỏi sinh viên y khoa phải làm gì?","o":["Tự rèn luyện, làm gương cho đồng nghiệp, người bệnh và xã hội","Tuyên truyền đạo đức nhưng ưu tiên thực hành kỹ thuật chuyên môn","Đòi hỏi người khác tuân thủ đạo đức trước khi bản thân thực hiện","Chỉ nêu gương khi làm việc ở các bệnh viện công lập"]},{"q":"Quyết định số 2088 /BYT-QĐ ban hành quy định về tiêu chuẩn đạo đức của người làm công tác y tế được Bộ trưởng Bộ Y tế ý ban hành vào thời gian nào?","o":["06 /11/1996","06 /11/1990","06 /11/2000","06 /11/2006"],"w":"Nguồn có cụm “được Bộ trưởng Bộ Y tế ý ban hành”, có dấu hiệu thiếu chữ. Giữ nguyên ngày tháng, số quyết định và khóa; không tự khôi phục chữ bị mất."},{"q":"Sau khi nhận được thông tin phản hồi từ người khác, người nhận nên làm gì để thể hiện sự tôn trọng?","o":["Cảm ơn người đưa phản hồi","Bỏ đi không nói gì","Yêu cầu người đưa phản hồi phải xin lỗi","Báo cáo lên cấp trên về sự việc"]},{"q":"Sinh viên y khoa ghi nhớ số lượng, liều lượng thuốc cần cấp cứu ngay trong ca trực. Loại trí nhớ này chủ yếu là:","o":["Trí nhớ ngắn hạn","Trí nhớ dài hạn","Trí nhớ vận động","Trí nhớ cảm xúc"]},{"q":"So với nhận thức cảm tính, nhận thức lý tính có đặc điểm nào sau đây?","o":["Chậm hơn, mang tính trừu tượng, chính xác và phản ánh bản chất sự vật","Nhanh chóng, trực tiếp, sinh động nhưng dễ nhầm lẫn","Phản ánh trực tiếp các bề ngoài của sự vật","Không cần sử dụng dữ liệu từ các giác quan"]},{"q":"Tác phẩm 'Hải Thượng y tông Tâm Lĩnh' (hay Lãn Ông Tâm Lĩnh) gồm bao nhiêu tập và bao nhiêu quyển?","o":["28 tập, 66 quyển","12 tập, 66 quyển","20 tập, 60 quyển","60 tập, 62 quyển"]},{"q":"Thách thức nào dưới đây đang ảnh hưởng tiêu cực đến tính nhân văn trong chăm sóc người bệnh hiện nay?","o":["Áp lực công việc, quá tải bệnh viện và sự tác động của cơ chế thương mại hóa y tế","Số lượng người bệnh quá ít gây giảm trải nghiệm thực tế","Môi trường y tế quá an toàn và không có rủi ro","Sự hỗ trợ quá mức của các quỹ từ thiện y tế"]},{"q":"Thầy thuốc cảm thấy day dứt, trăn trở trong lòng khi vô ý kê đơn thuốc chưa hoàn toàn tối ưu cho bệnh nhân. Đây là biểu hiện của phạm trù nào?","o":["Lương tâm","Danh dự","Pháp luật","Quyền hạn Dành cho việc kiểm tra khả năng thông hiểu, phân biệt khái niệm và so sánh bản chất"],"w":"Phương án cuối chứa thêm câu “Dành cho việc kiểm tra khả năng thông hiểu, phân biệt khái niệm và so sánh bản chất”, có dấu hiệu ghi chú biên soạn lẫn trong ô phương án. Giữ toàn bộ nội dung nguồn, không tự cắt bỏ."},{"q":"Theo Đại danh y Hải Thượng Lãn Ông, mục đích cao nhất của người làm nghề y là gì?","o":["Thực hiện việc nhân nghĩa, cứu người là gốc, lợi người là vui","Tích lũy tài sản cho gia đình","Mưu cầu danh tiếng và địa vị xã hội","Thể hiện sự vượt trội về tài năng chuyên môn"]},{"q":"Theo Điều 11 trong 12 Điều y đức, khi bản thân xảy ra sai sót chuyên môn, người cán bộ y tế phải có thái độ như thế nào?","o":["Tự giác nhận trách nhiệm về mình, không đổ lỗi cho đồng nghiệp, cho tuyến trước","Tìm lý do khách quan để giải thích cho người bệnh","Báo cáo cấp trên và giữ kín thông tin với đồng nghiệp","Nhờ đồng nghiệp đứng ra nhận thay để giảm bớt hình phạt"]},{"q":"Theo Điều 12 trong 12 Điều y đức, nhiệm vụ của người thầy thuốc đối với cộng đồng bao gồm nội dung nào?","o":["Hăng hái tham gia công tác thông tin - giáo dục sức khỏe, phòng chống dịch bệnh, cấp cứu tại cộng đồng","Tổ chức các đợt bán thuốc khuyến mãi tại cộng đồng","Tập trung làm công tác khám chữa bệnh tại viện, hạn chế tham gia hoạt động xã hội","Chỉ tham gia chống dịch khi có lệnh điều động khẩn cấp từ Bộ Y tế"]},{"q":"Theo Điều 2 trong 12 Điều y đức, điều kiện BẮT BUỘC để đưa người bệnh/người tham gia vào các thử nghiệm lâm sàng, phương pháp chẩn đoán hoặc điều trị mới là gì?","o":["Sự cho phép của Bộ Y tế và sự chấp nhận của người bệnh","Sự đồng ý của Giám đốc bệnh viện và Trưởng khoa","Sự bảo lãnh tài chính từ đơn vị tài trợ nghiên cứu","Quyết định của Hội đồng khoa học cơ sở"]},{"q":"Theo Điều 3 trong 12 Điều y đức, hành vi nào sau đây bị CẤM trong giao tiếp và cung cấp dịch vụ y tế?","o":["Có thái độ ban ơn, lạm dụng nghề nghiệp, gây phiền hà cho người bệnh","Ưu tiên khám bệnh cho đối tượng chính sách xã hội","Giữ kín bí mật riêng tư của người bệnh khi thăm khám","Phổ biến quyền lợi và nghĩa vụ của người bệnh khi nhập viện"]},{"q":"Theo Điều 5 trong 12 Điều y đức, khi gặp trường hợp người bệnh cấp cứu, thái độ và hành động bắt buộc của nhân viên y tế là gì?","o":["Khẩn trương chẩn đoán, xử trí kịp thời, không được đùn đẩy người bệnh","Yêu cầu đóng đủ viện phí trước khi xử trí","Chuyển ngay lên tuyến trên nếu chưa rõ chẩn đoán","Chờ người nhà đến ký cam kết rồi mới tiến hành xử trí"]},{"q":"Theo Điều 9 trong 12 Điều y đức, khi người bệnh tử vong, thái độ và ứng xử chuẩn mực của nhân viên y tế là gì?","o":["Thông cảm sâu sắc, chia buồn và hướng dẫn, giúp đỡ gia đình họ là các thủ tục cần thiết","Nhanh chóng di chuyển tử thi ra khỏi khoa để tránh ảnh hưởng tâm lý bệnh nhân khác","Báo cảnh sát trước khi giải thích cho gia đình người bệnh","Ủy quyền hoàn toàn cho nhân viên nhà hộ táng tự xử lý"],"w":"Đáp án có cụm “giúp đỡ gia đình họ là các thủ tục”, có dấu hiệu thiếu chữ. Giữ nguyên văn và khóa."},{"q":"Theo Điều 1 trong 12 Điều y đức, nghĩa vụ học tập của người làm công tác y tế bao gồm nội dung nào?","o":["Không ngừng học tập, tích cực NCKH để nâng cao trình độ chuyên môn","Học tập ngoại ngữ để đi làm việc tại nước ngoài","Chỉ học tập khi có yêu cầu bắt buộc từ quản lý cơ sở y tế","Tự học chuyên môn mà không cần tham gia nghiên cứu khoa học"]},{"q":"Theo Điều 4 trong 12 Điều y đức, nhân viên y tế phải làm gì khi người bệnh ra viện?","o":["Dặn dò chu đáo, hướng dẫn họ tiếp tục điều trị, tự chăm sóc và giữ gìn sức khỏe","Thu hồi lại toàn bộ hồ sơ bệnh án cá nhân của người bệnh","Yêu cầu người bệnh ký cam kết không quay lại khi reo rắc biến chứng","Chỉ cần đưa giấy ra viện và thu tiền viện phí"],"w":"Câu này viện dẫn Điều 4 cho việc dặn dò lúc ra viện, trong khi câu 22 cũng viện dẫn Điều 4 cho nội dung khác. Cần đối chiếu số điều với văn bản y đức gốc; ứng dụng không tự sửa số điều hoặc khóa đáp án."},{"q":"Theo định nghĩa trong khoa học hành vi, hành vi con người được hiểu là:","o":["Phản ứng hoặc hoạt động có thể quan sát được của con người đối với môi trường.","Các suy nghĩ và cảm xúc nội tâm không bao giờ biểu hiện ra bên ngoài.","Những phản xạ sinh học bẩm sinh không thể thay đổi theo thời gian.","Các hoạt động giao tiếp bằng lời nói giữa người bệnh và nhân viên y tế."]},{"q":"Theo tư tưởng Hồ Chí minh, nội dung cốt lõi của \"Trung với nước, hiếu với dân\" đối với người hành nghề y là gì?","o":["Đặt quyền lợi sức khỏe người bệnh và cộng đồng lên trên lợi ích cá nhân","Đặt lợi ích cá nhân lên trên để phát triển phòng khám riêng","Chỉ phục vụ những người bệnh có đóng góp cho nhà nước","Ưu tiên giải quyết các công việc quản lý hành chính trước CB"],"w":"Phương án cuối kết thúc bằng “trước CB”, có dấu hiệu chữ hoặc ghi chú dư. Giữ nguyên thay vì đoán nội dung còn thiếu."},{"q":"Thuộc tính nào của đạo đức thể hiện việc chuẩn mực đạo đức luôn mang dấu ấn của từng giai đoạn phát triển lịch sử xã hội?","o":["Tính lịch sử","Tính bất biến tuyệt đối","Tính cưỡng chế pháp lý","Tính ngẫu nhiên"]},{"q":"Tổng hợp những đặc điểm tâm lý, đạo đức, trí tuệ và năng lực xã hội được hình thành trong quá trình sống, học tập và lao động gọi là:","o":["Nhân cách","Khí chất","Tính cách","Ý thức"]},{"q":"Trí nhớ là khả năng thực hiện chuỗi quá trình nào sau đây đối với thông tin?","o":["Ghi nhận, lưu trữ, tái hiện","Tiếp nhận, chuyển giao, xóa bỏ","Cảm nhận, phân tích, phán đoán","Tập trung, phản xạ, ứng biến"]},{"q":"Trong mô hình SBI, bước \"Situation\" (Bối cảnh) yêu cầu người đưa phản hồi thực hiện điều gì?","o":["Xác định rõ thời gian và nơi chốn xảy ra hành vi","Đánh giá tính cách của người nhận phản hồi","Đưa ra giải pháp khắc phục hậu quả ngay lập tức","Phân tích tác động tài chính của sự việc"]},{"q":"Trong phẩm chất \"Cần, Kiệm , Liêm , Chính, Chí công vô tư\", chữ \"Liêm \" đối với người thầy thuốc được hiểu là:","o":["Trong sạch, không tham nhũng, không lạm dụng chức quyền","Siêng năng, nhiệt tình trong chăm sóc người bệnh","Tiết kiệm vật tư, tránh lãng phí trang thiết bị y tế","Chính trực, công bằng trong phân loại bệnh nhân"]},{"q":"Trong quá trình đào tạo chính quy, biện pháp nào giúp sinh viên y hoa rèn luyện y đức hiệu quả?","o":["Lồng ghép Y đức vào chương trình học, thực hành lâm sàng và tham gia các hoạt động cộng đồng","Cho sinh viên tự đọc tài liệu ở nhà mà không cần thảo luận tình huống","Chỉ tổ chức thi lý thuyết vào cuối hóa học","Cách ly sinh viên khỏi các tình huống giao tiếp với người bệnh thực tế"],"w":"Phần hỏi ghi “sinh viên y hoa”, phương án T2 ghi “cuối hóa học”; có dấu hiệu thiếu ký tự. Không tự sửa các cụm từ nguồn."},{"q":"Trường hợp một bệnh nhân mắc tiểu đường tuýp 2 kiên trì thực hiện chế độ ăn kiêng nghiêm ngặt và tập thể dục hằng ngày nhằm mục tiêu kiểm soát chỉ số HbA1c thể hiện sự tác động rõ rệt nhất của yếu tố tâm lý nào?","o":["Động cơ và nhu cầu cải thiện sức khỏe.","Căng thẳng tiêu cực (Stress).","Phản ứng sợ hãi sự trừng phạt.","Định kiến xã hội."]},{"q":"Truyền thống \"Tôn sư trọng đạo\", \"Nhất tự vi sư, bán tự vi sư\" nhắc nhở sinh viên y khoa điều gì trong rèn luyện?","o":["Học tập suốt đời, tôn trọng người đi trước và truyền đạt iến thức cho thế hệ sau","Chỉ học tập khi có sự giám sát của thầy cô","Tuyệt đối không phản biện các ý kiến y học của thế hệ trước","Tập trung vào thực hành lâm sàng, bỏ qua học lý thuyết"],"w":"Đáp án ghi “truyền đạt iến thức”, có dấu hiệu thiếu chữ. Khóa Đ vẫn được giữ nguyên."},{"q":"Tư tưởng đạo đức Hồ Chí minh được hình thành từ những nguồn gốc nào sau đây?","o":["Truyền thống đạo đức dân tộc, tinh hoa văn hóa nhân loại, chủ nghĩa mác – Lênin và kinh nghiệm thực tiễn","Chỉ dựa trên chủ nghĩa mác – Lênin và kinh nghiệm đấu tranh cách mạng","Chỉ tiếp thu triết học Nho giáo và Phật giáo Đông Phương","Tiếp thu toàn bộ văn hóa phương Tây hông qua chọn lọc"],"w":"Phương án cuối ghi “hông qua chọn lọc”, có dấu hiệu thiếu chữ. Không tự khôi phục ký tự."},{"q":"Vai trò của cơ sở y tế và cơ quan quản lý trong việc nâng cao y đức là gì?","o":["Giám sát, đánh giá, khen thưởng kịp thời cán bộ làm tốt và xử lý nghiêm các hành vi vi phạm","Bỏ qua các vi phạm nhỏ để giữ uy tín cho bệnh viện","Giao toàn bộ trách nhiệm theo dõi đạo đức cho người bệnh","Không cần xây dựng tiêu chí đánh giá y đức"]},{"q":"Văn hóa giao tiếp ứng xử được định nghĩa như thế nào?","o":["Là những hành vi ứng xử đạt mục đích giao tiếp, mang lại sự hài lòng và phù hợp với hoàn cảnh cụ thể","Là việc tuân thủ tuyệt đối các nghi lễ truyền thống cổ xưa","Là kỹ năng nói chuyện lưu khoát trước đám đông","Là việc luôn luôn đồng ý với mọi ý kiến của đối phương"]},{"q":"Vì sao đạo đức đặc biệt quan trọng trong nghề y?","o":["Vì y học liên quan trực tiếp đến sự sống – cái chết, sức khỏe – hạnh phúc của con người.","Vì nghề y mang lại thu nhập rất cao so với các ngành nghề khác.","Vì nhân viên y tế không chịu sự quản lý của quy định pháp luật.","Vì y học chỉ nghiên cứu trên mô hình lý thuyết mà không tiếp xúc con người."]},{"q":"Việc nhân viên y tế tôn trọng quyền riêng tư, bảo mật thông tin và không phân biệt đối xử với người bệnh thuộc hệ thống chuẩn mực nào?","o":["Chuẩn mực đạo đức nghề nghiệp (Y đức).","Chuẩn mực chuyên môn kỹ thuật.","Chuẩn mực phong tục tập quán.","Chuẩn mực pháp luật hành chính."]},{"q":"Y đức có vai trò trực tiếp nào đối với chất lượng khám chữa bệnh?","o":["Giúp thầy thuốc thực hiện đầy đủ, cẩn trọng các quy trình y khoa, tránh sai sót nguy hiểm","Thay thế hoàn toàn cho máy móc và thiết bị y tế hiện đại","Rút ngắn thời gian điều trị lâm sàng xuống một nửa","Tự động khỏi bệnh không cần dùng thuốc"]},{"q":"Yêu cầu \"Trí đức\" của người thầy thuốc cách mạng đòi hỏi điều gì?","o":["Không ngừng học tập nâng cao trình độ chuyên môn, áp dụng KHKT mới và sử dụng kiến thức có đạo đức","Chỉ cần học một lần trong trường đại học là đủ hành nghề cả đời","Lạm dụng tối đa kỹ thuật cao để tăng doanh thu cho bệnh viện","Tập trung nghiên cứu lý thuyết, không cần áp dụng thực tiễn"]},{"q":"Yếu tố nào dưới đây thể hiện nét đặc thù về 'Tính niềm tin' trong đạo đức y học?","o":["Mối quan hệ giữa thầy thuốc và người bệnh được xây dựng dựa trên sự tin cậy và tín nhiệm .","Người bệnh bắt buộc phải ký cam kết tài chính trước khi khám .","Bác sĩ áp đặt mọi quyết định mà không cần sự đồng ý của bệnh nhân.","Bệnh viện công khai doanh thu hằng tháng cho người bệnh."]},{"q":"Yếu tố nào giữ vai trò CHỦ ĐẠO trong sự hình thành và phát triển nhân cách theo chuẩn mực xã hội?","o":["Yếu tố giáo dục","Yếu tố di truyền","Môi trường tự nhiên","May mắn ngẫu nhiên"]},{"q":"Yếu tố nào sau đây giữ đóng vai trò là tiền đề sinh học cho sự hình thành nhân cách?","o":["Di truyền và cấu trúc hệ thần kinh","Giáo dục nhà trường","Môi trường văn hóa xã hội","Trải nghiệm nhóm bạn bè"]},{"q":"Yếu tố nào sau đây là nguyên nhân từ phía xã hội/ môi trường dẫn đến sai lệch hành vi của nhân viên y tế?","o":["Quy trình làm việc không rõ ràng, thiếu sự giám sát.","Bản thân thiếu kiến thức chuyên môn.","Trạng thái mệt mỏi thể chất của cá nhân.","Nhận thức sai lệch về ưu tiên cá nhân."]},{"q":"Yếu tố nào sau đây thuộc về giao tiếp phi ngôn ngữ?","o":["Cử chỉ, tư thế, ánh mắt và biểu cảm khuôn mặt","Từ ngữ chuyên ngành y khoa","Tờ hướng dẫn sử dụng thuốc","Lời dặn trực tiếp của bác sĩ"]},{"q":"Yếu tố sinh lý nào dưới đây đóng vai trò quy định các đặc điểm cơ bản như tính cách, năng lực vận động và phản xạ của cá nhân?","o":["Yếu tố di truyền (Gen).","Niềm tin tôn giáo.","Môi trường làm việc.","Trình độ học vấn."]}],"sh":[{"q":"Đặc điểm hình thái điển hình nhất của Xạ khuẩn","o":["Không màng nhân hoàn","ADN nằm trong nhân có màng","Có bào quan có màng","Có hệ thống nội màng phát triển"],"w":"Phần hỏi nói về hình thái xạ khuẩn nhưng các lựa chọn mô tả cấu trúc tế bào; khóa ghi “Không màng nhân hoàn”, có dấu hiệu câu chữ chưa hoàn chỉnh."},{"q":"Vùng chứa vật chất di truyền của tế bào nhân sơ được gọi là:","o":["Vùng nhân","Nhân con","Nucleoid","Ribosome"],"w":"“Vùng nhân” và “Nucleoid” là hai tên của cùng một vùng. Có hơn một lựa chọn tương đương; ứng dụng vẫn chỉ chấm lựa chọn ở ô Đ theo yêu cầu."},{"q":"Thành tế bào của vi khuẩn chủ yếu được cấu tạo từ:","o":["Peptidoglycan","Chitin","Cellulose","Glycogen"]},{"q":"Ribosome của tế bào nhân sơ có kích thước:","o":["70S","60S","50S","80S"]},{"q":"Plasmid trong tế bào nhân sơ có vai trò chủ yếu nào sau đây?","o":["Mang gen kháng kháng sinh","Tham gia tổng hợp protein","Chứa gen thiết yếu cho sự sống","Tham gia hô hấp tế bào"]},{"q":"Tế bào nhân sơ không có cấu trúc nào sau đây?","o":["Ty thể","Màng sinh chất","Ribosome","Thành tế bào"]},{"q":"Lông roi (flagellum) ở vi khuẩn có chức năng chủ yếu là:","o":["Vận chuyển vật chất trong tế bào","Bám dính","Trao đổi chất","Giúp tế bào di chuyển"],"w":"Khóa Đ ghi vận chuyển vật chất trong tế bào, trong khi phương án T3 nêu giúp tế bào di chuyển. Chức năng vận động của roi cần được đối chiếu; không thay khóa gốc."},{"q":"Quá trình hô hấp tế bào ở vi khuẩn hiếu khí diễn ra chủ yếu ở:","o":["Ty thể","Tế bào chất","Màng sinh chất","Lưới nội chất"],"w":"Khóa Đ ghi ty thể nhưng tế bào nhân sơ không có ty thể. Chuỗi truyền electron ở màng sinh chất; bản gốc cũng nêu điều này ở câu 79. Không thay khóa."},{"q":"Sinh vật nào sau đây thuộc nhóm Prokaryota?","o":["Vi khuẩn lam","Tảo lục","Nấm men","Động vật nguyên sinh"]},{"q":"Phát biểu nào sau đây đúng về tế bào nhân sơ?","o":["Có hệ gen đơn giản, chủ yếu là ADN vòng","Chỉ sinh sản bằng sinh sản hữu tính","Kích thước lớn và cấu trúc phức tạp","Không có ribosome"]},{"q":"ADN của tế bào nhân sơ có đặc điểm:","o":["ADN vòng, không liên kết với histon điển hình","ADN thẳng, liên kết với histon","ADN vòng, nằm trong nhân có màng","ADN thẳng, nằm trong ty thể"],"w":"Phạm vi “nhân sơ” gồm cả Archaea; mô tả không gắn histone điển hình không nên coi là đúng tuyệt đối cho mọi nhóm nhân sơ."},{"q":"Cấu trúc nào giúp vi khuẩn bám dính vào bề mặt hoặc tế bào chủ?","o":["Pili (fimbriae)","Ribosome","Roi","Plasmid"]},{"q":"Thành phần nào chỉ có ở một số tế bào nhân sơ?","o":["Vỏ nhầy (capsule)","Ribosome","Màng sinh chất","Vùng nhân"]},{"q":"Chức năng chủ yếu của vỏ nhầy ở vi khuẩn là:","o":["Bảo vệ và tránh thực bào","Tổng hợp protein","Trao đổi chất","Hô hấp tế bào"]},{"q":"Quá trình tổng hợp protein ở tế bào nhân sơ diễn ra tại:","o":["Ribosome tự do trong tế bào chất","Ty thể","Lưới nội chất hạt","Bộ máy Golgi"]},{"q":"Điểm khác biệt cơ bản giữa tế bào nhân sơ và nhân thực là:","o":["Không có bào quan có màng","Có màng sinh chất","Có ribosome","Có ADN làm vật chất di truyền"]},{"q":"Hình thức sinh sản phổ biến nhất của vi khuẩn là:","o":["Phân đôi","Giảm phân","Nảy chồi","Nguyên phân"]},{"q":"Cấu trúc tham gia vào quá trình tiếp hợp ở vi khuẩn là:","o":["Pili giới tính","Roi","Vỏ nhầy","Thành tế bào"]},{"q":"Phát biểu nào sau đây không đúng về tế bào nhân sơ?","o":["Có hệ thống nội màng phát triển","Cấu trúc đơn giản","Kích thước nhỏ","Không có nhân thật"]},{"q":"Vi khuẩn lam có khả năng quang hợp nhờ:","o":["Hệ sắc tố nằm trên màng tilacoit","Ty thể","Lục lạp","Bộ máy Golgi"]},{"q":"Đặc điểm cơ bản nhất để phân biệt tế bào nhân thực với tế bào nhân sơ là:","o":["Có nhân hoàn chỉnh được bao bởi màng","Có ADN","Có ribosome","Có màng sinh chất"]},{"q":"Bào quan nào sau đây chỉ có ở tế bào nhân thực?","o":["Ty thể","Thành tế bào","Ribosome","Roi"]},{"q":"Màng nhân của tế bào nhân thực được cấu tạo bởi:","o":["Hai lớp màng","Một lớp màng","Ba lớp màng","Không có màng"]},{"q":"Thành phần nào không thuộc cấu trúc nhân tế bào?","o":["Ribosome","Nhân con","Nhiễm sắc chất","Màng nhân"]},{"q":"Ribosome trong tế bào nhân thực có kích thước chủ yếu là:","o":["80S","60S","50S","70S"]},{"q":"Chức năng chính của lưới nội chất hạt là:","o":["Tổng hợp protein tiết và protein màng","Tổng hợp lipid","Phân giải chất độc","Tổng hợp ATP"]},{"q":"Bào quan nào có chức năng đóng gói, biến đổi và phân phối protein?","o":["Bộ máy Golgi","Ty thể","Lưới nội chất trơn","Lysosome"]},{"q":"Lysosome có vai trò chủ yếu trong tế bào là:","o":["Tiêu hóa nội bào","Quang hợp","Hô hấp tế bào","Tổng hợp protein"]},{"q":"Ty thể là bào quan có vai trò chính trong quá trình:","o":["Hô hấp tế bào và tạo ATP","Tổng hợp protein","Quang hợp","Sao chép ADN"]},{"q":"ADN trong tế bào nhân thực chủ yếu tồn tại dưới dạng:","o":["ADN thẳng kết hợp với histon","ADN vòng tự do","ADN vòng trong tế bào chất","ADN thẳng không liên kết protein"]},{"q":"Thành phần cấu tạo nên khung xương tế bào không bao gồm:","o":["Lông roi","Vi sợi actin","Sợi trung gian","Vi ống"],"w":"Lông/roi nhân thực có bộ khung vi ống. Cần phân biệt phần phụ của tế bào với ba nhóm cấu trúc chính của khung xương tế bào; câu nguồn dùng cách gọi dễ gây nhập nhằng."},{"q":"Lưới nội chất trơn có chức năng chính là:","o":["Tổng hợp lipid và khử độc","Tổng hợp protein","Phân giải protein","Sao chép ADN"]},{"q":"Không bào lớn, chiếm phần lớn thể tích tế bào, đặc trưng cho:","o":["Tế bào thực vật","Tế bào nấm","Tế bào động vật","Tế bào vi khuẩn"]},{"q":"Thành tế bào của tế bào thực vật được cấu tạo chủ yếu từ:","o":["Cellulose","Peptidoglycan","Chitin","Glycogen"]},{"q":"Lục lạp là bào quan đặc trưng cho tế bào:","o":["Thực vật và tảo","Nấm","Động vật","Vi khuẩn lam và tảo"]},{"q":"Phát biểu nào sau đây đúng về tế bào nhân thực?","o":["Có nhiều bào quan có màng","Luôn có thành tế bào","Không có hệ thống nội màng","Không có ribosome"]},{"q":"Quá trình phiên mã ở tế bào nhân thực diễn ra chủ yếu ở:","o":["Nhân tế bào","Ribosome","Tế bào chất","Ty thể"]},{"q":"Trung thể (centrosome) có vai trò chính trong:","o":["Hình thành thoi vô sắc","Tổng hợp protein","Tiêu hóa nội bào","Vận chuyển nội bào"]},{"q":"Bào quan nào không có trong tế bào động vật?","o":["Lục lạp","Lưới nội chất","Lysosome","Ty thể"]},{"q":"So với tế bào nhân sơ, tế bào nhân thực có đặc điểm nào sau đây?","o":["Mức độ tổ chức cao hơn","Cấu trúc đơn giản hơn","Không có màng nhân","Kích thước nhỏ hơn"]},{"q":"Enzyme về bản chất là:","o":["Protein","Carbohydrate","Lipid","Acid nucleic"],"w":"Phát biểu “enzyme về bản chất là protein” là sự khái quát: còn có RNA xúc tác (ribozyme). Câu 308 của chính tài liệu nêu hoạt tính ribozyme của rRNA."},{"q":"Đặc điểm quan trọng nhất của enzyme là:","o":["Có tính đặc hiệu cao","Tăng năng lượng hoạt hóa","Bị tiêu hao trong phản ứng","Chỉ hoạt động trong môi trường kiềm"]},{"q":"Vai trò chủ yếu của enzyme trong phản ứng sinh hóa là:","o":["Làm giảm năng lượng hoạt hóa","Làm tăng ΔG của phản ứng","Làm thay đổi cân bằng phản ứng","Cung cấp năng lượng cho phản ứng"]},{"q":"Trung tâm hoạt động của enzyme là:","o":["Vùng liên kết với cơ chất","Toàn bộ phân tử enzyme","Vùng liên kết với coenzyme","Phần không gian ngoài enzyme"]},{"q":"Mô hình giải thích sự gắn enzyme – cơ chất phù hợp nhất hiện nay là:","o":["Mô hình cảm ứng phù hợp","Mô hình ổ khóa cứng","Mô hình khóa – chìa","Mô hình va chạm ngẫu nhiên"]},{"q":"Phát biểu nào sau đây đúng về enzyme?","o":["Enzyme không bị biến đổi sau phản ứng","Enzyme bị tiêu hao sau phản ứng","Enzyme làm thay đổi ΔG của phản ứng","Enzyme không có tính đặc hiệu"],"w":"Cụm “không bị biến đổi sau phản ứng” cần hiểu là chất xúc tác được tái tạo trong chu trình xúc tác, không phải enzyme không bao giờ biến tính hay phân hủy."},{"q":"Nhiệt độ tối ưu của enzyme là:","o":["Nhiệt độ enzyme có hoạt tính cao nhất","Nhiệt độ enzyme bắt đầu bị biến tính","Nhiệt độ cao nhất enzyme chịu được","Nhiệt độ môi trường sống của sinh vật"]},{"q":"pH tối ưu của enzyme là pH tại đó:","o":["Enzyme có hoạt tính cao nhất","Enzyme có hoạt tính thấp nhất","Enzyme bị biến tính hoàn toàn","Enzyme ngừng hoạt động"]},{"q":"Yếu tố nào sau đây không ảnh hưởng trực tiếp đến hoạt tính enzyme?","o":["Áp suất khí quyển","pH","Nồng độ cơ chất","Nhiệt độ"],"w":"Câu hỏi không chỉ rõ điều kiện áp suất; giữ nguyên cách phân loại ở khóa Đ, không suy ra áp suất không bao giờ ảnh hưởng enzyme."},{"q":"Khi tăng nồng độ cơ chất đến mức bão hòa thì:","o":["Tốc độ phản ứng đạt cực đại (Vmax)","Tốc độ phản ứng giảm","Tốc độ phản ứng tiếp tục tăng vô hạn","Enzyme bị biến tính"]},{"q":"Chất hỗ trợ cho enzyme nhưng không phải là protein được gọi là:","o":["Coenzyme","Apoenzyme","Trung tâm hoạt động","Substrate"],"w":"Chất hỗ trợ không phải protein còn có thể là ion vô cơ (cofactor); coenzyme là nhóm cofactor hữu cơ. Phần hỏi nguồn chưa giới hạn rõ."},{"q":"Enzyme hoàn chỉnh có hoạt tính xúc tác được gọi là:","o":["Holoenzyme","Coenzyme","Apoenzyme","Isoenzyme"]},{"q":"Kim loại nào sau đây thường là ion hoạt hóa của enzyme?","o":["Mg²⁺","K⁺","Na⁺","Cl⁻"],"w":"Ngoài Mg²⁺, K⁺ và Na⁺ cũng có thể hoạt hóa một số enzyme. Câu dùng “thường” nhưng thiếu enzyme cụ thể; giữ khóa Đ của tài liệu."},{"q":"Isoenzyme là các enzyme:","o":["Xúc tác cùng một phản ứng nhưng khác cấu trúc","Có cấu trúc giống hệt nhau","Xúc tác các phản ứng khác nhau","Chỉ có ở vi sinh vật"]},{"q":"Chất ức chế cạnh tranh enzyme có đặc điểm:","o":["Có cấu trúc tương tự cơ chất","Không bị ảnh hưởng bởi nồng độ cơ chất","Gắn vào vị trí khác trung tâm hoạt động","Làm giảm Vmax nhưng không đổi Km"],"w":"Tương tự cơ chất là đặc điểm của nhiều chất ức chế cạnh tranh, không phải yêu cầu bắt buộc cho mọi chất ức chế cạnh tranh."},{"q":"Khi tăng nồng độ cơ chất có thể khắc phục được sự ức chế:","o":["Cạnh tranh","Không thuận nghịch","Không cạnh tranh","Allosteric"]},{"q":"Phát biểu nào sau đây đúng về ức chế không cạnh tranh?","o":["Không bị ảnh hưởng bởi nồng độ cơ chất","Không ảnh hưởng đến Vmax","Chỉ gắn vào trung tâm hoạt động","Có cấu trúc giống cơ chất"]},{"q":"Enzyme xúc tác phản ứng thủy phân thuộc nhóm:","o":["Hydrolase","Transferase","Oxidoreductase","Lyase"]},{"q":"Đồ thị Michaelis–Menten biểu diễn mối quan hệ giữa:","o":["Tốc độ phản ứng và nồng độ cơ chất","Tốc độ phản ứng và nhiệt độ","Tốc độ phản ứng và nồng độ enzyme","Tốc độ phản ứng và thời gian"]},{"q":"Ý nghĩa sinh học quan trọng nhất của enzyme là:","o":["Làm phản ứng xảy ra nhanh ở điều kiện sinh lý","Tạo sản phẩm mới cho tế bào","Làm tăng năng lượng phản ứng","Thay đổi chiều phản ứng"]},{"q":"Hô hấp tế bào là quá trình:","o":["Phân giải chất hữu cơ, giải phóng năng lượng cho tế bào","Tổng hợp chất hữu cơ từ CO₂","Vận chuyển O₂ trong cơ thể","Trao đổi khí với môi trường"]},{"q":"Vai trò quan trọng nhất của hô hấp tế bào là:","o":["Cung cấp ATP cho các hoạt động sống","Sinh ra CO₂","Tạo nhiệt cho cơ thể","Tổng hợp enzyme"]},{"q":"Quá trình hô hấp tế bào hiếu khí gồm các giai đoạn chính nào sau đây?","o":["Đường phân – chu trình Krebs – chuỗi chuyền electron","Đường phân – lên men – chu trình Krebs","Quang hợp – đường phân – chu trình Krebs","Chu trình Calvin – chuỗi chuyền electron"]},{"q":"Đường phân diễn ra ở:","o":["Tế bào chất","Nhân tế bào","Ty thể","Lưới nội chất"]},{"q":"Sản phẩm cuối cùng của đường phân là:","o":["Pyruvate","Acetyl-CoA","Glucose","Lactate"]},{"q":"Trong quá trình đường phân, từ 1 phân tử glucose thu được:","o":["4 ATP","6 ATP","8 ATP","10 ATP"],"w":"Chưa phân biệt tổng ATP tạo ở pha thu năng lượng (4 ATP) với lãi ròng của toàn đường phân (2 ATP). Khóa 4 ATP được giữ nguyên; câu nguồn không nêu cách tính."},{"q":"Khi không có oxy, pyruvate sẽ được chuyển hóa thành:","o":["Sản phẩm lên men","CO₂ và H₂O","Acetyl-CoA","Oxaloacetate"]},{"q":"Chu trình Krebs diễn ra tại:","o":["Chất nền ty thể","Màng trong ty thể","Tế bào chất","Lưới nội chất"],"w":"Vị trí chất nền ty thể phù hợp với tế bào nhân thực; câu nguồn không ghi rõ phạm vi, vi khuẩn không có ty thể."},{"q":"Vai trò chủ yếu của chu trình Krebs là:","o":["Tạo nhiều ATP trực tiếp","Oxy hóa hoàn toàn acetyl-CoA","Tổng hợp glucose","Phân giải lipid"],"w":"Khóa Đ ghi tạo nhiều ATP trực tiếp; phương án T1 nêu oxi hóa acetyl-CoA. Phần lớn năng lượng chu trình được giữ trong NADH/FADH₂; cần đối chiếu khóa."},{"q":"Trong một vòng chu trình Krebs, từ 1 acetyl-CoA tạo ra:","o":["1 ATP, 3 NADH, 1 FADH₂","2 ATP, 2 NADH, 2 FADH₂","1 ATP, 1 NADH, 1 FADH₂","2 ATP, 3 NADH, 1 FADH₂"],"w":"Một vòng tạo một GTP hoặc ATP tương đương tùy hệ enzyme. Câu nguồn ghi ATP; giữ nguyên quy ước của file."},{"q":"Chuỗi chuyền electron hô hấp nằm ở:","o":["Màng trong ty thể","Chất nền ty thể","Màng ngoài ty thể","Tế bào chất"],"w":"Vị trí màng trong ty thể cần phạm vi tế bào nhân thực; tế bào nhân sơ dùng màng sinh chất."},{"q":"Chất nhận electron cuối cùng trong hô hấp hiếu khí là:","o":["O₂","FAD","NAD⁺","CO₂"]},{"q":"Phosphoryl hóa oxy hóa là quá trình:","o":["Tổng hợp ATP nhờ gradien proton","Tổng hợp ATP trực tiếp trong chu trình Krebs","Tổng hợp ATP trong đường phân","Tổng hợp ATP không cần oxy"]},{"q":"Bơm proton (H⁺) trong chuỗi chuyền electron có vai trò:","o":["Tạo gradien điện hóa H⁺","Vận chuyển CO₂","Phân giải glucose","Tổng hợp NADH"]},{"q":"Enzyme ATP synthase có chức năng:","o":["Tổng hợp ATP từ ADP và Pi","Bơm H⁺ qua màng","Phân giải ATP","Vận chuyển electron"],"w":"ATP synthase có thể hoạt động thuận/nghịch tùy điều kiện; khóa nguồn đang xét chiều tổng hợp ATP trong hô hấp."},{"q":"Phát biểu nào sau đây đúng về hô hấp tế bào?","o":["Là quá trình oxy hóa – khử","Không cần enzyme","Chỉ xảy ra ở tế bào động vật","Không tạo ATP"]},{"q":"So với hô hấp hiếu khí, lên men có đặc điểm:","o":["Không có chuỗi chuyền electron","Không cần enzyme","Tạo nhiều ATP hơn","Xảy ra trong ty thể"]},{"q":"Hiệu suất năng lượng của hô hấp tế bào hiếu khí cao hơn vì:","o":["Glucose được oxy hóa hoàn toàn","Có nhiều phản ứng hơn","Diễn ra nhanh hơn","Không tạo nhiệt"]},{"q":"Trong tế bào nhân sơ, chuỗi chuyền electron hô hấp diễn ra ở:","o":["Màng sinh chất","Thành tế bào","Tế bào chất","Ribosome"]},{"q":"Ý nghĩa sinh học tổng quát của hô hấp tế bào là:","o":["Cung cấp năng lượng cho mọi hoạt động sống","Tạo CO₂ cho quang hợp","Tổng hợp chất hữu cơ","Duy trì hình dạng tế bào"]},{"q":"Quang hợp là quá trình:","o":["Tổng hợp chất hữu cơ từ CO₂ và H₂O nhờ ánh sáng","Phân giải chất hữu cơ","Oxy hóa glucose","Trao đổi khí"]},{"q":"Bào quan quang hợp là:","o":["Lục lạp","Ty thể","Ribosome","Golgi"]},{"q":"Sắc tố quang hợp chủ yếu:","o":["Chlorophyll b","Phycobilin","Chlorophyll a","Carotenoid"],"w":"Khóa ghi chlorophyll b, trong khi chlorophyll a là sắc tố trung tâm phản ứng của quang hợp oxygen. Cần đối chiếu khóa với phương án T2; không thay đổi."},{"q":"Pha sáng diễn ra ở:","o":["Màng tilacoit","Màng ngoài lục lạp","Chất nền lục lạp","Nhân"]},{"q":"Sản phẩm pha sáng:","o":["ATP, O₂ và NADPH","CO₂","Glucose","O₂ và CO₂"]},{"q":"O₂ giải phóng có nguồn từ:","o":["H₂O","Glucose","CO₂","NADPH"]},{"q":"Chu trình Calvin diễn ra ở:","o":["Chất nền lục lạp","Màng tilacoit","Tế bào chất","Ty thể"]},{"q":"Enzyme chủ chốt của quang hợp:","o":["Rubisco","ATP synthase","Cytochrome","Peroxidase"]},{"q":"Chất nhận CO₂ đầu tiên:","o":["Glucose","PGA","RuBP","PEP"],"w":"Chưa nêu thực vật C3, C4 hay CAM: RuBP nhận CO₂ trong Calvin, PEP tham gia cố định ban đầu ở C4/CAM. Khóa “Glucose” cần đối chiếu; không tự bổ sung phạm vi."},{"q":"Sản phẩm ổn định đầu tiên của quang hợp (C3):","o":["PGA","RuBP","Glucose","OAA"]},{"q":"Đặc điểm TV C4:","o":["Cố định CO₂ hiệu quả","Chỉ xẩy ra ban ngày","Không Calvin","Không Rubisco"],"w":"Phương án “chỉ xảy ra ban ngày” chưa nêu rõ quá trình nào; không diễn giải thêm vào câu nguồn."},{"q":"TV CAM thích nghi:","o":["Khô hạn","Ẩm","Lạnh","Ngập nước"]},{"q":"CAM cố định CO₂","o":["Ban đêm","Ban ngày","Sáng","Chiều"],"w":"CAM cố định CO₂ sơ cấp bằng PEP carboxylase chủ yếu ban đêm; chu trình Calvin chủ yếu ban ngày. Câu nguồn không phân biệt hai bước."},{"q":"Ý nghĩa quang hợp:","o":["Tạo chất hữu cơ và O₂","Giảm O₂","Tạo CO₂","Chỉ cho TV"]},{"q":"Quan hệ quang hợp – hô hấp:","o":["Sản phẩm QH là nguyên liệu HH","Độc lập","QH tiêu O₂","HH chỉ ban đêm"]},{"q":"Hiệu ứng tăng cường Emerson (Emerson enhancement effect) cung cấp bằng chứng thực nghiệm quan trọng nhất cho sự tồn tại của hiện tượng nào?","o":["Sự phối hợp hoạt động của hai hệ thống quang hóa (PSI và PSII) có đỉnh hấp thụ khác nhau để tối ưu hóa dòng điện tử.","Quá trình quang phân ly nước chỉ xảy ra khi có sự hiện diện của phức hệ giải phóng oxy chứa Mn2+.","Khả năng hấp thụ ánh sáng xanh tím của sắc tố phụ Carotenoid để bảo vệ diệp lục khỏi bị quang oxy hó","Chu trình Calvin có thể diễn ra độc lập trong tối nếu được cung cấp đủ ATP và NADPH từ bên ngoài."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T2). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Tại sao ở thực vật C4, nồng độ CO2 tại tế bào bao bó mạch luôn được duy trì ở mức rất cao so với tế bào mô giậu?","o":["Để tối ưu hóa hoạt tính carboxylase và ức chế triệt để hoạt tính oxygenase của RuBisCO, giúp loại bỏ hô hấp sáng.","Để tăng áp suất thẩm thấu giúp tế bào bao bó mạch dễ dàng hấp thụ nước và khoáng chất từ mạch dẫn.","Để kích thích enzyme PEP-carboxylase hoạt động mạnh hơn trong bước cố định CO2 tạm thời ban đầu.","Để ngăn chặn sự rò rỉ năng lượng ATP và các sản phẩm trung gian của chu trình Calvin ra ngoài môi trường."],"w":"Các từ “luôn”, “triệt để”, “loại bỏ” mang tính tuyệt đối; C4 hạn chế rất mạnh hô hấp sáng nhưng cách diễn đạt nguồn cần kiểm tra."},{"q":"Trong pha sáng, vai trò sinh học cốt lõi của dòng điện tử vòng (Cyclic electron flow) quanh hệ thống quang hóa I (PSI) là gì?","o":["Cung cấp thêm gradient proton để tổng hợp ATP mà không tạo ra NADPH, giúp cân bằng tỉ lệ năng lượng cho chu trình Calvin.","Sản sinh thêm O2 phân tử để cung cấp cho chuỗi truyền điện tử hô hấp tại ty thể trong điều kiện thiếu sáng.","Vận chuyển proton ngược từ xoang thylakoid ra chất nền để ổn định độ pH của lục lạp khi cường độ sáng quá cao.","Tạo ra lực khử mạnh hơn để khử các hợp chất hữu cơ trung gian trong chu trình C4."]},{"q":"Hệ thống điều hòa Ferredoxin-Thioredoxin đảm bảo các enzyme then chốt của chu trình Calvin chỉ hoạt động khi có ánh sáng thông qua cơ chế nào?","o":["Khử các cầu nối disulfide (-S-S-) thành các nhóm sulfhydryl (-SH) tự do trên enzyme, làm thay đổi cấu hình không gian để hoạt hóa chúng.","Sử dụng năng lượng từ sự phân giải ATP để gắn các nhóm phosphate vào enzyme (phosphoryl hóa).","Tạo ra môi trường axit trong chất nền lục lạp để kích hoạt các trung tâm hoạt động của enzyme RuBisCO.","Giải phóng các ion Mg2+ từ màng thylakoid vào chất nền lục lạp để làm cofactor cho enzyme."]},{"q":"Nguyên phân là quá trình phân chia tế bào nhằm:","o":["Tạo hai tế bào con có bộ NST giống hệt tế bào mẹ","Tạo giao tử đơn bội","Làm giảm số lượng NST","Tạo biến dị tổ hợp"]},{"q":"Ở sinh vật nhân thực, nguyên phân xảy ra chủ yếu ở?","o":["Tế bào soma","Tế bào sinh dục chín","Giao tử","Tế bào giảm phân II"]},{"q":"Sự nhân đôi ADN chuẩn bị cho nguyên phân diễn ra ở pha nào?","o":["S","G1","G2","M"]},{"q":"Sự tiêu biến hoàn toàn màng nhân xảy ra ở:","o":["Kì giữa","Kì đầu cuối","Kì đầu sớm","Kì sau"],"w":"Khóa ghi kỳ giữa; sự phá vỡ màng nhân gắn với kỳ tiền giữa/cuối kỳ đầu theo cách chia giai đoạn. Cần đối chiếu với lựa chọn “Kì đầu cuối”."},{"q":"Ở kì giữa nguyên phân, mỗi NST kép gồm:","o":["2 cromatit chị em","1 cromatit","3 cromatit","4 cromatit"]},{"q":"Chức năng của kinetochore là:","o":["Gắn NST với thoi phân bào","Tổng hợp protein","Phân giải ADN","Hình thành màng nhân"]},{"q":"Cromatit chị em phân li ở:","o":["Kì đầu","Kì giữa","Kì sau","Kì cuối"],"w":"Khóa ghi kỳ đầu, trong khi chromatid chị em phân ly ở kỳ sau. Không thay khóa Đ của file."},{"q":"Động lực chính kéo NST là:","o":["Vi ống thoi phân bào","Áp suất thẩm thấu","Khuếch tán","Dòng tế bào chất"]},{"q":"Cơ chế đảm bảo phân li đồng đều NST là:","o":["Gắn đối xứng kinetochore","Tiếp hợp NST","Trao đổi chéo","Ngẫu nhiên"]},{"q":"Trung thể ở TB động vật có vai trò:","o":["Tổ chức thoi phân bào","Tổng hợp ARN","Điều hòa gen","Tạo màng nhân"]},{"q":"Đặc trưng kì cuối là:","o":["NST dãn xoắn, màng nhân tái tạo","Cromatit tách","NST co xoắn cực đại","NST xếp xích đạo"]},{"q":"Cytokinesis ở TB động vật phụ thuộc:","o":["Actin – myosin","Tubulin","Ribosome","Lưới nội chất"]},{"q":"Checkpoint quan trọng trước nguyên phân:","o":["G2/M","G1/S","Metaphase","Anaphase"]},{"q":"TB có 2n=12, kì sau có:","o":["12 NST đơn","12 NST kép","24 NST đơn","24 NST kép"],"w":"Nếu đếm toàn bộ tế bào ở kỳ sau nguyên phân với 2n=12 thì có 24 NST đơn; nếu đếm mỗi cực thì có 12. Câu nguồn không nêu đơn vị đếm và đánh dấu 12."},{"q":"Ý nghĩa di truyền của nguyên phân:","o":["Duy trì ổn định NST","Tạo biến dị","Tạo giao tử","Giảm gen"]},{"q":"Nguyên phân không xảy ra ở:","o":["Thần kinh biệt hóa","Biểu mô","Gan","Mô phân sinh"]},{"q":"Lỗi gắn kinetochore gây:","o":["Lệch bội","Đa bội","Trao đổi chéo","Hoán vị gen"]},{"q":"Mitosis là:","o":["Nhân đôi ADN","Phân chia nhân","Phân chia tế bào chất","Chu kì tế bào"],"w":"Mitosis là phân chia nhân, không phải nhân đôi DNA. Tài liệu đặt “Phân chia nhân” tại T1 nhưng khóa Đ là “Nhân đôi ADN”; giữ nguyên khóa."},{"q":"So với giảm phân, nguyên phân:","o":["Một lần phân bào","Hai lần phân bào","Có tiếp hợp NST","Tạo giao tử"]},{"q":"Hệ thống điều khiển chu kỳ tế bào:","o":["Cyclin–CDK","Operon","Enzyme giới hạn","Riboswitch"]},{"q":"Trong giảm phân, các nhiễm sắc thể (NST) đơn bắt đầu co xoắn và hiện rõ dưới kính hiển vi ở giai đoạn nào?","o":["Kỳ đầu I","Kỳ trung gian","Kỳ giữa II","Kỳ cuối I"],"w":"Trước giảm phân I, DNA đã nhân đôi và NST là NST kép. Câu nguồn dùng “NST đơn” khi nói co xoắn ở kỳ đầu I; cần đối chiếu thuật ngữ."},{"q":"Phức hợp tiếp hợp (synaptonemal complex) hình thành giữa các NST tương đồng nhằm mục đích gì?","o":["Tạo điều kiện cho sự trao đổi chéo diễn ra","Giúp NST nhân đôi nhanh hơn","Đẩy hai cực của tế bào ra xa nhau","Phân chia tế bào chất"]},{"q":"Kết thúc giảm phân I, số lượng NST trong mỗi tế bào con là bao nhiêu so với tế bào ban đầu (2n)?","o":["n NST kép","2n NST đơn","n NST đơn","2n NST kép"]},{"q":"Thoi vô sắc bắt đầu gắn vào tâm động của các NST kép ở giai đoạn nào của giảm phân I?","o":["Kỳ đầu I","Kỳ giữa I","Kỳ sau I","Kỳ cuối I"],"w":"Việc gắn vi ống với kinetochore diễn ra sau phá vỡ màng nhân ở tiền giữa I/cuối kỳ đầu I tùy cách chia giai đoạn; nguồn chưa nêu quy ước."},{"q":"Sự kiện nào sau đây chỉ xảy ra trong giảm phân mà không có trong nguyên phân?","o":["Sự tiếp hợp của các cặp NST tương đồng","Sự nhân đôi của DNA","Sự co xoắn của nhiễm sắc thể","Sự hình thành thoi vô sắc"]},{"q":"Tại kỳ sau II của giảm phân, thành phần nào sau đây bị phân tách và di chuyển về hai cực?","o":["Các nhiễm sắc tử chị em (sister chromatids)","Các cặp NST tương đồng","Các màng nhân cũ","Các trung thể"]},{"q":"Ở một loài thực vật có bộ nhiễm sắc thể lưỡng bội 2n = 24. Giả sử trong quá trình giảm phân tạo hạt phấn, có 10% số tế bào sinh hạt phấn xảy ra hiện tượng không phân ly của một cặp nhiễm sắc thể trong giảm phân I, giảm phân II diễn ra bình thường; các tế bào còn lại giảm phân bình thường. Tỉ lệ giao tử đột biến mang n+1 nhiễm sắc thể chiếm tỉ lệ bao nhiêu trong tổng số giao tử được tạo ra?","o":["5%.","10%.","2,5%.","20%."]},{"q":"Tế bào nào sau đây là sản phẩm trực tiếp của quá trình giảm phân ở động vật có vú cái?","o":["Trứng và các thể cực","Tinh tử","Tế bào sinh dưỡng","Noãn nguyên bào"]},{"q":"Trong quá trình giảm phân, tâm động của các NST kép thực sự tách rời nhau ở kỳ nào?","o":["Kỳ sau II","Kỳ sau I","Kỳ giữa I","Kỳ giữa II"]},{"q":"Ý nghĩa của việc giảm số lượng NST xuống còn một nửa trong giao tử là gì?","o":["Duy trì ổn định bộ NST của loài qua các thế hệ sinh sản hữu tính","Giúp tế bào con lớn nhanh hơn","Ngăn chặn sự đột biến gen","Tiết kiệm năng lượng cho tế bào"]},{"q":"Ở người (2n=46), sau khi kết thúc giảm phân I, mỗi tế bào con chứa bao nhiêu chromatid?","o":["46","23","92","0"]},{"q":"Giai đoạn nào được gọi là giai đoạn chuyển tiếp ngắn giữa giảm phân I và giảm phân II?","o":["Kỳ trung gian (không có pha S)","Pha G1","Pha S","Kỳ cuối I"]},{"q":"Hiện tượng các NST tương đồng từ bố và mẹ phân ly ngẫu nhiên về các cực tế bào xảy ra ở đâu?","o":["Kỳ sau I","Kỳ sau II","Kỳ đầu I","Kỳ đầu II"]},{"q":"Các đơn vị được hình thành khi hai NST tương đồng tiếp hợp với nhau được gọi là gì?","o":["Nhóm bốn (Tetrad) hoặc NST kép tương đồng","Chromatin","Tâm động","Trung thể"],"w":"“Tetrad” là một cặp NST tương đồng đã nhân đôi, gồm bốn chromatid. Cụm “hoặc NST kép tương đồng” trong đáp án chưa thật chính xác."},{"q":"Sau khi kết thúc giảm phân II, màng nhân tái hình thành bao quanh tập hợp các NST:","o":["Đơn đơn bội (n đơn)","Đơn lưỡng bội (2n đơn)","Kép đơn bội (n kép)","Kép lưỡng bội (2n kép)"]},{"q":"Khi so sánh giữa quá trình nguyên phân và giảm phân, phát biểu nào sau đây là ĐÚNG về kết quả và ý nghĩa di truyền?","o":["Nguyên phân tạo ra 2 tế bào con có bộ NST giống hệt tế bào mẹ (2n), trong khi giảm phân tạo ra 4 tế bào con có bộ NST giảm đi một nửa (n).","Cả nguyên phân và giảm phân đều tạo ra các tế bào con có biến dị tổ hợp phong phú cung cấp cho tiến hó","Nguyên phân xảy ra ở tế bào sinh dục chín, còn giảm phân xảy ra ở tế bào sinh dưỡng và tế bào mầm.","Nguyên phân bao gồm hai lần phân bào liên tiếp, còn giảm phân chỉ bao gồm một lần phân bào duy nhất."],"w":"Kết quả bốn tế bào con là mô hình giảm phân tổng quát; sinh trứng phân chia tế bào chất không đều. Không áp dụng như bốn giao tử chức năng trong mọi trường hợp. Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Sự khác biệt chính giữa kỳ sau của nguyên phân và kỳ sau I của giảm phân là gì?","o":["Nguyên phân tách chromatid chị em, giảm phân I tách NST tương đồng","Nguyên phân tách NST tương đồng, giảm phân I tách chromatid chị em","Nguyên phân không cần ATP, giảm phân I cần ATP","Nguyên phân làm giảm số lượng NST, giảm phân I thì không"]},{"q":"Hiện tượng trao đổi chéo (Crossing over) diễn ra tại các điểm cụ thể trên NST gọi là gì?","o":["Điểm bắt chéo (Chiasmata)","Tâm động (Centromere)","Đầu mút (Telomere)","Eo thứ cấp"]},{"q":"Tại sao các chromatid chị em trong giảm phân II không còn giống hệt nhau về mặt di truyền?","o":["Do kết quả của hiện tượng trao đổi chéo ở kỳ đầu I","Do sai sót trong quá trình nhân đôi ở kỳ trung gian","Do sự tác động của thoi vô sắc ở kỳ giữa II","Do sự phân ly độc lập ở kỳ sau II"]},{"q":"Nếu một tế bào sinh dục sơ khai thực hiện giảm phân nhưng cặp NST số 21 không phân ly ở giảm phân I, các giao tử tạo ra sẽ có bộ NST như thế nào?","o":["2 giao tử (n+1) và 2 giao tử (n-1)","4 giao tử đều là (n)","2 giao tử (n) và 2 giao tử (n+1)","1 giao tử (n+1), 1 giao tử (n-1) và 2 giao tử (n)"],"w":"Tế bào sinh dục sơ khai thường nguyên phân trước khi biệt hóa; câu nguồn gọi trực tiếp tế bào này thực hiện giảm phân. Kết quả bốn giao tử còn cần giả thiết giảm phân II bình thường."},{"q":"Protein Cohesin có vai trò gì trong giảm phân I?","o":["Giữ các chromatid chị em và các NST tương đồng dính với nhau","Phân hủy thoi vô sắc","Kích hoạt sự nhân đôi DNA","Tạo ra màng nhân mới"],"w":"Cohesin giữ chromatid chị em; liên hệ giữa NST tương đồng còn thông qua chiasma. Đáp án nguồn gộp hai quan hệ này nên cần đọc có điều kiện."},{"q":"Điều gì xảy ra đối với các thể cực (polar bodies) được hình thành trong quá trình giảm phân ở giống cái?","o":["Chúng thường bị thoái hóa và tiêu biến","Chúng phát triển thành các tế bào trứng phụ","Chúng tham gia vào quá trình thụ tinh kép","Chúng trở thành tế bào sinh dưỡng của phôi"]},{"q":"Sự chuyển đổi từ trạng thái NST kép sang NST đơn trong toàn bộ quá trình giảm phân xảy ra tại thời điểm nào?","o":["Khi các chromatid chị em tách nhau ra ở kỳ sau II","Khi các NST tương đồng tách nhau ra ở kỳ sau I","Ngay sau khi kết thúc giảm phân I","Ở cuối kỳ trung gian"]},{"q":"Pha S của kỳ trung gian trước giảm phân thường kéo dài hơn so với nguyên phân vì:","o":["Cần thời gian để chuẩn bị cho sự tiếp hợp và các protein đặc thù của giảm phân","Tế bào phải nhân đôi DNA hai lần liên tiếp","Tế bào cần tích lũy nhiều chất dinh dưỡng hơn cho 4 tế bào con","Thoi vô sắc của giảm phân phức tạp hơn"],"w":"Nhận định pha S trước giảm phân thường dài hơn và nguyên nhân được nêu không phải mô tả phổ quát cho mọi loài; cần đối chiếu giáo trình học phần."},{"q":"Trong giảm phân II, thoi vô sắc được sắp xếp theo hướng nào so với thoi vô sắc của giảm phân I?","o":["Thường theo hướng vuông góc","Luôn luôn song song","Theo hướng ngược chiều 180 độ","Không có thoi vô sắc ở giảm phân II"],"w":"Hướng hai thoi giảm phân II phụ thuộc loài và kiểu phân bào; câu nguồn dùng “thường” mà chưa giới hạn đối tượng."},{"q":"Vai trò của enzyme Shugoshin trong kỳ sau I của giảm phân là gì?","o":["Bảo vệ sự liên kết giữa các chromatid chị em ở vùng tâm động không bị phân hủy","Cắt đứt các liên kết giữa các NST tương đồng","Thúc đẩy sự đóng xoắn của nhiễm sắc thể","Phân giải các vi ống của thoi vô sắc"],"w":"Shugoshin là protein bảo vệ cohesin vùng tâm động, không nên gọi chung là enzyme. Nội dung nguồn được giữ nguyên."},{"q":"Ở một loài thực vật, sự trao đổi chéo xảy ra tại 2 điểm không cùng lúc trên một cặp NST tương đồng. Điều này dẫn đến:","o":["Tăng đáng kể sự đa dạng các loại giao tử được tạo ra","Làm giảm khả năng sống sót của giao tử","Luôn dẫn đến đột biến cấu trúc NST","Làm cho quá trình giảm phân dừng lại ở kỳ giữa I"],"w":"Cụm “2 điểm không cùng lúc” chưa xác định đầy đủ kiểu trao đổi chéo; kết luận định tính về đa dạng cần hiểu trong phạm vi bài học."},{"q":"Cơ chế nào đảm bảo rằng các vi ống từ cùng một cực tế bào chỉ gắn vào một NST kép trong cặp tương đồng tại kỳ giữa I?","o":["Sự định hướng theo một phía của các kinetochore chị em (Co-orientation)","Sự phân ly ngẫu nhiên của các trung thể","Sự biến mất hoàn toàn của màng nhân","Sự ức chế enzyme separase bởi cyclin B"]},{"q":"Một cơ thể có kiểu gen AaBbD Nếu quá trình giảm phân xảy ra sự trao đổi chéo giữa A và a, nhưng không có trao đổi chéo ở các locus khác, số loại giao tử tối đa có thể tạo ra là bao nhiêu?","o":["8 loại với tỉ lệ phụ thuộc vào tần số hoán vị gen","4 loại với tỉ lệ bằng nhau","16 loại do có sự tổ hợp mới","2 loại vì các gen liên kết hoàn toàn"],"w":"Kiểu gen nguồn bị dở ở “AaBbD”; chưa xác định Dd/DD và vị trí liên kết. Không tự đoán alen bị thiếu hoặc thêm dữ kiện; vẫn giữ khóa của file."},{"q":"Sự sai khác giữa giảm phân I và giảm phân II về mặt năng lượng và điều hòa protein chủ yếu nằm ở:","o":["Sự hiện diện của Cyclin B và sự kiểm soát điểm chốt thoi vô sắc ở giảm phân I chặt chẽ hơn","Giảm phân II không cần tiêu tốn ATP cho việc di chuyển NST","Giảm phân I không có sự tham gia của các protein vận động (motor proteins)","Giảm phân II diễn ra hoàn toàn trong điều kiện kỵ khí của tế bào"],"w":"Khóa gộp sự hiện diện Cyclin B với mức kiểm soát điểm chốt giữa hai lần giảm phân; nhận định so sánh này cần giáo trình hoặc đối tượng cụ thể."},{"q":"Quá trình sinh tinh ở nam giới bắt đầu diễn ra mạnh mẽ vào thời điểm nào?","o":["Tuổi dậy thì","Giai đoạn bào thai","Ngay sau khi sinh","Tuổi trưởng thành (sau 20 tuổi)"]},{"q":"Nơi diễn ra quá trình sản sinh tinh trùng trong tinh hoàn là:","o":["Các ống sinh tinh","Tuyến hành niệu đạo","Túi tinh","Mào tinh hoàn"]},{"q":"Từ một tinh bào bậc I, sau khi kết thúc quá trình giảm phân sẽ tạo ra bao nhiêu tinh tử?","o":["4","1","2","8"]},{"q":"Tế bào nào sau đây có bộ nhiễm sắc thể lưỡng bội (2n)?","o":["Tinh nguyên bào","Tinh bào bậc II","Tinh tử","Tinh trùng"]},{"q":"Chức năng chính của tế bào Sertoli là gì?","o":["Nuôi dưỡng và bảo vệ các tế bào dòng tinh","Sản sinh hormone Testosterone","Trực tiếp phân chia để tạo tinh tử","Vận chuyển tinh trùng ra khỏi ống sinh tinh"]},{"q":"Hormone nào kích thích tế bào kẽ (Leydig) sản sinh Testosterone?","o":["LH (Luteinizing Hormone)","FSH (Follicle Stimulating Hormone)","Estrogen","Progesterone"]},{"q":"Bộ nhiễm sắc thể của tinh trùng người là:","o":["n = 23","2n = 46","n = 46","2n = 23"]},{"q":"Cấu trúc nào của tinh trùng chứa các enzyme giúp xuyên qua màng trứng?","o":["Cực đầu (Acrosome)","Đuôi (Flagellum)","Thân (Cổ)","Nhân"]},{"q":"Quá trình biến đổi từ tinh tử thành tinh trùng được gọi là:","o":["Sự tạo tinh (Spermiogenesis)","Sự giảm phân","Sự nguyên phân","Sự thụ tinh"]},{"q":"Năng lượng cho sự vận động của tinh trùng được cung cấp bởi ty thể tập trung ở đâu?","o":["Đoạn giữa của tinh trùng","Đầu tinh trùng","Cực đầu","Phần cuối của đuôi"]},{"q":"Ở người, thời gian trung bình cho một chu kỳ sinh tinh từ tế bào mầm đến tinh trùng trưởng thành là khoảng:","o":["64 - 74 ngày","28 ngày","14 ngày","120 ngày"]},{"q":"Loại tế bào nào sau đây là kết quả của giảm phân I?","o":["Tinh bào bậc II","Tinh bào bậc I","Tinh tử","Tinh trùng"]},{"q":"Trong tinh hoàn, tế bào Leydig nằm ở vị trí nào?","o":["Trong mô kẽ giữa các ống sinh tinh","Bên trong lòng ống sinh tinh","Trên màng đáy của ống sinh tinh","Ở mào tinh hoàn"]},{"q":"Tinh trùng trưởng thành về mặt chức năng và khả năng vận động tại đâu?","o":["Mào tinh hoàn","Ống dẫn tinh","Túi tinh","Tuyến tiền liệt"],"w":"Trưởng thành ở mào tinh khác với capacitation (hoạt hóa khả năng thụ tinh) trong đường sinh dục nữ. Câu nguồn ghép “về mặt chức năng” và vận động, cần phân biệt."},{"q":"Thành phần chính của đầu tinh trùng là:","o":["Nhân chứa vật chất di truyền cô đặc","Hệ thống ty thể","Các túi chứa dịch kiềm","Hệ thống vi ống"]},{"q":"Hàng rào máu - tinh hoàn được hình thành bởi:","o":["Các liên kết chặt giữa các tế bào Sertoli","Lớp vỏ trắng bao quanh tinh hoàn","Các tế bào kẽ Leydig","Màng đáy của ống sinh tinh"]},{"q":"Protein gắn Androgen (ABP) do tế bào nào tiết ra dưới tác động của FSH?","o":["Tế bào Sertoli","Tế bào kẽ","Tinh nguyên bào","Tế bào thùy trước tuyến yên"]},{"q":"Sự khác biệt về bộ nhiễm sắc thể giữa tinh bào bậc I và tinh bào bậc II là:","o":["Tinh bào bậc I là 2n kép, tinh bào bậc II là n kép","Tinh bào bậc I là 2n đơn, tinh bào bậc II là n đơn","Tinh bào bậc I là n kép, tinh bào bậc II là n đơn","Tinh bào bậc I là 2n kép, tinh bào bậc II là 2n đơn"]},{"q":"Hormone Inhibin do tế bào Sertoli tiết ra có tác dụng:","o":["Ức chế ngược lên thùy trước tuyến yên để giảm tiết FSH","Kích thích vùng dưới đồi tăng tiết GnRH","Kích thích tế bào Leydig tăng tiết Testosterone","Tăng cường quá trình giảm phân II"]},{"q":"Trong quá trình Spermiogenesis (biến đổi hình thái), bào quan nào hình thành nên Acrosome?","o":["Bộ máy Golgi","Lưới nội chất hạt","Trung thể","Ti thể"]},{"q":"Tại sao nhiệt độ trong bìu thường thấp hơn nhiệt độ cơ thể từ 2-3O?","o":["Để đảm bảo điều kiện tối ưu cho quá trình sinh tinh","Để bảo vệ tinh hoàn khỏi các va chạm cơ học","Để tăng tốc độ di chuyển của tinh trùng trong ống dẫn","Để kích thích tế bào kẽ sản sinh nhiều hormone hơn"],"w":"Ký hiệu nhiệt độ cuối câu ghi “2-3O”, có dấu hiệu lỗi ký tự đơn vị. Giữ nguyên thay vì tự thêm đơn vị."},{"q":"Sự kiện nào sau đây xảy ra trong giai đoạn biệt hóa từ tinh tử thành tinh trùng?","o":["Loại bỏ phần lớn tế bào chất dư thừa","Nhân đôi DNA lần cuối cùng","Tiếp hợp và trao đổi chéo giữa các nhiễm sắc thể","Phân chia tế bào chất để tạo ra 2 tế bào mới"]},{"q":"Một người đàn ông bị hội chứng chỉ có tế bào Sertoli (Sertoli cell-only syndrome) thì sẽ:","o":["Không có khả năng hormone nào?","o":["LH","Estrogen","Testosterone","FSH"]},{"q":"Sau khi rụng trứng, phần còn lại của nang trứng biến đổi thành cấu trúc nào?","o":["Hoàng thể (Tuyến vàng)","Thể trắng","Noãn bào bậc II","Tử cung"]},{"q":"Bộ nhiễm sắc thể của noãn bào bậc II ở người là:","o":["n = 23 (NST kép)","2n = 46 (NST đơn)","n = 23 (NST đơn)","2n = 46 (NST kép)"]},{"q":"Ở người, một người phụ nữ sinh ra đã có sẵn khoảng bao nhiêu noãn bào bậc I trong buồng trứng?","o":["1 - 2 triệu","400 - 500","10 - 20 triệu","Không giới hạn"]},{"q":"Tế bào trứng thực sự hoàn thành quá trình giảm phân II khi nào?","o":["Khi có sự xâm nhập của tinh trùng (thụ tinh)","Ngay khi rụng trứng","Khi nang trứng chín","Khi bắt đầu kỳ kinh nguyệt"]},{"q":"Hormone nào do hoàng thể tiết ra nhiều nhất để chuẩn bị niêm mạc tử cung cho sự làm tổ?","o":["Progesterone","FSH","LH","GnRH"]},{"q":"Tại sao quá trình sinh trứng lại tạo ra các tế bào có kích thước không đều nhau?","o":["Do sự phân chia tế bào chất không đồng đều để tập trung dinh dưỡng cho tế bào trứng","Do sai lệch trong việc sắp xếp các nhiễm sắc thể","Do các thể cực bị đột biến mất tế bào chất","Do tác động của các hormone kích thích không đều"]},{"q":"Noãn bào bậc I tạm dừng ở giai đoạn nào từ khi sinh ra cho đến trước khi dậy thì?","o":["Kỳ đầu I (giai đoạn Diplotene)","Kỳ giữa I","Kỳ cuối I","Kỳ đầu II"]},{"q":"Lớp màng bảo vệ bao quanh noãn bào bậc II mà tinh trùng phải vượt qua gọi là:","o":["Màng trong suốt (Zona pellucida)","Màng sinh chất","Vỏ nang trứng","Niêm mạc buồng trứng"]},{"q":"Sự khác biệt cơ bản giữa sinh tinh và sinh trứng là:","o":["Sinh tinh diễn ra liên tục, sinh trứng diễn ra theo chu kỳ và có giai đoạn tạm dừng","Sinh tinh tạo ra 1 tế bào, sinh trứng tạo ra 4 tế bào","Sinh trứng bắt đầu từ tuổi dậy thì, sinh tinh bắt đầu từ bào thai","Sinh tinh chỉ diễn ra ở tinh hoàn, sinh trứng diễn ra ở buồng trứng và tử cung"]},{"q":"Hormone GnRH từ vùng dưới đồi kích thích tuyến yên tiết ra những hormone nào?","o":["FSH và LH","Estrogen và Progesterone","HCG và Prolactin","Insulin và Glucagon"]},{"q":"Hiện tượng \"Atresia\" trong buồng trứng là gì?","o":["Sự thoái hóa của các nang trứng không đạt đến giai đoạn chín","Sự rụng nhiều trứng cùng một lúc","Sự hình thành đa nang buồng trứng","Quá trình thụ tinh diễn ra trong buồng trứng"]},{"q":"Thể cực thứ nhất được hình thành đồng thời với tế bào nào?","o":["Noãn bào bậc II","Noãn bào bậc I","Tế bào trứng trưởng thành","Noãn nguyên bào"]},{"q":"Trong chu kỳ buồng trứng, nồng độ Estrogen cao nhất vào giai đoạn nào?","o":["Ngay trước khi rụng trứng","Giai đoạn hành kinh","Giai đoạn hoàng thể","Giai đoạn sau rụng trứng 1 tuần"]},{"q":"Một phụ nữ có khoảng 400 - 500 trứng rụng trong suốt cuộc đời. Số còn lại của hàng triệu noãn bào ban đầu sẽ như thế nào?","o":["Bị thoái hóa dần theo thời gian (Atresia)","Đợi đến giai đoạn mãn kinh mới rụng","Biến đổi thành tế bào kẽ của buồng trứng","Được tái hấp thụ để tạo năng lượng cho cơ thể"]},{"q":"Tín hiệu hóa học nào ngăn cản noãn bào hoàn thành giảm phân I trước tuổi dậy thì?","o":["OMI (Oocyte Maturation Inhibitor) do tế bào nang tiết ra","Nồng độ LH quá cao trong máu","Sự thiếu hụt dinh dưỡng từ mạch máu buồng trứng","Do các nhiễm sắc thể chưa nhân đôi xong"],"w":"OMI là thuật ngữ mô tả lịch sử; điều hòa dừng giảm phân có cơ chế cAMP/cGMP phức tạp hơn. Không bổ sung cơ chế thay cho khóa nguồn."},{"q":"Cơ chế phân tử nào giữ cho noãn bào bậc II dừng lại ở kỳ giữa II?","o":["Sự hiện diện của yếu tố thúc đẩy kỳ giữa (CSF - Cytostatic Factor) ức chế APC/C","Sự biến mất hoàn toàn của thoi phân bào","Sự thiếu hụt enzyme DNA Polymerase","Sự đóng xoắn quá mức của nhiễm sắc thể khiến chúng không thể phân ly"]},{"q":"Sau khi thụ tinh, canxi nội bào trong trứng tăng lên đột ngột có tác dụng gì đối với chu kỳ tế bào?","o":["Hoạt hóa enzyme phân giải CSF, giúp trứng hoàn thành giảm phân II","Kích thích trứng nhân đôi DNA lần nữa","Ngăn cản sự hình thành nhân của tinh trùng","Làm cho thể cực thứ hai nhập lại vào tế bào trứng"]},{"q":"Đột biến không phân ly nhiễm sắc thể trong quá trình sinh trứng thường xảy ra ở giai đoạn nào và dẫn đến hậu quả gì phổ biến nhất?","o":["Giảm phân I, dẫn đến các hội chứng lệch bội như Down (Trisomy 21)","Nguyên phân, dẫn đến ung thư buồng trứng","Giảm phân II, dẫn đến thai vô sinh","Giai đoạn biệt hóa nang trứng, dẫn đến mãn kinh sớm"]},{"q":"Vai trò của các tế bào hạt (Granulosa cells) trong sự phát triển của noãn bào là gì?","o":["Cung cấp các yếu tố tăng trưởng, chuyển đổi androgen thành estrogen và tạo màng trong suốt","Trực tiếp tham gia vào quá trình giảm phân cùng với noãn bào","Chống lại sự xâm nhập của nhiều tinh trùng cùng lúc (đa thụ tinh)","Biến đổi thành các thể cực để hỗ trợ dinh dưỡng cho trứng"],"w":"Đáp án gộp vai trò granulosa với tạo zona pellucida; đóng góp hình thành zona phụ thuộc loài và không nên coi granulosa là nguồn duy nhất ở người."},{"q":"Tại sao tuổi của người mẹ càng cao thì nguy cơ con mắc các bệnh di truyền do lệch bội NST càng tăng?","o":["Do các noãn bào bậc I đã dừng lại ở kỳ đầu I quá lâu, khiến thoi phân bào dễ bị lỗi khi tái hoạt động","Do nồng độ hormone Progesterone giảm làm trứng dễ bị đột biến","Do niêm mạc tử cung không còn khả năng lọc các phôi lỗi","Do các thể cực không còn được hình thành chính xác ở phụ nữ lớn tuổi"]},{"q":"Enzyme chính xúc tác quá trình kéo dài mạch polynucleotide trong nhân đôi DNA ở vi khuẩn E. coli là gì?","o":["DNA polymerase III.","DNA polymerase I.","RNA polymerase.","DNA ligase."]},{"q":"Mạch được tổng hợp liên tục (leading strand) trong quá trình nhân đôi DNA hướng theo chiều nào so với chạc sao chép?","o":["Từ 5' đến 3' cùng hướng với sự mở chạc sao chép.","Từ 3' đến 5' ngược hướng với sự mở chạc sao chép.","Từ 5' đến 3' ngược hướng với sự mở chạc sao chép.","Tùy thuộc vào trình tự của mạch khuôn."]},{"q":"Quá trình nhân đôi DNA diễn ra theo nguyên tắc nào sau đây?","o":["Nguyên tắc bổ sung và bán bảo toàn.","Nguyên tắc bảo toàn và phân tán.","Nguyên tắc ngẫu nhiên và phân tán.","Nguyên tắc bổ sung và bảo toàn toàn phần."]},{"q":"Đoạn mồi (primer) cần thiết để bắt đầu quá trình tổng hợp mạch DNA mới có bản chất hóa học là gì?","o":["RNA (Ribonucleic acid).","DNA (Deoxyribonucleic acid).","Protein.","Phức hợp Lipid-carbohydrate"]},{"q":"Trong quá trình nhân đôi DNA, enzyme có vai trò tháo xoắn và cắt đứt liên kết hydro giữa hai mạch đơn là:","o":["Helicase.","Topoisomerase.","Ligase.","Endonuclease."]},{"q":"Chức năng chính của protein bám mạch đơn (SSB - Single-strand binding protein) trong nhân đôi DNA là gì?","o":["Ngăn cản hai mạch đơn chập lại thành mạch kép, bảo vệ mạch đơn khỏi nuclease.","Xúc tác quá trình tổng hợp đoạn mồi RN","Nối các đoạn Okazaki trên mạch ra chậm (lagging strand).","Cắt bỏ các nucleotide lắp ráp sai trên mạch mới tổng hợp."],"w":"Có ký hiệu hoặc từ ngữ có dấu hiệu bị cắt trong bản gốc (T1). Giữ nguyên văn bản, không đoán ký tự còn thiếu."},{"q":"Nguồn năng lượng để tạo liên kết phosphodiester trong quá trình kéo dài mạch DNA được cung cấp trực tiếp từ đâu?","o":["Sự phân cắt hai nhóm phosphate từ các deoxynucleoside triphosphate (dNTP).","Sự phân giải ATP nội bào bởi enzyme helicase.","Sự chênh lệch nồng độ ion H+ qua màng sinh chất.","Quá trình đường phân và chu trình Krebs."]},{"q":"Trên mạch ra chậm (lagging strand), các đoạn Okazaki được nối lại với nhau tạo thành mạch liên tục nhờ enzyme nào?","o":["DNA ligase.","DNA polymerase I.","Primase.","Helicase."]},{"q":"Enzyme nào xúc tác quá trình tổng hợp đoạn mồi RNA trong sinh tổng hợp DNA?","o":["Primase.","DNA polymerase III.","RNase H.","Telomerase."]},{"q":"Vị trí đặc hiệu trên phân tử DNA nơi quá trình tháo xoắn và bắt đầu sao chép diễn ra được gọi là gì?","o":["Ori (Origin of replication).","Promoter.","Terminator.","Vùng vận hành (Operator)."]},{"q":"Lý do cốt lõi nào khiến quá trình sao chép DNA bắt buộc phải cần đoạn mồi?","o":["Vì DNA polymerase chỉ có thể gắn nucleotide mới vào đầu 3'-OH có sẵn.","Vì đoạn mồi có vai trò cung cấp năng lượng cho enzym
