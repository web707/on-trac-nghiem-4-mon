trên 10%","0-14>35%","≥65\u003c5%","Tuổi trung vị\u003c20"],"w":"Cần phân biệt “già hóa” với “dân số già” và chỉ tiêu 60+ với 65+. Nguồn nêu 60+ trên 10% nhưng không ghi hệ phân loại hoặc mốc tham chiếu; không tự đổi khóa."},{"q":"Tỷ số phụ thuộc chung phản ánh:","o":["Số người ngoài tuổi lao động trên 100 người trong tuổi lao động","Thu nhập","Mức sinh","Tử vong"]},{"q":"Theo LHQ, già hóa dân số bắt đầu khi ≥65 tuổi chiếm:","o":["7%","5%","10%","15%"],"w":"Ngưỡng tuổi và tỷ lệ phụ thuộc cách phân loại. Giữ 7% theo nguồn, không đổi sang một ngưỡng khác hay áp dụng cho mọi định nghĩa."},{"q":"Tháp dân số ổn định phản ánh:","o":["Quy mô dân số ổn định","Mức sinh cao","Dân số giảm","Không có người già"],"w":"Khái niệm dân số ổn định (stable) và dân số dừng (stationary) cần phân biệt; cơ cấu tuổi ổn định chưa nhất thiết đồng nghĩa tổng quy mô không đổi. Nguồn dùng cách diễn đạt giản lược."},{"q":"Quá trình biến động dân số tự nhiên trong dân số học chủ yếu thông qua hai hiện tượng nào sau đây?","o":["Sinh và Chết","Kết hôn và Ly hôn","Nhập cư và Xuất cư","Đô thị hóa và Di dân"]},{"q":"Thuật ngữ dân số học nào dùng để chỉ khả năng sinh học (năng lực sinh học) của một người phụ nữ hay một cặp vợ chồng có thể sinh con được?","o":["Khả năng sinh sản (Fertility)","Sinh sản (Reproductive)","Số lần sinh con sống (Parity)","Mức sinh thay thế (Replacement level)"],"w":"Trong thuật ngữ dân số học, khả năng sinh học thường gọi fecundity; fertility mô tả sinh sản thực tế/mức sinh. Nguồn ghi “Khả năng sinh sản (Fertility)”; giữ nguyên chữ và khóa."},{"q":"Công thức tính Tỷ suất sinh thô (CBR) là gì?","o":["CBR = (B / P) * 1.000","CBR = (P / B) * 1.000","CBR = (B / W_15-49) * 1.000","CBR = (D / P) * 1.000"]},{"q":"Theo định nghĩa của WHO, một đứa trẻ sau khi thoát ly hoàn toàn khỏi cơ thể người mẹ, chỉ cần có một trong các biểu hiện nào sau đây thì được coi là một \"trẻ sinh sống\" (live birth)?","o":["Tất cả các biểu hiện như hơi thở, tim đập, mạch đập dây rốn hoặc co bóp cơ tùy ý","Hơi thở, sự đập của tim, sự mạch đập của dây rốn","Sự co bóp rõ rệt của các cơ tùy ý","Chỉ cần có hơi thở hoặc tim đập"],"w":"Có lỗi bố cục liền kề: ba phương án số liệu 19,9‰ / 46‰ / 39‰ của câu 45 chen sau bốn lựa chọn câu này. HTML giữ bốn lựa chọn về trẻ sinh sống cho câu 44, chuyển ba lựa chọn số liệu về câu 45 và ghi lại vị trí gốc. Câu hỏi nói chỉ cần một dấu hiệu nhưng các lựa chọn B/C/D là tập con của A nên chưa loại trừ nhau hoàn toàn; giữ khóa A."},{"q":"Vào năm 1999, Tỷ suất sinh thô (CBR) của Việt Nam được ghi nhận ở mức bao nhiêu?","o":["19,9‰","46‰","39‰","17‰"],"w":"Ghép lại lỗi bố cục bằng nội dung sẵn có: A–C lấy từ các đoạn trước tiêu đề câu 45 (đoạn 268–270, chỉ số từ 0 trong bản trích xuất); D ở đoạn 273. Không thêm hoặc sửa số liệu. Khóa A giữ theo dòng đáp án trong nguồn; dữ kiện thuộc năm 1999."},{"q":"Tổng tỷ suất sinh (TFR) đo lường số con trung bình của một người phụ nữ đi qua hết thời kỳ sinh đẻ nếu chị ta tuân theo:","o":["Tỷ suất sinh đặc trưng theo tuổi (ASFR) của một năm cụ thể","Tỷ suất sinh thô (CBR) của một chu kỳ 10 năm","Xu hướng kết hôn của thế hệ trước","Quy mô gia đình lý tưởng do Nhà nước quy định"]},{"q":"Khi tỷ suất tái sinh ròng (NRR) bằng 1 (NRR = 1), điều này có nghĩa là gì?","o":["Một thế hệ mẹ trung bình sinh ra đúng một thế hệ con gái để thay thế mình (Đạt mức sinh thay thế)","Dân số đang tăng trưởng với tốc độ phi mã","Mức chết của trẻ em dưới 1 tuổi bằng 0","Không có sự biến động dân số tự nhiên"]},{"q":"Trong công thức tính Tỷ suất chết thô (CDR), đại lượng P đại diện cho:","o":["Số dân trung bình (hoặc số dân giữa năm) của quần thể nghiên cứu","Tổng số phụ nữ trong độ tuổi sinh đẻ","Số trẻ em sinh sống trong năm","Tổng số người chết vì mọi nguyên nhân trong năm"]},{"q":"Chỉ số IMR trong dân số học dùng để đo lường tỷ suất tử vong của nhóm đối tượng nào?","o":["Trẻ em dưới 1 tuổi (từ 0 đến dưới 365 ngày tuổi)","Trẻ em dưới 5 tuổi","Trẻ sơ sinh dưới 28 ngày tuổi","Thai nhi bị sẩy tự nhiên hoặc nạo phá"]},{"q":"Khi nghiên cứu cơ cấu nguyên nhân tử vong, chỉ số nào cho biết tỷ lệ phần trăm số người chết do một nguyên nhân cụ thể trong tổng số các ca tử vong nói chung?","o":["Tỷ lệ chết theo một nguyên nhân đặc trưng (PDSC_i)","Tỷ suất chết đặc trưng theo nguyên nhân (CSDR_i)","Tỷ suất chết thô (CDR)","Tỷ suất chết đặc trưng theo tuổi (ASDR_x)"]},{"q":"Tại sao Tỷ suất sinh thô (CBR) lại được gọi là chỉ số \"thô\"?","o":["Vì mẫu số của nó là tổng số dân (P), bao gồm cả những người không có khả năng sinh đẻ như nam giới, trẻ em và người già","Vì nó tính toán dựa trên số liệu chưa được làm sạch","Vì nó không nhân với hệ số k = 1.000","Vì nó chỉ áp dụng được ở các quốc gia có nền kinh tế thô sơ, chưa phát triển"]},{"q":"Nhược điểm lớn nhất của Tỷ suất chết thô (CDR) khi dùng để so sánh mức độ tử vong giữa hai quốc gia khác nhau là gì?","o":["Bị ảnh hưởng rất nặng nề bởi cơ cấu tuổi của dân số","Không tính đến yếu tố di dân tự do","Rất khó thu thập số liệu tử vong ở các nước đang phát triển","Công thức tính quá phức tạp và dễ sai sót"]},{"q":"Một cuộc điều tra ghi nhận trong năm, một huyện có số dân giữa năm là 50.000 người, tổng số trẻ sinh sống là 1.000 trẻ, và tổng số ca tử vong là 300 ca. Tỷ suất tăng tự nhiên (NIR) của huyện này là bao nhiêu?","o":["1,4%","2,0%","14%","0,7%"]},{"q":"Theo lý thuyết phân loại của Davis và Blake về các biến số trung gian ảnh hưởng đến mức sinh, hành vi \"Sử dụng các biện pháp tránh thai\" và \"Triệt sản\" thuộc nhóm nào","o":["Các yếu tố ảnh hưởng đến việc thụ thai (Conception variables)","Các yếu tố ảnh hưởng đến việc giao hợp (Intercourse variables)","Các yếu tố ảnh hưởng đến thai nghén và sinh đẻ (Gestation variables)","Các yếu tố môi trường tự nhiên"]},{"q":"Nhận định nào sau đây là đúng về mối quan hệ giữa trình độ học vấn của người mẹ và mức sinh đẻ tại Việt Nam theo các nghiên cứu dân số?","o":["Trình độ học vấn của mẹ và mức sinh thường có quan hệ nghịch (học vấn càng cao, mức sinh có xu hướng giảm)","Trình độ học vấn càng cao thì mức sinh càng cao (tỷ lệ thuận)","Học vấn hoàn toàn không có ảnh hưởng gì tới hành vi sinh đẻ","Mối quan hệ này chỉ đúng với nhóm phụ nữ trên 45 tuổi"]},{"q":"Tuổi kết hôn lần đầu của phụ nữ thấp (tảo hôn, kết hôn sớm) thường dẫn đến mức sinh cao chủ yếu là do cơ chế nào?","o":["Làm kéo dài thời gian chung sống trong thời kỳ sinh sản của người phụ nữ","Làm giảm tỷ lệ sẩy thai tự nhiên","Làm tăng tỷ suất tử vong của trẻ sơ sinh","Khiến người phụ nữ có sức khỏe sinh học tốt hơn"]},{"q":"Đường biểu diễn Tỷ suất chết đặc trưng theo tuổi (ASDR) của hầu hết các quần thể dân số trên thế giới thường có dạng hình chữ gì?","o":["Hình chữ U hoặc chữ J","Hình đường thẳng dốc xuống","Hình chữ S ngược","Hình chữ V úp ngược (hình parabol)"]},{"q":"Ý nghĩa thực tế của việc nghiên cứu chỉ số Tỷ suất chết đặc trưng theo nguyên nhân (CSDR_i) đối với ngành Y tế là gì?","o":["Để xác định các mặt bệnh ưu tiên, phân bổ ngân sách và xây dựng chiến lược phòng chống bệnh tật phù hợp","Để tính toán tuổi thọ trung bình chính xác của một thế hệ","Để quản lý việc cấp giấy chứng tử tại các trạm y tế xã","Để thay thế hoàn toàn cho chỉ số Tỷ suất chết thô (CDR)"]},{"q":"Theo tài liệu, tại các nước đang phát triển, nhóm nguyên nhân tử vong nào thường chiếm tỷ trọng cao trong cơ cấu tử vong ở các thập kỷ trước, nhưng đang giảm dần nhờ thành tựu y học?","o":["Các bệnh nhiễm trùng, ký sinh trùng và dịch bệnh lây nhiễm","Bệnh tim mạch và ung thư","Tai nạn giao thông và chấn thương lao động","Các bệnh thoái hóa do tuổi già"]},{"q":"Khi so sánh mức sinh giữa các vùng địa lý ở Việt Nam, vùng nào sau đây thường được ghi nhận là có mức sinh (TFR) thấp nhất cả nước, thường xuyên dưới mức sinh thay thế?","o":["Vùng Đông Nam Bộ và Đồng bằng sông Cửu Long","Vùng Tây Bắc","Vùng Tây Nguyên","Vùng Bắc Trung Bộ"],"w":"Câu hỏi không chỉ rõ năm tham chiếu và gộp hai vùng trong một lựa chọn dù hỏi thấp nhất. Giữ nội dung tài liệu, không coi đây là bảng xếp hạng cập nhật."},{"q":"Biến động dân số bao gồm hai cấu thành cơ bản nào?","o":["Biến động tự nhiên và biến động cơ học.","Biến động tự nhiên và tăng trưởng sinh học.","Biến động cơ học và tăng giảm mật độ.","Tăng trưởng tự nhiên và di dân quốc tế."]},{"q":"Theo nghĩa hẹp, tổ chức nào định nghĩa di dân là sự di chuyển dân cư từ một đơn vị lãnh thổ này đến một đơn vị lãnh thổ khác nhằm thiết lập nơi cư trú mới?","o":["Liên hiệp quốc","Tổ chức Di cư Quốc tế (IOM)","Tổ chức Y tế Thế giới (WHO)","Hội nghị quốc tế về Dân số và Phát triển"]},{"q":"Hiện tượng di chuyển dân cư từ một nước này sang một nước khác để sinh sống tạm thời hoặc vĩnh viễn được gọi là gì?","o":["Xuất cư","Nhập cư","Di dân nội địa","Di chuyển con lắc"],"w":"Di chuyển giữa hai nước có thể gọi là xuất cư từ góc nhìn nước đi, nhập cư từ nước đến, hoặc di cư quốc tế. Câu chưa chỉ rõ góc nhìn; giữ khóa A."},{"q":"Hình thức phân loại di dân quan trọng nhất dựa trên tiêu chí nào?","o":["Khoảng cách","Đặc trưng di dân","Độ dài thời gian cư trú","Địa bàn nơi đến"],"w":"Cụm “quan trọng nhất” phụ thuộc cách phân loại của giáo trình; file không giải thích tiêu chí xếp hạng."},{"q":"Hiện tượng \"Chảy máu chất xám\" thuộc loại hình di dân nào?","o":["Di dân quốc tế","Di dân nội địa","Di dân tự phát","Di dân mùa vụ"]},{"q":"Dòng di chuyển của cư dân nông thôn vào thành phố trong thời kỳ nông nhàn được gọi là hình thái di dân nào?","o":["Di dân mùa vụ (di chuyển con lắc)","Di chuyển lâu dài","Di dân có tổ chức","Chảy máu chất xám"],"w":"Di dân mùa vụ và di chuyển con lắc là các khái niệm cần phân biệt theo thời gian, tính lặp lại và nơi cư trú. Nguồn đặt chúng cùng ngoặc; giữ nguyên."},{"q":"Theo kết quả điều tra năm 2015, vùng nào có tỷ lệ di cư cao nhất nước ta?","o":["Đông Nam Bộ","Đồng bằng sông Hồng","Đồng bằng sông Cửu Long","Tây Nguyên"]},{"q":"Khái niệm \"Siêu đô thị\" (Mega City) dùng để chỉ các thành phố có quy mô dân số tối thiểu là bao nhiêu?","o":["Trên 10 triệu người","Trên 5 triệu người","Trên 15 triệu người","Trên 20 triệu người"],"w":"Cần phân biệt ngưỡng “từ 10 triệu” với “trên 10 triệu” khi hỏi tối thiểu. Giữ cách viết của nguồn, không sửa dấu so sánh."},{"q":"Theo tiêu chí phân loại đô thị hiện nay ở Việt Nam, quy mô dân số thấp nhất của một đô thị là bao nhiêu?","o":["4.000 người (vùng núi có thể thấp hơn)","2.000 người","2.500 người","50.000 người"],"w":"Câu dùng “hiện nay” nhưng không nêu văn bản phân loại đô thị, năm hiệu lực hay cấp đô thị. Không diễn giải 4.000 người là quy định hiện hành cho mọi loại đô thị."},{"q":"Tỷ lệ đô thị hóa của Việt Nam năm 2019 đạt bao nhiêu phần trăm?","o":["34,4%","23,5%","29,0%","29,6%"]},{"q":"Điểm khác biệt căn bản giữa di biến động dân cư do di dân và tăng trưởng dân số tự nhiên là gì?","o":["Di dân có thể lặp đi lặp lại nhiều lần trong đời một cá nhân, còn sinh và chết chỉ diễn ra một lần.","Di dân chỉ làm tăng mật độ dân cư chứ không làm thay đổi số lượng.","Tăng trưởng tự nhiên làm thay đổi cơ cấu giới tính rõ rệt hơn di dân.","Di dân chỉ diễn ra ở các nước đang phát triển, tăng trưởng tự nhiên diễn ra ở mọi quốc gia."]},{"q":"Theo nhà nghiên cứu Henry S. Shryock, hoạt động nào sau đây ĐƯỢC coi là di dân?","o":["Thay đổi nơi ở thường xuyên giữa các đơn vị hành chính và làm thay đổi các quan hệ xã hội.","Đi du lịch dài ngày xuyên quốc gia.","Qua lại biên giới để buôn bán làm ăn thường xuyên.","Đi thăm người thân ở tỉnh khác trong vòng 3 tháng."]},{"q":"Một địa phương có số người nhập cư ít hơn số người xuất cư thì Tỷ suất di dân thuần túy (NMR) của địa phương đó sẽ có giá trị như thế nào?","o":["Có giá trị âm (-)","Luôn bằng 0","Có giá trị dương (+)","Không thể xác định được"]},{"q":"Trong trường hợp số người xuất cư xấp xỉ bằng số người nhập cư khiến tỷ suất di cư thuần túy (NMR) quá nhỏ, người ta thường dùng chỉ tiêu nào để đánh giá toàn diện tình hình di cư?","o":["Tỷ suất tổng di dân (TR)","Tỷ suất xuất cư (OR)","Tỷ suất nhập cư (IR)","Tỷ lệ đô thị hóa (UR)"]},{"q":"Theo lý thuyết của Ravenstein, yếu tố nào sau đây được phân loại là một \"Lực đẩy\" tại vùng nơi dân chuyển đi?","o":["Đất canh tác ít, bạc màu, không có vốn và kỹ thuật chuyển đổi ngành nghề.","Cơ hội dễ kiếm việc làm và thu nhập cao.","Khí hậu ôn hòa, môi trường sống thuận lợi.","Môi trường văn hóa - xã hội tốt hơn nơi ở cũ."]},{"q":"Đặc điểm nổi bật nào minh chứng cho tính năng động và vai trò độc lập của cá nhân/gia đình trong hình thái di dân tự phát tại Việt Nam?","o":["Tự quyết định di chuyển và giải quyết đời sống mà không phụ thuộc vào kế hoạch hay sự hỗ trợ của Nhà nước.","Luôn nhận được sự giúp đỡ từ chính quyền địa phương nơi nhập cư.","Hạn chế tối đa việc khai thác tài nguyên thiên nhiên bừa bãi.","Chỉ di chuyển trong phạm vi nội tỉnh hoặc khoảng cách rất ngắn."]},{"q":"Theo tiêu chí phân loại đô thị tại Việt Nam hiện nay, tỷ lệ lao động phi nông nghiệp trong tổng số lao động phải đạt tối thiểu là bao nhiêu?","o":["Từ 60% trở lên","Trên 50%","Từ 70% trở lên","Từ 85% trở lên"],"w":"Câu dùng “hiện nay” nhưng thiếu năm, văn bản và loại đô thị. Tỷ lệ lao động phi nông nghiệp cần điều kiện phân loại; khóa 60% được giữ theo tài liệu."},{"q":"Sự thay đổi của dân số thành thị xuất phát từ 3 nhân tố: Tăng trưởng tự nhiên nội tại, tăng trưởng do di dân (cơ học) và nhân tố nào sau đây?","o":["Sự tái phân bố dân cư theo địa bàn thông qua các biện pháp hành chính.","Sự thay đổi kết cấu tuổi do chảy máu chất xám.","Sự chênh lệch tiền công giữa khu vực chính thức và phi chính thức.","Sự suy giảm tỷ lệ sinh ở khu vực nông thôn xung quanh."]},{"q":"Xu hướng di chuyển dân cư đặc trưng ở các nước phát triển được tài liệu nhắc đến là gì?","o":["Di chuyển đến các đô thị nhỏ vệ tinh xung quanh những đô thị lớn.","Tập trung ồ ạt vào các lõi đô thị trung tâm cực lớn.","Di chuyển từ đô thị về hẳn các vùng nông thôn hẻo lánh.","Di dân quốc tế bất hợp pháp sang các nước đang phát triển."]},{"q":"Dựa vào Bảng 4.1, khi xem xét \"nơi chuyển đến\" là TP. HCM, dòng di cư lớn nhất xuất phát từ vùng nào?","o":["Đồng bằng sông Cửu Long (ĐBSCL)","Đồng bằng sông Hồng (ĐBSH)","Đông Nam Bộ (DNB)","Bắc Trung Bộ và Duyên hải miền Trung (BTB & DHMT)"],"w":"Câu dẫn “Bảng 4.1” nhưng file được cung cấp không chứa bảng số liệu đó. Giữ câu và khóa A; không dựng thêm bảng hoặc số liệu để lấp phần thiếu."},{"q":"Theo định nghĩa của Tổ chức Y tế Thế giới được trích dẫn trong tài liệu, sức khỏe được hiểu là gì?","o":["Trạng thái thoải mái về thể chất, tinh thần và xã hội, chứ không chỉ là tình trạng không có bệnh tật hay thương tật.","Tình trạng hoàn toàn không có bệnh tật hay thương tật.","Trạng thái khỏe mạnh về cơ bắp và có lối sống lành mạnh, không mắc bệnh truyền nhiễm.","Tình trạng cơ thể phát triển cân đối và không có khiếm khuyết về mặt hình thể."]},{"q":"Vào năm 1990, tỷ lệ dân số trong độ tuổi lao động ở các nước phát triển là bao nhiêu?","o":["66,5%","60,0%","70,0%","71,0%"],"w":"Số liệu năm 1990 không kèm bảng hoặc nguồn thống kê gốc. Giữ 66,5% theo tài liệu, không chuyển thành số liệu hiện tại."},{"q":"Đối tượng nào sau đây ĐƯỢC tính vào khối \"Dân số hoạt động kinh tế\"?","o":["Những người đang làm việc trong lĩnh vực dân sự và những người làm việc trong lực lượng vũ trang.","Người làm công việc nội trợ hoặc trông nom nhà cửa, con cái trong hộ gia đình của chính họ.","Học sinh, sinh viên đang học tập thường xuyên tại các trường công hoặc trường tư.","Người hưởng lợi tức, nhận được thu nhập do đầu tư hoặc tài sản cho thuê mà không phải làm việc."],"w":"Dân số hoạt động kinh tế còn cần cách định nghĩa lực lượng lao động và thời kỳ tham chiếu; khóa đang nêu nhóm có việc làm, không phải liệt kê đầy đủ mọi nhóm."},{"q":"Tính đến thời điểm Tổng điều tra Dân số và Nhà ở ngày 01 tháng 04 năm 2019, dân số Việt Nam đạt hơn 96 triệu người và là quốc gia đông dân thứ mấy trong khu vực Đông Nam Á?","o":["Thứ ba","Thứ nhất","Thứ hai","Thứ tư"]},{"q":"Giáo dục chính quy được tài liệu định nghĩa là gì?","o":["Những lớp học theo một chương trình đã được nhà nước chuẩn hóa, được tiến hành trong các trường học.","Các lớp học có chương trình tùy thuộc vào mục đích và yêu cầu của người học, tổ chức ngoài nhà trường.","Các khóa huấn luyện kỹ năng ngắn hạn do các tổ chức tư nhân phối hợp thực hiện.","Tất cả các dạng học tập tự phát của con người nhằm truyền đạt kinh nghiệm xã hội."]},{"q":"Điền vào chỗ trống: \"Tỷ lệ gia tăng GNP bình quan đầu người = Tỷ lệ gia tăng GNP – ........................\"?","o":["Tỷ lệ gia tăng dân số","Tỷ lệ tham gia lực lượng lao động thô","Tỷ lệ tăng năng suất lao động","Tỷ suất tử vong thô"],"w":"Đẳng thức tốc độ tăng GNP bình quân bằng tăng GNP trừ tăng dân số là dạng gần đúng theo tốc độ phần trăm thông thường. Nguồn không nêu giả thiết xấp xỉ."},{"q":"Biểu thức toán học nào sau đây thể hiện Tổng chi phí tiêu dùng của xã hội (C)?","o":["C = Σ P_x c_x = Σ P (P_x/p) c_x = P Σ p_x c_x","C = Σ P_x a_x","C = P Σ p_x a_x","C = Y - P Σ p_x(a_x - c_x)"],"w":"Công thức nguồn dùng lẫn P và p trong P_x/p, sau đó dùng p_x, nhưng không có phần định nghĩa các ký hiệu kèm theo. Giữ nguyên công thức và không tự chuẩn hóa mẫu số."},{"q":"Theo số liệu Tổng điều tra dân số năm 2019, tỷ lệ dân số từ 65 tuổi trở lên ở nước ta chiếm bao nhiêu phần trăm?","o":["7,7%","24,3%","60,0%","69,0%"]},{"q":"Khối lượng sử dụng tài nguyên không tái tạo được (Q) phụ thuộc vào những yếu tố nào theo công thức trong tài liệu?","o":["Số dân (P), mức sử dụng tài nguyên bình quan mỗi người/năm (a), khoảng thời gian khai thác (T).","Tổng thu nhập xã hội (Y), diện tích đất nông nghiệp (ha), tỷ lệ gia tăng dân số (g).","Số người trong độ tuổi lao động, năng suất lao động thô, mức tiêu dùng bình quan.","Mật độ dân số, diện tích đất có rừng, hàm lượng hóa chất sử dụng trong sản xuất."]},{"q":"Tài liệu chia nguồn tài nguyên tự nhiên thành ba loại nào?","o":["Tài nguyên không tái tạo được, tài nguyên tái tạo được và tài nguyên vô hạn.","Tài nguyên đất, tài nguyên nước và tài nguyên không khí.","Tài nguyên khoáng sản, tài nguyên sinh vật và tài nguyên vô hạn.","Tài nguyên hữu hạn, tài nguyên phục hồi được và tài nguyên năng lượng."]},{"q":"Nhược điểm lớn nhất của \"Tỷ lệ tham gia lực lượng lao động thô\" (CLFPR) khiến nó bị ảnh hưởng lớn giống như tỷ suất sinh thô là gì?","o":["Bị ảnh hưởng bởi cơ cấu dân số và sử dụng toàn bộ dân số ở mẫu số (gồm cả người quá già, quá trẻ).","Không tính đến những người làm việc trong lực lượng vũ trang.","Sử dụng khoảng thời gian điều tra quá dài (trên một tháng).","Không thể phân tách riêng biệt giữa thành thị và nông thôn."]},{"q":"Nhóm dân cư nào sau đây có tỷ lệ tham gia lực lượng lao động và năng suất lao động cao hơn hẳn, nếu chiếm tỷ trọng cao sẽ giúp nền kinh tế đạt kết quả tốt hơn?","o":["Nhóm dân cư nam từ 25 đến 29 tuổi.","Nhóm dân cư nam từ 15 đến 19 tuổi.","Nhóm dân cư nữ từ 20 đến 24 tuổi.","Nhóm dân cư nữ từ 50 đến 54 tuổi."],"w":"So sánh năng suất và tỷ lệ tham gia lao động cần quần thể, năm và dữ liệu cụ thể. File không có bảng để xác nhận nhận định nam 25–29 cao hơn hẳn các nhóm còn lại."},{"q":"Tại sao ở các nước có nền kinh tế phát triển, nhu cầu muốn có nhiều con, đặc biệt là con trai của các cặp cha mẹ lại giảm thấp?","o":["Do chế độ bảo hiểm xã hội và phúc lợi tốt nên cha mẹ không phải lo thiếu chỗ dựa khi về già.","Do chi phí dịch vụ y tế và giáo dục chính quy quá đắt đỏ.","Do tỷ lệ ô nhiễm môi trường cao làm suy giảm khả năng sinh sản của nam giới.","Do quy định luật pháp bắt buộc áp dụng các biện pháp đình sản vĩnh viễn."]},{"q":"Sự khác biệt về cấu trúc của hệ thống giáo dục giữa quốc gia có \"dân số trẻ\" và quốc gia có \"dân số già\" (với giả thiết hầu hết trẻ em đến tuổi đều đi học) là gì?","o":["Dân số trẻ có số học sinh cấp I lớn hơn cấp II; dân số già thì ngược lại.","Dân số trẻ có số học sinh cấp II lớn hơn cấp I; dân số già thì ngược lại.","Dân số trẻ chỉ tập trung giáo dục không chính quy; dân số già chỉ phát triển giáo dục chính quy.","Không có sự khác biệt nào về quy mô học sinh giữa các cấp học."],"w":"So sánh số học sinh giữa các cấp cần cả độ dài cấp học và diễn biến số sinh. Nguồn nêu mô hình giản lược; không suy ra quy luật tuyệt đối cho mọi hệ thống giáo dục."},{"q":"Trình độ học vấn của phụ nữ phải đạt đến \"ngưỡng\" tối thiểu nào thì mới bắt đầu có ảnh hưởng rõ rệt làm giảm mức sinh ở khu vực châu Á?","o":["Học hết cấp Tiểu học và tiến lên trình độ Trung học cơ sở (THCS).","Học một vài năm đầu của cấp Tiểu học.","Học hết cấp Trung học phổ thông (THPT).","Tốt nghiệp các trường Cao đẳng hoặc Đại học."],"w":"Ngưỡng học vấn và mức sinh phụ thuộc nghiên cứu, thời kỳ và quần thể. File không dẫn nghiên cứu để kiểm tra ngưỡng chung cho châu Á."},{"q":"Nghiên cứu năm 1970 tại 8 nước châu Mỹ Latinh cho thấy các bà mẹ học hết Tiểu học có con bị chết ở độ tuổi sơ sinh ít hơn bao nhiêu phần trăm so với các bà mẹ mù chữ?","o":["25%","15%","40%","50%"],"w":"Nguồn dẫn một nghiên cứu năm 1970 ở tám nước nhưng không ghi tác giả, tên nghiên cứu hoặc bảng gốc; giữ số 25% mà không tự bổ sung trích dẫn."},{"q":"Nguyên nhân chủ yếu của hơn một nửa số trường hợp trẻ em dưới 5 tuổi bị chết ở các nước có thu nhập thấp được tài liệu chỉ ra là gì?","o":["Tình trạng thiếu dinh dưỡng (ở các cấp độ) và suy dinh dưỡng nặng.","Các bệnh tai nạn giao thông và tệ nạn xã hội tràn lan.","Tình trạng thiếu thốn cán bộ y tế chuyên khoa tại các thành phố lớn.","Sự suy giảm tầng ozon và hiện tượng Trái đất nóng lên."],"w":"Tỷ lệ và vai trò suy dinh dưỡng phụ thuộc năm, định nghĩa và cách phân bổ nguyên nhân tử vong. File không ghi mốc cho nhận định hơn một nửa; không xem là ước tính hiện hành."},{"q":"Tại sao mật độ dân số quá thấp tại một số khu vực lại gây trở ngại cho công tác dự phòng và phục vụ của hệ thống y tế?","o":["Một cán bộ hay một cơ sở y tế chỉ phục vụ được một số ít dân cư nên hiệu quả không cao, kèm theo trình độ văn hóa thấp khó vận động ăn ở hợp vệ sinh.","Ô nhiễm môi trường quá cao đòi hỏi chi phí lớn để xử lý nguồn nước bẩn.","Nhu cầu dịch vụ kế hoạch hóa gia đình tăng quá nhanh làm quá tải hệ thống.","Tập trung nhiều bệnh xã hội lây lan nguy hiểm như giang mai, HIV/AIDS."],"w":"Đáp án gộp dân cư thưa với trình độ văn hóa thấp; quan hệ thứ hai không thể suy ra chỉ từ mật độ dân số. Giữ nguyên câu nguồn, không mở rộng kết luận."},{"q":"Ở Việt Nam, giai đoạn 1943–1980 đã xảy ra hiện tượng đáng lưu ý nào đối với tài nguyên rừng?","o":["Dân số tăng lên bao nhiêu lần thì diện tích rừng giảm đi bấy nhiêu lần.","Diện tích rừng tăng tỷ lệ thuận với quy mô phát triển kinh tế.","Diện tích rừng bình quân đầu người được giữ vững ở mức 0,64 ha/người.","Diện tích rừng tăng nhẹ nhờ luồng di cư từ miền núi về đồng bằng."],"w":"Nhận định biến đổi theo cùng số lần cần số liệu gốc cho cả dân số và diện tích rừng 1943–1980. File không kèm bảng kiểm chứng; giữ nguyên khóa."},{"q":"Hiện tượng \"ùn tắc lao động\" ở nông thôn đồng bằng nước ta đã dẫn đến hệ quả di dân nào được đề cập trong tài liệu?","o":["Dòng di cư từ đồng bằng lên miền núi.","Dòng di cư từ thành thị quay trở lại nông thôn.","Dòng di cư ra nước ngoài để tìm kiếm việc làm giản đơn.","Luồng di chuyển dân cư giữa các huyện nghèo ở vùng sâu vùng xa."]},{"q":"Theo định nghĩa trong tài liệu, dự báo dân số ngắn hạn được thực hiện cho giai đoạn nào?","o":["Dưới 5 năm","Từ 5 đến 10 năm","Dưới 30 năm","Từ 30 năm trở lên"],"w":"Các khoảng thời gian ở lựa chọn không loại trừ nhau: dưới 5 năm cũng thuộc dưới 30 năm. Theo yêu cầu vẫn chỉ chấm khóa A của nguồn."},{"q":"Hàm số nào sau đây biểu thị quy mô dân số hàng năm tăng hoặc giảm với một lượng không đổi?","o":["Hàm cấp số cộng","Hàm cấp số nhân","Hàm số mũ","Hàm logistics"]},{"q":"Trong các phương pháp dự báo dân số, phương pháp nào biểu diễn quá trình tăng dân số từ giới hạn dưới đến giới hạn trên?","o":["Hàm logistics","Phương pháp thành phần","Hàm cấp số nhân","Phương pháp ngoại suy tỷ lệ"]},{"q":"Quyết định nào của Hội đồng Chính phủ vào ngày 26/12/1961 đã mở đầu cho việc quản lý nhà nước đối với phát triển dân số ở Việt Nam?","o":["Quyết định 216-CP","Quyết định 34-CP","Quyết định 162-HĐBT","Quyết định 58-HĐBT"]},{"q":"Ủy ban quốc gia dân số và kế hoạch hóa gia đình (UBQGDS-KHHGĐ) được thành lập vào năm nào?","o":["1984","1961","1993","2005"]},{"q":"Chiến lược Dân số - Kế hoạch hóa gia đình (DS-KHHGĐ) đến năm 2000 của Việt Nam xác định địa bàn trọng điểm là khu vực nào?","o":["Vùng nông thôn","Vùng thành thị và các khu công nghiệp","Vùng biên giới và hải đảo","Toàn bộ các thành phố lớn trên cả nước"]},{"q":"Nghị quyết số 21-NQ/TW về công tác dân số trong tình hình mới do Ban Chấp hành Trung ương Đảng khóa XII ban hành vào ngày tháng năm nào?","o":["25/10/2017","26/12/1961","14/01/1993","22/11/2019"]},{"q":"Quyết định phê duyệt \"Chiến lược Dân số Việt Nam đến năm 2030\" có số hiệu là gì?","o":["Quyết định số 1679/QĐ-TTg","Quyết định số 216-CP","Quyết định số 162-HĐBT","Quyết định số 270-TTg"]},{"q":"Mục tiêu tổng quát của Chiến lược Dân số Việt Nam đến năm 2030 bao gồm nội dung nào sau đây?","o":["Duy trì vững chắc mức sinh thay thế; đưa tỷ số giới tính khi sinh về mức cân bằng tự nhiên","Giảm nhanh tỷ lệ sinh con thứ 3 trở lên để quy mô dân số dưới mức 82 triệu","Mỗi gia đình chỉ có một con để nhanh chóng ổn định quy mô dân số","Tập trung toàn diện vào việc áp dụng các biện pháp đình sản vĩnh viễn"]},{"q":"Theo Chiến lược Dân số Việt Nam đến năm 2030, mục tiêu cần đạt của tuổi thọ trung bình vào năm 2030 là bao nhiêu tuổi?","o":["75 tuổi","73,4 tuổi","74,5 tuổi","78 tuổi"]},{"q":"Điểm khác biệt căn bản trong việc dự báo dân số toàn quốc so với dự báo dân số cho từng vùng lãnh thổ, đơn vị hành chính nhỏ hơn trong nhiều trường hợp là gì?","o":["Yếu tố di dân (xuất cư, nhập cư)","Xu hướng biến động của tỷ suất sinh thô","Xu hướng biến động của tỷ suất tử vong thô","Việc lựa chọn các mốc thời gian để tính toán"]},{"q":"Nhược điểm lớn nhất của phương pháp dự báo dân số theo hàm số toán học là gì?","o":["Chỉ đưa ra kết quả tổng dân số và mức độ chính xác không cao nếu thời gian dự báo dài","Quá trình tính toán vô cùng phức tạp và bắt buộc phải dùng máy tính","Yêu cầu nguồn số liệu gốc cực kỳ chi tiết về cơ cấu tuổi và giới tính","Không thể áp dụng khi dân số có tốc độ tăng trưởng ổn định"]},{"q":"Định nghĩa về chính sách dân số của một quốc gia nhấn mạnh hệ thống đồng bộ các mục tiêu và giải pháp do chính phủ đề ra nhằm tác động đến các yếu tố nào của dân số?","o":["Quy mô, cơ cấu, phân bổ và tốc độ tăng trưởng dân số","Chỉ tác động duy nhất vào mức sinh và các biện pháp kế hoạch hóa gia đình","Trình độ học vấn và thu nhập bình quân đầu người của lao động nông thôn","Tuổi thọ trung bình và tỷ lệ mắc các bệnh bẩm sinh của trẻ em"]},{"q":"Ví dụ nào sau đây thể hiện một \"Chính sách dân số trực tiếp\"?","o":["Chính sách sinh một con ở Trung Quốc hoặc khuyến khích nhập cư ở một nước phát triển","Nâng cao trình độ văn hóa giáo dục cho phụ nữ vùng sâu vùng xa","Phát triển hệ thống bảo hiểm y tế toàn dân cho người cao tuổi","Đầu tư xây dựng cơ sở hạ tầng giao thông ở nông thôn để giãn dân đô thị"],"w":"Ví dụ chính sách một con là ví dụ lịch sử; câu đang hỏi loại chính sách, không khẳng định đó là chính sách Trung Quốc hiện hành."},{"q":"Chính sách dân số \"ngầm định\" (hoặc không công khai) được hiểu là trường hợp nào?","o":["Chính phủ không công bố chính thức chính sách nhưng vẫn tiến hành các biện pháp cần thiết để tác động đến biến dân số","Chính phủ không nhận thức được việc tăng dân số đang hạn chế sự phát triển","Chính sách chỉ áp dụng cho các vùng dân tộc thiểu số rất ít người","Chính sách do các tổ chức quốc tế tự ý triển khai không thông qua chính phủ"]},{"q":"Theo quan điểm cũ (Nghị quyết 04-NQTW năm 1993), giải pháp cơ bản mang tính động lực thúc đẩy phong trào quần chúng thực hiện KHHGĐ là gì?","o":["Vận động tuyên truyền và giáo dục gắn liền với các dịch vụ tiếp cho người chấp nhận gia đình ít con","Thực thi nghiêm kỷ cương pháp luật và áp dụng các hình phạt hành chính nặng","Tập trung mở rộng các kỹ thuật mới trong y học hiện đại","Đẩy mạnh xã hội hóa và chỉ dựa vào nguồn viện trợ của các tổ chức quốc tế"],"w":"Đáp án có cụm “các dịch vụ tiếp cho người chấp nhận” có dấu hiệu thiếu từ. Giữ nguyên thay vì tự đoán chữ bị thiếu."},{"q":"Điểm mới cốt lõi trong Quan điểm 2 của Nghị quyết số 21-NQ/TW (năm 2017) về trọng tâm của chính sách dân số hiện nay là gì?","o":["Chuyển trọng tâm chính sách dân số từ kế hoạch hóa gia đình sang dân số và phát triển","Chuyển trọng tâm hoàn toàn sang kiểm soát quy mô dân số ở đô thị","Chỉ tập trung vào việc giảm sinh ở những vùng có mức sinh thay thế cao","Chuyển trọng tâm sang thúc đẩy di dân từ nông thôn ra các thành phố lớn"]},{"q":"Trong quan điểm mới về đầu tư cho công tác dân số, Nghị quyết 21-NQ/TW đã thay đổi nhận thức như thế nào so với Nghị quyết 04-NQTW?","o":["Xem đầu tư cho dân số là đầu tư cho phát triển","Xem đầu tư cho dân số là đầu tư mang lại hiệu quả kinh tế trực tiếp rất cao","Xem đầu tư cho dân số là trách nhiệm riêng của các tổ chức quốc tế viện trợ","Xem đầu tư cho dân số là hoạt động không cần ưu tiên bố trí ngân sách nhà nước"],"w":"So sánh hai nghị quyết cần đối chiếu nguyên văn cả hai; câu nguồn không trích các đoạn tương ứng. Giữ đáp án tài liệu, không bổ sung diễn giải pháp lý."},{"q":"Mục tiêu cụ thể đến năm 2030 đối với \"Tỷ số giới tính khi sinh\" của Việt Nam được quy định như thế nào?","o":["Đưa về mức cân bằng tự nhiên, phấn đấu đạt dưới 109 bé trai/100 bé gái","Đạt mức 112,2 bé trai/100 bé gái","Đạt mức 111 bé trai/100 bé gái","Duy trì ở mức ổn định như năm 2016 là 115 bé trai/100 bé gái"]},{"q":"Chỉ số mục tiêu nào sau đây liên quan đến chất lượng dân số của thanh niên 18 tuổi cần đạt được vào năm 2030?","o":["Chiều cao trung bình đạt 168,5 cm đối với nam và 157,5 cm đối với nữ","Tuổi thọ trung bình đạt 75 tuổi với số năm sống khỏe mạnh lớn hơn 68 năm","Tầm soát ít nhất 4 loại bệnh trước sinh và 5 bệnh bẩm sinh ở trẻ sơ sinh","100% thanh niên được đăng ký và quản lý trong hệ thống cơ sở dữ liệu quốc gia"]},{"q":"Theo WHO, sức khỏe là:","o":["Trạng thái thoải mái toàn diện về thể chất, tinh thần và xã hội","Không có bệnh","Có thể lao động","Không có thương tật"]},{"q":"TT-GDSK nhằm:","o":["Nâng cao kiến thức, thay đổi thái độ và hành vi","Điều trị bệnh","Tăng doanh thu","Quản lý bệnh viện"]},{"q":"TT-GDSK tác động lên:","o":["Kiến thức, thái độ, thực hành","Điều trị","Chẩn đoán","Nghiên cứu"]},{"q":"Lĩnh vực không thuộc TT-GDSK:","o":["Điều trị","Kiến thức","Thái độ","Thực hành"]},{"q":"Mục tiêu cuối cùng TT-GDSK:","o":["Thay đổi hành vi có lợi","Cấp thuốc","Khám bệnh","Xét nghiệm"]},{"q":"Alma Ata khẳng định TT-GDSK là:","o":["Nội dung số một CSSKBĐ","Điều trị","Tiêm chủng","Quản lý"]},{"q":"PRECEDE-PROCEED do ai phát triển?","o":["Green và cộng sự","WHO","UNICEF","Ottawa"]},{"q":"Tuyên ngôn Ottawa năm:","o":["1986","1978","1980","1990"]},{"q":"TT-GDSK là nhiệm vụ của:","o":["Mọi cán bộ y tế","Bác sĩ","Điều dưỡng","Tuyên truyền viên"],"w":"“Mọi cán bộ y tế” bao gồm cả bác sĩ và điều dưỡng; các lựa chọn này không hoàn toàn loại trừ nếu hiểu là những người có nhiệm vụ. Nguồn chọn đáp án bao quát A."},{"q":"Truyền hình có ưu điểm:","o":["Hình ảnh và âm thanh","Chỉ âm thanh","Chỉ chữ","Không lưu trữ"]},{"q":"TT-GDSK là quá trình:","o":["Hai chiều","Một chiều","Ba chiều","Không phản hồi"]},{"q":"P thứ 5 của mô hình 5P:","o":["Quảng bá","Giá","Địa điểm","Dịch vụ"],"w":"Có nhiều biến thể mô hình 5P; file không nêu tên năm thành phần hoặc tài liệu tham chiếu để xác định thứ tự P thứ năm."},{"q":"Giai đoạn đầu PRECEDE:","o":["Chẩn đoán xã hội","Đánh giá","Can thiệp","Hành vi"]},{"q":"Niềm tin, giá trị là yếu tố:","o":["Tiền đề","Tăng cường","Có thể","Môi trường"]},{"q":"Giai đoạn 5 là:","o":["Quyết định can thiệp","Đánh giá","Dịch tễ","Xã hội"],"w":"Câu chỉ ghi “Giai đoạn 5” mà không nêu rõ mô hình hoặc phiên bản. Không tự bổ sung PRECEDE/PROCEED hay đổi tên giai đoạn để khớp khóa."},{"q":"Theo Ottawa sức khỏe là:","o":["Nguồn lực cuộc sống","Mục tiêu duy nhất","Không bệnh","Giàu có"]},{"q":"Không thuộc 5 nội dung NCSK:","o":["Điều trị chuyên khoa","Chính sách","Môi trường","Kỹ năng"]},{"q":"Mô hình Tannahill gồm:","o":["3 lĩnh vực","2","4","5"]},{"q":"Hành vi sức khỏe là nguyên nhân của:","o":["Nhiều bệnh hiện đại","Bệnh bẩm sinh","Tai nạn","Di truyền"],"w":"“Tai nạn” cũng có thể liên quan hành vi sức khỏe/nguy cơ. Câu không giới hạn phạm vi, nên các lựa chọn có thể chồng lấn; giữ khóa A."},{"q":"Tuyến đầu tiếp xúc dân:","o":["Trạm y tế xã","Bộ Y tế","BV TW","Sở Y tế"]},{"q":"Tổ chức Y tế Thế giới (WHO) ước tính hàng năm có khoảng bao nhiêu ca tử vong có liên quan đến nghề nghiệp?","o":["2 triệu ca","1 triệu ca","3 triệu ca","4 triệu ca"],"w":"Ước tính tử vong nghề nghiệp cần năm và phạm vi. WHO/ILO công bố khoảng 1,9 triệu cho năm 2016; số làm tròn 2 triệu trong file không được xem là con số cập nhật cho mọi năm."},{"q":"Theo Tổ chức Y tế Thế giới, có bao nhiêu phần trăm chứng đau thắt lưng là do nghề nghiệp?","o":["37%","27%","47%","57%"],"w":"Con số 37% không có năm hoặc báo cáo WHO kèm theo; giữ đúng số liệu của file, không xác nhận đó là ước tính hiện tại."},{"q":"Theo Luật lao động năm 2012, người lao động là người từ đủ bao nhiêu tuổi trở lên?","o":["15 tuổi","14 tuổi","16 tuổi","18 tuổi"],"w":"Câu đã giới hạn Bộ luật Lao động năm 2012: giữ nguyên bối cảnh lịch sử, không coi đây là tóm tắt toàn bộ quy định hiện hành hoặc các ngoại lệ về lao động chưa thành niên."},{"q":"Năm 1948, Tổ chức Y tế Thế giới (WHO) định nghĩa sức khỏe là trạng thái thoải mái hoàn toàn về thể chất, tâm thần và yếu tố nào dưới đây?","o":["Xã hội","Kinh tế","Môi trường","Tâm linh"]},{"q":"Độ tuổi lao động ở Việt Nam hiện nay đối với nam giới là bao nhiêu?","o":["18 - 60 tuổi","18 - 55 tuổi","15 - 60 tuổi","18 - 65 tuổi"],"w":"“Hiện nay” chưa có ngày tham chiếu, và tuổi lao động không nên đồng nhất với tuổi nghỉ hưu. Nguồn đánh dấu 18–60; giữ khóa, không dùng câu này làm hướng dẫn pháp luật hiện hành."},{"q":"Mối quan hệ giữa lao động và sức khoẻ được biểu diễn là mối quan hệ như thế nào?","o":["Hai chiều","Một chiều","Đồng biến","Nghịch biến"]},{"q":"Tính đến ngày 31/12/2016, Việt Nam đã ban hành danh mục bao nhiêu bệnh nghề nghiệp được bảo hiểm?","o":["34 bệnh","28 bệnh","30 bệnh","35 bệnh"],"w":"Câu đã giới hạn ngày 31/12/2016. Giữ số 34 bệnh theo khóa nguồn; không dùng để mô tả danh mục hiện hành."},{"q":"Theo tài liệu, hiện nay ở Việt Nam có bao nhiêu Trung tâm Y tế quận/huyện tham gia vào mạng lưới chăm sóc sức khỏe người lao động?","o":["713","650","700","750"],"w":"Nguồn dùng “hiện nay” với con số 713 nhưng không nêu năm thống kê. Số lượng và tổ chức mạng lưới có thể thay đổi; không tự cập nhật dữ liệu."},{"q":"Không gian của khu vực lao động trong đó người lao động làm việc cùng với phương tiện phục vụ lao động được gọi là gì?","o":["Môi trường lao động","Điều kiện lao động","Vị trí lao động","Phân xưởng sản xuất"]},{"q":"Theo WHO và ILO (1950), việc tuyển chọn và đảm bảo cho người lao động được làm nghề thích hợp phải dựa trên tiêu chí nào?","o":["Khả năng tâm sinh lý của họ","Nhu cầu của doanh nghiệp","Bằng cấp học vấn","Mức lương thỏa thuận"]},{"q":"Tuyên ngôn Alma Ata (1987) khẳng định mạnh mẽ điều gì về sức khỏe?","o":["Sức khỏe là một quyền cơ bản của con người","Sức khỏe là không có bệnh tật","Sức khỏe là trách nhiệm riêng của ngành y tế","Sức khỏe hoàn toàn phụ thuộc vào kinh tế xã hội"],"w":"Phần hỏi ghi Alma Ata (1987), trong khi tuyên bố Alma-Ata được thông qua năm 1978 theo WHO. Giữ nguyên năm trong câu nguồn và khóa A; chỉ ghi chú chỗ cần kiểm tra."},{"q":"Theo định nghĩa của Tổ chức Y tế Thế giới, sức khỏe nghề nghiệp là trạng thái thoải mái toàn diện về thể chất, tâm thần và xã hội của người lao động trong điều kiện nào?","o":["Điều kiện lao động và quá trình làm việc","Môi trường sống và sinh hoạt","Môi trường tự nhiên và xã hội","Gia đình và cộng đồng"]},{"q":"Vệ sinh lao động là giải pháp phòng, chống tác động của yếu tố nào đối với con người trong quá trình lao động?","o":["Yếu tố có hại","Yếu tố nguy hiểm","Yếu tố rủi ro","Yếu tố môi trường"]},{"q":"Yếu tố gây mất an toàn, làm tổn thương hoặc tử vong cho con người trong quá trình lao động được gọi là gì?","o":["Yếu tố nguy hiểm","Yếu tố có hại","Yếu "},{"q":"Nếu một tế bào bị mất chức năng của ribosome, quá trình nào bị ảnh hưởng trực tiếp nhất?","o":["Tổng hợp protein","Khuếch tán nước qua màng","Sao chép ADN בלבד","Phân giải glucose ở bào tương"],"e":"Ribosome là bộ máy trực tiếp tổng hợp protein; các quá trình khác có thể bị ảnh hưởng gián tiếp về sau.","ch":"Chương 1: Tế bào học","df":"Trung bình"},{"q":"Điểm giống nhau quan trọng giữa ti thể và lục lạp là gì?","o":["Đều có ADN và ribosome riêng","Đều có trong mọi tế bào nhân thực","Đều tổng hợp mọi protein của tế bào","Đều không có màng bao bọc"],"e":"Ti thể và lục lạp có ADN và ribosome riêng, phù hợp với giả thuyết nội cộng sinh.","ch":"Chương 1: Tế bào học","df":"Trung bình"},{"q":"Vì sao tế bào nhân thực thường có khả năng phân chia nhiều chức năng nội bào hiệu quả hơn tế bào tiền nhân?","o":["Vì có các bào quan và hệ thống màng phân ngăn chức năng","Vì không cần enzyme","Vì không chứa ADN","Vì mọi phản ứng đều diễn ra trong nhân"],"e":"Các bào quan chuyên hóa và sự phân ngăn giúp tạo môi trường phù hợp cho nhiều quá trình tế bào.","ch":"Chương 1: Tế bào học","df":"Trung bình"},{"q":"Một chất ức chế làm hỏng màng trong ti thể nhưng không tác động trực tiếp đến ribosome. Hậu quả trực tiếp có khả năng cao nhất là gì?","o":["Giảm hiệu quả tạo ATP qua chuỗi chuyền electron","Ngừng hoàn toàn phiên mã trong nhân ngay lập tức","Mất khả năng tạo peptide tại mọi ribosome ngay lập tức","Thành tế bào vi khuẩn bị phá hủy"],"e":"Chuỗi chuyền electron và quá trình tạo gradient proton diễn ra ở màng trong ti thể; tổn thương màng này làm giảm sản xuất ATP.","ch":"Chương 1: Tế bào học","df":"Khó"},{"q":"Một tế bào không có nhân màng bao bọc nhưng có ADN, ribosome và màng sinh chất. Nhận định nào chính xác nhất?","o":["Đó có thể là tế bào tiền nhân","Đó chắc chắn là virus","Đó chắc chắn là tế bào thực vật trưởng thành","Đó không phải tế bào sống vì không có nhân"],"e":"Tế bào tiền nhân có ADN, ribosome và màng sinh chất nhưng không có nhân được bao bọc bởi màng.","ch":" chất đơn giản và thường cần năng lượng","Phân giải chất phức tạp thành chất đơn giản và giải phóng năng lượng","Chỉ xảy ra ở tế bào thực vật","Không liên quan đến enzyme"],"e":"Đồng hóa tạo nên các phân tử phức tạp từ các đơn vị nhỏ hơn và thường cần năng lượng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quá trình dị hóa (catabolism) thường có vai trò gì?","o":["Phân giải phân tử và giải phóng năng lượng","Tạo ra mọi đại phân tử của tế bào","Làm ngừng mọi phản ứng hóa học","Chỉ tổng hợp protein"],"e":"Dị hóa phân giải các phân tử, giải phóng năng lượng và cung cấp nguyên liệu cho các quá trình khác.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Phân tử nào được xem là đồng tiền năng lượng trực tiếp phổ biến của tế bào?","o":["ATP","DNA","Cellulose","NADP"],"e":"ATP có thể cung cấp năng lượng cho nhiều hoạt động tế bào thông qua thủy phân nhóm phosphate cuối.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"ATP giải phóng năng lượng trực tiếp khi xảy ra phản ứng nào?","o":["ATP bị thủy phân thành ADP và phosphate vô cơ","Liên kết peptide được hình thành","DNA được nhân đôi","Glucose được tổng hợp từ CO2"],"e":"Thủy phân ATP thành ADP và phosphate vô cơ có thể được ghép cặp với các phản ứng cần năng lượng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Enzyme có bản chất chủ yếu là gì?","o":["Protein","Lipid","Carbohydrate","Acid nucleic luôn luôn"],"e":"Phần lớn enzyme là protein; một số RNA cũng có khả năng xúc tác và được gọi là ribozyme.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Vai trò cơ bản của enzyme trong phản ứng sinh hóa là gì?","o":["Làm giảm năng lượng hoạt hóa","Làm tăng năng lượng hoạt hóa","Làm thay đổi sản phẩm cuối cùng của mọi phản ứng","Làm phản ứng xảy ra mà không cần cơ chất"],"e":"Enzyme làm giảm năng lượng hoạt hóa, giúp phản ứng diễn ra nhanh hơn mà không bị tiêu hao vĩnh viễn.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Vị trí trên enzyme nơi cơ chất gắn và phản ứng diễn ra thường được gọi là gì?","o":["Trung tâm hoạt động","Màng sinh chất","Nhân tế bào","Chuỗi vận chuyển electron"],"e":"Trung tâm hoạt động có cấu trúc phù hợp để nhận biết cơ chất và xúc tác phản ứng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chất mà enzyme tác động lên được gọi là gì?","o":["Cơ chất","Sản phẩm","Chất ức chế","Đồng yếu tố"],"e":"Cơ chất là phân tử được enzyme nhận biết và chuyển hóa thành sản phẩm.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sau khi xúc tác một phản ứng, enzyme thường như thế nào?","o":["Có thể tiếp tục xúc tác phản ứng khác nếu còn điều kiện thích hợp","Bị biến thành sản phẩm","Bị tiêu hao hoàn toàn","Luôn bị biến tính"],"e":"Enzyme không bị tiêu hao theo phản ứng tổng thể nên có thể được tái sử dụng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Nhiệt độ quá cao thường ảnh hưởng đến nhiều enzyme protein như thế nào?","o":["Có thể làm biến tính và giảm hoạt tính","Luôn làm tăng hoạt tính vô hạn","Không ảnh hưởng đến cấu trúc enzyme","Biến enzyme thành lipid"],"e":"Nhiệt độ cao có thể phá vỡ các tương tác duy trì cấu trúc không gian của enzyme, làm giảm hoạt tính.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Độ pH có thể ảnh hưởng đến hoạt tính enzyme chủ yếu vì pH làm thay đổi điều gì?","o":["Trạng thái ion hóa và cấu trúc tại trung tâm hoạt động","Số lượng nhiễm sắc thể","Trình tự nucleotide của mọi gene","Số lượng tế bào trong mô"],"e":"pH ảnh hưởng đến trạng thái proton hóa của các nhóm hóa học, từ đó tác động đến cấu trúc và khả năng xúc tác.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chất nào sau đây là một ví dụ điển hình của enzyme tiêu hóa tinh bột?","o":["Amylase","Hemoglobin","Collagen","Insulin"],"e":"Amylase xúc tác sự thủy phân tinh bột thành các đường nhỏ hơn.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quá trình hô hấp tế bào hiếu khí sử dụng chất nào làm chất nhận electron cuối cùng?","o":["Oxygen","Glucose","ATP","Carbon dioxide"],"e":"Trong hô hấp hiếu khí, oxygen là chất nhận electron cuối cùng của chuỗi vận chuyển electron.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Đường phân (glycolysis) diễn ra chủ yếu ở đâu trong tế bào nhân thực?","o":["Tế bào chất","Chất nền ti thể","Nhân tế bào","Bộ máy Golgi"],"e":"Đường phân diễn ra trong bào tương, không trực tiếp cần oxygen để tiến hành.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Ở tế bào nhân thực, chu trình Krebs diễn ra chủ yếu tại đâu?","o":["Chất nền ti thể","Lưới nội chất","Khoang ngoài nhân","Màng sinh chất"],"e":"Các phản ứng của chu trình Krebs diễn ra chủ yếu trong chất nền ti thể ở tế bào nhân thực.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quang hợp ở thực vật chuyển đổi chủ yếu dạng năng lượng nào thành dạng năng lượng nào?","o":["Năng lượng ánh sáng thành năng lượng hóa học","Năng lượng hóa học thành năng lượng âm thanh","Nhiệt năng thành năng lượng cơ học","Điện năng thành năng lượng ánh sáng"],"e":"Quang hợp sử dụng năng lượng ánh sáng để tạo các hợp chất hữu cơ giàu năng lượng hóa học.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chất diệp lục có vai trò chính nào trong quang hợp?","o":["Hấp thụ năng lượng ánh sáng","Phân giải protein","Tổng hợp DNA","Vận chuyển amino acid qua màng"],"e":"Diệp lục hấp thụ ánh sáng ở những bước sóng nhất định và tham gia chuyển đổi năng lượng trong pha sáng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chất ức chế enzyme là chất có khả năng gì?","o":["Làm giảm hoạt tính enzyme bằng cách cản trở quá trình xúc tác","Luôn làm tăng lượng sản phẩm","Luôn cung cấp cơ chất","Thay thế hoàn toàn enzyme trong tế bào"],"e":"Chất ức chế làm giảm hoạt tính enzyme thông qua những cơ chế khác nhau, chẳng hạn gắn vào trung tâm hoạt động hoặc vị trí khác.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Cofactor của enzyme có thể là loại chất nào?","o":["Ion kim loại hoặc phân tử hữu cơ hỗ trợ xúc tác","Chỉ là DNA mạch kép","Chỉ là tinh bột","Chỉ là nước tinh khiết"],"e":"Một số enzyme cần cofactor như ion kim loại hoặc coenzyme hữu cơ để hoạt động hiệu quả.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Một phản ứng có enzyme xúc tác đạt tốc độ tối đa khi tăng nồng độ cơ chất. Nếu tiếp tục tăng cơ chất mà tốc độ hầu như không tăng, giải thích phù hợp nhất là gì?","o":["Các trung tâm hoạt động của enzyme gần như đã bão hòa cơ chất","Toàn bộ enzyme đã bị biến tính","Cơ chất đã chuyển thành enzyme","Phản ứng không còn tạo sản phẩm"],"e":"Khi nồng độ cơ chất đủ cao, phần lớn trung tâm hoạt động được chiếm giữ nên tốc độ tiến gần Vmax.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Trong thí nghiệm, enzyme hoạt động mạnh nhất ở 37°C nhưng hoạt tính giảm mạnh sau khi được giữ ở 80°C. Kết luận nào hợp lý nhất?","o":["Nhiệt độ cao có thể làm biến tính cấu trúc enzyme","Enzyme chỉ hoạt động khi có ánh sáng","Enzyme đã biến thành cơ chất","Mọi enzyme đều có nhiệt độ tối ưu là 37°C"],"e":"Nhiệt độ cao có thể làm biến đổi cấu trúc không gian của enzyme. Tuy nhiên, nhiệt độ tối ưu cụ thể khác nhau giữa các enzyme.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Tại sao phản ứng giải phóng năng lượng trong tế bào thường được ghép cặp với phản ứng cần năng lượng?","o":["Để năng lượng được chuyển giao và sử dụng hiệu quả cho công việc tế bào","Để mọi phản ứng đều trở thành phản ứng cân bằng ngay lập tức","Để enzyme không cần cơ chất","Để ngăn ATP được tạo ra"],"e":"Ghép cặp phản ứng giúp năng lượng từ phản ứng thuận lợi thúc đẩy phản ứng không thuận lợi về mặt năng lượng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Trong hô hấp tế bào, phần lớn ATP ở tế bào nhân thực được tạo ra nhờ quá trình nào?","o":["Phosphoryl hóa oxy hóa gắn với chuỗi vận chuyển electron","Đường phân בלבד","Lên men lactic","Khuếch tán đơn giản qua màng"],"e":"Ở tế bào nhân thực, phần lớn ATP của hô hấp hiếu khí được tạo ra nhờ gradient proton và ATP synthase tại màng trong ti thể.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Một chất ức chế cạnh tranh gắn vào trung tâm hoạt động của enzyme. Tác động nào có thể xảy ra khi tăng nồng độ cơ chất đủ cao?","o":["Có thể giảm bớt tác động ức chế do cơ chất cạnh tranh vị trí gắn","Enzyme bị phá hủy hoàn toàn","Tốc độ phản ứng luôn bằng không","Cơ chất không còn cần thiết"],"e":"Chất ức chế cạnh tranh tranh chấp vị trí gắn với cơ chất; tăng cơ chất có thể làm giảm ảnh hưởng của chất ức chế.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Một enzyme có Vmax là 120 đơn vị/phút và Km là 4 mM. Theo mô hình Michaelis–Menten, tốc độ phản ứng khi [S] = 4 mM xấp xỉ bằng bao nhiêu?","o":["60 đơn vị/phút","30 đơn vị/phút","40 đơn vị/phút","120 đơn vị/phút"],"e":"Khi [S] = Km, tốc độ v = Vmax/2 = 120/2 = 60 đơn vị/phút.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Một đột biến làm thay đổi amino acid ở trung tâm hoạt động, khiến enzyme vẫn giữ cấu trúc tổng thể nhưng gắn cơ chất kém hơn. Hệ quả trực tiếp có khả năng nhất là gì?","o":["Giảm khả năng hình thành phức hợp enzyme–cơ chất và giảm hoạt tính","Tăng ái lực với mọi cơ chất","Tất cả phản ứng tế bào dừng ngay lập tức","Enzyme trở thành carbohydrate"],"e":"Thay đổi các amino acid tại trung tâm hoạt động có thể làm giảm tính bổ sung về hình dạng hoặc tương tác hóa học với cơ chất.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Một tế bào có chuỗi vận chuyển electron ở màng trong ti thể bị ức chế mạnh. Hệ quả nào được dự đoán trực tiếp nhất đối với phosphoryl hóa oxy hóa?","o":["Sản xuất ATP qua phosphoryl hóa oxy hóa giảm mạnh do gradient proton không được duy trì","Gradient proton tăng vô hạn","ATP synthase không còn cần gradient proton","Đường phân bắt buộc dừng hoàn toàn ngay lập tức"],"e":"Chuỗi vận chuyển electron tạo gradient proton cần thiết để ATP synthase tổng hợp ATP; ức chế chuỗi làm giảm quá trình này.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Một enzyme điều hòa bị ức chế dị lập thể khi sản phẩm cuối của con đường chuyển hóa tích lũy. Ý nghĩa sinh học phù hợp nhất của cơ chế này là gì?","o":["Phản hồi âm giúp hạn chế tổng hợp dư thừa và tiết kiệm nguồn lực","Khuếch đại sản xuất sản phẩm bất kể nhu cầu","Tăng tiêu hao cơ chất","Làm enzyme xúc tác nhanh hơn trong mọi điều kiện"],"e":"Ức chế ngược bởi sản phẩm cuối là cơ chế phản hồi âm giúp điều chỉnh dòng chuyển hóa theo nhu cầu của tế bào.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Một chất làm tiêu tan gradient proton qua màng trong ti thể nhưng không trực tiếp khóa trung tâm xúc tác của ATP synthase. Dự đoán nào hợp lý nhất?","o":["Tốc độ tổng hợp ATP qua ATP synthase giảm, dù vận chuyển electron có thể vẫn tiếp tục hoặc tăng","ATP được tổng hợp nhiều hơn nhờ gradient proton lớn hơn","Chu trình Krebs chuyển ngay thành quang hợp","Enzyme không thể bị ảnh hưởng bởi gradient ion"],"e":"ATP synthase phụ thuộc vào dòng proton theo gradient điện hóa. Khi gradient bị tiêu tan, tổng hợp ATP giảm; chuỗi vận chuyển electron có thể tiếp tục nhưng kém hiệu quả về tạo ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Vị trí diễn ra quá trình đường phân trong tế bào nhân thực là gì?","o":["Tế bào chất (bào tương)","Lưới nội chất","Chất nền ti thể","Màng trong ti thể"],"e":"Đường phân diễn ra hoàn toàn trong bào tương của tế bào.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Nguyên liệu khởi đầu chính của quá trình đường phân là gì?","o":["Glucose","Pyruvate","Acetyl-CoA","Oxaloacetate"],"e":"Một phân tử Glucose (6C) là nguyên liệu khởi đầu của đường phân.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sản phẩm cuối cùng của đường phân thu được từ 1 phân tử Glucose là gì?","o":["2 Pyruvate + 2 ATP + 2 NADH","2 Acetyl-CoA + 2 CO2","1 Pyruvate + 1 ATP + 1 NADH","2 Lactate + 2 ATP"],"e":"Kết thúc đường phân tạo ra 2 pyruvate, 2 ATP (ròng) và 2 NADH.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quá trình đường phân có bắt buộc cần sự có mặt của oxy hay không?","o":["Không, xảy ra cả khi có hoặc không có O2","Có, bắt buộc","Chỉ xảy ra khi nồng độ CO2 cao","Chỉ xảy ra ở tế bào thực vật"],"e":"Đường phân là quá trình kị khí không phụ thuộc trực tiếp vào O2.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quá trình biến đổi Pyruvate thành Acetyl-CoA diễn ra tại vị trí nào trong tế bào nhân thực?","o":["Chất nền ti thể","Bào tương","Màng ngoài ti thể","Nhân tế bào"],"e":"Pyruvate được vận chuyển vào chất nền ti thể để thực hiện oxy hóa biến đổi thành Acetyl-CoA.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chu trình Krebs (chu trình citric acid) diễn ra ở đâu?","o":["Chất nền ti thể","Bào tương","Màng trong ti thể","Không gian giữa hai màng ti thể"],"e":"Các enzyme của chu trình Krebs nằm ở chất nền ti thể.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Trong hô hấp hiếu khí, chất nhận electron cuối cùng của chuỗi truyền electron là gì?","o":["O2","NAD+","FAD","Pyruvate"],"e":"O2 nhận electron và H+ để tạo thành H2O ở cuối chuỗi truyền.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Chuỗi truyền electron hô hấp ở tế bào nhân thực nằm ở đâu?","o":["Màng trong ti thể (mào ti thể)","Màng tế bào","Màng ngoài ti thể","Chất nền ti thể"],"e":"Phức hợp truyền electron phân bố trên màng trong ti thể.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Phân tử nào đóng vai trò kết hợp với nhóm acetyl (2C) để bắt đầu chu trình Krebs?","o":["Oxaloacetate","Citrate","Succinate","Malate"],"e":"Acetyl-CoA (2C) kết hợp với Oxaloacetate (4C) tạo thành Citrate (6C).","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Khi thiếu oxy, tế bào cơ bắp người sẽ thực hiện quá trình nào để giải phóng năng lượng?","o":["Lên men lactic acid","Lên men alcohol","Hô hấp hiếu khí","Chu trình Krebs"],"e":"Khi thiếu O2, cơ bắp chuyển sang lên men lactic acid tạo acid lactic gây mỏi cơ.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Trong giai đoạn đầu của đường phân, tế bào phải tiêu tốn bao nhiêu phân tử ATP?","o":["2 ATP","1 ATP","4 ATP","38 ATP"],"e":"Giai đoạn đầu tư năng lượng tốn 2 ATP để hoạt hóa phân tử Glucose.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Loại enzyme tổng hợp ATP dựa trên chênh lệch nồng độ H+ qua màng trong ti thể là gì?","o":["ATP synthase","DNA polymerase","Helicase","Pyruvate dehydrogenase"],"e":"ATP synthase sử dụng lực động proton để tổng hợp ATP từ ADP và Pi.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sản phẩm phụ dạng khí thoát ra trong quá trình hô hấp hiếu khí là gì?","o":["CO2","O2","N2","H2S"],"e":"CO2 được giải phóng từ giai đoạn oxy hóa pyruvate và chu trình Krebs.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Quá trình lên men rượu (alcohol fermentation) ở nấm men tạo ra sản phẩm gì từ Pyruvate?","o":["Ethanol và CO2","Lactic acid và ATP","Acetyl-CoA và CO2","Oxaloacetate và H2O"],"e":"Lên men alcohol chuyển pyruvate thành ethanol và CO2.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Trong 1 chu trình Krebs, mỗi phân tử Acetyl-CoA đi vào sẽ tạo ra trực tiếp bao nhiêu GTP/ATP?","o":["1 GTP/ATP","2 GTP/ATP","3 GTP/ATP","12 GTP/ATP"],"e":"Mỗi vòng chu trình Krebs biến đổi 1 Acetyl-CoA tạo ra 1 GTP (tương đương 1 ATP) bằng phosphoryl hóa mức cơ chất.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Vai trò chính của NAD+ và FAD trong hô hấp tế bào là gì?","o":["Vận chuyển electron và proton","Cung cấp năng lượng trực tiếp","Cấu tạo nên màng ti thể","Xúc tác phân hủy glucose"],"e":"NAD+ và FAD nhận e- và H+ trở thành NADH và FADH2 mang năng lượng đến chuỗi truyền electron.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Ở tế bào sinh vật nhân sơ, chuỗi truyền electron hô hấp nằm ở vị trí nào?","o":["Màng sinh chất","Ti thể","Bào tương","Nhân tế bào"],"e":"Sinh vật nhân sơ không có ti thể, chuỗi truyền electron nằm trên màng sinh chất.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Hình thức phosphoryl hóa tạo ra ATP trong quá trình Đường phân được gọi là gì?","o":["Phosphoryl hóa mức cơ chất","Phosphoryl hóa quang hợp","Phosphoryl hóa oxy hóa","Phosphoryl hóa thụ động"],"e":"Đường phân tạo ATP bằng chuyển nhóm phosphate trực tiếp từ cơ chất sang ADP (phosphoryl hóa mức cơ chất).","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sự tích tụ proton H+ trong hô hấp tế bào xảy ra ở đâu trong ti thể?","o":["Không gian giữa hai màng ti thể","Chất nền ti thể","Màng ngoài ti thể","Nhân ti thể"],"e":"Chuỗi truyền e- bơm H+ từ chất nền vào khoảng không gian giữa hai màng ti thể.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Từ 1 phân tử Glucose, qua giai đoạn oxy hóa pyruvate sẽ tạo ra bao nhiêu phân tử NADH?","o":["2 NADH","1 NADH","3 NADH","4 NADH"],"e":"1 Glucose tạo 2 Pyruvate; mỗi Pyruvate bị oxy hóa tạo 1 NADH => Tổng cộng 2 NADH.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Ước tính trung bình 1 phân tử NADH đi qua chuỗi truyền electron sẽ tạo ra khoảng bao nhiêu phân tử ATP?","o":["2.5 ATP","1.5 ATP","3.5 ATP","4.5 ATP"],"e":"Theo lý thuyết hiện đại, 1 NADH cung cấp đủ năng lượng cho bơm H+ tạo ra khoảng 2.5 ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Ước tính 1 phân tử FADH2 đi qua chuỗi truyền electron sẽ tạo ra khoảng bao nhiêu phân tử ATP?","o":["1.5 ATP","2.5 ATP","3.0 ATP","3.5 ATP"],"e":"FADH2 đi vào chuỗi truyền muộn hơn (ở Phức hợp II) nên chỉ tạo ra khoảng 1.5 ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Tính tổng số phân tử CO2 được giải phóng hoàn toàn từ 1 phân tử Glucose qua hô hấp hiếu khí là bao nhiêu?","o":["6","2","4","12"],"e":"2 CO2 ở giai đoạn oxy hóa pyruvate + 4 CO2 ở chu trình Krebs = 6 CO2.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Tại sao phân tử FADH2 lại tạo ra ít ATP hơn so với NADH trong chuỗi truyền electron?","o":["Electron từ FADH2 đi vào chuỗi truyền ở phức hợp II, bỏ qua phức hợp I","FADH2 không chứa electron","FADH2 bị tiêu hủy nhanh hơn","FADH2 chỉ có ở thực vật"],"e":"Do đi vào phức hợp II, electron của FADH2 bỏ qua bơm proton của Phức hợp I, làm giảm số H+ được bơm ra.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Hoạt động của chất hóa học DNP (Dinitrophenol) làm thủng màng trong ti thể gây rò rỉ H+ sẽ dẫn đến hậu quả gì?","o":["Tiêu tốn O2 nhưng giảm tổng hợp ATP, năng lượng thoát ra dưới dạng nhiệt","Tăng tổng hợp ATP","Ngừng sinh nhiệt","Ức chế hoàn toàn đường phân"],"e":"Mất chênh lệch nồng độ H+ làm ATP synthase không tổng hợp được ATP, năng lượng chảy qua màng bị giải phóng thành nhiệt.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Giả sử một tế bào cơ bị đột biến làm mất chức năng của phức hợp I trên chuỗi truyền electron, tế bào này vẫn có thể thu được ATP từ electron của phân tử nào sau đây?","o":["FADH2 từ chu trình Krebs","NADH từ đường phân","NADH từ chu trình Krebs","NADPH từ con đường pentose"],"e":"Phức hợp II nhận electron trực tiếp từ FADH2 mà không phụ thuộc vào Phức hợp I.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Chất Cyanide ức chế cytochrome c oxidase (Phức hợp IV). Sự có mặt của Cyanide sẽ ảnh hưởng trực tiếp thế nào đến ti thể?","o":["Ngừng sự di chuyển của electron đến O2, làm mất độ chênh lệch proton và ngừng tổng hợp ATP","Ngừng quá trình đường phân lập tức","Làm tăng tốc độ chu trình Krebs","Chỉ ức chế quá trình lên men lactic"],"e":"Phức hợp IV bị ức chế khiến chuỗi truyền e- bị tắc nghẽn, không thể chuyển e- cho O2, làm dừng bơm proton và dừng tổng hợp ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Trong điều kiện hiếu khí, nếu cơ chế thoi shuttles (vận chuyển NADH từ đường phân vào ti thể) gặp sự cố làm 2 NADH đường phân không vào được ti thể, tổng năng lượng ATP thu được tối đa từ 1 Glucose giảm đi bao nhiêu?","o":["Giảm khoảng 3 - 5 ATP","Giảm 6 - 8 ATP","Giảm 10 - 12 ATP","Không giảm"],"e":"2 NADH trong bào tương nếu không truyền được electron vào ti thể sẽ làm mất đi năng lượng tương đương 3 - 5 ATP (2 x 1.5 hoặc 2 x 2.5 ATP).","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Enzyme Phosphofructokinase-1 (PFK-1) là enzyme điều hòa then chốt của đường phân. Sự thay đổi nồng độ nào sau đây sẽ KÍCH THÍCH mạnh mẽ hoạt tính của PFK-1?","o":["Nồng độ AMP/ADP cao","Nồng độ ATP cao","Nồng độ Citrate cao","Nồng độ NADH cao"],"e":"Tỷ lệ AMP/ADP cao báo hiệu tế bào đang thiếu năng lượng, kích thích PFK-1 để tăng tốc đường phân.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Một phân tử acid béo palmitic (16 carbon) qua quá trình beta-oxidation tạo ra 8 Acetyl-CoA, 7 NADH và 7 FADH2. Khi oxy hóa hoàn toàn, lượng ATP thu được so với 1 phân tử Glucose (6 carbon) như thế nào?","o":["Cao hơn gấp nhiều lần (khoảng >100 ATP)","Thấp hơn nhiều","Tương đương nhau","Chỉ bằng một nửa"],"e":"Phân tử lipid chứa mức giảm carbon cao hơn nhiều so với carbohydrate, 1 phân tử Palmitate tạo ra khoảng 106 ATP (so với ~30-32 ATP của Glucose).","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Bào quan thực hiện chức năng quang hợp chủ yếu ở tế bào thực vật là gì?","o":["Lục lạp","Ti thể","Bộ máy Golgi","Lưới nội chất"],"e":"Lục lạp chứa diệp lục và hệ thống enzyme thực hiện quá trình quang hợp.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sắc tố trực tiếp tham gia chuyển hóa năng lượng ánh sáng thành năng lượng hóa học trong ATP và NADPH là gì?","o":["Diệp lục a ở trung tâm phản ứng","Diệp lục b","Carotenoid","Xanthophyll"],"e":"Diệp lục a ở trung tâm phản ứng trực tiếp tham gia biến đổi năng lượng ánh sáng thành năng lượng hóa học.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Pha sáng của quá trình quang hợp diễn ra tại vị trí nào trong lục lạp?","o":["Màng thylakoid","Chất nền stroma","Màng ngoài lục lạp","Màng trong lục lạp"],"e":"Pha sáng diễn ra trên màng thylakoid, nơi có chứa hệ quang hóa và chuỗi truyền electron.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Pha tối (chu trình Calvin) của quá trình quang hợp diễn ra ở đâu trong lục lạp?","o":["Chất nền stroma","Màng thylakoid","Xoang thylakoid","Màng ngoài lục lạp"],"e":"Pha tối chứa các enzyme cố định CO2 nằm trong chất nền stroma của lục lạp.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Khí O2 giải phóng trong quá trình quang hợp có nguồn gốc từ phân tử nào?","o":["H2O","CO2","RuBP","Glucose"],"e":"O2 được giải phóng từ quá trình quang phân phân tử H2O ở pha sáng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sản phẩm chính được tạo ra ở pha sáng dùng cho pha tối bao gồm những gì?","o":["ATP và NADPH","ATP và O2","NADPH và CO2","Glucose và O2"],"e":"Pha sáng tổng hợp ATP và NADPH để cung cấp năng lượng và khử CO2 ở pha tối.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Hợp chất nhận CO2 đầu tiên trong chu trình Calvin (thực vật C3) là phân tử nào?","o":["Ribulose-1,5-bisphosphate / RuBP (5C)","Oxaloacetate (4C)","G3P (3C)","Pyruvate (3C)"],"e":"RuBP (5C) kết hợp với CO2 nhờ enzyme RuBisCO trong bước đầu tiên của chu trình Calvin.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Enzyme chính xúc tác cho phản ứng cố định CO2 trong chu trình Calvin là gì?","o":["RuBisCO","PEP carboxylase","ATP synthase","DNA polymerase"],"e":"RuBisCO xúc tác phản ứng giữa RuBP và CO2.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sản phẩm carbohydrate trực tiếp xuất ra từ chu trình Calvin để tổng hợp Glucose là gì?","o":["G3P (Glyceraldehyde-3-phosphate)","3-PGA","Pyruvate","Sucrose"],"e":"G3P (3C) là sản phẩm trực tiếp của pha tối, 2 phân tử G3P kết hợp tạo thành 1 Glucose.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Ánh sáng có bước sóng thuộc vùng nào hiệu quả nhất đối với quá trình quang hợp của thực vật?","o":["Đỏ và xanh tím","Xanh lục và vàng","Hồng ngoại và tử ngoại","Cam và vàng"],"e":"Diệp lục hấp thụ mạnh nhất ánh sáng ở dải xanh tím và dải đỏ.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Các nhóm thực vật C4 thường sống ở khu vực điều kiện khí hậu như thế nào?","o":["Khí hậu nhiệt đới và cận nhiệt đới, cường độ ánh sáng và nhiệt độ cao","Khí hậu ôn đới, mát mẻ","Vùng băng giá quanh năm","Dưới đáy biển sâu"],"e":"Thực vật C4 (như mía, ngô) thích nghi với môi trường nắng nóng, ánh sáng mạnh.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Thực vật CAM (như xương rồng, dứa) cố định CO2 vào thời gian nào trong ngày?","o":["Cố định CO2 ban đêm","Cố định CO2 buổi trưa","Chỉ cố định CO2 khi có ánh sáng chiếu trực tiếp","Cố định CO2 liên tục không dừng"],"e":"Thực vật CAM mở khí khổng ban đêm để hấp thụ và cố định CO2 nhằm tránh mất nước.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sự tích tụ proton H+ phục vụ tổng hợp ATP trong pha sáng xảy ra ở đâu?","o":["Xoang thylakoid (lumen)","Chất nền stroma","Không gian giữa màng ngoài và màng trong","Bào tương tế bào"],"e":"H+ được bơm và giải phóng vào xoang thylakoid tạo chênh lệch nồng độ H+ so với stroma.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Trung tâm phản ứng của Hệ quang hóa I (PSI) hấp thụ ánh sáng cực đại ở bước sóng nào?","o":["700 nm (P700)","680 nm (P680)","550 nm (P550)","400 nm (P400)"],"e":"Hệ quang hóa I (PSI) chứa diệp lục a trung tâm P700.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Trung tâm phản ứng của Hệ quang hóa II (PSII) hấp thụ ánh sáng cực đại ở bước sóng nào?","o":["680 nm (P680)","700 nm (P700)","450 nm (P450)","500 nm (P500)"],"e":"Hệ quang hóa II (PSII) chứa diệp lục a trung tâm P680.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Hô hấp sáng (photorespiration) xảy ra phổ biến nhất ở nhóm thực vật nào?","o":["Thực vật C3","Thực vật C4","Thực vật CAM","Tảo lam"],"e":"Thực vật C3 dễ bị hô hấp sáng khi nồng độ O2 cao và CO2 thấp do thuộc tính oxygenase của RuBisCO.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sắc tố phụ Carotenoid có vai trò chính nào trong quang hợp?","o":["Hấp thụ và truyền năng lượng ánh sáng cho diệp lục, bảo vệ diệp lục khỏi bị dư thừa ánh sáng","Trực tiếp giải phóng O2 từ H2O","Cố định CO2 vào chu trình Calvin","Tổng hợp trực tiếp ATP"],"e":"Carotenoid đóng vai trò bảo vệ hệ thống quang hợp và hỗ trợ hấp thụ ánh sáng ở dải sóng diệp lục không hấp thụ.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Phương trình tổng quát đơn giản nhất của quá trình quang hợp tạo 1 phân tử Glucose là gì?","o":["6 CO2 + 6 H2O -> C6H12O6 + 6 O2","6 CO2 + 12 H2O -> C6H12O6 + 6 O2 + 6 H2O","C6H12O6 + 6 O2 -> 6 CO2 + 6 H2O","6 CO2 + 6 O2 -> C6H12O6 + 6 H2O"],"e":"Phương trình cơ bản nhất thể hiện tỉ lệ phản ứng quang hợp sản xuất 1 Glucose.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Sản phẩm cố định CO2 đầu tiên xuất hiện ở thực vật C4 là hợp chất mấy carbon?","o":["4 carbon (Oxaloacetate / OAA)","3 carbon (3-PGA)","5 carbon (RuBP)","6 carbon (Glucose)"],"e":"Thực vật C4 tạo ra hợp chất OAA (4C) đầu tiên sau khi cố định CO2.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Dạng năng lượng nào được tích lũy trong các phân tử đường thu được sau quang hợp?","o":["Hóa năng","Nhiệt năng","Cơ năng","Quang năng"],"e":"Quang hợp chuyển hóa quang năng thành hóa năng lưu trữ trong liên kết hóa học của Glucose.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Dễ"},{"q":"Để tổng hợp được 1 phân tử Glucose (C6H12O6), chu trình Calvin phải cố định bao nhiêu phân tử CO2 và tiêu tốn bao nhiêu ATP, NADPH?","o":["6 CO2, 18 ATP, 12 NADPH","6 CO2, 12 ATP, 12 NADPH","3 CO2, 9 ATP, 6 NADPH","6 CO2, 24 ATP, 18 NADPH"],"e":"Để tạo 1 Glucose cần 2 G3P. Mạch phản ứng cần cố định 6 CO2, tiêu tốn 18 ATP và 12 NADPH.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Giải phẫu lá của thực vật C4 có điểm đặc trưng gì nổi bật so với thực vật C3?","o":["Có lớp tế bào bao bao mạch phát triển chứa lục lạp lớn xung quanh gân lá","Chỉ có tế bào mô màng giậu","Không có khí khổng ở mặt dưới lá","Không chứa tế bào mô khuyết"],"e":"Thực vật C4 có cấu trúc giải phẫu Kranz (tế bào bao bao mạch chứa lục lạp đảm nhận chu trình Calvin).","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Điểm khác biệt chính giữa dòng electron không vòng và dòng electron vòng trong pha sáng là gì?","o":["Dòng electron không vòng cần cả PSII và PSI, tạo ra ATP, NADPH và O2","Dòng electron vòng tạo ra cả ATP và NADPH","Dòng electron vòng giải phóng lượng O2 lớn hơn","Dòng electron không vòng không cần sự tham gia của H2O"],"e":"Dòng e- không vòng trải qua cả PSII và PSI tạo ATP, NADPH và O2; dòng e- vòng chỉ qua PSI tạo duy nhất ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Enzyme PEP carboxylase ở thực vật C4 và CAM có ưu điểm gì vượt trội so với enzyme RuBisCO?","o":["Không có hoạt tính oxygenase và có lực gắn kết (ái lực) rất cao với CO2","Có thể tổng hợp ATP trực tiếp","Hoạt động không cần nước","Xúc tác được cả phản ứng phân hủy Glucose"],"e":"PEP carboxylase chỉ cố định CO2, không liên kết với O2 nên không gây ra hiện tượng hô hấp sáng.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Trong hô hấp sáng, ba bào quan nào tham gia phối hợp thực hiện biến đổi hóa học?","o":["Lục lạp, Ti thể, Peroxisome","Lục lạp, Không bào, Bộ máy Golgi","Ti thể, Nhai bào, Lưới nội chất","Lục lạp, Nhân, Ti thể"],"e":"Hô hấp sáng đòi hỏi sự hợp tác liên hoàn của 3 bào quan: Lục lạp -> Peroxisome -> Ti thể.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Trung bình"},{"q":"Sự phân không gian cố định CO2 ở thực vật C4 diễn ra cụ thể giữa hai loại tế bào nào?","o":["Cố định ban đầu ở tế bào mô màng giậu, chu trình Calvin ở tế bào bao bao mạch","Cố định ban đầu ở tế bào bao bao mạch, chu trình Calvin ở tế bào mô màng giậu","Cố định ban đầu ở biểu bì, chu trình Calvin ở khí khổng","Cố định ban đầu ở rễ, chu trình Calvin ở lá"],"e":"Ở thực vật C4, CO2 được gắn vào PEP tại tế bào mô giậu tạo malate/OAA, sau đó chuyển sang tế bào bao bao mạch giải phóng CO2 cho RuBisCO.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Nếu chiếu ánh sáng có bước sóng đơn sắc 700 nm vào hệ thống quang hợp thực vật, điều gì sẽ xảy ra đối với các sản phẩm của pha sáng?","o":["Chỉ tạo ra ATP (dòng e- vòng), không giải phóng O2 và không tạo NADPH","Tạo ra cả ATP, NADPH và O2 bình thường","Chỉ tạo ra NADPH và O2","Ngừng toàn bộ hoạt động tổng hợp ATP"],"e":"Ánh sáng 700nm chỉ kích thích được PSI (P700), không kích thích được PSII (P680) nên không có quang phân nước (không O2) và diễn ra truyền e- vòng tạo ATP.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Thực vật CAM tránh mất nước trong môi trường hoang mạc khô hạn bằng cách tách biệt hai quá trình cố định CO2 theo cơ chế nào?","o":["Tách biệt về vị trí bào quan trong cùng tế bào","Tách biệt về mặt không gian (Hai loại tế bào khác nhau)","Không cần cố định CO2 mà dùng trực tiếp carbon hữu cơ từ đất"],"e":"Thực vật CAM sử dụng sự phân chia thời gian: mở khí khổng ban đêm tích trữ malate trong không bào, ban ngày đóng khí khổng và giải phóng CO2 cho chu trình Calvin.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Chất hóa học DCMU (Diuron) diệt cỏ bằng cách ngăn cản dòng truyền electron giữa PSII và Plastoquinone. Tác động trực tiếp nhất của DCMU lên quang hợp là gì?","o":["Ngừng dòng electron không vòng, dừng tạo NADPH và O2","Ức chế trực tiếp enzyme RuBisCO ở pha tối","Làm thủng màng thylakoid gây rò rỉ H+","Tăng cường dòng electron vòng ở PSI"],"e":"DCMU chặn chuỗi truyền electron ở ngay sau PSII làm dừng sự giải phóng O2 và không thể truyền e- tạo NADPH.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Tại sao năng suất sinh học của thực vật C4 thường cao hơn nhiều so với thực vật C3 trong điều kiện nhiệt độ cao và ánh sáng mạnh?","o":["Vì thực vật C4 không có hiện tượng hô hấp sáng lãng phí năng lượng nhờ cơ chế bơm tập trung CO2 quanh RuBisCO","Vì thực vật C4 sử dụng ít năng lượng ATP hơn ở pha tối","Vì thực vật C4 hấp thụ được cả ánh sáng hồng ngoại","Vì lục lạp của thực vật C4 chứa lượng diệp lục gấp 10 lần thực vật C3"],"e":"Thực vật C4 loại bỏ được hô hấp sáng nhờ nồng độ CO2 tại tế bào bao bao mạch luôn cao, giúp tối ưu hóa hiệu suất quang hợp.","ch":"Chương 2: Trao đổi chất, năng lượng và enzyme","df":"Khó"},{"q":"Quá trình nguyên phân xảy ra chủ yếu ở loại tế bào nào trong cơ thể sinh vật đa bào?","o":["Tế bào sinh dưỡng (soma) và tế bào sinh dục sơ khai","Tế bào sinh dục chín","Giao tử đực","Giao tử cái"],"e":"Nguyên phân diễn ra ở tế bào sinh dưỡng và tế bào sinh dục sơ khai để giúp cơ thể lớn lên và tái tạo mô.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự nhân đôi của DNA và nhiễm sắc thể (NST) diễn ra ở pha nào của kỳ trung gian?","o":["Pha S","Pha G1","Pha G2","Kỳ đầu"],"e":"Pha S (Synthesis) là pha tổng hợp DNA và nhân đôi nhiễm sắc thể.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Một tế bào lưỡng bội (2n) sau 1 lần nguyên phân bình thường sẽ tạo ra bao nhiêu tế bào con?","o":["2 tế bào con (2n)","1 tế bào con (2n)","4 tế bào con (n)","2 tế bào con (n)"],"e":"Nguyên phân từ 1 tế bào mẹ 2n tạo ra 2 tế bào con có bộ NST 2n giống hệt nhau và giống tế bào mẹ.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Các nhiễm sắc thể co xoắn cực đại và có hình thái đặc trưng rõ nhất ở kỳ nào của nguyên phân?","o":["Kỳ giữa","Kỳ đầu","Kỳ sau","Kỳ cuối"],"e":"Tại kỳ giữa, NST co xoắn cực đại, giúp quan sát hình thái NST rõ nhất dưới kính hiển vi.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ở kỳ giữa của nguyên phân, các nhiễm sắc thể tập trung thành mấy hàng trên mặt phẳng phân chia của thoi phân bào?","o":["1 hàng","2 hàng","3 hàng","Tập trung hỗn loạn không thành hàng"],"e":"Trong nguyên phân, các NST kép xếp thành 1 hàng trên mặt phẳng xích đạo ở kỳ giữa.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự tách các chromatid chị em trong NST kép thành hai NST đơn diễn ra ở kỳ nào?","o":["Kỳ sau","Kỳ đầu","Kỳ giữa","Kỳ cuối"],"e":"Ở kỳ sau, tâm động phân chia, tách 2 chromatid chị em thành 2 NST đơn phân ly về 2 cực.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Thoi phân bào (thoi vô sắc) bắt đầu được hình thành ở kỳ nào của nguyên phân?","o":["Kỳ đầu","Kỳ giữa","Kỳ sau","Kỳ cuối"],"e":"Thoi phân bào được hình thành từ hai trung thể ở kỳ đầu để chuẩn bị đính vào tâm động NST.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Màng nhân và nhân con biến mất ở kỳ nào và xuất hiện lại ở kỳ nào trong nguyên phân?","o":["Biến mất ở kỳ đầu, xuất hiện lại ở kỳ cuối","Biến mất ở kỳ giữa, xuất hiện lại ở kỳ sau","Biến mất ở kỳ sau, xuất hiện lại ở kỳ cuối","Biến mất ở pha S, xuất hiện lại ở kỳ giữa"],"e":"Màng nhân và nhân con tiêu biến ở kỳ đầu và tái xuất hiện ở kỳ cuối.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự phân chia tế bào chất ở tế bào thực vật khác tế bào động vật ở điểm nào?","o":["Hình thành vách ngăn tế bào ở trung tâm đi ra","Thắt màng sinh chất từ ngoài vào trong","Không phân chia tế bào chất","Phân chia tế bào chất trước khi phân chia nhân"],"e":"Do có thành cellulose cứng, tế bào thực vật phân chia tế bào chất bằng cách hình thành vách ngăn ở giữa.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Sự thắt màng tế bào từ ngoài vào trong để phân chia tế bào chất là đặc điểm của loại tế bào nào?","o":["Tế bào động vật","Tế bào thực vật","Tế bào vi khuẩn","Tế bào nấm"],"e":"Tế bào động vật không có thành cellulose nên phân chia bằng cách thắt màng tế bào ở mặt phẳng xích đạo.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Một tế bào người (2n = 46) đang ở kỳ giữa của nguyên phân sẽ có bao nhiêu nhiễm sắc thể kép?","o":["46 NST kép","23 NST kép","92 NST kép","46 NST đơn"],"e":"Ở kỳ giữa, tế bào có 2n NST kép, đối với người là 46 NST kép.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Một tế bào người (2n = 46) ở kỳ sau của nguyên phân sẽ chứa bao nhiêu nhiễm sắc thể đơn?","o":["92 NST đơn","46 NST đơn","23 NST đơn","92 NST kép"],"e":"Ở kỳ sau, 46 NST kép tách thành 92 NST đơn phân ly về 2 cực tế bào.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Cấu trúc nào đính nhiễm sắc thể vào thoi phân bào trong quá trình nguyên phân?","o":["Tâm động (kinetochore)","Màng nhân","Nhân con","Đoạn đầu mút (telomere)"],"e":"Các vi ống của thoi phân bào đính vào phức hợp protein kinetochore tại tâm động của NST.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Pha G1 của kỳ trung gian chủ yếu diễn ra hoạt động nào sau đây?","o":["Gia tăng tế bào chất, tổng hợp RNA và protein","Nhân đôi DNA","Tách các chromatid chị em","Hình thành thoi vô sắc"],"e":"Pha G1 là khoảng thời gian tế bào sinh trưởng, tích lũy chất, tổng hợp RNA và protein.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Pha G2 của kỳ trung gian có nhiệm vụ chính nào?","o":["Nhân đôi trung thể và tổng hợp các chất chuẩn bị cho phân bào","Phân chia tế bào chất","Nhân đôi toàn bộ nhiễm sắc thể","Phân ly các nhiễm sắc thể đơn"],"e":"Pha G2 hoàn tất việc tổng hợp protein (như tubulin) và chuẩn bị năng lượng cho sự phân bào.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Số lượng chromatid trong một tế bào có bộ NST 2n = 8 ở kỳ giữa nguyên phân là bao nhiêu?","o":["16 chromatid","8 chromatid","32 chromatid","4 chromatid"],"e":"Ở kỳ giữa có 8 NST kép, mỗi NST kép gồm 2 chromatid => 8 x 2 = 16 chromatid.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Ý nghĩa sinh học quan trọng nhất của nguyên phân là gì?","o":["Duy trì ổn định bộ NST đặc trưng của loài qua các thế hệ tế bào","Tạo ra sự đa dạng di truyền ở thế hệ sau","Giảm một nửa số lượng NST trong giao tử","Tạo ra các tế bào con mang bộ NST đơn bội (n)"],"e":"Nguyên phân truyền đạt nguyên vẹn bộ NST 2n của tế bào mẹ cho các tế bào con.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Chu kỳ tế bào bao gồm hai giai đoạn chính nào?","o":["Kỳ trung gian và quá trình nguyên phân (pha M)","Pha G1 và pha G2","Kỳ đầu và kỳ cuối","Phân chia nhân và phân chia tế bào chất"],"e":"Chu kỳ tế bào gồm Kỳ trung gian (chiếm đa số thời gian) và Pha M (phân chia tế bào).","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Thành phần protein chính cấu tạo nên các vi ống của thoi phân bào là gì?","o":["Tubulin","Actin","Myosin","Histone"],"e":"Thoi phân bào được cấu tạo từ các vi ống cấu thành bởi dimer protein Tubulin.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Nếu một tế bào 2n = 14 tiến hành nguyên phân liên tiếp 3 lần thì tổng số tế bào con thu được là bao nhiêu?","o":["8","6","14","16"],"e":"Số tế bào con tạo thành sau k lần nguyên phân là 2^k = 2^3 = 8 tế bào.","ch":"Chương 3: Phân bào và sinh sản","df":"Dễ"},{"q":"Có 5 tế bào sinh dưỡng của cùng một loài (2n = 20) cùng nguyên phân 4 lần. Tính tổng số nhiễm sắc thể có trong tất cả các tế bào con thu được.","o":["1600 NST","800 NST","3200 NST","400 NST"],"e":"Số tế bào con = 5 * 2^4 = 80 tế bào. Tổng số NST = 80 * 20 = 1600 NST đơn.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Phức hợp checkpoint nào kiểm tra sự đính kết chính xác của các nhiễm sắc thể vào thoi phân bào trước khi tế bào bước vào kỳ sau?","o":["Điểm kiểm soát thoi phân bào (M checkpoint / SAC)","Điểm kiểm soát G1/S","Điểm kiểm soát G2/M","Điểm kiểm soát pha S"],"e":"Spindle Assembly Checkpoint (SAC) đảm bảo mọi tâm động đều đính vào vi ống trước khi kích hoạt phân tách chromatid.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Hoạt tính của kinase phụ thuộc cyclin (CDK) điều hòa chu kỳ tế bào phụ thuộc trực tiếp vào yếu tố nào?","o":["Sự liên kết với phân tử Cyclin tương ứng và trạng thái phosphorylated","Nồng độ Glucose trong bào tương","Số lượng ribosome trong tế bào","Cường độ hô hấp tế bào"],"e":"CDK hoạt động khi liên kết với Cyclin biến đổi theo chu kỳ và được biến đổi phosphoryl hóa thích hợp.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Loại vạch/vòng cấu tạo từ vi sợi actin và myosin tham gia vào sự phân chia tế bào chất ở tế bào động vật gọi là gì?","o":["Vòng thắt (Contractile ring)","Vách tế bào sơ cấp","Phiến tế bào (Cell plate)","Khung xương vi ống"],"e":"Vòng co rút (contractile ring) gồm vi sợi actin và myosin II thắt màng sinh chất chia đôi tế bào động vật.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Khi xử lý tế bào đang phân bào bằng hóa chất Colchicine, quá trình nguyên phân sẽ bị dừng lại ở kỳ nào?","o":["Kỳ giữa","Kỳ đầu","Kỳ sau","Kỳ cuối"],"e":"Colchicine ức chế sự trùng hợp tubulin làm thoi vô sắc không hình thành, làm tế bào bị dừng ở kỳ giữa.","ch":"Chương 3: Phân bào và sinh sản","df":"Trung bình"},{"q":"Protein Cohesin giữ vai trò liên kết hai chromatid chị em. Enzyme nào trực tiếp phân hủy Cohesin để cho phép các chromatid phân ly ở kỳ sau?","o":["Separase","Securin","APC/C (Anaphase-Promoting Complex)","Helicase"],"e":"Separase là protease trực tiếp cắt đứt protein Cohesin; trước đó APC/C đã phân hủy Securin để kích hoạt Separase.","ch":"C
