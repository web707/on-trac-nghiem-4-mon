 codon) trên mARN quy định điểm bắt đầu dịch mã có trình tự nucleotide nào?","o":["5'- AUG -3'","5'- UAA -3'","5'- UAG -3'","5'- UGA -3'"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Codon 5'-AUG-3' trên mARN là mã mở đầu, mã hóa cho axit amin Methionine (ở nhân thực) hoặc Formyl-methionine (ở nhân sơ)."},{"q":"Ba bộ ba kết thúc (Stop codons) trên mARN làm nhiệm vụ báo hiệu dừng quá trình dịch mã là những bộ ba nào?","o":["5'- UAA -3', 5'- UAG -3', 5'- UGA -3'","5'- AUG -3', 5'- UAA -3', 5'- UAG -3'","5'- UAA -3', 5'- UAC -3', 5'- UGA -3'","5'- UAG -3', 5'- UGA -3', 5'- UGG -3'"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"3 codon kết thúc gồm UAA (Ochre), UAG (Amber) và UGA (Opal) không mã hóa cho axit amin nào."},{"q":"Bào quan trực tiếp thực hiện quá trình dịch mã tổng hợp protein trong tế bào là gì?","o":["Ribosome","Bộ máy Golgi","Ti thể","Peroxisome"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Ribosome (gồm tiểu đơn vị lớn và tiểu đơn vị nhỏ) là nhà máy tổng hợp protein của tế bào."},{"q":"Tính thoái hóa (tính dư thừa) của mã di truyền có nghĩa là gì?","o":["Nhiều bộ ba khác nhau cùng mã hóa cho một loại axit amin","Một bộ ba mã hóa cho nhiều loại axit amin","Tất cả các loài đều dùng chung một bộ mã di truyền","Mã di truyền bị mất dần qua các thế hệ"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Tính thoái hóa: Do có 61 codon mã hóa cho 20 loại axit amin nên đa số axit amin được mã hóa bởi nhiều hơn 1 codon."},{"q":"Tính đặc hiệu của mã di truyền có nghĩa là gì?","o":["Một bộ ba nhất định chỉ mã hóa cho duy nhất một loại axit amin","Một axit amin do nhiều bộ ba mã hóa","Mã di truyền có thể đọc gối lên nhau","Mã di truyền thay đổi tùy theo loài sinh vật"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Tính đặc hiệu khẳng định mỗi codon chỉ tương ứng với 1 loại axit amin duy nhất."},{"q":"Tính phổ biến của mã di truyền có nghĩa là gì?","o":["Hầu hết tất cả các loài sinh vật trên Trái Đất đều dùng chung một bộ mã di truyền","Mã di truyền có ở khắp mọi nơi trong không khí","Mỗi sinh vật có một bộ mã di truyền riêng","Mã di truyền chỉ có ở tế bào nhân thực"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Tính phổ biến chứng minh tính thống nhất của sinh giới: từ vi khuẩn đến con người đều dùng chung bảng mã di truyền."},{"q":"Trong giai đoạn hoạt hóa axit amin của dịch mã, năng lượng cung cấp cho quá trình này được lấy từ phân tử nào?","o":["ATP","GTP","CTP","TTP"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Axit amin được hoạt hóa nhờ tiêu tốn ATP tạo thành Aminoacyl-AMP trước khi gắn vào tARN."},{"q":"Giai đoạn tổng hợp chuỗi polypeptide trên mARN diễn ra theo chiều nào của phân tử mARN?","o":["Chiều 5' -> 3'","Chiều 3' -> 5'","Từ hai đầu vào giữa","Chiều ngẫu nhiên"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Ribosome dịch chuyển dọc theo phân tử mARN theo chiều 5' -> 3' từng bộ ba một."},{"q":"Axit amin đầu tiên được đưa vào chuỗi polypeptide ở tế bào sinh vật nhân thực (Eukaryote) là gì?","o":["Methionine (Met)","Formyl-methionine (fMet)","Valine","Alanine"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Ở sinh vật nhân thực, axit amin mở đầu là Methionine (ở nhân sơ là Formyl-methionine)."},{"q":"Sau khi chuỗi polypeptide hoàn thành, axit amin mở đầu (Methionine / Formyl-methionine) sẽ xử lý thế nào?","o":["Bị enzyme cắt bỏ khỏi chuỗi polypeptide để trở thành protein có chức năng sinh học","Được giữ lại vĩnh viễn ở đầu chuỗi","Biến đổi thành axit amin khác","Chuyển xuống cuối chuỗi"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Sau dịch mã, enzyme peptidase cắt bỏ axit amin mở đầu để tạo chuỗi hoàn chỉnh gấp cuộn thành protein chức năng."},{"q":"Đặc điểm nào sau đây KHÔNG phải là chức năng sinh học của protein trong tế bào?","o":["Lưu trữ và bảo tồn thông tin di truyền qua các thế hệ","Xúc tác các phản ứng sinh hóa (Enzyme)","Cấu tạo nên màng tế bào và khung xương tế bào","Vận chuyển các chất và bảo vệ cơ thể (Kháng thể)"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Lưu trữ thông tin di truyền là chức năng của axit nucleic (ADN/ARN), không phải của protein."},{"q":"Sự hình thành liên kết peptide giữa hai axit amin kề nhau trên ribosome do thành phần nào xúc tác?","o":["Trung tâm Peptidyl transferase của rARN trong tiểu đơn vị lớn ribosome","Enzyme DNA polymerase","Enzyme RNA polymerase","Enzyme Helicase"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Peptidyl transferase là một ribozyme (rARN 23S ở nhân sơ, 28S ở nhân thực) xúc tác nối các axit amin."},{"q":"Một phân tử mARN trưởng thành có tổng số 900 nucleotide (kể cả mã mở đầu và mã kết thúc). Số axit amin trong chuỗi polypeptide hoàn chỉnh được tạo ra từ mARN này là bao nhiêu?","o":["298 axit amin","300 axit amin","299 axit amin","150 axit amin"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Số codon = 900 / 3 = 300. Chuỗi polypeptide sơ cấp = 300 - 1 (mã kết thúc) = 299 axit amin. Chuỗi hoàn chỉnh cắt bỏ Met mở đầu = 299 - 1 = 298 axit amin."},{"q":"Ba vị trí liên kết với tARN trên tiểu đơn vị lớn của ribosome theo đúng thứ tự từ cổng vào đến cổng ra gồm những vị trí nào?","o":["Vị trí A (Aminoacyl), vị trí P (Peptidyl), vị trí E (Exit)","Vị trí E, vị trí P, vị trí A","Vị trí P, vị trí A, vị trí E","Vị trí A, vị trí E, vị trí P"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Trình tự di chuyển của tARN qua ribosome: Vị trí A (nhận tARN mang aa mới) -> Vị trí P (giữ chuỗi peptit) -> Vị trí E (giải phóng tARN không còn aa)."},{"q":"Trình tự Shine-Dalgarno (SD sequence) trên mARN ở tế bào vi khuẩn nhân sơ mang vai trò quan trọng nào?","o":["Giúp tiểu đơn vị nhỏ ribosome (chứa rARN 16S) nhận biết và định vị đúng mã mở đầu AUG để bắt đầu dịch mã","Kết thúc quá trình phiên mã","Gắn đuôi Poly-A","Gắn axit amin vào tARN"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Trình tự giàu purine Shine-Dalgarno ở phía trước AUG bắt cặp bổ sung với đầu 3' của rARN 16S để định vị vị trí mở đầu."},{"q":"Hiện tượng biến đổi sau dịch mã (Post-translational modification - PTM) của protein bao gồm các phản ứng nào?","o":["Gắn thêm nhóm chức (Phosphoryl hóa, Glycosyl hóa), cắt tỉa chuỗi peptit hoặc tạo cầu nối Disulfide","Cắt bỏ các đoạn intron","Gắn mũ 5'-cap","Tháo xoắn chuỗi kép ADN"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"PTM biến đổi hóa học protein (phosphoryl hóa, glycosyl hóa...) giúp protein đạt cấu trúc và trạng thái hoạt động sinh học chuẩn xác."},{"q":"Chaperone (như Hsp70, GroEL/GroES) là nhóm protein đặc biệt có chức năng sinh học quan trọng nào?","o":["Hỗ trợ và định hướng quá trình gấp cuộn chính xác của các chuỗi polypeptide mới sinh, ngăn ngừa sự kết cụm hỏng","Cắt bỏ đoạn mồi RNA","Nối các đoạn Okazaki","Tổng hợp nucleotide mới"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Chaperone giúp các chuỗi polypeptide cuộn gập đúng cấu hình 3D và phục hồi các protein bị biến tính nhẹ."},{"q":"Các yếu tố giải phóng (Release Factors - RF1, RF2 ở nhân sơ hoặc eRF1 ở nhân thực) nhận biết mã kết thúc và chấm dứt dịch mã theo cơ chế nào?","o":["Bám trực tiếp vào vị trí A khi xuất hiện Stop codon, kích hoạt Peptidyl transferase bổ sung phân tử H2O giải phóng chuỗi peptit","Phân hủy trực tiếp phân tử mARN","Gắn một tARN đặc biệt vào Stop codon","Phá hủy thoi vô sắc"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Protein RF bắt chước cấu trúc tARN đi vào vị trí A, khiến Peptidyl transferase gắn nước thay vì axit amin, cắt đứt chuỗi polypeptide."},{"q":"Cơ chế nhắm mục tiêu protein (Protein targeting / Signal hypothesis) nhờ đoạn peptide tín hiệu (Signal peptide) ở đầu N giúp đưa protein vào hệ thống màng nào?","o":["Lưới nội chất hạt (Rough ER) để tiết ra ngoài tế bào hoặc gắn lên màng","Trực tiếp vào nhân tế bào","Phân hủy trong Vacuole","Giữ lại trong tế bào chất"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Phức hợp SRP nhận biết Signal peptide ở đầu N, dẫn truyền ribosome đến màng Lưới nội chất hạt để tổng hợp protein tiết."},{"q":"Con đường tiêu hủy protein bị hỏng hoặc hết hạn trong tế bào nhân thực thông qua hệ thống phân tử nào?","o":["Đánh dấu Ubiquitin và phân hủy tại phức hợp Proteasome 26S","Phân hủy bởi RNA polymerase","Đẩy ra ngoài qua vi ống","Chuyển thành DNA"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Hệ thống Ubiquitin-Proteasome là con đường cốt lõi phân hủy các protein sai hỏng hoặc kiểm soát chu kỳ tế bào."},{"q":"Đột biến vô nghĩa (Nonsense mutation) ảnh hưởng trực tiếp tới quá trình dịch mã như thế nào?","o":["Biến đổi một codon mã hóa axit amin thành một Stop codon làm chuỗi polypeptide bị kết thúc sớm (ngắn lại)","Làm thay đổi một axit amin này thành axit amin khác","Không làm thay đổi trình tự axit amin","Dịch chuyển toàn bộ khung đọc mã"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Đột biến vô nghĩa tạo ra mã kết thúc sớm (UAA, UAG, UGA), tạo ra protein cụt ngón mất chức năng."},{"q":"Bệnh Prion (như bệnh bò điên BSE, Creutzfeldt-Jakob) xuất phát từ cơ chế bất thường đặc biệt nào của phân tử protein?","o":["Protein PrP biến đổi từ dạng xoắn alpha (PrPC) sang dạng nếp gấp beta sai hỏng (PrPSc) và kích thích các protein bình thường biến đổi theo","Đột biến mất toàn bộ gene","Do sự xâm nhập của virus DNA","Thiếu hụt chất béo trong khẩu phần"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Prion là hạt protein lây nhiễm không chứa axit nucleic, gây hại do sự thay đổi cấu trúc không gian (alpha -> beta) lây lan chuỗi."},{"q":"Gene được định nghĩa là gì trong sinh học di truyền?","o":["Một đoạn phân tử DNA mang thông tin mã hóa cho một sản phẩm xác định (chuỗi polypeptide hay phân tử RNA)","Toàn bộ phân tử DNA trong tế bào","Một phân tử protein nằm trên nhiễm sắc thể","Mỗi tập hợp gồm 3 nucleotide bất kỳ"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene là một đoạn xác định của phân tử DNA mang thông tin mã hóa cho một sản phẩm sinh học chức năng (chuỗi polypeptide hoặc RNA)."},{"q":"Mỗi gene cấu trúc điển hình gồm có 3 vùng trình tự theo thứ tự từ đầu 3' đến 5' trên mạch khuôn lần lượt là gì?","o":["Vùng điều hòa, vùng mã hóa, vùng kết thúc","Vùng mã hóa, vùng điều hòa, vùng kết thúc","Vùng kết thúc, vùng mã hóa, vùng điều hòa","Vùng khởi động, vùng vận hành, vùng ức chế"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene cấu trúc gồm 3 vùng chính: Vùng điều hòa (đầu 3' mạch khuôn), Vùng mã hóa (ở giữa), Vùng kết thúc (đầu 5' mạch khuôn)."},{"q":"Gene không phân mảnh (các vùng mã hóa liên tục không chứa intron) là đặc điểm cấu trúc gene của nhóm sinh vật nào?","o":["Sinh vật nhân sơ (Prokaryote)","Sinh vật nhân thực (Eukaryote)","Động vật có xương sống","Thực vật hạt kín"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Hầu hết các gene ở sinh vật nhân sơ (vi khuẩn) là gene không phân mảnh, vùng mã hóa gồm toàn bộ các exon liên tục."},{"q":"Gene phân mảnh (vùng mã hóa gồm các exon xen kẽ với các intron) đặc trưng cho nhóm sinh vật nào?","o":["Sinh vật nhân thực (Eukaryote)","Sinh vật nhân sơ (Prokaryote)","Vi khuẩn Lam","Vi khuẩn E. coli"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene sinh vật nhân thực có cấu trúc phân mảnh: các đoạn mã hóa exon bị xen kẽ bởi các đoạn không mã hóa intron."},{"q":"Dựa vào chức năng sản phẩm, gene được chia thành hai loại lớn nào?","o":["Gene cấu trúc và gene điều hòa","Gene trội và gene lặn","Gene phân mảnh và gene không phân mảnh","Gene nhân và gene tế bào chất"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene cấu trúc mã hóa sản phẩm tạo cấu trúc/chức năng tế bào; Gene điều hòa mã hóa sản phẩm kiểm soát sự biểu hiện của gene khác."},{"q":"Khái niệm Operon dùng để chỉ cụm cấu trúc di truyền phổ biến ở đối tượng sinh vật nào?","o":["Cụm các gene cấu trúc có liên quan về chức năng được phân bố liền nhau và dùng chung một cơ chế điều hòa ở sinh vật nhân sơ","Một gene đơn độc ở tế bào nhân thực","Bộ nhiễm sắc thể đơn bội","Phân tử RNA thông tin trưởng thành"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Operon là cụm gồm nhiều gene cấu trúc xếp kề nhau, cùng được dịch mã/phiên mã chung bởi 1 promoter và operator ở sinh vật nhân sơ."},{"q":"Mô hình Operon Lac ở vi khuẩn E. coli được phát hiện đầu tiên bởi hai nhà khoa học nào?","o":["François Jacob và Jacques Monod","James Watson và Francis Crick","Thomas Morgan và Gregor Mendel","Carl Correns và Hugo de Vries"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Jacob và Monod đã đề xướng mô hình điều hòa Operon Lac ở E. coli vào năm 1961 (đạt giải Nobel 1965)."},{"q":"Trong mô hình cấu trúc Operon Lac ở E. coli, vùng vận hành (Operator - O) có chức năng gì?","o":["Là vị trí tương tác đặc hiệu với protein ức chế để ngăn cản hoặc mở đường cho phiên mã","Là nơi RNA polymerase bám vào khởi động phiên mã","Mã hóa cho enzyme phân hủy lactose","Tổng hợp protein ức chế"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Vùng O (Operator) nằm giữa Promoter và cụm gene cấu trúc, là nơi bám của protein ức chế để điều tiết phiên mã."},{"q":"Trong Operon Lac, ba gene cấu trúc Z, Y, A chịu trách nhiệm mã hóa cho các enzyme thực hiện chức năng gì?","o":["Chuyển hóa và phân giải đường Lactose trong tế bào vi khuẩn","Tổng hợp đường Glucose","Tổng hợp axit amin Tryptophan","Phân hủy thuốc kháng sinh"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene Z, Y, A mã hóa cho beta-galactosidase, permease và transacetylase để hấp thu và phân giải lactose."},{"q":"Gene điều hòa (lacI) nằm phía trước Operon Lac có vai trò gì?","o":["Mã hóa cho protein ức chế (Repressor protein)","Là một phần thuộc cấu trúc Operon Lac","Mã hóa cho enzyme RNA polymerase","Trực tiếp phân hủy đường lactose"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Gene điều hòa lacI liên tục tổng hợp protein ức chế; tuy nhiên lacI không nằm trong thành phần cấu trúc của Operon Lac."},{"q":"Khi môi trường nuôi dưỡng vi khuẩn E. coli KHÔNG có đường Lactose, Operon Lac sẽ ở trạng thái nào?","o":["Bị ức chế (không diễn ra phiên mã các gene Z, Y, A) do protein ức chế bám vào Operator","Hoạt động phiên mã mạnh mẽ","Cụm gene cấu trúc bị đột biến mất đoạn","RNA polymerase bám chặt vào Operator"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Khi không có lactose, protein ức chế bám vào O chặn đường di chuyển của RNA polymerase, làm ngưng phiên mã."},{"q":"Khi môi trường xuất hiện đường Lactose, chất đóng vai trò là chất cảm ứng (Inducer) bám vào protein ức chế là chất nào?","o":["Allolactose (hoặc Lactose)","Glucose","Galactose","Maltose"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Allolactose liên kết làm thay đổi cấu hình không gian của protein ức chế, khiến nó rời khỏi Operator, mở đường cho phiên mã."},{"q":"Đột biến gene là những biến đổi nhỏ diễn ra ở mức độ cấu trúc nào của gene?","o":["Thay đổi trong chuỗi polynucleotide tại một hoặc một số cặp nucleotide","Thay đổi số lượng nhiễm sắc thể trong tế bào","Mất toàn bộ bộ nhiễm sắc thể","Thay đổi cấu trúc không gian của protein"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Đột biến gene là những biến đổi trong cấu trúc của gene liên quan đến một hoặc một số cặp nucleotide."},{"q":"Đột biến điểm (Point mutation) là dạng đột biến gene liên quan đến bao nhiêu cặp nucleotide?","o":["Chỉ liên quan đến 1 cặp nucleotide","Liên quan đến từ 2 đến 5 cặp nucleotide","Liên quan đến toàn bộ gene","Chỉ liên quan đến đoạn intron"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Đột biến điểm là dạng đột biến gene chỉ liên quan đến biến đổi tại duy nhất 1 cặp nucleotide."},{"q":"Các dạng đột biến điểm cơ bản bao gồm những dạng nào?","o":["Thay thế, thêm, hoặc mất 1 cặp nucleotide","Mất, lặp, đảo, chuyển đoạn","Lệch bội và đa bội","Cắt dán và nối đoạn"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"3 dạng đột biến điểm cơ bản là: Thay thế 1 cặp nucleotide, Thêm 1 cặp nucleotide, và Mất 1 cặp nucleotide."},{"q":"Dạng đột biến thay thế cặp nucleotide làm xuất hiện mã kết thúc sớm gọi là đột biến gì?","o":["Đột biến vô nghĩa (Nonsense mutation)","Đột biến sai nghĩa (Missense mutation)","Đột biến đồng nghĩa / im lặng (Silent mutation)","Đột biến dịch khung (Frameshift mutation)"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Đột biến vô nghĩa biến đổi 1 codon mã hóa axit amin thành 1 Stop codon (UAA, UAG, UGA)."},{"q":"Dạng đột biến làm thay đổi cặp nucleotide nhưng KHÔNG làm thay đổi loại axit amin tương ứng do tính thoái hóa của mã di truyền gọi là gì?","o":["Đột biến đồng nghĩa / im lặng (Silent mutation)","Đột biến sai nghĩa","Đột biến vô nghĩa","Đột biến dịch khung"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Đột biến im lặng thay đổi bazo nhưng codon mới vẫn mã hóa cho chính axit amin ban đầu."},{"q":"Các dạng đột biến điểm nào thường dẫn đến hiện tượng dịch khung đọc mã (Frameshift mutation) gây ảnh hưởng nghiêm trọng tới trình tự chuỗi polypeptide?","o":["Thêm hoặc mất 1 cặp nucleotide","Thay thế 1 cặp nucleotide","Đảo vị trí hai cặp nucleotide","Biến đổi bazo nitơ dạng hiếm"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Thêm hoặc mất 1 cặp nucleotide làm lệch toàn bộ khung đọc mã di truyền từ vị trí đột biến về sau."},{"q":"Enzyme endonuclease đặc hiệu cắt DNA tại các trình tự nhận biết đối xứng ngắn (Palindromic sequence) dùng trong công nghệ gene gọi là gì?","o":["Enzyme cắt hạn chế (Restriction enzyme / Restricbase)","DNA Ligase","Taq Polymerase","Reverse Transcriptase"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Restriction enzyme (như EcoRI, BamHI) cắt liên kết phosphodiester tại các vị trí palindrome xác định."},{"q":"Thể truyền (Vector) phổ biến nhất được sử dụng để chuyển gene tái tổ hợp vào vi khuẩn là gì?","o":["Plasmid (phân tử DNA vòng nhỏ ngoài nhân của vi khuẩn)","Nhiễm sắc thể nhân","Phân tử mARN","Ribosome"],"ch":"Chương 5: Sinh học phân tử","df":"Dễ","e":"Plasmid có khả năng tự nhân đôi độc lập, mang gene đánh dấu nên rất lý tưởng làm thể truyền trong công nghệ gene."},{"q":"Trong điều hòa Operon Lac ở vi khuẩn E. coli, sự kiểm soát dương tính (Positive control) thực hiện thông qua phức hợp nào?","o":["Phức hợp CAP-cAMP bám vào vùng Promoter để kích hoạt tăng cường mức độ phiên mã","Protein ức chế lacI bám vào Operator","Allolactose gắn vào ribosome","Enzyme beta-galactosidase"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Khi nồng độ Glucose thấp, nồng độ cAMP tăng cao -> Phức hợp CAP-cAMP gắn vào Promoter giúp RNA pol bám hiệu quả hơn (kiểm soát dương)."},{"q":"Operon Tryptophan (Trp operon) ở E. coli thuộc loại Operon nào và hoạt động theo cơ chế nào?","o":["Operon ức chế (Repressible operon): Bình thường mở, chỉ tắt khi nồng độ Tryptophan dư thừa gắn với Aporepressor tạo phức hợp ức chế","Operon cảm ứng (Inducible operon)","Operon luôn luôn bật không bao giờ tắt","Operon không dùng protein ức chế"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Trp operon mã hóa enzyme tổng hợp tryptophan; khi môi trường thừa Trp, Trp đóng vai trò co-repressor kích hoạt protein ức chế để tắt operon."},{"q":"Các mức độ điều hòa biểu hiện gene ở sinh vật nhân thực (Eukaryote) diễn ra phức tạp qua những giai đoạn nào?","o":["Điều hòa cấu trúc nhiễm sắc thể (Epigenetics), điều hòa phiên mã, sau phiên mã, dịch mã và sau dịch mã","Chỉ diễn ra ở mức độ phiên mã giống như nhân sơ","Chỉ diễn ra ở mức độ dịch mã","Chỉ diễn ra khi tế bào phân chia"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"Sinh vật nhân thực điều hòa ở mọi cấp độ từ cuộn gập cromatin, phiên mã, xử lý ARN, dịch mã đến biến đổi protein."},{"q":"Phản ứng Chuỗi Polymerase (PCR - Polymerase Chain Reaction) dùng để làm gì và gồm 3 bước chu kỳ nhiệt nào?","o":["Khuếch đại in vitro một đoạn DNA xác định; gồm 3 bước: Biến tính nhiệt (Denaturation), Bắt cặp mồi (Annealing), Kéo dài (Extension)","Cắt DNA thành các đoạn nhỏ; gồm 2 bước","Tổng hợp protein nhân tạo","Giải trình tự toàn bộ hệ gen"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"PCR nhân bản DNA định hướng qua các chu kỳ biến tính (~95°C), bắt cặp mồi (~55°C) và kéo dài (~72°C nhờ Taq pol)."},{"q":"Thư viện cDNA (cDNA library) được tổng hợp từ loại phân tử sinh học nguồn nào nhờ enzyme phiên mã ngược (Reverse Transcriptase)?","o":["Từ toàn bộ các phân tử mARN trưởng thành trích xuất từ tế bào","Từ DNA genomic chứa cả intron","Từ chuỗi polypeptide","Từ tARN"],"ch":"Chương 5: Sinh học phân tử","df":"Trung bình","e":"cDNA (complementary DNA) tổng hợp bằng phiên mã ngược mARN trưởng thành nên chỉ chứa các vùng mã hóa exon của gene đang hoạt động."},{"q":"Cơ chế Làm suy giảm phiên mã (Attenuation) ở Operon Tryptophan phụ thuộc vào yếu tố đặc biệt nào?","o":["Sự hình thành cấu trúc kẹp tóc dừng phiên mã sớm trên đoạn mARN đầu (Leader peptide - trpL) phụ thuộc vào tốc độ dịch mã của Ribosome ứng với nồng độ Trp-tARN","Sự cắt dán intron","Hoạt tính của enzyme Restriction","Sự phân hủy của plasmid"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Attenuation kết hợp chặt chẽ giữa dịch mã đoạn leader trpL và phiên mã: khi thừa Trp, ribosome trượt nhanh tạo kẹp tóc 3-4 (terminator) dập tắt phiên mã sớm."},{"q":"Hiện tượng Biến đổi biểu di truyền (Epigenetics) điều hòa hoạt động của gene mà KHÔNG làm thay đổi trình tự DNA bao gồm các cơ chế cốt lõi nào?","o":["Methyl hóa DNA (tại đảo CpG) và Biến đổi hóa học đuôi Histone (Acetylation, Methylation...)","Đột biến điểm làm thay đổi bazo nitơ","Chuyển đoạn nhiễm sắc thể","Cắt bỏ exon"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"Epigenetics điều hòa đóng/mở cấu trúc chromatin thông qua methyl hóa cytosine trên DNA và acetyl hóa/methyl hóa đuôi histone."},{"q":"Hệ thống chỉnh sửa gen CRISPR-Cas9 có nguồn gốc tự nhiên từ đâu và hoạt động nhờ hai thành phần chính nào?","o":["Hệ thống miễn dịch thích ứng ở vi khuẩn; gồm enzyme nuclease Cas9 và đoạn sgRNA (single guide RNA) định hướng","Tế bào động vật có vú; gồm DNA polymerase và mARN","Virus nấm; gồm Ligase và tRNA","Cây trồng gen nhảy; gồm transposon và cDNA"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"CRISPR-Cas9 vốn là cơ chế chống vi-rút của vi khuẩn, được cải tiến dùng sgRNA dẫn đường cho nuclease Cas9 cắt đứt chính xác vị trí DNA mục tiêu."},{"q":"Các Yếu tố tăng cường (Enhancer) và Yếu tố dập tắt (Silencer) có thể nằm cách rất xa Promoter nhưng vẫn điều hòa phiên mã gene nhân thực nhờ cơ chế nào?","o":["Sự uốn cong vòng của sợi DNA (DNA looping) mang các protein Activator/Repressor tiếp xúc với phức hợp phiên mã tại Promoter nhờ protein Mediator","Di chuyển trực tiếp dọc theo sợi DNA","Cắt rời khỏi DNA để bám vào RNA","Biến đổi trực tiếp mARN"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"DNA tạo vòng (looping) đưa Enhancer ở xa lại gần Promoter, tương tác với các yếu tố phiên mã tổng quát và RNA pol II qua phức hợp Mediator."},{"q":"Kỹ thuật Giải trình tự thế hệ mới (NGS - Next Generation Sequencing / RNA-seq) cho phép đánh giá điều hòa biểu hiện gene ở quy mô nào?","o":["Phân tích định lượng toàn bộ hệ phiên mã (Transcriptome) của tế bào tại một thời điểm xác định","Chỉ đọc được trình tự 1 gene duy nhất","Chỉ đo nồng độ protein trong máu","Thay thế kỹ thuật nhân bản vi khuẩn"],"ch":"Chương 5: Sinh học phân tử","df":"Khó","e":"RNA-seq kết hợp NGS cho phép giải trình tự và định lượng song song hàng triệu đoạn RNA, phản ánh toàn bộ trạng thái biểu hiện gene của tế bào."},{"q":"Đặc điểm sinh học cơ bản nhất khẳng định virus KHÔNG phải là một tế bào sống hoàn chỉnh là gì?","o":["Chưa có cấu trúc tế bào, chỉ là dạng sống không bào và là ký sinh nội bào bắt buộc","Không có màng sinh chất","Có kích thước siêu nhỏ chỉ quan sát được dưới kính hiển vi điện tử","Không chứa protein"],"ch":"Chương 6: Virus","df":"Dễ","e":"Virus chưa có cấu trúc tế bào hoàn chỉnh, không có trao đổi chất độc lập nên phải ký sinh nội bào bắt buộc."},{"q":"Hai thành phần cấu tạo bắt buộc luôn có ở mọi loại virus (virus trần) bao gồm những gì?","o":["Lõi axit nucleic (DNA hoặc RNA) và vỏ protein (capsid)","Lõi DNA và vỏ phospholipid","Lõi RNA và màng tế bào","Bộ máy Golgi và ribosome"],"ch":"Chương 6: Virus","df":"Dễ","e":"Mọi virus (virion) đều gồm 2 phần bắt buộc: Lõi bộ gen axit nucleic và vỏ capsid bằng protein."},{"q":"Khác với tế bào sinh vật (luôn chứa cả DNA và RNA), hệ gen của một loại virus có đặc điểm gì?","o":["Chỉ chứa duy nhất một trong hai loại axit nucleic: DNA hoặc RNA","Luôn luôn chứa đồng thời cả DNA và RNA","Không chứa bất kỳ loại axit nucleic nào","Chỉ cấu tạo từ chuỗi amino acid"],"ch":"Chương 6: Virus","df":"Dễ","e":"Mỗi hạt virus chỉ chứa DNA hoặc RNA làm chất liệu di truyền (gọi là DNA virus hoặc RNA virus)."},{"q":"Vỏ capsid của virus được cấu tạo từ các đơn vị tiểu phần protein gọi là gì?","o":["Capsomere","Nucleosome","Peptidoglycan","Codon"],"ch":"Chương 6: Virus","df":"Dễ","e":"Vỏ capsid được lắp ráp từ các hình thái đơn vị protein gọi là capsomere."},{"q":"Phức hợp gồm lõi axit nucleic và vỏ capsid gộp chung lại được gọi là gì?","o":["Nucleocapsid","Envelope","Bacteriophage","Prion"],"ch":"Chương 6: Virus","df":"Dễ","e":"Cấu trúc hạt virus cơ bản gồm lõi axit nucleic bọc trong vỏ capsid được gọi là nucleocapsid."},{"q":"Lớp vỏ ngoài (envelope) ở một số loại virus phức tạp (như virus Cúm, HIV, SARS-CoV-2) có nguồn gốc chủ yếu từ đâu?","o":["Từ màng sinh chất hoặc màng nội bào của tế bào chủ khi virus nảy chồi ra ngoài","Do virus tự tổng hợp mới hoàn toàn","Từ vỏ tế bào vi khuẩn","Từ thành phần xenlulozo"],"ch":"Chương 6: Virus","df":"Dễ","e":"Vỏ ngoài lớp kép lipid thu được từ màng tế bào chủ trong quá trình xuất bào/nảy chồi (budding)."},{"q":"Các gai glycoprotein cắm trên vỏ ngoài của virus đóng vai trò mấu chốt nào?","o":["Gắn đặc hiệu vào các thụ thể (receptor) trên bề mặt tế bào chủ để khởi đầu sự xâm nhập","Giúp virus tự di chuyển trong không khí","Thực hiện quá trình quang hợp","Phân hủy ADN của tế bào chủ"],"ch":"Chương 6: Virus","df":"Dễ","e":"Gai glycoprotein (như gai Spike của SARS-CoV-2) giúp nhận diện và bám đặc hiệu lên thụ thể tế bào chủ."},{"q":"Khái niệm Thể thực khuẩn (Bacteriophage hay Phage) dùng để chỉ loại virus chuyên ký sinh ở đối tượng nào?","o":["Vi khuẩn","Thực vật","Động vật có xương sống","Nấm men"],"ch":"Chương 6: Virus","df":"Dễ","e":"Bacteriophage (phage) là nhóm virus chuyên ký sinh và xâm nhiễm tế bào vi khuẩn."},{"q":"Năm giai đoạn cơ bản trong chu trình nhân lên chuẩn của virus theo đúng thứ tự là gì?","o":["Hấp phụ -> Xâm nhập -> Tổng hợp -> Lắp ráp -> Giải phóng","Xâm nhập -> Hấp phụ -> Tổng hợp -> Lắp ráp -> Giải phóng","Tổng hợp -> Hấp phụ -> Xâm nhập -> Lắp ráp -> Giải phóng","Hấp phụ -> Tổng hợp -> Xâm nhập -> Giải phóng -> Lắp ráp"],"ch":"Chương 6: Virus","df":"Dễ","e":"Trình tự nhân lên gồm 5 bước: 1. Hấp phụ (bám), 2. Xâm nhập, 3. Tổng hợp sinh học, 4. Lắp ráp, 5. Giải phóng."},{"q":"Trong chu trình sinh tan (Lytic cycle) của thể thực khuẩn, điều gì sẽ xảy ra với tế bào chủ ở bước giải phóng?","o":["Tế bào chủ bị phá hủy (vỡ ra/tan bào) giải phóng hàng loạt virus mới","Tế bào chủ tiếp tục phân chia bình thường","Tế bào chủ biến thành bào tử","Tế bào chủ tự nhân đôi ADN của mình"],"ch":"Chương 6: Virus","df":"Dễ","e":"Chu trình tan làm ly giải hoàn toàn màng tế bào chủ để giải phóng virion ra ngoài."},{"q":"Trong chu trình tiềm tan (Lysogenic cycle), bộ gen của virus tồn tại ở trạng thái nào trong tế bào chủ?","o":["Cài đặt tích hợp vào hệ gen của tế bào chủ ở dạng Prophage (hoặc Provirus) và nhân đôi cùng tế bào","Lập tức phá hủy ADN tế bào chủ","Tự do trong tế bào chất mà không liên kết ADN","Biến mất hoàn toàn"],"ch":"Chương 6: Virus","df":"Dễ","e":"Ở chu trình tiềm tan, ADN virus gắn tích hợp vào nhiễm sắc thể tế bào chủ dưới dạng prophage, không làm tan tế bào."},{"q":"Enzyme phiên mã ngược (Reverse Transcriptase) đặc trưng có ở nhóm Retrovirus (như HIV) có chức năng gì?","o":["Tổng hợp DNA từ khuôn mẫu RNA","Tổng hợp RNA từ khuôn mẫu DNA","Cắt đứt chuỗi protein","Nối các đoạn RNA"],"ch":"Chương 6: Virus","df":"Dễ","e":"Reverse Transcriptase đảo ngược dòng thông tin di truyền: tổng hợp c-DNA từ khuôn mẫu RNA của virus."},{"q":"Thuốc kháng sinh (Antibiotics) có tác dụng tiêu diệt hoặc tiêu trừ virus không?","o":["Không, vì kháng sinh chỉ tác động lên cấu trúc và cơ chế trao đổi chất của vi khuẩn","Có, diệt được mọi loại virus","Chỉ diệt được virus có vỏ ngoài","Chỉ diệt được virus RNA"],"ch":"Chương 6: Virus","df":"Dễ","e":"Kháng sinh nhắm vào vách peptidoglycan, ribosome 70S... của vi khuẩn nên hoàn toàn không có hiệu lực với virus."},{"q":"Biện pháp hiệu quả và bền vững nhất để phòng ngừa các bệnh truyền nhiễm do virus ở người và động vật là gì?","o":["Tiêm vắc-xin (Vaccine) chủ động tạo miễn dịch","Uống thuốc kháng sinh liều cao","Sử dụng vitamin C","Truyền huyết thanh liên tục"],"ch":"Chương 6: Virus","df":"Dễ","e":"Vắc-xin kích thích hệ miễn dịch tạo kháng thể và tế bào nhớ, cung cấp khả năng bảo vệ chủ động chống virus."},{"q":"Viroid là tác nhân gây bệnh nhỏ hơn virus, có đặc điểm cấu trúc độc đáo nào?","o":["Chỉ gồm một đoạn phân tử RNA vòng ngắn, không có vỏ protein capsid","Chỉ gồm một phân tử protein không có RNA","Gồm DNA vòng kép","Có vỏ ngoài bằng lipid"],"ch":"Chương 6: Virus","df":"Dễ","e":"Viroid là phân tử RNA trần dạng vòng, không có vỏ capsid, chủ yếu gây bệnh ở thực vật (như bệnh củ khoai tây thoi)."},{"q":"Prion là tác nhân gây bệnh đặc biệt có bản chất cấu tạo hoàn toàn từ thành phần nào?","o":["Chỉ gồm phân tử Protein bị biến đổi cấu hình không gian sai hỏng, không chứa axit nucleic","Chỉ gồm DNA","Chỉ gồm RNA","Gồm Lipopolysaccharide"],"ch":"Chương 6: Virus","df":"Dễ","e":"Prion là các hạt protein lây nhiễm, không chứa bất kỳ axit nucleic nào (gây bệnh xốp não, bò điên)."},{"q":"Tại sao các loại virus chứa bộ gen là RNA (như virus Cúm, HIV, SARS-CoV-2) thường có tốc độ đột biến cao hơn nhiều so với virus DNA?","o":["Vì enzyme RNA polymerase (hoặc Reverse Transcriptase) tái bản RNA không có hoạt tính sửa sai (Proofreading)","Vì RNA có kích thước quá lớn","Vì virus RNA không có vỏ capsid","Vì RNA dễ bị nhiệt độ phá hủy"],"ch":"Chương 6: Virus","df":"Dễ","e":"Enzyme nhân bản RNA thiếu cơ chế đọc sửa sai (proofreading) 3'->5' nên tỷ lệ tích lũy sai sót đột biến rất cao."},{"q":"Sự lắp ráp hạt virus hoàn chỉnh trong tế bào chủ diễn ra như thế nào?","o":["Các thành phần vỏ protein capsid và lõi axit nucleic tự lắp ráp theo cơ chế tương tác hóa-lý","Nhờ thoi phân bào đưa vào","Nhờ ti thể gắn nối","Cần có sự phân chia của nhân tế bào"],"ch":"Chương 6: Virus","df":"Dễ","e":"Quá trình đóng gói hạt virus mới là sự tự lắp ráp (self-assembly) ngẫu nhiên dựa trên ái lực hóa sinh giữa vỏ và lõi."},{"q":"Hệ thống phân loại Baltimore chia virus thành 7 nhóm dựa trên tiêu chí mấu chốt nào?","o":["Cấu trúc axit nucleic (DNA/RNA, sợi đơn/kép) và cơ chế tổng hợp mARN của virus","Kích thước của hạt virus","Loại triệu chứng bệnh gây ra ở người","Số lượng capsomere trên vỏ capsid"],"ch":"Chương 6: Virus","df":"Trung bình","e":"Phân loại Baltimore (Nhóm I -> VII) dựa vào chất liệu di truyền (dsDNA, ssDNA, dsRNA, (+)ssRNA, (-)ssRNA, ssRNA-RT, dsDNA-RT) và đường hướng tạo mARN."},{"q":"Sự khác biệt cốt lõi về chức năng giữa virus RNA sợi dương ((+)ssRNA) và virus RNA sợi âm ((-)ssRNA) khi xâm nhập vào tế bào chủ là gì?","o":["RNA sợi dương có thể làm mARN dịch mã trực tiếp tạo protein; RNA sợi âm phải mang sẵn RNA-dependent RNA polymerase để phiên mã ra sợi bổ sung (+)","RNA sợi âm dịch mã trực tiếp, RNA sợi dương thì không","RNA sợi dương không có vỏ capsid","RNA sợi âm không tích hợp vào tế bào"],"ch":"Chương 6: Virus","df":"Trung bình","e":"(+)ssRNA có trình tự như mARN nên dịch mã ngay; (-)ssRNA phải nhờ enzyme RdRp đi kèm tổng hợp nên sợi (+) khuôn mẫu trước."},{"q":"Hiện tượng Trôi dạt kháng nguyên (Antigenic drift) ở virus Cúm diễn ra do cơ chế nào?","o":["Sự tích lũy dần dần các đột biến điểm nhỏ trên gene mã hóa gai Hemagglutinin (HA) và Neuraminidase (NA)","Sự tái tổ hợp các đoạn gen giữa hai chủng virus khác nhau","Sự mất đi vỏ ngoài lipid","Sự kết hợp với vi khuẩn"],"ch":"Chương 6: Virus","df":"Trung bình","e":"Antigenic drift là đột biến điểm tích lũy từ từ khiến vắc-xin cúm cần thay đổi hàng năm."},{"q":"Cơ chế Cướp mũ 5' (Cap-snatching) ở virus Cúm (Influenza virus) phục vụ cho mục đích sinh học nào?","o":["Enzyme endonuclease của virus cắt trộm đầu mũ 5'-cap từ pre-mARN tế bào chủ gắn vào RNA virus để qua mặt ribosome và khởi đầu dịch mã protein virus","Phân hủy đuôi Poly-A của mARN tế bào","Tháo xoắn ADN nhân","Tạo vòng ADN"],"ch":"Chương 6: Virus","df":"Khó","e":"Cap-snatching giúp virus cúm vừa vô hiệu hóa mARN tế bào chủ vừa có sẵn đầu 5'-cap cho mARN của chính mình sử dụng ribosome tế bào."},{"q":"Liệu pháp Phage (Phage therapy) ứng dụng bacteriophage trong y học hiện đại nhằm giải quyết khủng hoảng y tế nào?","o":["Điều trị các bệnh nhiễm trùng do vi khuẩn siêu đa kháng thuốc (Superbugs / AMR) mà thuốc kháng sinh thông thường hoàn toàn bất lực","Chữa trị các bệnh ung thư di truyền","Thay thế vắc-xin ngừa virus","Tăng cường trí nhớ"],"ch":"Chương 6: Virus","df":"Khó","e":"Phage therapy sử dụng các thể thực khuẩn đặc hiệu để tiêu diệt chính xác vi khuẩn kháng thuốc (AMR) mà không gây tác dụng phụ tới vi sinh vật có lợi."}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const SUBJ=[
 {id:'tl',name:'Tâm lý – Đạo đức y học',desc:'Tâm lý học, y đức, giao tiếp với người bệnh',color:'#8a3a52'},
 {id:'sh',name:'Sinh học di truyền',desc:'Tế bào, ADN, quy luật di truyền, đột biến',color:'#2f6b4f'},
 {id:'hh',name:'Hóa đại cương',desc:'Cấu tạo nguyên tử, liên kết, dung dịch, hợp chất hữu cơ',color:'#27598a'},
 {id:'ds',name:'Dân số và Sức khỏe',desc:'Dân số học, truyền thông – giáo dục sức khỏe, sức khỏe nghề nghiệp',color:'#9a6212'},
 {id:'sc',name:'Sinh học di truyền – theo chương',desc:'Bộ câu hỏi chia theo 6 chương, có mức độ Dễ / Trung bình / Khó và lời giải thích',color:'#5b6b1c'},
 {id:'tp',name:'Tâm lý – bộ HTML bổ sung (120 câu)',desc:'Bản từ file Tâm lý riêng; nội dung trùng bộ Tâm lý cũ và có lỗi chữ trong nguồn',color:'#945a7b'},
 {id:'sn',name:'Sinh học di truyền – bộ HTML bổ sung (436 câu)',desc:'Bản từ file Sinh học riêng; trùng bộ theo chương hiện có',color:'#327f83'}
];
const SM=Object.fromEntries(SUBJ.map(s=>[s.id,s]));
const MIX={id:'mix',name:'Trộn tất cả các môn',desc:'Câu hỏi lấy ngẫu nhiên từ tất cả các bộ',color:'#444b57'};
const TOTAL=SUBJ.reduce((a,s)=>a+DATA[s.id].length,0);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>String(Math.round(x*100)/100).replace('.',',');
const L='ABCD';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function rnd(n){if(window.crypto&&crypto.getRandomValues){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const Q=k=>{const p=k.split(':');return DATA[p[0]][+p[1]]};
const validKey=k=>{const p=String(k).split(':');return DATA[p[0]]&&DATA[p[0]][+p[1]]!==undefined};

let prog=store.get('onthi.prog',{best:{},wrong:{}});
if(!prog.best)prog.best={};if(!prog.wrong)prog.wrong={};
for(const k of Object.keys(prog.wrong))if(!validKey(k))delete prog.wrong[k];
let sess=store.get('onthi.sess',null);
if(sess&&(!Array.isArray(sess.items)||!sess.items.length||!sess.items.every(it=>validKey(it.k)&&Array.isArray(it.order)&&it.order.length===Q(it.k).o.length)))sess=null;
let fs=store.get('onthi.fs',2);
document.documentElement.setAttribute('data-fs',fs);
const ui={view:'home',subj:null,df:'',mode:'practice',limit:0,rf:'bad',panel:false,q:'',sf:'all',shown:30,modal:null};
let timerId=null;

function saveProg(){store.set('onthi.prog',prog)}
function saveSess(){store.set('onthi.sess',sess)}
function setsOf(id){
 const b=DATA[id];
 if(b[0].ch){const names=[...new Set(b.map(x=>x.ch))].sort();return names.map((nm,k)=>({k,label:nm,idxs:b.map((x,i)=>x.ch===nm?i:-1).filter(i=>i>=0)}))}
 const n=b.length,c=Math.ceil(n/50),size=Math.ceil(n/c),out=[];
 for(let k=0;k<c;k++){const a=k*size,e=Math.min(n,a+size);if(e>a){const idxs=[];for(let i=a;i<e;i++)idxs.push(i);out.push({k,label:'Đề '+(k+1),sub:'Câu '+(a+1)+'–'+e,idxs})}}
 return out}
const dfOk=(id,i)=>!(ui.subj===id&&ui.df)||DATA[id][i].df===ui.df;
function wrongKeys(subj){return Object.keys(prog.wrong).filter(k=>subj==='mix'||k.startsWith(subj+':'))}
const isRight=it=>it.ans!==null&&it.order[it.ans]===0;
function tally(){let c=0,w=0,b=0;sess.items.forEach(it=>{if(it.ans===null)b++;else if(isRight(it))c++;else w++});return{c,w,b,n:sess.items.length}}
const subjOf=id=>id==='mix'?MIX:SM[id];

function start(subj,kind,arg){
 let keys=[],title='';
 if(kind==='set'){const s=setsOf(subj)[arg];keys=s.idxs.filter(i=>dfOk(subj,i)).map(i=>subj+':'+i);title=s.label+(ui.df&&ui.subj===subj?' · '+ui.df:'')}
 else if(kind==='rand'){const ids=subj==='mix'?SUBJ.map(s=>s.id):[subj];let pool=[];ids.forEach(id=>DATA[id].forEach((_,i)=>{if(dfOk(id,i))pool.push(id+':'+i)}));keys=shuffled(pool).slice(0,arg);title='Ngẫu nhiên '+keys.length+' câu'+(ui.df&&ui.subj===subj?' · '+ui.df:'')}
 else{keys=shuffled(wrongKeys(subj)).slice(0,50);title='Ôn lại câu đã sai'}
 if(!keys.length)return;
 const now=Date.now(),lim=ui.mode==='exam'?ui.limit*60:0;
 sess={subj,kind,arg,title,mode:ui.mode,limit:lim,started:now,endAt:lim?now+lim*1000:0,items:keys.map(k=>({k,order:shuffled(Q(k).o.map((_,j)=>j)),ans:null,flag:false})),i:0,done:false};
 saveSess();ui.panel=false;go('quiz');
}
function go(v){ui.view=v;render();window.scrollTo(0,0)}
function pick(j){
 const it=sess.items[sess.i];
 if(sess.done)return;
 if(sess.mode==='practice'){
  if(it.ans!==null)return;
  it.ans=j;
  if(isRight(it))delete prog.wrong[it.k];else prog.wrong[it.k]=1;
  saveProg();saveSess();render();
  const fb=document.getElementById('fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
 }else{it.ans=j;saveSess();render()}
}
function jump(i){sess.i=Math.max(0,Math.min(sess.items.length-1,i));ui.panel=false;saveSess();render();window.scrollTo(0,0)}
function finish(){
 if(sess.done)return;
 sess.done=true;sess.finishedAt=Date.now();
 sess.items.forEach(it=>{if(it.ans===null)return;if(isRight(it))delete prog.wrong[it.k];else prog.wrong[it.k]=1});
 const r=tally();
 if(sess.kind==='set'){
  const key=sess.subj+':set'+sess.arg,sc=r.c/r.n*10,old=prog.best[key];
  if(!old||sc>old.score)prog.best[key]={score:sc,c:r.c,n:r.n,t:Date.now()};
 }
 saveProg();saveSess();
 ui.rf=(r.w+r.b)?'bad':'all';ui.panel=false;go('result');
}
function askSubmit(){
 const r=tally();
 ui.modal={title:'Nộp bài?',text:r.b?`Bạn còn ${r.b} câu chưa trả lời. Nộp bài bây giờ?`:'Bạn đã trả lời hết các câu. Nộp bài để xem điểm?',ok:'Nộp bài',cancel:'Làm tiếp',fn:finish};render();
}
function askExit(){
 ui.modal={title:'Thoát ra ngoài?',text:'Bài làm được lưu lại. Lần sau bạn có thể bấm “Làm tiếp” ở trang đầu.',ok:'Thoát',cancel:'Ở lại',fn:()=>go('home')};render();
}

/* ---------- views ---------- */
function header(){
 return `<header class="top"><div class="wrap"><button class="brand" data-act="home">Ôn trắc nghiệm</button><div class="tools"><div class="fs" role="group" aria-label="Cỡ chữ"><span>Cỡ chữ</span>${[1,2,3].map(n=>`<button class="fsb" style="font-size:${[.85,1.1,1.4][n-1]}rem" aria-pressed="${fs===n}" aria-label="Cỡ chữ ${['vừa','lớn','rất lớn'][n-1]}" data-act="fs" data-n="${n}">A</button>`).join('')}</div><button class="btn sm" data-act="search">Tra cứu</button></div></div></header>`;
}
function vHome(){
 let resume='';
 if(sess&&!sess.done){
  const a=sess.items.filter(i=>i.ans!==null).length;
  resume=`<div class="notice"><strong>Bạn đang làm dở một bài</strong><br>${esc(subjOf(sess.subj).name)} · ${esc(sess.title)} · đã trả lời ${a}/${sess.items.length} câu<div class="acts"><button class="btn primary" data-act="resume">Làm tiếp</button><button class="btn" data-act="drop">Bỏ bài này</button></div></div>`;
 }
 const cards=SUBJ.map(s=>{
  const sets=setsOf(s.id).length,unit=DATA[s.id][0].ch?'chương':'đề',done=Object.keys(prog.best).filter(k=>k.startsWith(s.id+':set')).length,w=wrongKeys(s.id).length;
  return `<button class="row subj" style="--c:${s.color}" data-act="subj" data-id="${s.id}"><span><span class="rt">${esc(s.name)}</span><span class="rs">${DATA[s.id].length} câu · ${sets} ${unit} · đã làm ${done}/${sets} ${unit}${w?` · ${w} câu cần ôn lại`:''}</span></span><span class="go" aria-hidden="true">›</span></button>`}).join('');
 const mw=wrongKeys('mix').length;
 return `${header()}<main class="wrap"><h1>Chọn môn để ôn</h1><p class="lead">Bấm vào một môn, sau đó chọn đề muốn làm.</p>${resume}${cards}<button class="row subj" style="--c:${MIX.color}" data-act="subj" data-id="mix"><span><span class="rt">${MIX.name}</span><span class="rs">${TOTAL} câu · lấy ngẫu nhiên từ tất cả các bộ${mw?` · ${mw} câu cần ôn lại`:''}</span></span><span class="go" aria-hidden="true">›</span></button>${foot()}</main>`;
}
function foot(){return `<div class="foot">Tổng hợp từ các file trắc nghiệm gốc, giữ nguyên câu hỏi và đáp án. Các file Tâm lý, Sinh học, Dân số ghi tác giả NGUYỄN GIA PHÚ - 526YCT02. Điểm và tiến độ lưu ngay trên trình duyệt này, không cần mạng.</div>`}
function vSubject(){
 const id=ui.subj,S=subjOf(id),isMix=id==='mix',n=isMix?TOTAL:DATA[id].length,w=wrongKeys(id).length;
 const modes=[['practice','Ôn luyện','Chọn xong biết đúng sai ngay, có giải thích.'],['exam','Thi thử','Làm hết rồi nộp bài mới biết điểm.']];
 const seg=modes.map(m=>`<button class="segb" role="radio" aria-checked="${ui.mode===m[0]}" data-act="mode" data-m="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('');
 const timer=ui.mode==='exam'?`<div class="chips" role="group" aria-label="Thời gian làm bài">${[[0,'Không giới hạn'],[45,'45 phút'],[60,'60 phút'],[90,'90 phút']].map(t=>`<button class="chip" aria-pressed="${ui.limit===t[0]}" data-act="limit" data-m="${t[0]}">${t[1]}</button>`).join('')}</div>`:'';
 let sets='',dfc='';
 const hasDf=!isMix&&DATA[id][0].df;
 if(hasDf)dfc=`<h2 style="margin-bottom:.3rem">2. Mức độ khó</h2><div class="chips" style="margin-top:0" role="group" aria-label="Mức độ khó">${[['','Mọi mức độ'],['Dễ','Dễ'],['Trung bình','Trung bình'],['Khó','Khó']].map(d=>`<button class="chip" aria-pressed="${ui.df===d[0]}" data-act="df" data-m="${d[0]}">${d[1]}</button>`).join('')}</div>`;
 if(!isMix){
  const chap=!!DATA[id][0].ch;
  sets=`<h2>${hasDf?'3':'2'}. Chọn ${chap?'chương':'đề'}</h2>`+setsOf(id).map(s=>{
   const cnt=s.idxs.filter(i=>dfOk(id,i)).length,b=prog.best[id+':set'+s.k];
   return `<button class="row" data-act="start" data-kind="set" data-arg="${s.k}" ${cnt?'':'disabled'}><span><span class="rt">${esc(s.label)}</span><span class="rs">${s.sub?s.sub+' · ':''}${cnt} câu${ui.df&&hasDf?' ('+ui.df+')':''}</span></span><span class="best">${b?`Cao nhất<b>${fmt(b.score)}/10</b>`:'Chưa làm'}</span></button>`}).join('');
 }
 const rnd=`<h2>${isMix?'2':hasDf?'4':'3'}. Hoặc làm đề tự chọn</h2>
 <button class="row" data-act="start" data-kind="rand" data-arg="20"><span><span class="rt">Ngẫu nhiên 20 câu</span><span class="rs">Làm nhanh, khoảng 10–15 phút</span></span><span class="go" aria-hidden="true">›</span></button>
 <button class="row" data-act="start" data-kind="rand" data-arg="50"><span><span class="rt">Ngẫu nhiên 50 câu</span><span class="rs">Một đề đầy đủ, mỗi lần một đề khác</span></span><span class="go" aria-hidden="true">›</span></button>
 <button class="row" data-act="start" data-kind="wrong" ${w?'':'disabled'}><span><span class="rt">Ôn lại câu đã làm sai</span><span class="rs">${w?`${w} câu${w>50?' (mỗi lượt lấy 50 câu)':''}`:'Chưa có câu sai nào. Làm một đề trước nhé.'}</span></span><span class="go" aria-hidden="true">›</span></button>`;
 return `${header()}<main class="wrap"><button class="back" data-act="home">‹ Về danh sách môn</button><h1 style="border-left:12px solid ${S.color};padding-left:.7rem">${esc(S.name)}</h1><p class="lead">${esc(S.desc)} · ${n} câu</p><h2 style="margin-top:1.2rem">1. Chọn cách ôn</h2><div class="seg" role="radiogroup" aria-label="Cách ôn">${seg}</div>${timer}${dfc}${sets}${rnd}${foot()}</main>`;
}
function vQuiz(){
 const it=sess.items[sess.i],q=Q(it.k),n=sess.items.length,practice=sess.mode==='practice',locked=practice&&it.ans!==null,subjId=it.k.split(':')[0],S=SM[subjId];
 const opts=it.order.map((oi,j)=>{
  let c='opt',tag='';
  if(locked){c+=' lock';if(oi===0){c+=' ok';tag='<span class="tag">✓ Đáp án đúng</span>'}else if(j===it.ans){c+=' no';tag='<span class="tag">✗ Bạn đã chọn câu này</span>'}}
  else if(j===it.ans)c+=' sel';
  return `<button class="${c}" data-act="pick" data-j="${j}" aria-pressed="${j===it.ans}"><span class="let">${L[j]}</span><span class="otx">${esc(q.o[oi])}${tag}</span></button>`}).join('');
 let fb='';
 if(locked){
  const r=isRight(it);
  fb=`<div id="fb" class="fb ${r?'good':'bad'}" role="status"><strong>${r?'✓ Đúng rồi!':'✗ Chưa đúng.'}</strong>${r?'':` Đáp án đúng là <b>${L[it.order.indexOf(0)]}</b>.`}${q.e?`<p>${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</div>`;
 }
 const flag=!practice?`<button class="flagbtn" data-act="flag">${it.flag?'★ Đã đánh dấu xem lại (bấm để bỏ)':'☆ Đánh dấu để xem lại sau'}</button>`:'';
 let panel='';
 if(ui.panel){
  panel=`<div class="panel"><strong>Danh sách câu</strong><div class="small">${practice?'Xanh: đúng · Đỏ: sai · Trắng: chưa làm':'Ô xanh đậm: đã trả lời · Dấu chấm than: đã đánh dấu'}</div><div class="grid">${sess.items.map((x,i)=>{
   let c='cell',mk=String(i+1);
   if(practice&&x.ans!==null){c+=isRight(x)?' ok':' no';mk+=isRight(x)?' ✓':' ✗'}
   else if(!practice&&x.ans!==null)c+=' done';
   if(x.flag)c+=' flag';if(i===sess.i)c+=' cur';
   return `<button class="${c}" data-act="jump" data-i="${i}" aria-label="Câu ${i+1}">${mk}</button>`}).join('')}</div>${practice?'':'<button class="btn primary" data-act="submit">Nộp bài</button>'}</div>`;
 }
 const last=sess.i===n-1;
 const next=last?(practice?`<button class="btn primary main" data-act="${practice?'finish':'submit'}">Xem kết quả</button>`:`<button class="btn primary main" data-act="submit">Nộp bài</button>`):`<button class="btn ${practice&&!locked?'':'primary'} main" data-act="next">Câu tiếp ›</button>`;
 return `<div class="qtop"><div class="wrap"><button class="btn sm" data-act="exit">‹ Thoát</button><div class="qcount">Câu ${sess.i+1} / ${n}</div><div id="timer" class="timer"></div></div></div><div class="bar" aria-hidden="true"><i style="width:${(sess.i+1)/n*100}%"></i></div>
 <main class="wrap" style="padding-top:0"><div class="qcard"><div class="qmeta"><span class="sbadge" style="--c:${S.color}">${esc(S.name)}</span><span>${esc(sess.title)} · ${practice?'Ôn luyện':'Thi thử'}${q.df?' · '+esc(q.df):''}</span></div><div class="qtext" tabindex="-1" id="qtext">${esc(q.q)}</div>${opts}</div>${fb}${flag}${panel}</main>
 <div class="nav"><div class="wrap"><button class="btn" data-act="prev" ${sess.i===0?'aria-disabled="true"':''}>‹ Trước</button><button class="btn" data-act="panel">${ui.panel?'Đóng danh sách':'Danh sách câu'}</button>${next}</div></div>`;
}
function reviewItem(it,idx){
 const q=Q(it.k),S=SM[it.k.split(':')[0]],st=it.ans===null?['bl','Chưa trả lời']:isRight(it)?['ok','✓ Đúng']:['no','✗ Sai'];
 const opts=it.order.map((oi,j)=>{
  let c='ro',m='';
  if(oi===0){c+=' ok';m='<b class="m">✓ Đáp án đúng</b>'}else if(j===it.ans){c+=' no';m='<b class="m">✗ Bạn đã chọn câu này</b>'}
  return `<div class="${c}"><span class="l">${L[j]}.</span><span>${esc(q.o[oi])}${m}</span></div>`}).join('');
 return `<article class="rv"><div class="rvh"><span class="num">Câu ${idx+1} <span class="sbadge" style="--c:${S.color};font-weight:400">${esc(S.name)}</span></span><span class="st ${st[0]}">${st[1]}</span></div><div class="rq">${esc(q.q)}</div>${opts}${q.e?`<p class="small" style="margin-top:.6rem">${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</article>`;
}
function vResult(){
 const r=tally(),sc=r.c/r.n*10,S=subjOf(sess.subj);
 const bad=r.w+r.b;
 const list=sess.items.map((it,i)=>[it,i]).filter(([it])=>ui.rf==='all'||it.ans===null||!isRight(it));
 return `${header()}<main class="wrap"><h1>Kết quả</h1><p class="lead">${esc(S.name)} · ${esc(sess.title)} · ${sess.mode==='practice'?'Ôn luyện':'Thi thử'}</p>
 <div class="score"><div class="big">${fmt(sc)}<small> / 10</small></div><div>Đúng ${r.c} trên ${r.n} câu</div></div>
 <div class="stats"><div class="stat g"><b>${r.c}</b>Đúng</div><div class="stat r"><b>${r.w}</b>Sai</div><div class="stat"><b>${r.b}</b>Chưa làm</div></div>
 <div class="acts"><button class="btn primary" data-act="again">Làm lại đề này</button><button class="btn" data-act="subj" data-id="${sess.subj}">Chọn đề khác</button><button class="btn" data-act="home">Về trang đầu</button></div>
 <h2>Xem lại bài làm</h2>
 <div class="chips" style="margin:0 0 1rem" role="group" aria-label="Lọc câu"><button class="chip" aria-pressed="${ui.rf==='bad'}" data-act="rf" data-m="bad">Câu sai và chưa làm (${bad})</button><button class="chip" aria-pressed="${ui.rf==='all'}" data-act="rf" data-m="all">Tất cả ${r.n} câu</button></div>
 ${list.length?list.map(([it,i])=>reviewItem(it,i)).join(''):'<p class="lead">Bạn làm đúng hết. Không có câu nào cần xem lại.</p>'}${foot()}</main>`;
}
function vSearch(){
 return `${header()}<main class="wrap"><button class="back" data-act="home">‹ Về trang đầu</button><h1>Tra cứu câu hỏi</h1><p class="lead">Gõ một vài từ để tìm câu hỏi và xem đáp án đúng. Gõ không dấu cũng được.</p>
 <label for="sq" class="small">Từ khóa</label><input id="sq" class="field" type="search" autocomplete="off" value="${esc(ui.q)}" placeholder="Ví dụ: ribosome, hô hấp, orbital...">
 <div class="chips" role="group" aria-label="Lọc theo môn"><button class="chip" aria-pressed="${ui.sf==='all'}" data-act="sf" data-m="all">Tất cả môn</button>${SUBJ.map(s=>`<button class="chip s" style="--c:${s.color}" aria-pressed="${ui.sf===s.id}" data-act="sf" data-m="${s.id}">${esc(s.name)}</button>`).join('')}</div>
 <div id="res" style="margin-top:1.2rem"></div></main>`;
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function fillSearch(){
 const box=document.getElementById('res');if(!box)return;
 const t=norm(ui.q.trim()).split(/\s+/).filter(Boolean);
 if(!t.length){box.innerHTML=`<p class="small">Nhập từ khóa để bắt đầu tìm.</p>`;return}
 const hits=[];
 for(const s of SUBJ){if(ui.sf!=='all'&&ui.sf!==s.id)continue;DATA[s.id].forEach((q,i)=>{if(q._n===undefined)q._n=norm(q.q+' '+q.o.join(' '));if(t.every(w=>q._n.includes(w)))hits.push([s,q,i])})}
 const part=hits.slice(0,ui.shown);
 box.innerHTML=`<p class="small">Tìm thấy ${hits.length} câu.</p>`+part.map(([s,q,i])=>`<article class="rv"><div class="rvh"><span class="sbadge" style="--c:${s.color}">${esc(s.name)}</span><span class="small">Câu ${i+1}</span></div><div class="rq">${esc(q.q)}</div>${q.o.map((o,j)=>`<div class="ro${j===0?' ok':''}"><span>${esc(o)}${j===0?'<b class="m">✓ Đáp án đúng</b>':''}</span></div>`).join('')}${q.e?`<p class="small" style="margin-top:.6rem">${esc(q.e)}</p>`:''}${q.w?`<div class="warn"><b>Lưu ý về câu này:</b> ${esc(q.w)}</div>`:''}</article>`).join('')+(hits.length>part.length?`<button class="btn" data-act="more">Hiện thêm</button>`:'');
}
function modalHtml(){
 const m=ui.modal;if(!m)return '';
 return `<div class="mask" data-act="mclose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(m.title)}</h2><p>${esc(m.text)}</p><div class="acts"><button class="btn" data-act="mclose">${esc(m.cancel)}</button><button class="btn primary" id="mok" data-act="mok">${esc(m.ok)}</button></div></div></div>`;
}
function render(){
 const v=ui.view;
 if((v==='quiz'||v==='result')&&!sess)ui.view='home';
 const html=ui.view==='home'?vHome():ui.view==='subject'?vSubject():ui.view==='quiz'?vQuiz():ui.view==='result'?vResult():vSearch();
 app.innerHTML=html+modalHtml();
 if(ui.view==='search')fillSearch();
 if(ui.modal){const b=document.getElementById('mok');if(b)b.focus()}
 tick();
}
function tick(){
 if(ui.view!=='quiz'||!sess||sess.done||!sess.endAt)return;
 const left=Math.max(0,Math.ceil((sess.endAt-Date.now())/1000)),el=document.getElementById('timer');
 if(el){el.textContent='Còn '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.classList.toggle('low',left<300)}
 if(left<=0){ui.modal=null;finish()}
}
setInterval(tick,1000);

/* ---------- events ---------- */
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.classList.contains('mask')&&e.target!==t)return;
 const a=t.dataset.act;
 switch(a){
  case 'home':ui.modal=null;go('home');break;
  case 'fs':fs=+t.dataset.n;store.set('onthi.fs',fs);document.documentElement.setAttribute('data-fs',fs);render();break;
  case 'search':go('search');break;
  case 'subj':if(ui.subj!==t.dataset.id)ui.df='';ui.subj=t.dataset.id;go('subject');break;
  case 'mode':ui.mode=t.dataset.m;render();break;
  case 'df':ui.df=t.dataset.m;render();break;
  case 'limit':ui.limit=+t.dataset.m;render();break;
  case 'start':start(ui.subj,t.dataset.kind,t.dataset.kind==='set'||t.dataset.kind==='rand'?+t.dataset.arg:0);break;
  case 'resume':ui.panel=false;go('quiz');break;
  case 'drop':ui.modal={title:'Bỏ bài đang làm?',text:'Các câu đã trả lời trong bài này sẽ không được tính điểm.',ok:'Bỏ bài',cancel:'Giữ lại',fn:()=>{sess=null;store.set('onthi.sess',null);render()}};render();break;
  case 'pick':pick(+t.dataset.j);break;
  case 'next':jump(sess.i+1);break;
  case 'prev':if(sess.i>0)jump(sess.i-1);break;
  case 'jump':jump(+t.dataset.i);break;
  case 'panel':ui.panel=!ui.panel;render();break;
  case 'flag':sess.items[sess.i].flag=!sess.items[sess.i].flag;saveSess();render();break;
  case 'submit':askSubmit();break;
  case 'finish':finish();break;
  case 'exit':askExit();break;
  case 'again':{ui.mode=sess.mode;ui.limit=sess.limit/60;ui.subj=sess.subj;start(sess.subj,sess.kind,sess.arg);break}
  case 'rf':ui.rf=t.dataset.m;render();break;
  case 'sf':ui.sf=t.dataset.m;ui.shown=30;render();break;
  case 'more':ui.shown+=30;fillSearch();break;
  case 'mclose':ui.modal=null;render();break;
  case 'mok':{const fn=ui.modal&&ui.modal.fn;ui.modal=null;render();if(fn)fn();break}
 }
});
app.addEventListener('input',e=>{if(e.target.id==='sq'){ui.q=e.target.value;ui.shown=30;fillSearch()}});
document.addEventListener('keydown',e=>{
 if(ui.modal){if(e.key==='Escape'){ui.modal=null;render()}return}
 if(ui.view!=='quiz'||!sess||sess.done)return;
 const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
 const k=e.key.toLowerCase();
 if('1234'.includes(k)&&k.length===1)pick(+k-1);
 else if('abcd'.includes(k)&&k.length===1)pick('abcd'.indexOf(k));
 else if(e.key==='ArrowRight'&&sess.i<sess.items.length-1)jump(sess.i+1);
 else if(e.key==='ArrowLeft'&&sess.i>0)jump(sess.i-1);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script>
</body>
</html>
